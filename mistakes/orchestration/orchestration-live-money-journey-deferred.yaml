category: incomplete-procedure
symptom: "The launch plan never tests the full user journey against the live contracts with a real wallet and small real funds before the frontend reaches a public URL — the real-money check lands after the public deploy, or is left to team discretion."
expected_pattern: "Before any step that puts the frontend on a public URL, run the whole journey against the live contracts with a real wallet and $1-10 of real funds, as a required step, not an optional one."
skill_section: "Shipping a dApp"   # the pre-public go/no-go bullet names the small-real-money journey
status: fixed
notes: |
  Distinct from orchestration-transition-gates-implicit, which grades
  whether a go/no-go condition is *stated* at each boundary (expect_5/6/7).
  On gpt-5.5 every no_skill plan states a pre-public gate, so that record
  reads 0/3 — but in 2/3 of those plans the stated condition is not the
  live small-real-money journey. One plan (2026-09-24T130341Z run 2) puts
  the first real tip after the Vercel deploy and makes it conditional on
  "both teammates agree"; the other (run 3) says "use tiny real funds ...
  before posting the URL publicly", i.e. after the frontend is already on
  a public URL. expect_2 grades the journey itself and both fail it.

  Both skill texts close it, 0/3 each, including the first vendored text
  (2f0adb01) whose three-phase table walks the live-contracts-local-UI
  phase before any public frontend. Filed status: fixed because the
  shipped skill's pre-public bullet names the small-real-money journey
  explicitly and no with_skill run missed it.
