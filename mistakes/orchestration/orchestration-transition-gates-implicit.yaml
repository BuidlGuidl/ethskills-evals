mistake_id: orchestration-transition-gates-implicit
skill: orchestration
first_seen: 2026-08-13
frequency:                     # against the split expect_5/6/7
  no_skill: 3/3                # 2026-08-27; every no_skill plan missed at least one of the three
  with_skill: 1/3              # 2026-09-03 on the shipped 5ad8abf; was 0/3 on 2026-08-27's c065e45
category: incomplete-procedure
symptom: "Launch plans label many checks as gates but omit one or more of the explicit transition gates: pre-mainnet tests/local deploy, live small-money journey before public frontend, or public-URL smoke test."
expected_pattern: "At every phase boundary, state a named GO/NO-GO condition before moving forward: local readiness before mainnet deploy; successful small-real-money live journey before public URL; public URL loaded and exercised after deploy."
skill_section: "Shipping a dApp"   # the three go/no-go bullets; was "The Three-Phase Build System" before the 2026-08-26 rewrite
status: fixed
notes: |
  Addressed in skills/orchestration on 2026-08-26, the one thing the
  minimal pass added rather than cut: the three boundaries are now a list
  of stated conditions near the top of the skill, not something a reader
  infers from a phase table. The old skill described three phases and
  called each phase's end "Validate:", which every failing run reproduced
  as a pile of checks with no boundary attached.

  Graded surface changed with it: goal-001's single gate expect line is now
  three, one per boundary, so the next benchmark reports which gate is
  missing instead of that one is.
  Re-run 2026-08-27: every with_skill plan passed all three split gates.
  No-skill missed the pre-mainnet gate 3/3 and pre-public gate 2/3; all
  three included the post-public smoke gate. The rewrite fixed the gap.

  Status flipped open -> fixed with that re-run. It had been left open by
  oversight while the sibling explorer-key record flipped to fixed on the
  same shape of evidence — a with_skill 0/3 against a standing no_skill
  rate, measured on the shipped skill — which made a `status: open` filter
  report this as remaining work and miss nothing else.

  Re-measured 2026-09-03 after the deployer step and the targetNetworks
  switch were folded back into the skill, and it moved: 1/3 with_skill, one
  run missing the post-deploy gate. The verdict is borderline rather than an
  absent step — that plan does load the public URL and put a real tip
  through it, but states no condition after the deploy, and expect_7 grades a
  stated go/no-go rather than the action. Two readings and n=3 does not
  separate them: either the restored material crowds the third gate, or it is
  variance on a line the 2026-08-13 regrade already showed moving in both
  directions on text that never changed. Status stays fixed on the strength
  of the no_skill 3/3 against with_skill 0/3 and 1/3 across two skill
  versions; a second three-run set on 5ad8abf is what would settle it.
