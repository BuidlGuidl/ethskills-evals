mistake_id: orchestration-generated-registry-churn
skill: orchestration
first_seen: 2026-08-13
frequency:                     # the two halves are 14 days and a skill rewrite apart, so they are
                               # dated rather than presented as one rate
  no_skill: 0/3                # 2026-08-13, second run set; the first read 2/3 under an expect line that misgraded it
  with_skill: 0/3              # 2026-08-27 — but see the notes: no with_skill run of that set opened the skill
category: workflow-overreach
symptom: "For a frontend-only ticket whose contract phase is explicitly complete, stands up a local chain and deploys to regenerate deployedContracts.ts, work the ticket never asked for."
expected_pattern: "Build the page against the registry as supplied; deploy only when the task asks for it. Regenerating the registry is allowed and ungraded — the cost is the detour, not the file."
skill_section: "SE-2 specifics worth having right"   # was "none" — the gap is filled as of 2026-08-26
status: open
notes: |
  Restated 2026-08-13 after the quiz-003 re-run. The record originally read as
  a failed check: two with_skill runs "changed deployedContracts.ts" and lost
  expect_4. That verdict was wrong — both had regenerated the file via yarn
  deploy, which the task declares the executor's call and ungraded, and the
  judge cannot tell a generated registry from a hand-written one in a diff.
  What survives is narrower and unrelated to grading: on a frontend-only
  ticket, a with_skill run spends turns deploying anyway (1/3 in the second
  set, 2/3 in the first), and in one first-set run also reformatted unrelated
  frontend code. Worth a one-line guard in the skill if the block that would
  carry it survives; not worth an expect line, since the deliverable is
  correct either way.

  Guard added 2026-08-26: the minimal skill ends with one line saying a
  frontend-only ticket deploys nothing and does not redeploy to regenerate
  deployedContracts.ts unless deploying was the ask. This is the "optional
  one line" the quiz-003 report proposed, kept even though the block that
  would have carried it is gone. Still ungraded by design — the deliverable
  is correct either way, so the cost shows up in tokens and turns, which is
  what a re-run should read.
  Re-run 2026-08-27: 0/3 with_skill runs deployed or regenerated the
  registry, while all hook checks remained 3/3.

  That 0/3 is not evidence about the guard, and the earlier draft of this
  note claiming "the one-line guard held" was wrong. Grepping the three
  transcripts for `skills/orchestration/SKILL.md` returns nothing: run 3
  lists `.agents` with rg and goes no further, and none of the three ever
  opens the file. Whatever produced 0/3 deploys, it was not a line no run
  read.

  The likely cause is this branch's own description rewrite. The skill now
  opens "Not for frontend implementation (`frontend-ux`)", which is a
  correct routing rule, and quiz-003 is a frontend ticket — so on this task
  the skill is not supposed to load, and mostly does not. That leaves
  quiz-003 structurally unable to do the job its notes give it: if the skill
  never loads on a frontend ticket, a with_skill drop cannot signal that the
  deleted hooks block mattered, and it cannot signal that this guard held
  either. Deciding that is open work on the task, not on this record — the
  guard needs a task shaped so the skill actually loads, and until then this
  record has no with_skill measurement at all.

  Status stays open for that reason: the guard is written but unmeasured.
