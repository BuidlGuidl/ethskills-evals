notes: |
  Kept in the minimal skill of 2026-08-26 — this is the one claim in
  skills/orchestration that no arm of the benchmark reached without it
  (quiz-001 expect_1: no_skill 0/3, with_skill 3/3; goal-001 expect_4:
  no_skill 1/3, with_skill 3/3). Wording tightened, mechanism unchanged:
  the .env.example key and the postinstall copy are named, so a reader can
  check the claim in the checkout rather than take it.
  Re-run 2026-08-27 split by task: quiz-001 remained 0/3 with_skill against
  the standing 3/3 no_skill mistake rate, while goal-001 produced the
  mistake 3/3 in both arms. Combined: no_skill 6/6, with_skill 3/6. The
  correct content was not salient enough when applied unprompted.

  Skill edited again 2026-08-27, after that re-run, and not yet measured. The
  three failing with_skill plans all did the same thing: they wrote an env
  template for the team to fill and put `ETHERSCAN_API_KEY=<your Basescan key>`
  in it. Nothing in them waited on ops, but a blank the team has to fill is the
  same dependency in another shape, which is what expect_4 grades. The line the
  rewrite of 2026-08-26 had softened to "swap in your own key later if you want
  one" now says the opposite explicitly: no launch step obtains a key, no env
  template ships that blank, and swapping in your own is housekeeping afterwards.
  Next measurement is a with_skill re-run of goal-001 alone; quiz-001 is
  unaffected at 3/3 and does not need repeating.

  Patched re-run 2026-08-27: goal-001 with_skill passed expect_4 in 3/3
  runs, and all three runs passed every other check as well. The explicit
  prohibition on obtaining or templating an explorer key fixed the
  unprompted launch-plan failure. Frequency now reports the current skill
  version; the prior 3/3 failure remains documented above and in artifacts.
