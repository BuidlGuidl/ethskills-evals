symptom: "SKILL.md L462 states Morpho Blue is 'Deployed on Base and Ethereum, but NOT on Arbitrum as of February 2026 (despite the vanity CREATE2 address)'. Morpho Blue IS deployed on Arbitrum, at the non-vanity address 0x6c247b1F6182318877311737BaC0844bAa518F5e, confirmed 2026-08-12 against docs.morpho.org, Arbiscan, and eth_getCode (15,582 bytes). An agent that trusts the sentence tells a team to build without a deployment that exists."
expected_pattern: "Say what is absent from the address, not from the chain: the 0xBBBB... vanity address is not Morpho on Arbitrum, and Morpho on Arbitrum lives at 0x6c247b1F.... Absence of a contract at one address is not absence from the chain."
skill_section: "L460-467 — '### Morpho Blue (Base)', prose line L462 and table row L467"
status: open
notes: |
  The error is narrower than "the skill is wrong", and the fix should be too. The
  table row is accurate as written — `0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb` |
  Arbitrum | ❌ Not deployed — because that vanity address really does hold nothing on
  Arbitrum. It is the prose above it that overreaches, generalizing "not at this
  address" into "not on this chain". Suggested edit: keep the row, rewrite L462 to
  name the real Arbitrum deployment, and let the pair carry the lesson the section
  exists to teach.

  **No run failed on this.** addresses-quiz-003 went 3/3 in both variants. All three
  with_skill runs consulted the skill and then checked anyway: eth_getCode on the
  vanity address on Arbitrum with Base as a control, docs.morpho.org, Arbiscan, and
  `cast code` / `owner()` / `feeRecipient()` on the real deployment. with_skill run 1
  wrote the correction into its answer unprompted — "The internal address skill is
  stale on this exact entry... last verified 2026-03-03, five months ago."

  The task notes predicted a negative delta here and it did not appear, which is
  itself the finding: on claude-opus-5, a task whose input demands both an address and
  "say how you established it" produces verification regardless of variant. Compare
  addresses-quiz-001, where the input asked only for a justified venue choice and one
  with_skill run answered from the skill with no lookup at all — see
  [[addresses-verified-stamp-substitutes-for-check]]. The prompt shape, not the
  skill's presence, is what decided whether the stale fact got caught.

  Re-verify before any re-run: docs.morpho.org/get-started/resources/addresses.

  Fix proposed on skill/addresses-minimal: the Morpho entry is gone with the
  address tables, and the lesson it was carrying survives as a rule — "nothing at
  that address is not absence from the chain; check the deployment list before
  telling anyone a chain is unsupported". Status stays open until a re-run
  confirms it.
