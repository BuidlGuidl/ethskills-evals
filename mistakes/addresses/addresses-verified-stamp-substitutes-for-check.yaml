mistake_id: addresses-verified-stamp-substitutes-for-check
skill: addresses
first_seen: 2026-08-12
frequency:                     # claude/claude-opus-5, 2026-08-12; quiz-001 and quiz-005
  no_skill: 0/6
  with_skill: 2/6              # quiz-001 run 1, quiz-005 run 3
source: addresses-quiz-001 with_skill run 1 (2026-08-12T155821Z-claude-with-skill-1); addresses-quiz-005 with_skill run 3 (2026-08-12T163107Z-claude-with-skill-3)
category: unverified-recall
symptom: "Treats the skill's own freshness stamp as having performed the verification. The run wrote 'from the verified-addresses reference (last onchain verification: March 3, 2026), not from recall' and shipped a config address with no live check — no explorer, no eth_getCode, no quote. Whole tool sequence was ls -> Skill -> Write. Because the skill answers instantly and cites a date, it removes the felt need to look, which is the opposite of what an address skill should do."
expected_pattern: "Use the table to know WHAT to check and what the answer should look like, then confirm the specific address on the target chain before it reaches a config that moves funds. A dated snapshot narrows the search; it does not discharge the check."
skill_section: "L10 '**Last Verified:** March 3, 2026 (all addresses verified onchain via eth_getCode + eth_call + symbol() + latestAnswer())', plus the ✅ Verified column repeated on every table row"
status: open
notes: |
  The skill is not silent on this — its own frontmatter description ends "Always
  verify addresses against a block explorer before sending transactions." The
  problem is that the presentation pulls harder than the instruction: a
  five-month-old snapshot labelled "verified onchain" with a ✅ on every row reads
  as a completed check, and one run in three took it that way.

  Directly observable in the run split on addresses-quiz-001. All three no_skill
  runs verified on-chain (12, 13 and 22 shell calls: codesize probes, symbol()/
  name() identity, defaultFactory()/voter() to prove a router really belongs to the
  protocol claimed) and all three passed. Two with_skill runs consulted the skill and
  then verified anyway (9 and 12 calls) and passed. The one with_skill run that
  treated the stamp as sufficient failed expect_1 — and, separately, carried the
  wrong dominance metric into its answer, see
  [[addresses-base-dominance-metric]].

  Cost signal worth keeping with this record: the unverified run was 71s / $0.39 /
  5 turns against a no_skill mean of ~500s / ~$1.43 / ~26 turns. The skill does buy
  a large speedup; on this run it bought it by skipping the step the skill exists to
  enforce.

  Second sighting, addresses-quiz-005 with_skill run 3 (42s, $0.35, 5 turns, Skill ->
  Write). The task asks for "a one-line comment on each address saying where you got
  it", for eight addresses that "go straight into a live supply() call". All eight
  values were correct — including the Base Aave pool that breaks the one-protocol-one-
  address reflex — and every comment attributed them to "verified address reference",
  which is the skill. expect_4 wants deployment docs, an explorer, or an on-chain
  check; citing the document you just read is circular, and the judge failed it.

  That failure is the cleanest statement of the problem in the whole benchmark: the
  skill is good enough to get eight addresses right and confident enough that the run
  never looked at a chain before wiring them to live funds. The other two with_skill
  runs on that task did check (4 Bash calls in run 2) and passed.

  Suggested edit is presentational, not factual: date each table (or each row) with
  what "verified" covered, and put the verify-before-funds instruction where the
  addresses are rather than only in the frontmatter description, so the reminder
  arrives at the moment of copying rather than before it.
