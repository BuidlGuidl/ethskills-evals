  basescan / official deployment docs"). Only no-skill-1, new-1 and new-3 name a
  concrete list (Uniswap's Base deployments page, the Slipstream repo,
  data.chain.link). Read strictly, the goal-001 rate is none 2/3, old 3/3,
  new 1/3; read loosely, old-3 is a false fail. Either way the old-vs-new gap
  on this line is not a reliable signal at n=3. See
