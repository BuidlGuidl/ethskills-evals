notes: |
  The graded rate is noisier than it looks. On goal-001 expect_4 the judge failed
  old-3 but passed old-1, old-2 and new-2, whose NOTES.md source the same extra
  contracts the same way ("checked on-chain" plus a generic "re-verify on
  basescan / official deployment docs"). Only no-skill-1, new-1 and new-3 name a
  concrete list (Uniswap's Base deployments page, the Slipstream repo,
  data.chain.link). Read strictly, the goal-001 rate is none 2/3, old 3/3,
  new 1/3; read loosely, old-3 is a false fail. Either way the old-vs-new gap
  on this line is not a reliable signal at n=3. See
  reports/major-refine-addresses-opus-5-medium.md.
  2026-09-22, codex gpt-5.5 high: none 1/6, old 0/6, new 0/6. no-skill-3's
  NOTES.md backs the v3 factory and QuoterV2 with factory()/WETH9() probes and
  names no source at all. The other codex runs, all arms, write a "Sources
  checked" list (Uniswap's Base deployments page, Aerodrome's security page, the
  Slipstream repo), so the line barely discriminates on this stack.
