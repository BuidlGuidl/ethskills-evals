mistake_id: addresses-base-dominance-metric
skill: addresses
first_seen: 2026-07-27
frequency:                     # addresses-quiz-001, claude/claude-opus-5, 2026-08-12
  no_skill: 0/3
  with_skill: 1/3
source: pre-run fact audit (PR #30 review); first seen in executor output 2026-08-12
category: stale-skill-fact
symptom: "SKILL.md L353 states Aerodrome dominates Base by TVL, and the eval encoded that. Checked 2026-07-27 on DefiLlama (7d Base DEX volume): Aerodrome ~$2.35B (Slipstream ~$2.3B, v1 ~$38M) leads Uniswap ~$1.59B (v4 ~$980M, v3 ~$610M) — a ~1.5x lead on volume, not on TVL, where Uniswap is narrowly ahead (~$305M vs ~$285M). A run that answers 'Uniswap leads Base TVL' is right and would be graded wrong."
expected_pattern: "State the metric with the claim — Aerodrome leads Base by routed volume, Uniswap by aggregate TVL — and steer venue choice on depth/volume for the pair being swapped, which is what decides execution quality."
skill_section: "L353 — 'The dominant DEX on each L2 is NOT Uniswap'"
status: fixed
notes: |
  Directionally the steer is right and worth keeping: reflex-defaulting to
  Uniswap on Base is still the failure the line exists to prevent. Only the
  metric is wrong, and TVL rots faster than the steer does — suggested edit is
  to name the metric rather than drop the claim.

  Eval side, already applied: addresses-quiz-001 expect_2 and
  addresses-goal-001 expect_5 grade Base volume/depth reasoning and fail any
  asserted dominance claim in either direction, so a justified Uniswap answer
  passes both. Both expects now carry per-version volume and TVL numbers rather
  than a ratio: the first attempt said "~4x", which held only for Slipstream vs
  Uniswap v3 and dropped Uniswap v4 (~$980M/7d on Base), so a run that counted
  v4 would have been failed for contradicting the rubric.

  Also landed in building-blocks-quiz-001, whose expect_1 required a Base-native
  DEX "rather than defaulting to Uniswap" with no evidence-backed pass path for
  Uniswap. PR #37 regraded that expect on Base evidence in both directions.

  2026-08-12, addresses-quiz-001 (claude/claude-opus-5, 3 runs per variant): first
  sighting in executor output. with_skill run 1 wrote "dominant DEX on Base by TVL
  (~$500-600M)" and failed expect_1 for giving no Base-specific liquidity evidence.
  The skill did not merely fail to prevent the error, it supplied it: the run
  reproduced L353's TVL framing and attached a magnitude roughly double the pinned
  ground truth (Aerodrome TVL ~$285M; Uniswap is ahead on TVL at ~$305M). Its whole
  tool sequence was ls -> Skill -> Write, with no lookup between reading the claim and
  writing it down.

  The other two with_skill runs consulted the skill and then verified on-chain (9 and
  12 cast calls) and passed, and all three no_skill runs passed by measuring. So the
  metric error only surfaces when the skill is treated as sufficient on its own.

  Provenance of the wrong number is exact: L357 opens the Aerodrome section with "The
  largest DEX on Base by TVL (~$500-600M)", and the failing run wrote "dominant DEX on
  Base by TVL (~$500-600M)". Not a hallucinated magnitude — a copied one. The same
  section carries a second, independent defect, see
  [[addresses-aerodrome-slipstream-missing]].

  Fix proposed on skill/addresses-minimal: the TVL dominance claim and the
  ~$500-600M figure are gone with the rest of the L2-native section; the reduced
  skill keeps the steer ("the deepest venue on an L2 is often not the mainnet
  one") and requires the metric to be named and backed by a live quote or a
  current volume figure. Status stays open until a re-run confirms it.

  CONFIRMED FIXED, 2026-08-19 re-run (skill a461aa8, claude/claude-opus-5, 3 runs per variant):
  addresses-quiz-001 with_skill 3/3, up from 2/3. The TVL claim and its ~$500-600M figure are
  gone from the skill; no run asserted a dominance figure, and all three argued the venue from
  measured Base evidence. See reports/addresses-minimal-2026-08-19.md.
