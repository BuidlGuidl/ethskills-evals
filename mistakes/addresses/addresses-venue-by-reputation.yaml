category: stale-knowledge
symptom: "Builds a treasury-size Base USDC->WETH swap on a venue justified by reputation — Uniswap v3 because 'the Base deployment is canonical and documented', or Aerodrome because it is 'the native liquidity hub on Base' — without comparing where Base USDC/WETH depth actually sits. All three no-skill runs chose Uniswap v3 this way and said in passing that Aerodrome or an aggregator 'may beat it for very large clips'."
expected_pattern: "Quote each candidate venue's pool at the real clip size (or cite a current per-venue Base volume/depth figure for the pair) and choose from the numbers; name the metric."
skill_section: "Choosing a venue (lines 30-32)"
status: open
notes: |
  Unprompted only. On addresses-quiz-001, which asks for the venue outright,
  the same model measured: 2/3 no-skill runs quoted Aerodrome Slipstream against
  Uniswap v3 at 100k-1M. In goal-001 the venue is a step on the way to code, and
  documentation quality stood in for depth.

  Old arm: old-3 is the no-skill pattern (Uniswap v3, "deep, observable onchain
  liquidity", no figure); old-2 is the old text's own claim (Aerodrome "the
  native liquidity hub", cf. [[addresses-base-dominance-metric]]) and then
  correctly routes through Slipstream anyway.

  New arm, 1/3 as graded, and the judge is not consistent: new-3 was failed
  although it quoted every Slipstream tickSpacing at 500k (it compared pools
  inside Aerodrome, not Aerodrome against Uniswap), while new-2 passed on
  "Aerodrome's own docs describe it as the central liquidity hub for Base",
  which is weaker. Read strictly it is new 1/3 (new-2); either way not 0/3, so
  the refined "Choosing a venue" paragraph does not reliably fire when the
  venue is not the question. Candidate edit: tie the paragraph to building a
  swap, not just answering which venue ("including when the venue is a step
  inside a build").

  Opus never showed it on goal-001 (all 9 runs passed expect_5).
