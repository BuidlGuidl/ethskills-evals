  no_skill: n/a
  with_skill: n/a
source: pre-run fact audit (PR #30 review)
category: stale-skill-fact
symptom: "SKILL.md L375 says Aerodrome and Velodrome 'both merged into Aero in November 2025'. The merger was announced then, not completed: as of 2026-07-28 no VELO->AERO token conversion has opened, and Dromos re-timed the unified launch on 2026-07-16 to target September 2026. The token upgrade is expected at launch, so VELO is still the live Optimism token today. A run trusting L375 treats AERO as the settled Optimism token and VELO as historical, which is backwards."
expected_pattern: "Date protocol migrations by state, not by announcement — 'announced Nov 2025, still unlaunched, targeting Sep 2026, token upgrade expected at launch' — and send the reader to the protocol's contracts list for which token is live today. A date read off a launch announcement rots twice: once when the launch slips, once when it lands."
skill_section: "L375 — Velodrome / ve(3,3) section"
status: fixed
notes: |
  A skill whose whole job is which address is live cannot describe an in-flight
  migration in the past tense; this is the exact failure mode L388's V1/V2 VELO
  warning exists to prevent, one paragraph earlier.

  Announced schedule as of the 2026-07-16 re-timing, per
  https://aero.xyz/articles/aero-is-on-the-horizon/: codebase public 3 Aug,
  final audit round through 21 Aug, public audit contest 24 Aug - 11 Sep,
  launch targeted September (no date pinned). That article covers the schedule
  only and defers the feature and token detail to a later post, so treat "the
  token upgrade lands at launch" as the announced intent, not a sourced
  mechanic, and re-read it before trusting any of these dates.

  Eval side, already applied: addresses-quiz-004 carries a blocking run-day
  gate — VELO V2 0x9560e827aF36c94D2Ac33a39bCE1Fe78631088Db verified live
  2026-07-28, but if AERO goes live on Optimism before the runs, expect_2 must
  make AERO primary and expect_1's premise (balances live in V2) has to be
  re-checked. addresses-quiz-001 and addresses-goal-001 accept either name.

  building-blocks-quiz-001 carried the same "Aero since the Nov 2025 merger"
  phrasing and now carries the corrected timeline (PR #37). The same stale fact
  sits in two other vendored skills: skills/l2s SKILL.md L22 ("Same contracts,
  new brand") and L97-98, whose dominant-DEX table already lists Base and
  Optimism under the Aero brand — tracked as
  mistakes/l2s/l2s-aero-merger-tense.yaml — and skills/building-blocks SKILL.md
  L16 and L169, untracked when this was written. Any fix to L375 had to land in
  all three; see the closing note below for where the other two are tracked now.

  FIXED on skill/addresses-minimal: skills/addresses no longer mentions the
  merger, the brands' tokens, or any date, so the tense error cannot recur
  there. The 18 with_skill runs of the 2026-08-19 re-run produced no
  merger-tense claim; nothing in the reduced skill can supply one.

  The two remaining copies are tracked against the skills that carry them, not
  here: skills/l2s (L22, L97-98) as [[l2s-aero-merger-tense]], and
  skills/building-blocks (L16, L169) as
  [[building-blocks-aero-merger-tense]], opened on PR #75 review. This record
  stayed open for those two for a while, which left mistakes/addresses/
  describing a line skills/addresses no longer has.
