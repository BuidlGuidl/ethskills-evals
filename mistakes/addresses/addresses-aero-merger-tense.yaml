symptom: "SKILL.md L375 says Aerodrome and Velodrome 'both merged into Aero in November 2025'. The merger was announced then, not completed: as of 2026-07-28 no VELO->AERO token migration has opened, and Dromos re-timed the unified launch on 2026-07-16 to target September 2026 (codebase public 3 Aug, audits through 21 Aug, Sherlock contest 24 Aug - 11 Sep), with AERO, veAERO, VELO and veVELO all upgrading at launch. A run trusting L375 treats AERO as the settled Optimism token and VELO as historical, which is backwards."
expected_pattern: "Date protocol migrations by state, not by announcement — 'announced Nov 2025, still unlaunched, targeting Sep 2026, tokens upgrade at launch' — and send the reader to the protocol's contracts list for which token is live today. A date read off a launch announcement rots twice: once when the launch slips, once when it lands."
