notes: |
  Verified 2026-08-26 by eth_getCode: the mainnet IdentityRegistry returns 0x on
  both Base Sepolia and Ethereum Sepolia, while the testnet pair is deployed —
  matching the deployment table in github.com/erc-8004/erc-8004-contracts, which
  lists roughly 25 mainnets on one pair and roughly 25 testnets on the other.
  Re-confirmed in the #92 review.

  This is the precise claim standards-quiz-001 expect_8 was added to grade as a
  failure, and the corrected standards skill now carries both pairs in an
  explicit table. So the repo simultaneously ships a skill teaching the claim and
  an eval line failing it.

  Filed rather than fixed: same reasoning as
  tools-skill-x402-contradicts-standards — PR #92 is the standards benchmark, and
  the addresses skill should be edited in a PR where its own tasks can measure
  the change. The fix is small (add the testnet row, drop 'same address on all
  chains'), so it should not sit long.
