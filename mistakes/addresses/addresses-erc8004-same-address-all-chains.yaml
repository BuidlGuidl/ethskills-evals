symptom: "The addresses skill heads its ERC-8004 table 'Same addresses on 20+ chains' and closes it 'Verified on: Mainnet, Arbitrum, Base, Optimism (CREATE2 — same address on all chains)', listing only the mainnet pair. Testnets use a DIFFERENT pair, and the mainnet addresses have no code on Sepolia or Base Sepolia. An agent following this skill — whose stated purpose is 'use this instead of guessing' — reuses 0x8004A169... on Base Sepolia and calls an address with no code."
expected_pattern: "Carry both pairs and say the split explicitly: mainnets IdentityRegistry 0x8004A169FB4a3325136EB29fA0ceB6D2e539a432 / ReputationRegistry 0x8004BAa17C55a88189AE136b182e5fdA19dE9b63; testnets 0x8004A818BFB912233c491871b3d84c89A494BD9e / 0x8004B663056A597Dffe9eCcC1965A193B7388713. 'Same address on all chains' is false as written."
