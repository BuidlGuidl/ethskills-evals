mistake_id: addresses-aerodrome-slipstream-missing
skill: addresses
first_seen: 2026-08-12
frequency:                     # skill gap; caught by every run that hit it
  no_skill: 0/3
  with_skill: 0/3              # all goal-001 runs complete
source: addresses-goal-001 with_skill run 1 (quantified); addresses-quiz-001 no_skill run 2 (identified qualitatively)
category: incomplete-coverage
symptom: "The Aerodrome section (L355-369) lists one router — the v2-style vAMM Router 0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43 — and never mentions Slipstream, Aerodrome's concentrated-liquidity AMM, anywhere in the file. Slipstream is where Base USDC/WETH depth actually sits. An agent that takes the listed Router as 'the Aerodrome address' and routes a large clip through it gets materially worse execution, while every address it used was technically correct."
expected_pattern: "List both Aerodrome AMMs and say which is which: the vAMM Router for volatile/stable v2-style pools, and the Slipstream router/quoter for concentrated liquidity, where the major pairs trade. A venue recommendation for a size-sensitive swap has to name the right router within the venue, not just the right venue."
skill_section: "L355-369 — '### Aerodrome (Base) — Dominant DEX', the Router row at L362"
status: open
notes: |
  Measured, not theorised. addresses-goal-001 with_skill run 1 quoted every candidate
  pool at the real clip size against live Base state and tabulated the result in its
  NOTES.md:

  | venue / pool | WETH out | slippage |
  | --- | --- | --- |
  | Aerodrome Slipstream, tickSpacing 100 | 263.91 | **-14 bps** |
  | Uniswap v3, fee 3000 | 263.81 | -18 bps |
  | Uniswap v3, fee 500 | 261.41 | -108 bps |
  | **Aerodrome vAMM Router (the address this skill lists)** | 234.23 | **-1,283 bps** |

  Same conclusion reached independently by addresses-quiz-001 no_skill run 2, under a
  section it titled "⚠️ The address trap": the listed router "only routes the v2-style
  volatile/stable AMM pools. It cannot touch Slipstream concentrated liquidity, where
  the actual depth lives." It proved the address really is Aerodrome's by calling
  `defaultFactory()` and `voter()` on it first.

  This is the failure mode an address skill is least equipped to catch, because
  nothing about the address is wrong. `eth_getCode` passes, the contract is genuinely
  Aerodrome's, the ✅ Verified is honest. The defect is that the entry answers "what is
  Aerodrome's address" when the question the skill invites — pick a venue for a large
  Base swap — needs "which Aerodrome router for this pair, at this size".

  Compounds with [[addresses-base-dominance-metric]]: L357 opens this same section
  with "The largest DEX on Base by TVL (~$500-600M)". That parenthetical is the
  verbatim source of the wrong figure in addresses-quiz-001 with_skill run 1, which
  wrote "dominant DEX on Base by TVL (~$500-600M)" and failed expect_1. Pinned ground
  truth is ~$285M, with Uniswap ahead on TVL at ~$305M. One section, two defects, both
  reachable in a single read.

  No run failed because of this gap — every run that hit it caught it by quoting
  rather than trusting. It is filed as a skill edit, not a model failure.
