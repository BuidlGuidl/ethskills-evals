mistake_id: gas-stale-l2-blob-share
skill: gas
first_seen: 2026-07-24
frequency:
  no_skill: 0/12
  with_skill: 3/12
category: stale-knowledge
symptom: >-
  Runs put an unchecked L1 data-availability cost into their L2 numbers, traceable
  to the skill's "L2 Cost Components" example (Base swap = ~$0.0003 L2 execution +
  ~$0.0027 L1 blob). Measured live on 2026-07-24 across 14 Base swap receipts, the
  L1 share is a median 0.25%, not 90% — the example is off by ~350x on the ratio and
  ~840x on the absolute L1 figure. In gas-quiz-001 all three with_skill runs carried
  the adder into the answer ("~3 txs x ~$0.002 = $0.0060"); none queried an L2 fee
  oracle. Historical sampling dates the break to Dencun, March 2024 — the section
  describes the world EIP-4844 ended, while the section above it correctly explains
  that EIP-4844 ended it.
expected_pattern: >-
  Read l1Fee off an OP-stack receipt (or the GasPriceOracle predeploy at
  0x420000000000000000000000000000000000000F) before quoting an L1 data share.
  The skill should state that L1 data is now a sub-1% rounding error on OP-stack
  L2s and that L2 execution — base fee floor plus tip — is essentially the whole bill.
skill_section: "the L2 line of the cost formula, and the L2-optimization paragraph"
status: fixed
fixed_in: 70703bd
verification: >-
  Section rewritten against measurement on 2026-07-24. Re-tested by gas-goal-002
  (6 runs on the fixed skill, skill_version 70703bd): 0/3 with_skill runs
  reproduced the stale claim, none copied the section's numbers verbatim, and all
  three independently measured an L1 share under 1%. The three with_skill plans
  now name the pre-Dencun provenance of the misconception unprompted.
status_history:
  - open (2026-07-24, skill_version 9a129f1)
  - fixed (2026-07-24, skill_version 70703bd)
re_verified: >-
  Re-tested 2026-08-28 on codex gpt-5.6-terra by gas-goal-002: no with_skill run
  reproduced the stale claim. Still fixed, but the reduction in PR #57 briefly left the
  cost formula taking a single gas_price with l1Fee mentioned only further down under
  "For L2 optimization" — a shape that could have reintroduced the error from the other
  direction, by omitting the L1 component rather than inflating it. Corrected 2026-08-31:
  the formula block now carries both an L2 form with l1_fee_eth and the instruction to
  read it rather than estimate it.
glm_5_3_note: >-
  Re-measured 2026-09-23 on opencode glm-5.3 (high), gas-goal-002, major-refine-d9952522:
  no_skill 0/3, old text (2f0adb01) 1/3, new text (d9952522) 0/3. The one occurrence,
  2026-09-23T125436Z-opencode-with-skill-2f0adb01-2, is a new shape: the run called
  GasPriceOracle.getL1Fee on base-rpc.publicnode.com and 1rpc.io/base and got 3,042,062,991 wei
  for both 69 and 210 bytes, about 1% of its own 52,000 gas × 0.006 gwei execution figure.
  It judged the equal values "suspicious" (they are the oracle's minimum-L1-gas floor for small
  payloads, getL1GasUsed = 1600 for every size) and concluded "the public RPC proxies don't execute
  predeploy calls correctly". It dropped the reading and wrote "~1-5% at today's blob prices" into
  PLAN.md with no L1 amount. That fails gas-goal-002 expect_2 (share not stated at ~1% or less)
  and expect_5 (no L1 component as an amount). So a correct live reading was thrown out and a
  remembered range took its place. Status stays fixed: the new text tells the reader to read
  l1Fee off a receipt as well as the oracle. All three new-arm runs read l1Fee live and put the L1
  share at about 1% (0.9-1.3%, $0.0000088-$0.000011 per transfer).
