category: broken-pointer
symptom: >-
  The RPC endpoint the skill prescribes for verifying gas, https://eth.llamarpc.com,
  is dead. It returns HTTP 521 (confirmed directly by the orchestrator on 2026-07-24,
  and by cast and curl inside all three gas-quiz-001 with_skill runs). Every with_skill
  run that followed the skill's verification instruction burned a turn recovering and
  had to find its own endpoint. The skill names no fallback, so recovery was luck.
expected_pattern: >-
  Name a working endpoint and at least one fallback. https://ethereum-rpc.publicnode.com
  worked in every run that tried it; eth.drpc.org and rpc.flashbots.net also worked.
  Better still, tell the reader to expect endpoint rot and give two.
skill_section: "the RPC comment lines in the cast block"
status: fixed
fixed_in: 70703bd
verification: >-
  All four llamarpc references replaced with https://ethereum-rpc.publicnode.com,
  plus two named fallbacks and an instruction to try another endpoint rather than
  fall back on a remembered number. Re-tested by gas-goal-002: no with_skill run
  hit a dead endpoint or lost a turn to RPC recovery.
status_history:
  - open (2026-07-24, skill_version 9a129f1)
  - fixed (2026-07-24, skill_version 70703bd)
status_history_note: >-
  REGRESSED 2026-08-31, caught in review of PR #57. The reduction to 38 lines dropped both
  named fallbacks and left one mainnet URL and one Base URL, both primaries, under a bare
  "If an endpoint fails, try another RPC" — which is the state that produced this record in
  the first place, minus the dead URL. Recovery was luck again. Re-fixed in the same pass:
  eth.drpc.org and rpc.flashbots.net are named beside the mainnet primary and
  base.publicnode.com beside the Base one. All five endpoints re-tested by eth_gasPrice on
  2026-08-31 (mainnet 0xe43475b = 0.239 gwei, Base 0x5b8d80 = 0.006 gwei); the two ETH/USD
  sources were tested the same day (Chainlink 0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419
  latestRoundData = $2438.64 at 8 decimals, Coinbase spot = $2443.70). Not yet re-tested by
  a run set.
re_verified: >-
  Re-tested 2026-09-23 on codex gpt-5.5 high (major-refine-d9952522), the first run set since
  the 2026-08-31 re-fix. Old arm (2f0adb01, which still names eth.llamarpc.com): all six quiz
  runs called it and got HTTP 525 from cast or a Cloudflare "Just a moment..." page from curl,
  and one gas-goal-002 run extrapolated to base.llamarpc.com and got 403 — 7/9 lost at least
  one call. Every one recovered on a different endpoint; no run fell back on a remembered
  number. New arm (d9952522): 0/9 touched llamarpc, and every cast gas-price against the named
  mainnet and Base primaries returned. One new gap: base.publicnode.com, the named Base
  fallback, refused eth_getTransactionReceipt with "Archive requests require a personal token"
  even on a 5-block sample (2026-09-23T120001Z-codex-with-skill-d9952522-3, twice); base.drpc.org
  then timed out on eth_getLogs ("free plan"), and the run fed receipt hashes it had already
  found straight to its script. The skill tells the reader to read l1Fee off a recent receipt;
  on this evidence the named Base fallback serves gas-price but not that. Still fixed.
opus_5_medium_note: >-
  Re-measured 2026-09-23 on claude-opus-5 (medium). All six old-text (2f0adb01) quiz runs
  called eth.llamarpc.com first, as the old text says to, and got HTTP 525 or a
  Cloudflare challenge page; each recovered on
  ethereum-rpc.publicnode.com, drpc, ankr or cloudflare-eth, at the cost of a turn, and none
  fell back on a remembered number. The three old-text goal-002 runs only needed Base and never
  called it. No refined-text (d9952522) run hit a dead endpoint. Status stays fixed: the old
  arm is reproducing the defect the fix removed.
