status_history_note: >-
  REGRESSED 2026-08-31, caught in review of PR #57. The reduction to 38 lines dropped both
  named fallbacks and left one mainnet URL and one Base URL, both primaries, under a bare
  "If an endpoint fails, try another RPC" — which is the state that produced this record in
  the first place, minus the dead URL. Recovery was luck again. Re-fixed in the same pass:
  eth.drpc.org and rpc.flashbots.net are named beside the mainnet primary and
  base.publicnode.com beside the Base one. All five endpoints re-tested by eth_gasPrice on
  2026-08-31 (mainnet 0xe43475b = 0.239 gwei, Base 0x5b8d80 = 0.006 gwei); the two ETH/USD
  sources were tested the same day (Chainlink 0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419
  latestRoundData = $2438.64 at 8 decimals, Coinbase spot = $2443.70). Not yet re-tested by
  a run set.
opus_5_medium_note: >-
  Re-measured 2026-09-23 on claude-opus-5 (medium). All six old-text (2f0adb01) quiz runs
  called eth.llamarpc.com first, as the old text says to, and got HTTP 525 or a
  Cloudflare challenge page; each recovered on
  ethereum-rpc.publicnode.com, drpc, ankr or cloudflare-eth, at the cost of a turn, and none
  fell back on a remembered number. The three old-text goal-002 runs only needed Base and never
  called it. No refined-text (d9952522) run hit a dead endpoint. Status stays fixed: the old
  arm is reproducing the defect the fix removed.
