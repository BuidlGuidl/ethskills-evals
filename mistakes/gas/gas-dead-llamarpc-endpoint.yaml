category: broken-pointer
symptom: >-
  The RPC endpoint the skill prescribes for verifying gas, https://eth.llamarpc.com,
  is dead. It returns HTTP 521 (confirmed directly by the orchestrator on 2026-07-24,
  and by cast and curl inside all three gas-quiz-001 with_skill runs). Every with_skill
  run that followed the skill's verification instruction burned a turn recovering and
  had to find its own endpoint. The skill names no fallback, so recovery was luck.
expected_pattern: >-
  Name a working endpoint and at least one fallback. https://ethereum-rpc.publicnode.com
  worked in every run that tried it; eth.drpc.org and rpc.flashbots.net also worked.
  Better still, tell the reader to expect endpoint rot and give two.
skill_section: "the RPC comment lines in the cast block"
status: fixed
fixed_in: 70703bd
verification: >-
  All four llamarpc references replaced with https://ethereum-rpc.publicnode.com,
  plus two named fallbacks and an instruction to try another endpoint rather than
  fall back on a remembered number. Re-tested by gas-goal-002: no with_skill run
  hit a dead endpoint or lost a turn to RPC recovery.
status_history:
