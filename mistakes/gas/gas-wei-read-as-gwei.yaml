mistake_id: gas-wei-read-as-gwei
skill: gas
first_seen: 2026-08-27
frequency:
  codex/gpt-5.6-terra:
    no_skill: 0/3
    with_skill: 3/6      # of the gas-goal-001 skilled runs, 2026-08-27 and 2026-08-28
category: unit-error
symptom: >-
  Measures the chain correctly and then loses the conversion. Two shapes seen.
  2026-08-27T233109Z-codex-with-skill-1 read mainnet at 133,491,758 wei (0.1335 gwei),
  divided by 1e6 instead of 1e9, quoted $503 to deploy, and ruled mainnet out on that
  figure — a correct reading producing exactly the stale-prior conclusion the skill
  exists to prevent. 2026-08-28T013927Z-codex-with-skill-2 stopped one step earlier and
  put the raw readings into the README (49,519,046-wei base fee, 49,680,232-wei gas
  price) with no conversion to gwei and no dollar figure at all. A third,
  2026-08-27T233831Z-codex-with-skill-3, read 52,042,833 wei and wrote "approximately 52
  gwei on Ethereum mainnet" into its README — the same /1e6 — while converting Base's
  6,000,000 wei to 0.006 gwei correctly two clauses later. One run, two chains, two
  divisors. That run is the only one of the six that passes the corrected gas-goal-001
  rubric, and it passes carrying this error.
expected_pattern: >-
  cast gas-price and cast base-fee print wei. Divide by 1e9 before the figure enters
  cost_usd = gas_used x gas_price_gwei x 1e-9 x eth_usd, and sanity-check the converted
  value against the raw reading — a mainnet gas price in the hundreds of gwei, or a
  deployment in the hundreds of dollars at a sub-gwei base fee, is the tell.
skill_section: "the conversion clause under the cost formula"
status: open
notes: >-
  The skill gained an explicit wei clause in 9ece856 after the first shape was seen, and
  no run in the following twelve repeated it. That is weak evidence: the error appeared
  once in twelve runs to begin with. The second shape appeared after the clause and is
  what motivated rewriting gas-goal-001's expect_3 into a unit-consistency check on
  2026-08-31 — the rubric could not see either shape before that.
