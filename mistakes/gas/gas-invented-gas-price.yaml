category: stale-knowledge
symptom: >-
  Quotes a mainnet gas price and an ETH price from memory instead of checking either.
  All three gas-goal-001 no_skill runs did it: 20 gwei in one README, "10 gwei and
  $3,000 ETH" in the other two. Live values at the time were 0.09 gwei and $1,870,
  so the gas price is ~100-200x high and ETH ~60% high, which is what produces the
  $11-per-job figure that then disqualifies mainnet. Two of the three made no gas or
  price network call at all. The third tried, hit a dead RPC, and filled the gap from
  memory rather than trying a second endpoint.
expected_pattern: >-
  Read the base fee off a live RPC and the ETH price off a live feed before quoting
  any dollar figure. If the first endpoint fails, try another — a failed lookup is not
  a licence to fall back on a remembered number.
skill_section: "the opening instruction, and the ETH/USD sources beside it"
status: open
second_stack_note: >-
  Re-measured 2026-08-28 on codex gpt-5.6-terra. gas-quiz-001 no_skill reproduced it 3/3:
  $5.48 per ERC-20 transfer, a 20-gwei stress case yielding $16.10, and a hardcoded
  ETH = $3,500, against a live chain at 0.045 gwei and ETH at $2,512. No with_skill run in
  either 2026-08-27/28 set quoted a remembered gas or ETH price. Kept open rather than
  marked fixed: the skill named no ETH/USD source at all until 2026-08-31, so the eleven
  with_skill runs that fetched one improvised it (ten via api.coinbase.com, one via
  CoinGecko). The prevention was the instruction to fetch, not a pointer, and a named
  source has not yet been tested by a run set.
glm_5_3_note: >-
  Re-measured 2026-09-23 on opencode glm-5.3 (high). Two gas-quiz-001 controls made no RPC or
  price call and quoted from memory: 2026-09-23T111750Z-opencode-no-skill-2 ("ETH assumed at
  $2,500", mainnet scenarios at 8/30/100 gwei) and 112200Z-opencode-no-skill-3 (10 gwei, "ETH ≈
  $3,000"), against a chain at ~0.3 gwei and ETH at ~$2,720. Both fail gas-quiz-001 expect_3.
  The three gas-quiz-003 controls quoted mainnet from web articles rather than from memory, which
  is filed under gas-mainnet-disqualified-on-cost. All three gas-goal-002 controls measured Base
  live. No with_skill run on either text quoted a remembered gas or ETH price.
