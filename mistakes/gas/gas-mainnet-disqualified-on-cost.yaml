category: stale-knowledge
symptom: >-
  Rules Ethereum mainnet out on gas cost for an escrow holding $2,000-$50,000 per
  job, a workload of a few transactions per job. All three gas-goal-001 no_skill
  runs did it in the README they shipped ("Do not deploy to Ethereum L1 unless your
  jobs get much larger"; "Ethereum mainnet: no… On a $2,000 job that is a painful
  cut"), and one gas-quiz-001 no_skill run recommended Arbitrum while pricing mainnet
  off a 30-gwei and 100-gwei table. Live cost for a full job lifecycle is about 5
  cents, or 0.0003% of a $20,000 job.
expected_pattern: >-
  Price the workload at a live-checked base fee before ruling a chain out. At a few
  transactions per job and $2,000-$50,000 at stake, gas is not the deciding variable —
  custody risk, off-ramps, and settlement assurances are. Pick the L2 for those reasons
  or pick mainnet, but do not disqualify mainnet on cost.
skill_section: "Choose from the measured workload (the three bullets)"
status: open
second_stack_note: >-
  Re-measured 2026-08-28 on codex gpt-5.6-terra. Two gas-quiz-003 no_skill runs priced
  mainnet at $12.35 and $12.75 per action while it sat at 0.053-0.064 gwei, where the same
  action costs cents. The one with_skill occurrence is
  2026-08-27T233109Z-codex-with-skill-1, which reached the same conclusion from a correct
  reading it then misconverted — filed separately as gas-wei-read-as-gwei, because the
  defect is the unit, not the prior. The three gas-goal-001 controls in this set ruled
  mainnet out with no figure at all, which is gas-chain-picked-without-measuring rather
  than this record.
kimi_k3_note: >-
  Re-measured 2026-09-23 on opencode kimi-k3 (high). A new shape on this stack: all three
  gas-quiz-001 no_skill runs did look — web search, the Etherscan gas tracker — and wrote a
  sub-gwei reading into answer.md (~0.1-1 gwei), then ruled mainnet out anyway on a
  "congestion returns" scenario priced at 20-100 gwei ($12.50-$62 per job,
  2026-09-23T112317Z-opencode-no-skill-3; "$5-60 in congestion (30-100 gwei)",
  111629Z-no-skill-2). The live figure is present and discarded; the remembered one decides.
  All three recommended Base. gas-quiz-003's 113915Z-opencode-no-skill-3 priced mainnet at
  $1.10-$15 per action with no gas reading at all (web search only). Every with_skill run of
  gas-quiz-001, on either text, read mainnet off an RPC (0.30-0.35 gwei) and recommended
  mainnet; none of the twelve with_skill chain-pick runs disqualified it on cost.
