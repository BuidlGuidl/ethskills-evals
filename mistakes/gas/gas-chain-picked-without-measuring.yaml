mistake_id: gas-chain-picked-without-measuring
skill: gas
first_seen: 2026-08-27
frequency:
  codex/gpt-5.6-terra:
    no_skill: 3/3
    with_skill: 2/9
category: stale-knowledge
symptom: >-
  Names a deployment chain and justifies it on cost without measuring any chain — no
  gas price read, no ETH price fetched, no figure quoted at all. Distinct from
  gas-mainnet-disqualified-on-cost, which is quoting an inflated number: here there
  is no number to be wrong. All three gas-goal-001 no_skill runs on 2026-08-27 did it
  ("low transaction fees make it a practical production destination"; "low fees make
  per-job contracts practical"), and so did two with_skill runs that had read SKILL.md
  first — 2026-08-27T233445Z-codex-with-skill-2 and 2026-08-28T013258Z-codex-with-skill-1
  contain zero occurrences of base-fee, gas-price, gwei, curl or any price source
  across 7,213 and 11,767 transcript lines, and went straight from the skill to forge.
  Both scored 4/4 under the pre-2026-08-31 rubric, which had no line requiring a reading.
expected_pattern: >-
  Read the target chain's gas price and a live ETH price before naming cost as a reason
  for or against any chain, and put the figures and their source in the deliverable. A
  qualitative cost claim is the same failure as a stale quantitative one.
skill_section: "Gas and Chain Cost (the opening instruction)"
status: open
notes: >-
  The with_skill rate is over 9 runs (both 2026-08-27 and 2026-08-28 sets) because this
  is only visible in the transcript, not in the grade, until gas-goal-001 expect_5 was
  added on 2026-08-31. The skill triggering and being read is not sufficient; the two
  failures read it and did not act on it.
