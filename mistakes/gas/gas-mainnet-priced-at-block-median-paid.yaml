mistake_id: gas-mainnet-priced-at-block-median-paid
skill: gas
first_seen: 2026-09-23
frequency:
  opencode/openrouter/z-ai/glm-5.3:   # 2026-09-23, benchmark major-refine-d9952522, effort high
    no_skill: 0/3              # gas-quiz-003 only
    with_skill_2f0adb01: 0/3
    with_skill_d9952522: 1/3
category: wrong-reading
symptom: >-
  Measures mainnet correctly, then prices the comparison off the wrong live figure.
  2026-09-23T114344Z-opencode-with-skill-d9952522-3 (gas-quiz-003) read `cast gas-price` on
  three RPCs (0.365, 0.369, 0.061 gwei) and fetched ETH from Chainlink ($2,730), then sampled 12
  receipts from one block and headlined their median effectiveGasPrice, 2.17 gwei (min 0.35,
  max 5.34), as "Mainnet (median paid today)": $0.47 per post, $47,430/day at 100k posts. That
  median comes from a 12-transaction sample of whatever tips those senders paid, not from
  what a transaction needs to pay. The run's own figures imply about 80k gas per post, and at
  the 0.365 gwei gas-price it had in hand that post costs about $0.08. It also cited a "routine congestion spike to 30+ gwei" at $3+ per action. The
  pick (Base) and its reasoning from the traffic profile passed expect_3; the mainnet figure
  failed expect_4 (cents-or-below at a live sub-1-gwei price). The rest of the answer measured
  well: live l1Fee off Base and OP receipts, Arbitrum's gasUsedForL1, and three RPCs per chain.
expected_pattern: >-
  Price a transaction with `cast gas-price` (base fee plus a suggested tip), as the skill says. A
  block's median effectiveGasPrice includes whatever priority tips its senders chose to pay and is not
  what a user transaction needs. If you show a volatility range, label it as a range and keep
  the headline figure at the reading the skill prescribes.
skill_section: "the `cast gas-price` paragraph under the first code block"
status: open
notes: >-
  One occurrence in 18 with_skill runs on this stack, with frequency 1/3 on the one task where it
  appeared. The new text already says that `cast gas-price` "is the reading the formula below
  takes". The run read that line and chose a figure it considered more representative. A
  sentence saying that a block's paid median is inflated by tips, and is not the price to quote,
  would close it. The grade is borderline: $0.47 is cents, not dollars, but it came from a 2.17
  gwei price, and expect_4 asks for a sub-1-gwei one.
