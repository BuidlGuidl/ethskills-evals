category: stale-knowledge
symptom: >-
  Prices mainnet off a third-party fee page found by web search, never reads the chain, and
  presents the figure as current. All three gas-quiz-001 no_skill runs on 2026-09-23 did it:
  runs 1 and 3 took L2Fees.info's "$1.10 send / $5.48 swap" for Ethereum and built a
  "$3.30-$16.44 per escrow" table on it; run 2 took usdc.org's fee calculator ("Ethereum $4.10
  for a modeled 65k-gas USDC transfer") and priced a job at $21.13, 1.06% of a $2,000 escrow.
  The skill arms read mainnet over RPC in the same hour at 0.29-0.35 gwei with ETH around
  $2,720, where a 65k-gas transfer is about $0.06: the aggregator figures are 20-90x high,
  the price a 6-25 gwei chain would charge. None of the three runs made a single RPC call or
  ran cast; each did 4-15 web searches. It is the same result as gas-invented-gas-price
  reached without memory: the number is sourced, dated to the day, and still stale, which is
  harder for a reader to catch. It is what fails expect_2 and expect_3 in all three runs, and
  it fed gas-mainnet-disqualified-on-cost in two of them.
expected_pattern: >-
  Treat a fee aggregator or calculator as a claim to check, not a reading. Read the gas price
  off the chain (cast gas-price against a public RPC) and ETH/USD off a live feed, compute
  gas_used × gas_price × eth_usd, and if a web figure disagrees with that by an order of
  magnitude, say so and use the reading.
skill_section: "Gas and Chain Cost (the opening instruction and the cast block)"
status: open
notes: >-
  Both skill texts prevent it on this stack (0/6 skill runs quoted a web fee table for
  mainnet; all six read an RPC). The no_skill gas-quiz-003 runs also priced from web
  sources only (no RPC in any of the three) but landed on figures in the cents, so the
  shape is there without the error; the rubric does not require a reading when no mainnet
  cost is quoted.
