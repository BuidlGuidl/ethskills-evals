category: incomplete-model
symptom: >-
  Quotes an OP-stack L2 bill as L2 execution alone, or as a total with no component split, so
  the L1 data fee is either missing or unverifiable. The opposite of gas-stale-l2-blob-share:
  nothing is inflated, the component just is not there. Two shapes on gas-goal-002.
  (a) Execution only: 2026-09-23T102754Z-codex-with-skill-2f0adb01-1 (old arm) prices each
  transfer as 45,415 gas × 0.006 gwei and PLAN.md never mentions an L1 fee, blob or data
  availability; 2026-09-23T114510Z-codex-no-skill-3 says "That is execution gas only.
  OP-stack receipts may also expose l1Fee" and leaves it out of every figure. Both fail
  expect_2 and expect_5. (b) Totals only: 2026-09-23T110247Z-codex-no-skill-2 names both
  components in prose and quotes l1Fee at ~3e9 wei much further down, but its baseline table
  gives a single "median total per transfer" with no amount per component, and fails
  expect_5 alone. The old run's measurement script read eth_feeHistory and
  eth_estimateGas, which have no L1 component, after base.llamarpc.com returned 403.
expected_pattern: >-
  On an OP-stack chain, read l1Fee off recent receipts (or GasPriceOracle.getL1Fee at
  0x420000000000000000000000000000000000000F) and show the bill as execution + L1 data, each
  as an amount, then the share. On Base today the L1 part is well under 1%, and saying so
  with the number is what rules calldata compression out.
skill_section: "the OP-stack cost formula (cost_usd = (gas_used × gas_price_gwei × 1e-9 + l1_fee_eth) × eth_usd)"
status: open
notes: >-
  The refined text's two-line formula, which puts l1_fee_eth in the L2 form and says to read it
  rather than estimate it, is the one thing the old text lacks here: the old "L2 Cost
  Components" section lists the two components with a stale example and no instruction to
  measure. All three new-arm plans read l1Fee off receipts and printed it as an amount
  (2.87e9-3.42e9 wei, 0.85-1.18% of the per-transfer fee by their own figures; only one of the
  three stated the share as a percentage). Weak evidence (1/3 old against 0/3 new); two of the
  three old runs got it right unprompted.
