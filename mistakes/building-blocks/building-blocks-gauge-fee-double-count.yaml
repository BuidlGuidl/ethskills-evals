category: stale-prior
symptom: >-
  The run stakes its Aerodrome LP in a gauge and then models the position's income
  as emissions plus trading fees. goal-002 no-skill-4 states it three times: README
  "the gauge pays AERO emissions voted to this pool, on top of the 0.30% swap fees
  that accrue into the reserves"; NatSpec "compounds the AERO emissions plus accrued
  swap fees back into the LP"; and a test that donates to both pool sides to simulate
  fee accrual. A gauge-staked Aerodrome LP forfeits trading fees to veAERO voters, so
  the modelled yield is overstated and the fee half of the harvest has no source.
expected_pattern: >-
  Establish where a staked position's income actually comes from before modelling it.
  On Aerodrome, read Pool.claimable0/claimable1 for the gauge address and for the
  staker: the gauge accrues, the staker does not. Harvest one token (AERO) via
  gauge.getReward(), not pool.claimFees().
skill_section: none
status: open
notes: |
  This is the fact the reduction deleted. The 2026-08-14 report's skill edit #3 kept the
  Aerodrome fee model on the grounds it was "correct and carried runs to full passes",
  and the 2026-08-18 report then argued the protocol prose could move to a wiki because
  "even failed controls implemented the Aerodrome mechanics correctly" — 6/6 at the time.
  It is now 5/6. One counterexample in three controls does not overturn the reduction,
  but the sentence it rests on is no longer true as written, and the shipped skill omits
  the correction rather than making it.

  Graded, unlike building-blocks-aero-merger-tense: goal-002 expect_3 names the fee
  routing explicitly, which is why this surfaced as a scored failure rather than prose
  nobody checked.

  Re-measured 2026-09-21 in major-refine-d9952522 (claude-opus-5 at effort medium):
  goal-002 expect_3 passed in all nine runs, and quiz-002 (which grades the same fee
  model) passed in all eight runs whose design.md reached the judge. Did not reproduce
  in any arm. The codex/gpt-5.5 high row (2026-09-22) read the same: 0/3 in every arm on
  goal-002 expect_3.
