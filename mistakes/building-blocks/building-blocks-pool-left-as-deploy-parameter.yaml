mistake_id: building-blocks-pool-left-as-deploy-parameter
skill: building-blocks
first_seen: 2026-09-22
frequency:
  codex/gpt-5.5:               # major-refine-d9952522, 2026-09-22, effort high; goal-002 expect_1, 3 runs per arm
    none: 1/3
    old: 2/3                   # skill_version 2f0adb01
    new: 0/3                   # skill_version d9952522
category: unresolved-decision
symptom: >-
  The vault names its venue (Aerodrome) but never resolves which pool it deploys into.
  The pool, gauge and reward token arrive as constructor arguments or `0x...` env
  placeholders, and the README hands the choice back: "verify the live pair and gauge
  from Aerodrome's voter/factory contracts or deployment registry" (old-2,
  2026-09-22T121006Z), "confirm the pair, gauge, and route values from Aerodrome's
  current Base deployment sources" (none-3, 2026-09-22T122329Z). The strategy code is
  generic over any volatile pair with a gauge, so the concrete Base LP integration
  decision the task asks for is deferred to whoever deploys it.
expected_pattern: >-
  Resolve the pool before writing the deployment story: `PoolFactory.getPool(USDC, WETH,
  false)`, `Voter.gauges(pool)`, `Voter.isAlive(gauge)` on Base, and write the returned
  addresses with the block number into the README and the deploy script, as new-1
  (2026-09-22T121650Z, block 51645276) and new-3 did. A run that keeps the addresses as
  parameters can still pass by naming the resolved values as the defaults.
skill_section: none
status: open
notes: |
  Sits beside building-blocks-live-pair-evidence-omitted and is not the same miss: that
  record is about the figure that justifies the venue, this one is about the pool the
  code targets. On this stack the old text produces both at once — it names Aerodrome and
  its router/factory addresses (the runs copy them from the skill or its security page),
  but says nothing about picking a pool, so the runs stop at the venue. The new text's
  "verify the target chain and pair from live sources" carries the runs through to a
  resolved pool 3/3, including new-2, which resolved a Uniswap v3 fee tier by a live
  getPool check and passed expect_1 while failing expect_2 on the missing figure.
  Skill-side gap, not a stale fact: neither text says "resolve the pool address".

  Not seen on claude-opus-5 medium (goal-002 expect_1 was 9/9 there, PR #150); the
  frequency block is keyed to this stack for that reason.
