mistake_id: building-blocks-gauge-mechanics-read-as-evidence
skill: building-blocks
first_seen: 2026-08-21
frequency:                     # building-blocks-goal-002 expect_2, shipped-trigger round
  no_skill: 1/3
  with_skill: 0/3
category: judge-false-pass
symptom: >-
  goal-002 no-skill-6 passed expect_2 with no date, no block number and no source
  anywhere in its diff, asserting "Aerodrome is the dominant AMM on Base" from memory.
  What it did verify on chain was mechanism — Pool.claimable0/claimable1 against the
  gauge, Voter.isAlive(gauge) — which expect_2 lists as insufficient: "protocol
  mechanics alone, or an unsupported dominance claim does not pass." The judge appears
  to have credited the onchain reads as the "live incentives/gauge status" evidence the
  check allows, even though no figure and no date accompanied them.
expected_pattern: >-
  expect_2 should separate two things it currently runs together: a dated measurement of
  the pair (liquidity, routed volume, emissions rate) versus a correctness check on the
  reward plumbing. Only the first is venue evidence. Suggested wording: the figure must
  carry a date or block number, and reads that establish how a contract behaves rather
  than what the pair is currently worth do not satisfy it.
skill_section: none
status: open
notes: |
  Not regraded. The orchestrator has read the skill and the expect lines and cannot judge
  blind, so the recorded verdict stands and this record is the correction. If the pass is
  wrong the round is 3/3 vs 0/3 rather than 3/3 vs 1/3 — the delta grows, so the reported
  headline is the conservative one.

  Same shape as the quiz-001 false pass in building-blocks-base-dominance-asserted: an
  expect that spells out its failure condition, a run that meets it, and a judge that
  credits a mechanism argument as evidence. Fixing quiz-001's expect_1 did not
  inoculate goal-002's expect_2, which inherited the same soft clause.
