notes: |
  Two distinct problems, both worth separating.

  Skill side: L169 handed the model a dominance claim with a number attached, which is
  exactly what a run needs to feel done without checking. The five other quiz-001 runs
  all reached for live Base data; the one that did not is the one holding the skill's
  assertion. The reduction to a 128-word trigger deletes L169 outright, so the shortcut
  is gone and the skill now instructs the check instead ('Do not infer launch from an
  announcement or call a protocol dominant from a chain-wide headline'). skill_section is
  `none` rather than a dangling line number, and the record stays open: the replacement
  text has never been benchmarked, and the anti-Uniswap-default correction L169 also
  carried now lives nowhere. Closing this means the Base venue split (Aerodrome leads
  routed volume, Uniswap leads TVL) landing in the wiki/reference layer.

  Eval side: this is a judge false-pass, not a scoring artifact to leave alone. expect_1
  spelled out the failure condition ('a dominance claim in either direction asserted
  rather than shown fails') and the run meets it, but the judge credited the mechanism
  argument as Base-specific reasoning. quiz-001 expect_1 has since been rewritten with a
  hard evidence floor the judge cannot read past ('at least one dated, sourced liquidity,
  routed-volume, or live-incentive figure relevant to that pair; a design that
  deliberately omits current figures fails'). The `pass: true` on with_skill-2 is the old
  expect's verdict and has not been regraded — quiz-001 needs a re-run before that record
  reflects the current grading surface.

  Measured again on 2026-09-21 (major-refine-d9952522, claude-opus-5 at effort medium),
  against the rewritten expect_1 with its dated-figure floor. none 3/3 and old 3/3 fail
  it; new 0/3. None of the six failing runs makes a web or chain call: each is Skill (old
  only), Bash x2, Write, and picks the venue from memory. All three new runs read Base
  live through the shell (9-14 Bash calls each: DefiLlama, cast reads of pools and
  gauges) and cite dated figures. The 2026-08-08 none 0/3 read was against the old
  expect_1 with no evidence floor, which is why it does not reproduce. The replacement
  text is now benchmarked and does what the notes above asked of it on this stack; status
  left open for the other stacks and for the wiki/reference-layer note above.
