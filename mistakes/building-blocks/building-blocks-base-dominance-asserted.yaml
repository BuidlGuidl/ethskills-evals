symptom: "quiz-001 with_skill-2 picks the venue with no lookup of any kind — the whole run is Skill, Bash, Read, Write in 162s — and asserts 'Aerodrome is the dominant DEX' straight from SKILL.md L169, then declines on principle to quote any depth figure ('any specific TVL or APR figure written into this document is stale the week after it's written'). The venue is argued from mechanism (emissions exist, so there is something to harvest), never from Base liquidity for the pair. expect_1 says a dominance claim asserted rather than shown fails; the judge passed it anyway."
expected_pattern: "Show the depth for the pair the design picks, from live Base data, before calling a venue dominant — as quiz-001 with_skill-3 did (read Voter.isAlive() via cast, found the USDC/USDT v2 gauge killed at ~$5.8k and msUSD 31% depegged, rejected both, picked a live gauge at $8.85M TVL). Declining to quote numbers because they rot is a reason to date them, not to skip them."
