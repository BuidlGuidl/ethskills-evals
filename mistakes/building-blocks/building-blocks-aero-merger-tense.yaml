symptom: "SKILL.md L16 says Aerodrome and Velodrome 'merged into Aero (November 2025, Dromos Labs)' and L169 repeats it as 'In November 2025, Dromos Labs merged Aerodrome (Base) and Velodrome (Optimism) into a unified cross-chain DEX called Aero. Same contracts, same ve(3,3) model, new brand.' The merger was announced then, not completed: as of 2026-07-31 aero.xyz still reads 'Aero is on the horizon', launch is targeted for September 2026 after a public audit contest, and no AERO/VELO consolidation has landed. A run trusting this treats Aero as the live brand and VELO as historical, which is backwards on Optimism today."
expected_pattern: "Date protocol migrations by state, not by announcement — 'announced Nov 2025, still unlaunched as of <date>, targeting Sep 2026, token consolidation expected at launch' — and send the reader to the protocol's own contracts list for which token is live now."
skill_section: "L16 — 'The dominant DEX on each L2 is NOT Uniswap'; L169 — 'Dominant DEX: Aero'"
status: open
notes: |
  Third copy of one fact. It was first filed as
  [[addresses-aero-merger-tense]], which named skills/l2s and
  skills/building-blocks as untracked copies; skills/l2s got its own record
  ([[l2s-aero-merger-tense]]) and skills/addresses has since dropped the
  merger, the brands' tokens and the dates entirely, so the addresses record is
  closed and this one carries the remaining building-blocks half. Keeping it
  open under mistakes/addresses/ would have left that directory describing a
  line that no longer exists in skills/addresses.

  The tense is the error, not the steer: reflex-defaulting to Uniswap on Base is
  still the failure both lines exist to prevent, and Aerodrome does lead Base by
  routed volume.

  L169 carries a second, independent defect at the same line — "~$500-600M TVL"
  as the dominance figure. That is the metric error tracked as
  [[addresses-base-dominance-metric]]: Aerodrome leads Base on routed volume,
  not TVL, where Uniswap is narrowly ahead (~$305M vs ~$285M as of 2026-07-27),
  and ~$500-600M is roughly double the real figure. That record is marked fixed
  for skills/addresses only; the figure is still live here.

  Not graded by any building-blocks task today. building-blocks-quiz-001 grades
  the venue instinct and accepts either brand name, as do addresses-quiz-001 and
  addresses-goal-001, so no expect line depends on the tense either way.

  Schedule per the protocol's own post, re-read 2026-07-31
  (https://aero.xyz/articles/aero-is-on-the-horizon/): codebase public 3 Aug,
  final audit round through 21 Aug, public audit contest 24 Aug - 11 Sep, launch
  expected September following the contest. Single-sourced to that post, and
  review has since reported the host unreachable — re-check before relying on
  the dates.
