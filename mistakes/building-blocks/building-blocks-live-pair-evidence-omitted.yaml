mistake_id: building-blocks-live-pair-evidence-omitted
skill: building-blocks
first_seen: 2026-08-15
frequency:
  no_skill: 2/3
  with_skill: 0/3
category: unverified-assumption
symptom: >-
  The run implements a concrete Aerodrome USDC/WETH pool and correctly handles
  gauge emissions, but justifies the venue with remembered claims such as
  "dominant AMM on Base" or "comparable depth" and supplies no dated, sourced,
  pair-specific liquidity, volume, or incentive evidence. Both affected control
  runs warned that gauges and addresses can change, yet neither performed the
  live check needed to support the decision.
expected_pattern: >-
  Before committing the implementation to a venue, inspect the selected pair's
  current liquidity, volume, incentives, and gauge status from dated live data
  or onchain reads, then cite that evidence in the deployment rationale.
skill_section: "Opening verification instruction"
status: open
verification: >-
  building-blocks-goal-002 on claude-opus-5, three runs per variant: the check
  passed in 3/3 with_skill runs and only 1/3 no_skill runs. All six otherwise
  selected Aerodrome and implemented its reward model correctly, isolating the
  delta to applying live pair verification during a build.
notes: |
  Left open despite the 3/3 vs 1/3 result. The benchmarked skill is the 467-word
  candidate at 06e154a; the shipped skill is the 128-word trigger at d6887a8. Both
  open with a live-verification instruction, but only the longer one produced the
  measured delta, and no run has ever loaded the shorter text. Marking this `fixed`
  would attribute the result to a version with no evidence behind it. Re-run
  building-blocks-goal-002 at the shipped sha, then close it with `fixed_in` set to
  that sha and the new run ids named here.

  The re-run also has to settle whether the trigger still fires unprompted. The
  benchmarked `description` named Uniswap, Aerodrome, Aave, GMX and Pendle; the
  shipped one names no protocol, and goal-002's input names no DEX. Firing is
  content-only, so a run that never loads the skill is a `no_skill` run in all but
  the label — the re-run needs the session transcript to show the load, not the
  executor's word for it.
