symptom: >-
  quiz-002 new-2 (2026-09-21T130911Z-claude-with-skill-d9952522-2) wrote its only
  deliverable with the Write tool to an absolute path it retyped wrong:
  `~/.cache/ethskills-evals/<run-id>-building-blocks-quiz-002/design.md`, a hyphen
  where the workspace path has a slash (`<run-id>/building-blocks-quiz-002`). The
  file landed in a new sibling dir outside the workspace, `verify` snapshotted an
  empty workspace, and the judge failed all three expect lines on no evidence. The
  run's closing message describes a design that reads Base live (router, voter,
  gauge via cast), harvests AERO via gauge.getReward() and routes swap fees to
  veAERO voters, so the content was likely there. That is not a grade: nobody
  judged it, and the run stays a fail.
expected_pattern: >-
  Write the deliverable relative to the working directory the task names ("in this
  directory"), or use the cwd the session reports verbatim, never a path rebuilt
  from memory after long absolute-path shell work.
skill_section: none
status: open
notes: |
  Not a knowledge failure and not something the skill text can fix. It is on file
  because it cost the new arm one quiz-002 pass (2/3 instead of 3/3) and a reader
  of the tally should be able to find why. The run made 15 Bash calls with absolute
  `cd` paths into the workspace before writing; the slip happened on the Write.

  The stray dir was deleted after grading, so the file is gone; it was never
  evidence. Grading it by hand would be the orchestrator grading from its own
  context (AGENTS.md hard rule 4), so it was not done.

  Harness angle, not filed as a harness bug: `verify` could warn when a bare
  task's workspace holds no new files, since an empty snapshot almost always
  means the deliverable went somewhere else. See
  reports/major-refine-building-blocks-opus-5-medium.md.
