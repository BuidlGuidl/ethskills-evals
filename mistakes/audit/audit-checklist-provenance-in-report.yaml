mistake_id: audit-checklist-provenance-in-report
skill: audit
first_seen: 2026-09-04
source: audit-goal-001 (lib/blindness.ts "[checklist provenance]" refusal, not a graded expect)
frequency:                     # per variant, per stack; the leak only exists where a checklist was loaded
  codex/gpt-5.6-sol@7be55c8b:  # 2026-09-04; the minimized revision that d9952522 descends from
    no_skill: 0/3
    with_skill: 1/4            # 2026-09-04T155051Z-codex-with-skill-3, retracted in review of PR #110
  claude/claude-opus-5@2f0adb01:  # 2026-09-21, major-refine-d9952522
    no_skill: 0/3
    with_skill: 0/3            # the old arm never fetched a checklist, so it had nothing to cite
  claude/claude-opus-5@d9952522:  # 2026-09-21, major-refine-d9952522
    no_skill: 0/3
    with_skill: 4/4            # runs 1-3 plus the run-4 replacement drawn for the retracted run 1
  codex/gpt-5.5-high@2f0adb01:  # 2026-09-24, major-refine-d9952522, old arm
    no_skill: 0/3
    with_skill: 0/3
  codex/gpt-5.5-high@d9952522:  # 2026-09-24, major-refine-d9952522, new arm (same no_skill runs)
    no_skill: 0/3
    with_skill: 0/3            # the old arm fetched no checklist; the new arm fetched 8-10 per goal run and never named them in the report
category: deliverable-leaks-variant
symptom: "AUDIT-REPORT.md opens with a Method line naming the checklists the review was checked against — 'checked against the pinned `evm-audit-skills` checklists (general, precision-math, ...)', 'Cross-checked against the evm-audit-skills checklists pinned at `ffe4b67`', 'checked against lending, oracle, Arbitrum-specific, ERC20, proxy, signature and DoS checklists' — which no no_skill run can write, so the judge learns the arm from the deliverable."
expected_pattern: "The report describes what was reviewed and how findings were verified, not which guidance repository the reviewer read; provenance of the reviewer's own method belongs in the transcript, not the client deliverable."
skill_section: "The Checklists"   # 'The checklist repository is pinned so two audits do not silently use different guidance' — the executor repeats that promise in the report
status: open
notes: |
  On claude/claude-opus-5 at d9952522 this is a property of the arm, not an accident: every
  draw of the new arm did it, in wording that paraphrases the skill's own pinning sentence.
  Run 1 was refused by verify, retracted and replaced per the AGENTS.md rule; the replacement
  leaked the same line, and so did runs 2 and 3. All four were then graded with
  --allow-skill-mention and the report says which grades were not blind. Grading them was
  the only way to keep a new arm at all; re-drawing until a clean run appeared would have
  selected for runs that skipped the checklists, which is a different arm.

  The same sentence leaked once on codex at 7be55c8b (the retracted 2026-09-04 run 3), whose
  replacement did not repeat it. The claude rate is 4/4, so the replacement rule that worked
  for codex does not close this on claude.

  Whether the leak moved a grade cannot be shown from the verdicts: the leaking runs scored
  11/11 plus severity, the same as every none and old run in the sitting, so the judge's
  knowledge of the arm had nothing to raise. On a task that discriminated it would.

  Two ways to close it. In the skill: say the report is for the client and should not name
  the checklist repository or the skill; the pinning sentence can stay, the report line is
  what has to go. In the harness: nothing — lib/blindness.ts catches this shape, which is
  how it was found. Retracting the runs instead would remove the arm from the benchmark.

  Re-measured 2026-09-24 on codex/gpt-5.5 high under major-refine-d9952522: No GPT 5.5 report names evm-audit-skills or the checklists; every goal run left only AUDIT-REPORT.md, so all nine grades are blind. The claude 4/4 rate did not transfer to codex.
  See reports/major-refine-audit-gpt-5.5-high.md.
