mistake_id: audit-skill-not-invoked
skill: audit
first_seen: 2026-08-12
frequency:
  no_skill: n/a
  with_skill: 6/12          # half the with_skill runs never loaded the skill
source: runs (audit eval, claude/opus-5, 2026-08-12)
category: trigger-miss
symptom: >-
  Half the with_skill runs answered without ever loading the skill. Per task:
  quiz-001 2/3 loaded, quiz-002 0/3, quiz-003 2/3, goal-001 2/3. The misses
  split two ways. Five runs never looked at it at all — quiz-002 is the clearest
  case, where all three runs read a prose incident report about interest
  accrual, recognised it as a reasoning question and answered from context
  without listing skills. The sixth (goal-001 run 2) is worse: it found
  .claude/skills/audit/SKILL.md in its own file listing, opened it, read the
  routing table and the five phases, and then ignored it — no master index
  fetch, no checklists, no sub-agents. Those six runs are no_skill reruns
  carrying a with_skill label, and blending them into the with_skill column
  would overstate whatever the skill contributes.
expected_pattern: >-
  The description needs to cover incident-shaped and post-mortem-shaped prompts,
  not just "audit this repo" — "explain how this happened and what we change" is
  the form a security question actually arrives in. quiz-002 (a rate-accrual
  discrepancy across two chains) triggered nothing three times out of three
  despite chain-specific being one of the twenty routed checklists.
skill_section: "frontmatter description / routing table entry conditions"
status: open
notes: |
  Ungraded, and it costs nothing on this benchmark: every non-triggering run
  passed every expect anyway, because Opus 5 answers all four tasks correctly
  unaided. The trigger miss matters for a weaker executor, where the skill would
  be load-bearing and would not be there.

  goal-001 run 2 is the one to fix first. A prompt that says "I need a security
  review before we put real money behind it", in a workspace whose file listing
  shows the skill, is as close to the skill's home ground as a prompt gets, and
  the agent still read past it. See [[audit-subagent-phase-never-fires]] for the
  other half of the picture: even when it loads, the mechanism it describes does
  not run.
