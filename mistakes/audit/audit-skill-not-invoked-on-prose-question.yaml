mistake_id: audit-skill-not-invoked-on-prose-question
skill: audit
first_seen: 2026-08-27
source: audit-quiz-001/-002/-003 (transcript mining, not a graded expect)
frequency:                     # per variant, per stack
  claude/claude-opus-5:        # 2026-08-27
    no_skill: n/a              # nothing to load in this variant
    with_skill: 9/9            # every with_skill quiz run answered without opening the skill
category: skill-activation
symptom: "On a question-shaped audit task — an incident narrative with a Solidity snippet pasted into the prompt and no contract files in the workspace — the agent never invokes the skill. All nine with_skill quiz runs made ~2 Bash calls (one `ls`, one heredoc writing answer.md) and never touched .agents/skills/audit/SKILL.md, the Skill tool, or the checklist repo."
expected_pattern: "The skill triggers on reviewing a pasted snippet or diagnosing a post-mortem, not only on auditing a repo of contract files."
skill_section: "description frontmatter"   # 'Use when asked to audit a contract, find vulnerabilities, review code for security issues, or file security issues on a GitHub repo'
status: open
notes: |
  Not a wrong answer — all nine runs passed all four checks anyway. It is a measurement
  problem: those nine runs are no_skill runs wearing the with_skill label, so
  audit-quiz-001/-002/-003 report a with_skill column that no skill produced. Any future
  sitting that wants a real with_skill number on these three tasks has to force the
  trigger with the "Use the audit skill for this task." spawn line, and report the
  numbers as trigger-inclusive so they never blend with content-only runs.

  The description names artefacts ("a contract", "a GitHub repo"). The quiz prompts hand
  over a snippet inside a support ticket or a post-mortem and ask what went wrong, which
  reads as a debugging question rather than an audit request.

  Overlaps PR #65's `audit-skill-not-invoked` (2026-08-12 sitting, with_skill 6/12).
  Same phenomenon, independently measured, and worse here: 9/9 rather than 6/12, and
  quiz-002 missed 3/3 in both sittings. Neither rate is merged into the other — they are
  separate sittings against an unpinned checklist repo. If both records land, collapse to
  one and carry the two dated measurements side by side rather than averaging them.
