mistake_id: audit-subagent-fanout-not-executed
skill: audit
first_seen: 2026-08-27
source: audit-goal-001 (transcript mining, not a graded expect)
frequency:                     # per variant, per stack
  claude/claude-opus-5:        # 2026-08-27
    no_skill: n/a              # the pipeline only exists in the skill
    with_skill: 3/3            # every with_skill goal run skipped the fan-out
category: pipeline-not-followed
symptom: "The skill loads (Skill tool call, 'Launching skill: audit') and 2/3 runs curl the master index plus 10-13 domain checklists, but no run spawns the one-sub-agent-per-domain fan-out SKILL.md step 4 prescribes. Task/Agent tool calls: 0 across all three runs. Each agent reads the checklists inline in its own context and writes AUDIT-REPORT.md itself."
expected_pattern: "Either the skill spawns a sub-agent per routed domain as step 4 states, or the skill stops prescribing a fan-out it does not produce."
skill_section: "How To Run An Audit"   # step 4, 'Spawn one opus sub-agent per skill (parallel)'
status: open
notes: |
  This is the mechanism audit-goal-001 exists to test, and it did not run once. Steps 5
  and 6 fall with it: no run wrote findings-<skill>.md, so nothing was synthesised from
  per-domain files — which is incidentally why grading stayed blind, since a stray
  findings-oracles.md in the workspace snapshot would have told the judge which variant
  it was reading.

  Inlining is not obviously the wrong call on a 486-line fixture: the whole codebase fits
  in one context, and the inline runs scored the same 11/11 as no_skill. But it means the
  skill's central claim — parallel specialists over 500+ checklist items — is untested by
  this benchmark rather than confirmed by it. A fixture large enough that one context
  cannot hold it is what would force the fan-out and make the claim measurable.

  Overlaps PR #65's `audit-subagent-phase-never-fires` (2026-08-12 sitting). Same
  phenomenon, independently measured. Collapse to one record if both land, keeping each
  sitting's measurement separate.
