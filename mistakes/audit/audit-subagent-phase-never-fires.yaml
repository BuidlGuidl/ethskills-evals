mistake_id: audit-subagent-phase-never-fires
skill: audit
first_seen: 2026-08-12
frequency:                     # of the with_skill runs that actually loaded the skill
  no_skill: n/a
  with_skill: 6/6
source: runs (audit eval, claude/opus-5, 2026-08-12)
category: skill-mechanism-not-followed
symptom: >-
  SKILL.md Phase 3 is "Parallel Sub-Agents — spawn one Opus sub-agent per skill,
  each receives full source + checklist + standard format, outputs to
  audits/<repo>-<date>/findings-<skill>.md". No run ever spawned one. Across all
  six with_skill runs that loaded the skill (including goal-001 run 1, which
  fetched ten checklists), the Task tool count is zero: the main agent pulled the
  checklists into its own context and worked them inline. The routing table is
  the part of the skill that gets used; the fan-out that the routing is for
  never happens, so the eval could not measure the thing it was built to
  measure — whether a domain sub-agent per area beats one careful read.
expected_pattern: >-
  Either the skill spawns the per-domain sub-agents it describes, or it stops
  describing a mechanism it does not invoke. If inline checklist review is the
  real behaviour, Phase 3 should say so and the file-per-domain output contract
  should go with it. If fan-out is genuinely wanted, Phase 3 needs an explicit
  imperative the agent acts on ("call the Task tool once per routed skill")
  rather than a description of an architecture.
skill_section: "Phase 3: Parallel Sub-Agents"
status: open
notes: |
  Silver lining for grading: because no sub-agent ran, no run wrote
  findings-<domain>.md into the workspace, so nothing leaked the variant to the
  blind judge. Every workspace held exactly TASK.md, the untouched fixture and
  AUDIT-REPORT.md.

  Not gradable by the current expects — all twelve goal-001 expects passed in
  every run with or without fan-out, so no expect turns on this. It is visible
  only in the transcripts.
