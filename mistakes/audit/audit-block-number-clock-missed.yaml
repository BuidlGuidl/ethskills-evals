notes: |
  The other four valid goal runs got Arbitrum semantics right: Solidity block.number
  approximates the L1 block number there, making the 12-second assumption near-correct
  only by coincidence. All prescribed block.timestamp as the fix.

  Stack-specific as measured. claude/claude-opus-5 never reproduced it: expect_5 passed
  in all six runs of the comparable 2026-08-27 sitting, and in all six of the 2026-08-12
  sitting (PR #65) — 12/12 against the same expect lines, unchanged since 556ceec.

  Not reproduced by the minimized revision. The one @7be55c8b skill run that missed it
  is `2026-09-04T155051Z-codex-with-skill-3`, which was retracted in review of PR #110
  for not being graded blind; its evidence is kept but excluded from every count. Its
  replacement passed expect_5, as did the other two skill runs. Reopen this if a
  later blind sitting reproduces it — the observation is not disproved, only unmeasured
  on this revision.

  The @7be55c8b with_skill runs are 2026-09-04 runs 1 and 2 plus the 2026-09-08
  replacement `2026-09-08T142026Z-codex-with-skill-4`. Run 3 of the sitting is
