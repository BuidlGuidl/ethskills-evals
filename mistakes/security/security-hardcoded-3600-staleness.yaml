category: stale-skill-content
symptom: "SKILL.md's Chainlink example hardcodes one staleness bound for every feed: require(block.timestamp - updatedAt < 3600, \"Stale price\"). Heartbeats are per-feed — mainnet ETH/USD updates on a 1h heartbeat, USDC/USD on 24h — so a global 3600 check reverts almost continuously on a slow feed and bricks any market that reads it."
expected_pattern: "Carry the staleness bound per feed (constructor/config parameter, or a documented per-feed constant) and set it from that feed's published heartbeat plus a margin, rather than a single global 3600."
skill_section: "Prices and liquidations"   # "Never Use DEX Spot Prices as Oracles" before dcd9152a
status: fixed
fixed_in: dcd9152a
verification: >-
  The minimal skill replaces the hardcoded hour with a per-feed maximum age
  derived from the published heartbeat plus a justified margin. After the
  rubric clarification, security-quiz-002 expect_4 passed 3/3 with_skill on
  codex/gpt-5.4; one no_skill answer still gave only an arbitrary configured
  bound and failed.
notes: |
  No run was misled on claude-opus-5. 5/6 quiz-002 answers named the 24h
  USDC/USD heartbeat explicitly and treated the bound as per-feed; all 6
  goal-002 builds made staleness a configurable per-asset parameter with
  bounds, never a hardcoded hour.

  Confirmed from inside a run — security-quiz-002/with-skill-1: "A single
  global 3600 staleness constant — which is what the boilerplate snippet in
  our internal security skill shows, and what most codebases copy — will make
  USDC/USD revert almost continuously and brick the market. Worth correcting
  in that skill too."

  Same shape as [security-safeapprove-removed-in-oz-v5]: the skill's prose is
  right, its copy-paste snippet is wrong, and the model out-performs the
  snippet it was given.

  The codex/gpt-5.4 stack also avoided the stale snippet: all six quiz-002
  answers used a configurable max age / feed heartbeat rather than hardcoding
  3600. No run became wrong because of this skill defect.

  See [security-oracle-maxage-not-feed-derived] for the model-side counterpart:
  a configurable bound that is still never derived from the chosen feed. This
  record is about the skill text; that one is about the answer.
