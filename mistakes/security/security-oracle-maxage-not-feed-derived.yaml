category: oracle-validation
symptom: "Checks updatedAt against a configurable staleness number but never derives that bound from the selected feed's published heartbeat or update interval."
expected_pattern: "Choose maxAge per feed from its published heartbeat plus a justified margin (or a tighter asset-risk bound), rather than treating any configurable number as sufficient."
skill_section: "Prices and liquidations"
status: open
notes: |
  Measured by security-quiz-002 expect_4 on codex/gpt-5.4 after the
  2026-09-04 rubric clarification. no_skill-1 required a configured staleness
  bound but did not tie it to the feed's heartbeat; all three with_skill runs
  made that derivation explicit.

  Same rule as [security-hardcoded-3600-staleness], from the other side: that
  record is `stale-skill-content` — the pre-dcd9152a skill's own snippet
  hardcoded one hour — while this one is `oracle-validation`, a model that
  parameterizes the bound and still never derives it from a feed. Keep both:
  fixing the snippet does not by itself close this.

  Did not reproduce on claude/claude-opus-5 medium in the
  major-refine-d9952522 benchmark (2026-09-22): all three security-quiz-002
  no_skill answers derived maxAge from the selected feed's published heartbeat
  plus a margin, naming the 1h ETH/USD and 24h USDC/USD heartbeats. Kept open:
  the 1/3 no_skill rate that opened this record is codex/gpt-5.4, and the
  open-model stacks are unmeasured.

  codex/gpt-5.5, benchmark major-refine-d9952522 (2026-09-22), reproduces the
  2026-09-04 rate exactly: 1/3 no_skill, 0/3 in both skilled arms. no-skill-1
  listed a correct validation checklist — positive answer, complete round,
  non-zero updatedAt — and then bounded staleness against "the market's
  configured max staleness", one global number for the market rather than a
  bound derived from the chosen feed's heartbeat. The frequency block was
  flat two-line until this measurement; the pre-existing rate is the
  codex/gpt-5.4 row, per its `notes` above, and is keyed as such here rather
  than averaged with the new stack.
