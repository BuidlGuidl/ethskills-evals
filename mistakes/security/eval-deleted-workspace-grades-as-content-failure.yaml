mistake_id: eval-deleted-workspace-grades-as-content-failure
skill: security
first_seen: 2026-09-22
frequency:                     # harness incidents, not model errors
  claude/claude-opus-5 medium @ major-refine-d9952522:
    no_skill: 0/24
    with_skill_2f0adb01: 0/24
    with_skill_d9952522: 0/24
category: harness
symptom: "An executor whose workspace is deleted mid-run keeps going and exits 0. Its transcript reads as a model that reasoned correctly but could not write its deliverable, and executor.err carries 'Failed to write file <workspace>/answer.md', which matches none of the SHELL_FAILURES signatures in lib/executor-health.ts — so verify grades it as a content failure rather than refusing it."
expected_pattern: "verify should refuse a run whose workspace vanished. Either add the write-failure signature to SHELL_FAILURES, or have verify check workspace.path still exists before grading."
skill_section: "none"          # harness defect, not a skill gap
status: open
notes: |
  Observed on a codex/gpt-5.5 security-quiz-001 no_skill run during the
  major-refine-d9952522 benchmark, not on a run in this report. The cause was
  `yarn clean-workspaces --delete` run from a sibling checkout: it treats a
  workspace as an orphan when the checkout it runs in has no run dir for it,
  while ~/.cache/ethskills-evals/ is shared by every clone on the machine. The
  killed run exited 0 in 106s having spent ~128k tokens.

  Two things follow. For operators: give each concurrent benchmark its own
  EVAL_WORKSPACE_ROOT, on all three commands, and never run clean-workspaces
  without --root while another session has runs in flight — AGENTS.md says this
  and it is easy to miss. For the harness: exit 0 is not enough to trust, so
  the deliverable-missing case needs its own refusal path.

  Filed under skills/security because that is the benchmark that surfaced it;
  the defect is not specific to this skill.
