category: replay-protection
symptom: "Adds chainId to EIP-712 but leaves a constructor-cached domain separator permanently trusted if block.chainid changes after a fork."
expected_pattern: "Cache the deployment chain id and re-derive the domain separator when block.chainid changes, or use OpenZeppelin EIP712 which performs that invalidation."
skill_section: "Signatures and replay protection"   # "none" — the section did not exist before dcd9152a
status: fixed
fixed_in: dcd9152a
verification: >-
  Re-tested on codex/gpt-5.4 in the 2026-09-04 minimal-skill benchmark:
  security-quiz-005 expect_4 passed 3/3 with_skill versus 0/3 no_skill. All
  three skilled answers used OpenZeppelin EIP712 or explicitly re-derived the
  cached separator when block.chainid changes.
notes: |
  claude/claude-opus-5 comes from the 2026-07-28 benchmark, which ran these
  specs unchanged (`tasks/security-quiz-005.yaml` untouched since a5057d6):
  security-quiz-005 expect_4 passed 6/6 there, so 0/3 in both arms.

  Read that 0/3 carefully. expect_4 is conditional — "if it caches the domain
  separator, it accounts for block.chainid changing" — so an answer that never
  caches passes it without addressing the fork at all, and 0/3 strictly means
  "never wrong here", not "always handled". On this stack it happens to mean
  both: all six claude answers cached and re-derived on mismatch, each naming
  OpenZeppelin's EIP712 as the implementation. From no-skill-2: "a value
  computed once in the constructor is wrong the moment block.chainid changes
  under a live deployment ... Cache, but verify and recompute on mismatch."

  codex/gpt-5.4 at 191dcc1 is where the gap showed: 3/3 no_skill and 1/3
  with_skill. That skill's EIP-712 section did not teach the fork case, so the
  residual with_skill miss was a content gap, per the task's verdict-flipping
  note.

  The minimal rewrite added the missing fork-aware cache rule, which is why
  the frequency block carries a skill revision per measurement: the 1/3
  with_skill rate belongs to 191dcc1 and is superseded, not contradicted, by
  the 0/3 at dcd9152a.

  codex/gpt-5.5, benchmark major-refine-d9952522 (2026-09-22), reproduces the
  same split on a newer model and is the reason status stays `fixed`. The old
  arm (2f0adb01, which vendors the 191dcc1 text) missed 1/3 — with-skill-2 put
  chainId in the domain correctly and then assigned DOMAIN_SEPARATOR once at
  construction with no re-derivation. The new arm missed 0/3. Note the
  no_skill column moved the other way on this stack: 0/3 wrong, where
  gpt-5.4 was 3/3. gpt-5.5 handles the fork case unprompted, so on this stack
  the *only* arm that got it wrong is the one carrying the old skill text —
  the skill was actively steering a model that already knew better. That is a
  negative delta for the old arm, not a residual gap in the new one.
