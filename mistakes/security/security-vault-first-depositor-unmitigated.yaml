category: insecure-default
symptom: "Builds a permissionless receipt-token vault with a 1:1 empty-vault path and raw assets * supply / balance share math, leaving the first-depositor donation attack exploitable."
expected_pattern: "Use OpenZeppelin ERC4626's virtual assets/shares, an equivalent hand-rolled virtual offset, or a dead initial deposit before accepting public deposits."
skill_section: "Asset accounting"   # "Vault Inflation Attack" before dcd9152a
status: open
notes: |
  claude/claude-opus-5 comes from the 2026-07-28 benchmark, which ran these
  specs unchanged (`tasks/security-goal-001.yaml` untouched since a5057d6):
  security-goal-001 expect_1 passed 6/6 there, so 0/3 in both arms.

  codex/gpt-5.4 is the clearest discriminator on that stack: all three
  no_skill builds hand-rolled the empty-vault 1:1 path with raw
  assets * supply / balance math; all three with_skill builds protected it
  (one OZ ERC4626, two hand-rolled +1/+1 virtual offsets).

  codex/gpt-5.5, benchmark major-refine-d9952522 (2026-09-22), security-goal-001
  expect_1. The no_skill rate fell from 3/3 to 1/3 — gpt-5.5 usually defends the
  empty vault unprompted — but the failure mode is unchanged when it does slip.
  no-skill-2 shipped
  `supply == 0 ? assets : (assets * supply) / totalAssets()` over
  `ASSET.balanceOf(address(this))`, guarded only by a `ZeroShares` revert. That
  revert is what makes the run worth recording rather than dismissing as an old
  bug on a better model: it reverts the victim's deposit and reads as a
  deliberate fix, while leaving the donation manipulation itself untouched. Both
  skilled arms were 0/3, by different routes — the old arm hand-rolled virtual
  offsets, the new arm inherited OZ ERC4626 — so the skill still closes this on a
  frontier model, it just has fewer runs left to close.
