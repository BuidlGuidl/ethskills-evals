  claude/claude-opus-5:
    no_skill: 0/3
    with_skill: 0/3
  codex/gpt-5.4:
    no_skill: 3/3
    with_skill: 0/3
  codex/gpt-5.5 @ 2f0adb01:     # major-refine-d9952522, old arm
    no_skill: 1/3
