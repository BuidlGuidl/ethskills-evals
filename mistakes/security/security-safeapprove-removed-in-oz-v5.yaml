category: stale-skill-content
symptom: "SKILL.md's SafeERC20 example prescribes token.safeApprove(spender, amount). OpenZeppelin removed safeApprove in Contracts v5, so the snippet does not compile on any v5 repo, and it does not solve the USDT approve-race it is implicitly offered for. security-quiz-004 pins its repo to v5 and grades exactly this: an executor that copied the skill's line would fail expect_2."
expected_pattern: "SafeERC20.forceApprove (or safeIncreaseAllowance / safeDecreaseAllowance, which route through it in v5) for the approve path; safeTransfer / safeTransferFrom stay correct."
skill_section: "Asset accounting"   # "SafeERC20" before dcd9152a
status: fixed
fixed_in: dcd9152a
verification: >-
  The minimal skill now names forceApprove and says safeApprove was removed in
  OpenZeppelin Contracts v5. Re-tested by security-quiz-004 on codex/gpt-5.4:
  expect_2 passed 3/3 with_skill and 3/3 no_skill.
notes: |
  No run was misled on claude-opus-5: 6/6 quiz-004 runs prescribed forceApprove
  and 6/6 passed. The defect is in the skill text, not in the model. It was
  confirmed from inside a run — security-quiz-004/with-skill-3 wrote a section
  titled "One correction to the skill material": "The security skill this answer
  was written against recommends token.safeApprove(spender, amount). That call
  does not compile on OZ v5 — safeApprove was removed in 5.0. Use forceApprove."
  Filed on that evidence rather than on a failed expect line, per the task's
  stale-skill note. The risk is real for weaker models that copy the snippet
  instead of correcting it.

  The codex/gpt-5.4 stack likewise overrode the stale snippet: 6/6 quiz-004
  answers prescribed forceApprove or an explicit zero-then-set sequence, and
  every run passed. The skill defect remains real even though it did not flip
  a run on either measured frontier stack.

  Re-measured on claude/claude-opus-5 medium in the major-refine-d9952522
  benchmark (2026-09-22): security-quiz-004 passed 3/3 in all three arms. All
  9 answers prescribed forceApprove — 6-15 mentions each — including 3/3 runs
  whose own installed skill text said safeApprove. One stated the correction
  in the deliverable: "Do not reach for safeApprove — it was removed in
  OpenZeppelin Contracts v5 precisely because it reverted on the non-zero to
  non-zero case instead of handling it. forceApprove is its replacement."
  Third frontier stack on which this skill defect never became a model error.
