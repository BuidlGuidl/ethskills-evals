category: eval-saturation
symptom: "Every live security task passes in every arm on Opus 5 medium. 72 runs across 8 tasks and 3 arms produced zero failing expect lines, the unskilled baseline included, so the task set can no longer distinguish the refined skill from the old one, nor either from no skill."
expected_pattern: "A task set whose unskilled baseline fails something. Rotate the planted decisions — new vocabulary, held-out claims, or a rubric that grades which primitive was reached for rather than only the outcome — instead of loosening expect lines."
skill_section: "none"          # not a skill gap; the eval cannot measure the skill
status: open
notes: |
  Measured by the major-refine-d9952522 benchmark on claude/claude-opus-5 at
  medium effort, judged by claude-opus-5 at high effort: security-goal-001,
  security-goal-002 and security-quiz-001..006, 3 runs per arm per task.
  Result 24/24 · 24/24 · 24/24. See reports/major-refine-security-opus-5-medium.md.

  This is the same shape as the testing skill's saturation on the same stack,
  and the remedy is the same: build tasks whose vocabulary is rotated away from
  the skill's own examples and whose claims are held out of the text.

  Two specific holes this benchmark exposed, both worth fixing before the next
  security run on a frontier stack:

  - security-quiz-004 expect_2 and security-quiz-002 expect_4 grade stale-skill
    content (safeApprove, a hardcoded 3600). A frontier model corrects both
    unprompted — 9/9 and 9/9 here — so those cells can only fail a model weak
    enough to copy a snippet. Their remaining value is on the open-model stacks.
  - security-goal-001 expect_1 accepts a hand-rolled virtual offset and OZ
    ERC4626 equally, which is exactly where the arms diverged: both skilled arms
    inherited ERC4626 3/3, all three no_skill runs hand-rolled. The clearest
    measured effect of the skill is invisible to the rubric that was meant to
    catch it.

  Not evidence that the refined skill is unnecessary: it says the tasks cannot
  see a difference on this stack, not that there is none. The three other
  stacks in #119 are unmeasured for this skill.
