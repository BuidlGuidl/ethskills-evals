mistake_id: standards-eval-skill-example-matches-graded-literal
skill: standards
first_seen: 2026-08-31
frequency:
  no_skill: 0/3
  with_skill: 0/3
source: "standards-goal-001 expect_8 and standards-quiz-001 expect_5 — found in review of #92, not reproduced as a delta by any run"
category: eval-design
symptom: "The minimal skill rewrite (f3ba42f) changed the x402 base-units example to `$0.35 USDC is 350000` — the exact literal and the exact 0.35 x 10**6 derivation that standards-goal-001 expect_8 and standards-quiz-001 expect_5 grade, and that both task inputs price the call at. A with_skill run could satisfy both graded lines by transcribing the skill's example rather than deriving the value, so the with_skill arm of those two lines was confounded by answer leakage. The vendored skill it replaced used $0.10 -> 100000 and $0.50 -> 500000, which collide with nothing."
expected_pattern: "Worked examples in a skill must not use the literal a task grades. Teach the rule with a value the eval does not ask for — the skill now scales $0.10 and $2.50 — so a graded derivation can only come from the model applying the rule."
skill_section: "x402 — pay per HTTP call, no accounts (base units paragraph)"
status: fixed
notes: |
  Same family as standards-eval-domain-binding-owner-field: the eval and the
  skill agreeing on one spelling of an answer. The direction is opposite, and so
  is the consequence. There the expect line encoded the SKILL's invention and
  manufactured a false delta; here the SKILL encoded the EVAL's literal, which
  can only inflate with_skill.

  No re-run required, and no published number changes. Both lines were at
  ceiling on BOTH variants across the 2026-08-26 batch — the only two failures in
  144 judgments were goal-001 expect_1 and expect_4 on no-skill-3 — so no_skill
  derived 350000 unaided 3/3 and the leakage cannot have produced the reported
  delta. It is fixed because the confound would matter the moment either line
  stops being at ceiling, not because it corrupted a result already published.

  Fixed 2026-08-31 in skills/standards/SKILL.md: the base-units paragraph now
  scales $0.10 and $2.50 and states the rule (dollar figure scaled by the token's
  decimals) instead of pre-computing the graded case. Note the skill text
  therefore differs from the f3ba42f/194f765 blob the 2026-08-26 runs read; the
  benchmarked text is recoverable at those shas.
