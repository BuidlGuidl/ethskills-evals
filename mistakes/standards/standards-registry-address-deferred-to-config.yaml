source: standards-goal-001 (graded expect_1 and expect_4) — claude/opus-5 no_skill run 3, 2026-08-26; codex/gpt-5.5-high no_skill runs 1 and 3, 2026-09-22
category: knowledge-gap
symptom: "Designs the whole service on the ERC-8004 Identity and Reputation registries by name, then never produces their addresses: register.ts reads process.env.IDENTITY_REGISTRY, server.ts falls back to a 0x...02 placeholder, and design.md says to 'take the address from the ERC-8004 canonical deployment list for chain 8453 ... do not hardcode a guess'. The service cannot be registered until a human supplies the value."
expected_pattern: "Give the deployed addresses — IdentityRegistry 0x8004A169FB4a3325136EB29fA0ceB6D2e539a432 and ReputationRegistry 0x8004BAa17C55a88189AE136b182e5fdA19dE9b63 on mainnets — as the default, whether recalled or verified live. Keeping them overridable by env is good practice and not the defect; shipping no value at all is."
skill_section: "ERC-8004 — agent identity and reputation (address table)"
status: open
notes: |
  The only failing run in the 18-run benchmark of the minimal skill
  (reports/standards-2026-08-26.md), and it failed for a reason the eval was not
  built to catch: not a substituted design (it reached ERC-8004 unprompted and
  used it correctly throughout) but a missing constant. That is precisely the
  material the skill carries, so it reads as a knowledge-cost result rather than
  a habit result.

  Eval-side ambiguity, recorded rather than resolved: expect_1 and expect_4 name
  their negatives as wrong architectures — a self-hosted directory, an ENS-only
  scheme, a newly written registry contract — and say nothing about an address
  deferred to configuration. A judge reading the lines strictly could have passed
  this run. Before the next benchmark, decide explicitly whether "correct
  architecture, address parameterized with a named canonical source" passes, and
  write the answer into both lines. Same family as
  standards-eval-domain-binding-owner-field: one spelling of a right answer,
  graded by implication.

  Re-measured 2026-09-22 on codex/gpt-5.5-high as part of
  major-refine-d9952522. The same pattern reproduced in no_skill runs 1 and 3:
  both selected ERC-8004 by name and built the service around Identity and
  Reputation registries, but shipped placeholder/env-only registry addresses.
  Run 1 defaulted agentRegistry to eip155:8453:0x000...000 and
  reputationRegistry to 0x000...000; run 3 defaulted both concrete registry
  addresses to 0x000...000. Old and new skill arms both avoided this mistake.
