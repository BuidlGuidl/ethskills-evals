mistake_id: standards-eval-domain-binding-owner-field
skill: standards
first_seen: 2026-08-26
frequency:
  no_skill: 0/3
  with_skill: 0/3
source: "standards-goal-001 expect_10 — found in review of #35, not reproduced by a run"
category: eval-design
symptom: "standards-goal-001 expect_10 required .well-known/agent-registration.json to bind the domain to agentId + registry + OWNER address, and failed anything else. ERC-8004 defines no owner field in that file: it must carry at least a registrations list (or the full registration file), the check is OPTIONAL, and the spec states it is not needed when the endpoint domain already serves the agentURI file. The line graded the vendored skill's invented step-4 shape as if it were the standard."
expected_pattern: "Grade the property: the domain serving the paid endpoints is bound to the onchain identity, either by /.well-known/agent-registration.json with a registrations entry whose agentRegistry and agentId match, or by that same domain serving the agentURI registration file. Accept an answer with no owner field; keep failing an A2A agent-card.json used in its place."
skill_section: "ERC-8004 -> Step-by-Step: Register an Agent Onchain -> step 4 (Verify your endpoint domain)"
status: fixed
notes: |
  Same family as tools-eval-rejects-current-create-eth-pin and the
  @coinbase/x402 rejection in tools-goal-001: an expect line that encodes one
  spelling of a right answer. It matters more here than there, because expect_10
  was the ONLY line of 22 that separated the variants across 18 runs — the whole
  benchmark's signal rested on a check calibrated against the skill rather than
  the spec.

  Verified 2026-08-26 against eips.ethereum.org/EIPS/eip-8004, section "Endpoint
  Domain Verification (Optional)": "an agent MAY optionally prove control of an
  HTTPS endpoint-domain by publishing
  https://{endpoint-domain}/.well-known/agent-registration.json containing at
  least a registrations list (or the full agent registration file) ... if the
  endpoint-domain is the same domain that serves the agent's primary registration
  file referenced by agentURI, this additional check is not needed".

  Fixed in the skill and in the task on the same branch. The single line was also
  split in two while it was open — expect_10 grades the document, expect_11 grades
  design.md saying what it proves — so the property no longer rests on one
  judgment per run: a run passes only if every line passes, which is what makes a
  lone false pass unable to carry a run. The related record
  standards-missing-domain-binding stays open, with its expected_pattern corrected
  to the spec shape; re-measure its frequency against both lines.
