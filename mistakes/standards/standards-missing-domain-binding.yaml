mistake_id: standards-missing-domain-binding
skill: standards
first_seen: 2026-07-27
frequency:
  no_skill: 2/3
  with_skill: 0/3
category: incomplete-application
symptom: "Registers the agent in the ERC-8004 Identity Registry and points agentURI at a hosted document, but leaves the domain serving the advertised endpoints unbound to that identity: no .well-known/agent-registration.json, and the agentURI file served from somewhere else. Substitutes an A2A agent-card.json carrying a registrations[] back-pointer, which is a different document at a different path — a client running the ERC-8004 endpoint-domain check looks for agent-registration.json and finds nothing."
expected_pattern: "Serve https://{endpoint-domain}/.well-known/agent-registration.json carrying at least a registrations entry whose agentRegistry (e.g. eip155:8453:0x8004A169...) and agentId match the onchain agent — or serve the agentURI registration file from that same domain, which the spec accepts as already proving control. An owner field is NOT part of this file."
skill_section: "ERC-8004 → Step-by-Step: Register an Agent Onchain → step 4 (Verify your endpoint domain)"
status: open
notes: |
  The only check that separated the variants across 18 runs (standards-goal-001
  expect_10). All 3 with_skill runs served the file with all three fields; 2 of 3
  no_skill runs omitted it.

  Recorded frequency is what the evidence shows, not what the judge scored: the
  judge failed no_skill-1 for the omission and PASSED no_skill-3 for the same
  omission (both served only agent-card.json with a registrations[] back-pointer
  and no owner address). no_skill-2 genuinely served the file and passed
  correctly. So the graded goal score reads 2/3 while the substantive score on
  this check is 1/3. See reports/standards-2026-07-27.md.

  Correction, 2026-08-26: the original expected_pattern here prescribed the wrong
  fix. It asked for { agentId, agentRegistry, owner }, which is the vendored
  skill's step-4 invention, not the standard — ERC-8004 requires a registrations
  list (or the full registration file) and defines no owner field, and skips the
  check entirely when the endpoint domain already serves the agentURI file. The
  expect line that graded this carried the same error; see
  standards-eval-domain-binding-owner-field. The mistake itself is real and stays
  open: two of three no_skill runs left the endpoint domain unbound by any route
  the spec recognizes. Re-measure against the corrected expect_10 before closing.

  Re-measured 2026-08-26 on the minimal skill against the corrected, split expect
  lines (expect_10 the document, expect_11 the reasoning):
  no_skill 0/3, with_skill 0/3 — it did not reproduce. All three no_skill runs
  bound the endpoint domain by a route ERC-8004 recognizes. Read together with
  standards-eval-domain-binding-owner-field, the 2/3 recorded on 2026-07-27 is
  now best understood as mostly an artifact of the expect line demanding the
  skill's invented owner field. Kept open rather than closed on one re-run;
  close it if the next benchmark also comes back 0/3.

