source: standards-goal-001 with_skill runs 1-3 (#35) — skill defect, bypassed by every run, so ungraded
category: stale-knowledge
symptom: "The skill's x402 examples import symbols that do not exist in the scoped packages — x402Fetch from @x402/fetch and createWallet from @x402/evm — and call paymentMiddleware(config) with a single argument, which is the frozen v1 shape. Copied as written, none of it compiles."
expected_pattern: "Name the dead symbols and defer to the installed types instead of shipping a call signature: @x402/express 2.x paymentMiddleware takes routes plus a resource server, @x402/fetch exports wrapFetchWithPayment / wrapFetchWithPaymentFromConfig taking an x402 client, and @x402/evm exports ExactEvmScheme rather than a wallet factory."
skill_section: "x402 Server Setup (Express — Complete Example) and x402 Client (Agent Paying for Data)"
status: fixed
notes: |
  Filed as a skill defect, not an executor mistake, exactly like
  tools-skill-x402-example-api-nonexistent (the tools skill carried the same dead
  snippet). No run reproduced it because all three with_skill goal runs declined
  the snippet and hand-rolled the 402/verify/settle flow against the facilitator;
  two said so in a header comment, one of them naming "@x402/express" as the
  thing it was choosing not to use. So the longest code block in the skill was
  read and discarded three times out of three — the clearest evidence in the
  benchmark that the reference material was not what the skill was buying.

  Verified 2026-08-26 against the published packages at 2.23.0: @x402/fetch
  exports only wrapFetchWithPayment and wrapFetchWithPaymentFromConfig (no
  x402Fetch); @x402/evm exports ExactEvmScheme, toClientEvmSigner and the eip3009
  ABI (no createWallet); @x402/express exports
  paymentMiddleware(routes, server: x402ResourceServer, ...),
  paymentMiddlewareFromConfig and paymentMiddlewareFromHTTPServer. The
  PAYMENT-REQUIRED / PAYMENT-SIGNATURE / PAYMENT-RESPONSE header names the skill
  uses ARE current in @x402/core 2.x (X-PAYMENT is the v1 spelling), so those
  stay.

  Fixed in the minimal rewrite by removing both code blocks and stating the rule
  the tools skill settled on: do not pin a signature the reader can read live.
