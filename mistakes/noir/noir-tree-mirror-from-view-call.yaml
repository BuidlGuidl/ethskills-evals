mistake_id: noir-tree-mirror-from-view-call
skill: noir
first_seen: 2026-08-19
frequency:                     # noir-goal-001, claude/opus-5, n=3 per variant
  no_skill: 1/3
  with_skill: 0/3
source: noir-goal-001 (2026-08-19 minimal-skill benchmark)
category: wrong-data-source
symptom: "Builds the offchain Merkle mirror from a `getCommitments()` view call returning the whole commitment array, rather than replaying the registry's insert events. no-skill-3 declared the `MemberJoined(leafIndex, commitment, tokenId, newRoot)` event in its client ABI and then never read it, calling getCommitments() in three places instead."
expected_pattern: "Replay the contract's insert events (commitment, leaf index, resulting root) into an offchain tree mirror and derive the path locally. with-skill-3 states the reason in a comment: 'The contract never hands out a Merkle path -- asking it for one would tell the node you query which leaf is yours.'"
skill_section: "Persist the note, and rebuild the path from events"
status: open
notes: |
  The only graded failure in the whole 12-run benchmark (noir-goal-001
  no-skill-3, expect_7). A returned-array view call also scales badly — it grows
  without bound and eventually exceeds the node's response limits — but the
  privacy argument is the one the skill makes and the one the expect grades.
