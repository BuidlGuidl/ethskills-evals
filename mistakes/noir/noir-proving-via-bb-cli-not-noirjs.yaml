category: wrong-approach
symptom: "Asked for a Node script showing how a member goes from secret to submitted vote, the run shells out to the `bb` CLI (spawning `bb prove -t evm` as a subprocess and reading the proof back off disk) instead of generating the proof in-process with @noir-lang/noir_js + @aztec/bb.js. The script works on a dev laptop and cannot become the browser prover the app needs, which is the whole reason NoirJS exists."
expected_pattern: "Generate the proof in-process: `new UltraHonkBackend(circuit.bytecode, await Barretenberg.new())`, then `backend.generateProof(witness, { keccak: true })` (or `{ verifierTarget: 'evm' }`) so the serialization matches an EVM verifier. Reserve the bb CLI for build-time artifacts — VK and the Solidity verifier."
skill_section: "Frontend Proof Generation (NoirJS) — SKILL.md L426, L485-L500"
status: open
notes: |
  The only check that separated the variants in the whole benchmark. Both
  failures are the same shape: no-skill-2's js/core/prover.js is a "thin wrapper
  around the Noir/Barretenberg CLI", no-skill-3's scripts/common/prove.mjs the
  same. no-skill-1 used NoirJS in-process and passed.

  All three with_skill runs used the class, and all six runs that instantiated
  it landed on the correct two-argument form — the skill already shows
  `new UltraHonkBackend(circuit.bytecode, bb)` at L491-492, against docs that
  still show the one-arg form. with-skill-1 tried one-arg once anyway, hit
  "TypeError: Cannot read properties of undefined (reading 'circuitProve')" from
  bb.js backend.js:111, and fixed it in the next turn.

  codex/gpt-5.5 high (major-refine-d9952522, 2026-09-24): same 2/3 unaided on a second
  model. no-skill-1 (js/voteMember.js:127-138) and no-skill-2 (scripts/member_vote.js:92-104)
  spawn `bb prove -t evm`; their package.json holds ethers only. no-skill-3 used
  UltraHonkBackend with `{ verifierTarget: "evm" }` and passed. All six skill-arm runs
  proved in-process with the same option, on @aztec/bb.js 5.1.0; the new text's
  "Prove in-process with NoirJS, not by shelling out to the `bb` CLI" names exactly
  this failure. This is one of the two lines that separate the arms on this stack.
