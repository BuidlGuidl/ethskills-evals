source: noir-goal-001 expect_7, claude/opus-5, 2026-08-18
category: wrong-approach
symptom: "The client obtains its Merkle witness path without replaying the contract's insert events into an offchain tree mirror, and the member's note is not persisted at registration time. The flow works in a single script run that happens to still hold the tree in memory, and cannot be resumed by a member coming back weeks later — which is the actual user story."
expected_pattern: "Emit an insert event carrying commitment, leaf index and resulting root; have the client rebuild the tree by replaying those events into an offchain mirror (@zk-kit/lean-imt), and persist the member's note (nullifier, secret, leaf index) at registration."
skill_section: "Merkle Tree Membership -> offchain mirror + Note Lifecycle (What the User Must Save)"
status: open
notes: |
  Reproduced once (no-skill-3). Weak evidence at 1/3 and recorded as such, but
  the supporting counts across the six runs point the same way: files that
  replay insert events number 3, 3, 2 in the with_skill runs against 0, 1, 0 in
  no_skill. no-skill-1 passed expect_7 on a different mechanism rather than by
  replaying events.

  codex/gpt-5.5 high (major-refine-d9952522, 2026-09-24): the line that separates the
  arms on this stack. Failing shapes, from output/ (judge reasoning is not stored):
  no-skill-2 has no join transaction or insert event at all — an admin posts the root
  and the script builds the tree from hardcoded default secrets (member_vote.js:78-85);
  no-skill-3's event carries neither index nor root and the tree is `leaves=[commitment]`
  at index 0 (castVote.mjs:51-52); old-3 emits a complete event but reads only the join
  block's logs and builds the same one-leaf tree (member-vote.js:118-131). no-skill-1
  and old-2 replay a complete event correctly and fail on the note: a random or env
  secret that is never written or printed.
  Judge inconsistency on the note clause: old-1 and new-2 also keep the note only in
  memory, with NOTES.md telling the member to save it, and passed; old-2 did the same
  with weaker NOTES.md wording and failed. The note clause is the recoverability
  question noir-note-not-persisted already asks to split out. new-1 writes the note to
  disk; new-4 prints it with leafIndex ("save this note privately"). None of these fail via a contract view call (noir-tree-mirror-from-view-call
  0/9 here).
