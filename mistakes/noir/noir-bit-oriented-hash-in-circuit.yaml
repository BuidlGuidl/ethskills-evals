source: noir-goal-001 (2026-08-19 minimal-skill benchmark)
category: wrong-primitive
symptom: "Hashes commitments, Merkle parents and nullifiers in-circuit with a bit-oriented hash instead of an algebraic one, in a circuit whose members prove in a browser. no-skill-2 hand-rolled truncated SHA-256 over sha256_compression; no-skill-3 added `keccak256 = { git = .../keccak256, tag = v0.1.3 }` and hashed 'leaves, Merkle nodes, nullifiers' with keccak. Both wrote a confident rationale for it: no-skill-2's hash.nr opens 'Why SHA-256 and not Poseidon: the same hash has to be computed in three places ... SHA-256 is a cheap precompile in the EVM (60 gas)', trading ~600 gates for ~30,000 per hash to save EVM gas that a Poseidon verifier does not spend anyway."
expected_pattern: "Hash in-circuit with Poseidon over BN254 from the external noir-lang/poseidon dependency (`use poseidon::poseidon::bn254::hash_2`). Judge in-circuit hash cost by constraint count, not by EVM gas: the onchain side verifies a proof, it does not replay the hash."
skill_section: "Hash in-circuit with Poseidon, never keccak or SHA256"
status: open
notes: |
  The important part is that NO expect line in noir-goal-001 grades in-circuit
  hash choice, so both runs passed the graded checks: no-skill-2 passed 7/7 and
  no-skill-3 failed only expect_7, on an unrelated clause. The skill's largest
  observed effect on this task is invisible to the pass/fail table and shows up
  only by reading circuits.

  Reproduces PR #73's finding (no_skill keccak256 2/3, with_skill poseidon 3/3)
  at the same 2/3 vs 0/3 rate against the 81%-compressed skill, so the
  compression did not weaken this bullet. Eval gap, not a skill gap: see the
  report's "what should change in the eval" row.

  Re-measured 2026-09-21 under major-refine-d9952522 on noir-goal-001: 0/3
  unaided. No run in any arm hand-rolled SHA-256 or pulled in keccak256; every
  circuit in all nine runs hashes with Poseidon from the external dependency.
  The confident wrong rationale this record quotes ("SHA-256 is a cheap
  precompile in the EVM") did not recur. Left open on one stack's evidence —
  see the sibling record noir-keccak-in-circuit-hash for the same reading and
  the Poseidon-vs-Poseidon2 variance that sits behind it.

  codex/gpt-5.5 high (2026-09-24): 0/9 on goal-001. See noir-keccak-in-circuit-hash
  for the hand-rolled algebraic hash two unaided runs wrote instead.
