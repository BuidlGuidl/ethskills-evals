frequency:                     # noir-goal-001, claude/opus-5, n=3 per variant
  no_skill: 3/3
  with_skill: 0/3
source: noir-goal-001 (2026-08-19 minimal-skill benchmark)
category: missing-deliverable
symptom: "Generates the member's nullifier and secret at registration time and never writes them anywhere durable — no run in the no_skill variant persists the note. The member's ability to vote depends on values that exist only inside one process. All three with_skill runs wrote a dedicated note module (scripts/client/identity.mjs, js/lib/note.mjs, client/src/identity.js), each saving nullifier, secret and leafIndex to disk."
expected_pattern: "At commitment time, persist nullifier, secret and leafIndex together; the note is the only thing that can reconstruct the witness later, and losing it is unrecoverable by design."
skill_section: "Persist the note, and rebuild the path from events"
status: open
notes: |
  expect_7 names note persistence, but conjunctively with the event-replay
  clause, and the judge passed no-skill-1 and no-skill-2 on the event-replay
  half while both persisted nothing. So this is a 3/3 no_skill miss that the
  score sheet records as two passes. Splitting expect_7 into two checks is the
  single highest-value eval edit from this benchmark.
