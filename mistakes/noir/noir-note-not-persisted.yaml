mistake_id: noir-note-not-persisted
skill: noir
first_seen: 2026-08-19
frequency:                     # noir-goal-001, claude/opus-5, n=3 per variant
  no_skill: 0/3                # first filed 3/3, withdrawn on re-read — see notes
  with_skill: 0/3
source: noir-goal-001 (2026-08-19 minimal-skill benchmark)
category: missing-deliverable
symptom: "Not observed — withdrawn. Filed on the reading that no no_skill run writes the note anywhere durable; re-reading the three clients, none of them loses it. no-skill-1 and no-skill-3 derive the secret from a wallet signature over a fixed message, so there is nothing to back up and the nullifier re-derives on any machine. no-skill-2 generates a random secret, prints it at registration (js/register.js:36) with 'SAVE IT ... store it like a seed phrase' and re-imports it via --secret/--passphrase, deliberately not derived from the ETH key so the voting key can rotate. All three recover the leaf index by locating the commitment in the replayed tree. What actually splits the variants is that all three with_skill runs write a dedicated note module (scripts/client/identity.mjs, js/lib/note.mjs, client/src/identity.js) persisting nullifier, secret and leafIndex to disk — a key-management design difference, not a lost note."
expected_pattern: "The member's witness must be recoverable: the note persisted by the tool, handed to the member to keep, or deterministically re-derivable from a key they already hold — with the leaf index recoverable from the tree. Grade recoverability, not one spelling of it."
skill_section: "Persist the note, and rebuild the path from events"
status: wontfix                # withdrawn; kept for the recoverability criterion it produced
notes: |
  Kept rather than deleted because the eval finding it surfaced is real and
  still unfixed: expect_7 conjoins event replay and note handling, so it grades
  neither cleanly. The split expect must test recoverability (above). An expect
  that demands "writes nullifier+secret+leafIndex to disk" would fail all three
  no_skill designs — the one-spelling-of-a-right-answer false negative issue #1
  flags elsewhere.
