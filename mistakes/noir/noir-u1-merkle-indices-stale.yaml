symptom: "Every Merkle circuit example in SKILL.md types the path indices as `u1` (L235, L256, L285, L411), and L420 states the zk-kit binary_merkle_root signature takes `[u1; MAX_DEPTH]`. The `u1` type was removed from Noir, and zk-kit's binary_merkle_root now takes `[bool; N]`. A run that copies the example verbatim does not compile."
expected_pattern: "Type Merkle path indices as `[bool; MAX_DEPTH]` in every example, and restate the binary_merkle_root signature as taking `[bool; N]`. The accompanying claim — that the index type enforces binary at the type level so no manual `assert(i * (i - 1) == 0)` is needed — still holds for bool and is worth keeping."
