category: stale-knowledge
symptom: "Building the anonymous-voting circuit, the run hashes commitments and nullifiers in-circuit with keccak256 (noir-lang/keccak256 as a dependency) rather than an algebraic hash. keccak is bit-oriented and costs ~30,000 gates against ~600 for Poseidon, on a circuit whose members are meant to prove in a browser."
expected_pattern: "Use Poseidon over BN254 from the external dependency — `use poseidon::poseidon::bn254::hash_2` — for every in-circuit hash. Reserve keccak for the EVM-facing boundary (the proof transcript via --oracle_hash keccak), not for commitments and nullifiers."
skill_section: "What You Probably Got Wrong #2 + Hashing in Circuits"
status: open
notes: |
  Fires on goal-001, which deliberately does not grade the hash choice — that
  is quiz-002's job, and quiz-002 is where no_skill runs got it right. So the
  mistake is real, reproduced 2/3, and invisible in every pass count in the
  benchmark. It only surfaced by reading the circuits.

  The split is clean: no_skill wrote keccak256 (2/3) or Poseidon2 (1/3) and
  never the skill's path; with_skill wrote poseidon::poseidon::bn254::hash_2
  3/3. This is the skill's content working, on the one axis where the model's
  own prior is still wrong — and it argues for an expect that grades the hash
  family inside a build task, not only inside the quiz.
