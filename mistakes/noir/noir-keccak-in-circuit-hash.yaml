category: stale-knowledge
symptom: "Building the anonymous-voting circuit, the run hashes commitments and nullifiers in-circuit with keccak256 (noir-lang/keccak256 as a dependency) rather than an algebraic hash. keccak is bit-oriented and costs ~30,000 gates against ~600 for Poseidon, on a circuit whose members are meant to prove in a browser."
expected_pattern: "Use Poseidon over BN254 from the external dependency — `use poseidon::poseidon::bn254::hash_2` — for every in-circuit hash. Reserve keccak for the EVM-facing boundary (the proof transcript via --oracle_hash keccak), not for commitments and nullifiers."
skill_section: "What You Probably Got Wrong #2 + Hashing in Circuits"
status: open
notes: |
  Fires on goal-001, which deliberately does not grade the hash choice — that
  is quiz-002's job, and quiz-002 is where no_skill runs got it right. So the
  mistake is real, reproduced 2/3, and invisible in every pass count in the
  benchmark. It only surfaced by reading the circuits.

  The split is clean: no_skill wrote keccak256 (2/3) or Poseidon2 (1/3) and
  never the skill's path; with_skill wrote poseidon::poseidon::bn254::hash_2
  3/3. This is the skill's content working, on the one axis where the model's
  own prior is still wrong — and it argues for an expect that grades the hash
  family inside a build task, not only inside the quiz.

  Re-measured 2026-09-21 under major-refine-d9952522 on noir-goal-001, same task
  and same stack: no_skill is now 0/3 — all three unaided runs import
  `poseidon::poseidon::bn254::`, the exact path the skill teaches, with no
  keccak256 or sha256_compression anywhere in their circuits. The prior this
  record was opened against has moved on this task, so the skill's value here is
  no longer measurable; left open rather than closed because quiz-002 shows the
  unaided choice is still not stable (see below) and a single stack is thin
  evidence for a prior having shifted.

  Note the split within one model: on the goal build the unaided runs chose
  `poseidon::poseidon::bn254`, while on quiz-002 all three unaided runs chose
  `poseidon::poseidon2::Poseidon2` from the same dependency. Same model, same
  day, different algebraic hash per task — which is the cross-layer consistency
  risk the skill names ("Poseidon and Poseidon2 are different functions with
  different outputs"), showing up as task-to-task variance rather than as a
  wrong hash family.

  codex/gpt-5.5 high (2026-09-24): 0/9 on goal-001, no keccak256 or sha256 in any
  circuit. The unaided runs did not pick Poseidon either: no-skill-1 and no-skill-2
  hand-rolled a MiMC-style `hash2` (pow5 rounds, constants invented in the file —
  `(n * n) + 7`, c0..c9), no-skill-3 used stdlib `poseidon2_permutation`. Algebraic, so
  not this record's mistake, but an unaudited home-made hash protecting membership and
  nullifiers is worse than keccak's cost problem; no expect grades it. Both skill arms
  used `poseidon::poseidon::bn254` from the external dependency 6/6.
