category: stale-skill-fact
symptom: "SKILL.md L189 pins the Poseidon dependency at tag v0.2.6, which does not compile on nargo 1.0.0-beta.26. Every with_skill run that copied the pin hit `error: Expected type [Field], found type &[_; 0]` and `error: Type annotation needed` in poseidon/mod.nr:355, then had to diagnose and re-pin before any circuit work could proceed. No no_skill run ever saw the error — all six went straight to v0.3.0 from model knowledge."
expected_pattern: "Pin the dependency at v0.3.0 (compiles on beta.26), or drop the tag pin and say to use the latest release. Better: state the nargo version the pin was validated against next to it, so the next reader can tell a stale pin from a deliberate one."
skill_section: "Project Structure -> Nargo.toml dependencies (SKILL.md L189)"
status: open
notes: |
  Self-corrected in 6/6 runs — the compile error is loud and names the file, so
  no run shipped a broken circuit because of it. The cost is turns, not
  correctness: on quiz-002 the fix took a compile + sed + recompile round trip
  (e.g. with-skill-1 first mentions v0.2.6 at transcript line 40 and lands on
  v0.3.0 by line 112). One run wrote the diagnosis up unprompted: "Poseidon
  v0.2.6 (the version in the skill) does not compile on nargo 1.0.0-beta.26 —
  it fails on &[] slice syntax."

  This is the clearest negative delta the benchmark found: the skill made runs
  slower at the one thing it was supposed to make them faster at. It did not
  cost a single expect, because every run recovered.
