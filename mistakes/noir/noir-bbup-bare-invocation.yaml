symptom: "SKILL.md L51-57 says to install nargo first and then run bare `bbup`, adding that 'order matters' because bbup auto-detects the nargo version. On nargo >= 1.0.0-beta.23 that fails: bb-versions.json on the aztec-packages next branch maps nargo versions only up to 1.0.0-beta.22, so the lookup resolves null and the download 404s. The instruction is also pointed at the master branch of the installer while the version map lives on next."
expected_pattern: "Install bb with an explicit version — `bbup -v 5.1.0` for nargo 1.0.0-beta.26 — and say that bare `bbup` only works while the version map still covers your nargo. Keep the pairing rule visible: the bb CLI and @aztec/bb.js must match exactly or proof serialization diverges."
skill_section: "Installation (SKILL.md L51-57)"
status: fixed
