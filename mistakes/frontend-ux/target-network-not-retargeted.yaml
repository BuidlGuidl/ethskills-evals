category: config-default
symptom: >-
  The build ships pointed at the scaffold's local chain despite a Base-targeted product
  brief. Two shapes. (a) One SE-2 no_skill run never edited scaffold.config.ts, leaving
  targetNetworks on the [chains.hardhat] default (2026-07-24 1/3, 2026-09-21 1/3). (b) Every
  2026-09-21 run on the first vendored skill text edited scaffold.config.ts and still left
  `targetNetworks: [chains.hardhat]`, each with a comment deferring the switch — "Production
  target is Base (chains.base). Switch to it after `yarn deploy --network base`: contract
  types come from the target network, so Staker must be deployed there first" — a reasoned
  deferral from SE-2's type generation, made three times out of three.
expected_pattern: >-
  Point the build at the product's chain (targetNetworks includes chains.base) and keep the
  polling interval in the healthy range. Every new-arm run wrote `targetNetworks:
  [chains.base]` with the local-dev swap in the comment instead; two no_skill runs did the
  same or made it NODE_ENV-conditional.
skill_section: "Target chain"    # was "Rule 5: RPC Reliability and Polling" in the first vendored text, which never said to retarget
status: open
notes: >-
  Weak evidence (1/3) and partly a build-config discipline issue rather than a pure UX rule.
  Filed for honesty per the loop's first-seen policy. The polling half of expect_8 never
  discriminated — every run kept SE-2's healthy 3000ms default.
  2026-09-21 (major-refine-d9952522): this is the one line that separates the two skill
  texts on Opus 5 medium — old 3/3, new 0/3, none 1/3 — and it is the goal-001 headline
  (new 3/3 · old 0/3 · none 0/3) in full. The old Rule 5 talks about RPC providers and
  polling and never says which chain to configure; the new "Target chain" paragraph says
  "Point the app at the chain the brief names; scaffold defaults sit on local/hardhat" and
  the closing line says to confirm the configured target chain matches the brief. Shape
  (b) is worth keeping in the skill's words because the old-arm runs were not careless:
  each one read the template, found the type-generation dependency, and chose the
  default on purpose. Polling: all nine runs set 2000–3000ms; none degraded it.
  2026-09-22 on GPT 5.5 high: 0/9 on every arm. All nine runs put chains.base in
  targetNetworks — seven as [chains.base, chains.hardhat], new run 2 as [chains.base], none
  run 2 as an env switch defaulting to Base. The old arm did not defer the switch the way
  every Opus old-arm run did, so the Opus old-vs-new delta on goal-001 is a claude-side
  behaviour on the old text, not something the old text causes on every model.
