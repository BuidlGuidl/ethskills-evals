  trivially shown, but the ETH amount — the one that needs a real price — is left bare.
expected_pattern: >-
  Show a USD value alongside the ETH balance from a real price source (SE-2's native-currency
  price hook, or CoinGecko/Chainlink in a bare build). with_skill runs on SE-2 used the
  price-aware Balance component and bare with_skill runs fetched a real ETH/USD price.
skill_section: "Rule 4: Show USD Context for Token Values"
status: open
notes: >-
  In the SE-2 build the template's Balance component carries USD context for free, so 2/3
  no_skill runs pass — the gap only opens when a run swaps in a raw hook or builds the
