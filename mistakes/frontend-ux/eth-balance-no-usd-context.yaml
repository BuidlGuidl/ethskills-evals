category: missing-usd-context
symptom: >-
  The ETH gas balance is rendered as raw ETH units with no USD value. Both stacks split the
  same way: bare no_skill runs 3/3 — "N ETH (for gas)" with no price lookup anywhere (on
  opus-5, grepping the whole src tree of every no_skill run for coingecko / chainlink /
  ethPrice / usdPrice / AggregatorV3 returns nothing) — and SE-2 no_skill runs 1/3, where a
  run swaps in a raw balance hook (useWatchBalance) instead of SE-2's price-aware Balance
  component. The stablecoin's own ~1:1 dollar value is trivially shown, but the ETH amount —
  the one that needs a real price — is left bare.
expected_pattern: >-
  Show a USD value alongside the ETH balance from a real price source (SE-2's native-currency
  price hook, or CoinGecko/Chainlink in a bare build), and label a stale or unavailable price
  rather than silently dropping it. with_skill runs on SE-2 used the price-aware Balance
  component; bare with_skill runs fetched a real ETH/USD price — on opus-5, Chainlink
  latestRoundData in a usePrices hook, and one run's UsdValue component labels a missing
  price with the comment "a number with no caveat reads as current".
skill_section: "Fiat context"    # was "Rule 4: Show USD Context for Token Values" before the 2026-08 cut
status: open
notes: >-
  In the SE-2 build the template's Balance component carries USD context for free, so 2/3
  no_skill runs pass — the gap only opens when a run swaps in a raw hook or builds the
  balance display from scratch (bare, 3/3 fail). That 2/3-vs-0/3 gap is the clearest
  measurement in the goal pair of how much of goal-001's no_skill score is SE-2 and not the
  model. No quiz (retrieval if asked directly). Re-measured 2026-08-12 on opus-5 against the
  minimal skill: identical split, identical 0/6 with the skill.
  2026-09-21 (major-refine-d9952522, judge opus-5 high): the SE-2 no_skill split closed to
  3/3. Run 1 renders the ETH balance from a raw useBalance only; runs 2 and 3 render SE-2's
  <Balance> (ETH by default, USD on click) beside their own useBalance figure, and the judge
  failed both under "USD context alongside the token amount" — the 2026-08-12 grade passed
  that same shape, so part of the 4/6 → 6/6 move is the judge, not the model. Bare no_skill
  3/3 again: no price lookup anywhere in any of the three transcripts. Both skill arms 0/6:
  every run renders an inline ≈ $ figure from SE-2's native-currency price or a Chainlink /
  CoinGecko fetch, and one new-arm run labels "USD price unavailable" — the label the
  "Fiat context" paragraph asks for.
  2026-09-22 on GPT 5.5 high: none 6/6 again, skill arms 0/6 each. On SE-2 all three
  no_skill runs render the ETH balance from a raw useBalance and never touch SE-2's
  native-currency price (no <Balance>, no useFetchNativeCurrencyPrice in any diff); on the
  bare build none of the three fetches a price. Skill runs on SE-2 use
  useFetchNativeCurrencyPrice (new run 1 a CoinGecko fetch instead); bare skill runs use
  Chainlink latestRoundData (old run 2), Coinbase spot (old run 1) or CoinGecko. Both skill
  texts close it equally.
