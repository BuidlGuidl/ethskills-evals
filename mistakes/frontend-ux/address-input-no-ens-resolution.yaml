category: address-ux
symptom: >-
  On the bare /pay build, every no_skill run gated the recipient field with viem isAddress()
  (or a raw 0x-hex regex) and nothing else. Pasting an ENS name like vitalik.eth fails the
  hex check and is silently rejected as invalid — no resolution, no "resolved to 0x..."
  feedback. The address is treated as just a string.
expected_pattern: >-
  Use a dedicated address input with ENS resolution, paste normalization, and inline
  validation feedback (resolve the name onchain, show what it resolved to, and give a reason
  when input is rejected). with_skill runs added ENS resolution to the recipient field.
skill_section: "Rule 3: UX Standards for Addresses"
status: open
notes: >-
  Only surfaces without a scaffold: SE-2's bundled AddressInput component makes goal-001
  low-signal for Rule 3, which is why goal-002 (bare) carries it. Mirrors quiz-005 (the
  ENS-in-address-input claim) and goal-002 expect_1. Note the model knows ENS when asked
  (quiz-005 no_skill 3/3) but does not reach for a resolving input unprompted.
  2026-09-21 on Opus 5 medium: not reproduced. All three bare no_skill runs resolve ENS
  unprompted (wagmi useEnsAddress with viem normalize in a useRecipient hook, resolved
  address shown before submit) and pass goal-002 e1, as do all six skill runs. The
  3/3 → 0/3 move is a model change between the sittings, not a skill effect; the record
  stays open until the GPT 5.5 / Kimi / GLM columns say whether it holds off claude.
  2026-09-22 on GPT 5.5 high: reproduced 3/3. Every bare no_skill run gates the recipient
  with viem isAddress() only (no useEnsAddress / getEnsAddress anywhere), so vitalik.eth is
  rejected; all six skill runs resolve ENS (useEnsAddress, or getEnsAddress in new run 3).
  So the Opus 5 non-reproduction was the model, not the rule: on this stack the gap is
  exactly the one the record describes. quiz-005 is 9/9 on e1 here, so this is again
  knows-when-asked / skips-unprompted; quiz-005 none run 2 failed e2 for describing
  resolution without saying to show the user what the name resolved to.
