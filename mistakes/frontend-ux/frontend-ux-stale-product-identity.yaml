symptom: "Ships a working dApp under someone else's identity. On the SE-2 scaffold no run touched packages/nextjs/app/layout.tsx: all three no_skill runs still export title 'Scaffold-ETH 2 App', description 'Built with 🏗 Scaffold-ETH 2', and getMetadata.ts titleTemplate '%s | Scaffold-ETH 2', even though all three did rewrite Header.tsx branding — so the visible surface gets renamed and the metadata surface does not. On the bare workspace the failure inverts and narrows: all three no_skill runs set a real tab title ('USDC Pay') and description, then shipped no openGraph block, no twitter block, and no icon/favicon file at all."
expected_pattern: "Replace every framework default across the whole identity surface, not the visible half: tab title, favicon, OG/Twitter title, description and image, plus 'built with' branding. On SE-2 that means editing layout.tsx and getMetadata.ts, not just Header.tsx. All six with_skill runs did it — the bare-workspace ones shipped openGraph + twitter blocks and generated icon.svg / opengraph-image.tsx / apple-icon.tsx."
