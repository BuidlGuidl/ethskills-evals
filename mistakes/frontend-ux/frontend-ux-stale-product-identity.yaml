notes: |
  The single strongest signal in the benchmark, and the one the minimal skill's
  lead paragraph targets by name. Nothing in either build fails when the
  metadata is wrong, which is exactly the skill's stated reason it gets skipped.

  Judge caveat: goal-001 no_skill run 2 was graded pass on e6 on the strength of
  its Header.tsx rewrite, while its layout.tsx metadata was untouched like the
  other two. By file evidence the metadata half is 0/3 on that goal, so the
  recorded 1/3 pass rate understates the mistake. See the report's "grading
  precision" note.
