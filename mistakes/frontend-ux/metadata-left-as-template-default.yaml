mistake_id: metadata-left-as-template-default
skill: frontend-ux
first_seen: 2026-07-24
source: frontend-ux-goal-001 expect_6 + frontend-ux-goal-002 expect_6 (6 runs/variant per stack)
frequency:                       # per variant, per stack — both test the product-identity rule
  claude/claude-opus-4-8:        # 2026-07-24, skill 9a129f1 (the ~1100-word vendored version)
    no_skill: 6/6
    with_skill: 0/6
  claude/claude-opus-5:          # 2026-08-12, skill 32547c9 (the 359-word minimal revision); 5/6 by the judge, 6/6 by file evidence — see notes
    no_skill: 5/6
    with_skill: 0/6
category: missing-product-identity
symptom: >-
  Ships framework/template default metadata and branding. On the SE-2 build every
  no_skill run left the layout metadata as 'Scaffold-ETH 2 App' / 'Built with Scaffold-ETH 2'
  and the "%s | Scaffold-ETH 2" title template — on opus-5 all three did rewrite Header.tsx
  branding while none touched layout.tsx or getMetadata.ts, so the visible half gets renamed
  and the metadata half does not. On the bare build every no_skill run set a page title +
  description but shipped no favicon and no OpenGraph/Twitter tags. The correctness of the
  dApp is fine — only the pre-publish product identity is skipped.
expected_pattern: >-
  Before shipping, replace the whole identity surface, not the visible half: tab title,
  favicon, OG/Twitter title+description+image, and template branding. On SE-2 that means
  editing layout.tsx and getMetadata.ts, not just Header.tsx — with_skill runs rewrote the
  SE-2 metadata to 'USDC Staking on Base' and updated the title template unprompted; bare
  with_skill runs on opus-5 shipped openGraph + twitter blocks and generated icon.svg /
  opengraph-image.tsx / apple-icon.tsx.
skill_section: "Product identity"   # was "Rule 8: Pre-Publish Metadata and Product Identity" before the 2026-08 cut
status: open
notes: >-
  Strongest and most consistent delta in the benchmark, on both stacks. This is the one
  product-completeness rule that even SE-2's bundled guidance does not carry a no_skill run
  through — the template ships defaults and nothing prompts the model to change them, and
  nothing in either build fails when the metadata is wrong. Mirrors goal-001 expect_6 and
  goal-002 expect_6; no quiz (asked directly it is pure retrieval).
  Judge caveat on the opus-5 line: goal-001 no_skill run 2 was graded pass on e6 on the
  strength of its Header.tsx rewrite while its layout.tsx metadata was untouched like the
  other two, so the recorded 5/6 understates the mistake — by file evidence it is 6/6 again.
  e6 bundles "metadata and branding" into one expect; splitting it is tracked in #79.
