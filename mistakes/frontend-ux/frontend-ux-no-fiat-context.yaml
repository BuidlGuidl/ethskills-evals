  no_skill: 4/6
  with_skill: 0/6
source: frontend-ux-goal-001 + frontend-ux-goal-002, claude/claude-opus-5, skill 32547c9
category: unfinished-product-surface
symptom: "Renders the ETH gas balance as bare token units with no dollar value. On the bare workspace this is 3/3: grepping the whole src tree of every no_skill run for coingecko / chainlink / ethPrice / usdPrice / AggregatorV3 returns nothing — there is no price source in the build at all, so the balance a user checks before paying gas is unpriced. The stablecoin leg hides the gap (USDC's dollar figure is ~1:1 and needs no lookup), so the miss only shows on the ETH balance."
expected_pattern: "Every token or ETH amount shown carries a value from a real price source. With a scaffold, use what it ships (SE-2's native-currency price); with no scaffold, wire one — the with_skill runs read Chainlink latestRoundData in a usePrices hook. Label a stale or unavailable price rather than silently dropping it: one with_skill run's UsdValue component does exactly that, with the comment 'a number with no caveat reads as current'."
skill_section: "Fiat context"
status: open
notes: |
  This is the rule the bare workspace isolates best. On the SE-2 scaffold the
  habit is largely carried by the template (goal-001 e4 passed 2/3 without the
  skill, since SE-2 ships the native-currency price ready to use); strip the
  scaffold and it collapses to 0/3. That gap between 2/3 and 0/3 is the clearest
  measurement in the pair of how much of goal-001's no_skill score is SE-2 and
  not the model.
