mistake_id: frontend-ux-run-ends-waiting-on-background-install
skill: frontend-ux
first_seen: 2026-09-21
source: frontend-ux-goal-001 + frontend-ux-goal-002 transcripts (executor behaviour, not a graded expect), claude/claude-opus-5 medium
frequency:                       # per variant, per stack; the same six no_skill draws under both arms
  claude/claude-opus-5@2f0adb01: # 2026-09-21, major-refine-d9952522, old arm
    no_skill: 2/6
    with_skill: 0/6
  claude/claude-opus-5@d9952522: # 2026-09-21, major-refine-d9952522, new arm
    no_skill: 2/6
    with_skill: 0/6
category: stopped-short
symptom: >-
  The executor starts the dependency install with the Bash tool's run_in_background, then ends
  its turn on a sentence like "I'll be notified when the install finishes; then I'll compile,
  run tests, and type-check" (goal-001 no_skill run 2) or "waiting on the npm install to finish
  so I can typecheck and build" (goal-002 no_skill run 2). In print mode the session ends when
  the turn ends: the harness records exit 0 with stop_reason end_turn, and the last stream
  event is a task_notification for the install with status "stopped". goal-002 run 2 ships a
  package.json with no dependencies block, because npm was killed before it wrote one; goal-001
  run 2 never compiled, tested or committed. Both were graded as they stand (3 and 4 expect
  fails respectively) — the fails are on lines the finished code also lacked, not caused by the
  early stop.
expected_pattern: >-
  Wait for the install in the foreground, or poll it, before ending the turn; the deliverable
  is finished, committed code, and a turn that ends on "I'll be notified" in a non-interactive
  session ends the run.
skill_section: "Finish by running the project's build or typecheck"   # nearest line; no skill run stopped this way, but n is small
status: open
notes: >-
  Not a claim the skill makes, and a claude-CLI-in-print-mode interaction more than a model
  belief: the model's expectation of a notification is right in an interactive session and
  wrong here. Filed under this skill because these are the runs it happened in and an unfiled
  observation is lost. 2/6 no_skill against 0/12 with_skill is suggestive that a closing
  "run the build" instruction keeps the executor in the loop until the install returns, but
  two draws cannot carry that. The harness records these as clean exit-0 runs; there is no
  field that marks them, so they are visible only in the transcript's last event.
