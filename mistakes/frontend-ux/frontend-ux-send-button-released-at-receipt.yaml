category: pending-state
symptom: >-
  goal-002 no_skill run 2 (2026-09-21T142739Z-claude-no-skill-2) disables Send on
  `write.isPending || (Boolean(write.data) && receipt.isLoading)` — wagmi hook state alone,
  no submitting flag of its own and no `finally`. That holds the button from click through
  the receipt, but nothing holds it past the receipt: the moment `useWaitForTransactionReceipt`
  resolves the button re-enables while the balance refetch the run schedules in a useEffect
  is still in flight, and a wallet rejection releases it only because `isPending` happens to
  clear. The judge failed expect 4; its reasoning is not stored, so which of those two gaps it
  weighed is not on the record.
expected_pattern: >-
  One pending state per button, held from click through the receipt and the authoritative
  state refetch, released in `finally` so a rejection cannot lock it (the skill's first
  confirm line). The other two no_skill runs and all six skill runs hold the button through
  the receipt and passed; every skill run also has a `finally`.
skill_section: "One pending state per button, held from click through the receipt *and* the authoritative state refetch"
