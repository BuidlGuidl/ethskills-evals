mistake_id: frontend-ux-unsurfaced-tx-error
skill: frontend-ux
first_seen: 2026-08-12
frequency:                     # graded runs whose error-surfacing expect failed (goal-001 e5 + goal-002 e5)
  no_skill: 2/6
  with_skill: 0/6
source: frontend-ux-goal-001 + frontend-ux-goal-002, claude/claude-opus-5, skill 32547c9
category: silent-failure
symptom: "The failure path is modeled and then never rendered. Two distinct shapes: (a) goal-001 no_skill run 2 catches both tx errors and calls console.error('Failed to approve USDC:', error) / console.error('Failed to stake USDC:', error) with nothing shown in the UI; (b) goal-002 no_skill run 1 goes further and builds the machinery — useSendUsdc derives an 'error' status and exposes writeError ?? simulation.error ?? receipt.error — but TxStatus branches only on 'reverted' and falls through to `return null` for 'error', so a wallet rejection or failed simulation renders nothing. The reverted branch in that same file is well written, which is what makes the gap easy to miss in review."
expected_pattern: "Translate reverts and wallet errors to human text and show them near the action that failed. Having an error status in a hook is not surfacing it — every status the hook can produce needs a rendered branch."
skill_section: "Reverts and wallet errors translated to human text, shown near the action that failed"
status: open
notes: |
  Lowest-frequency of the three mistakes, and it sits in the skill's
  "usually already habit — confirm rather than rebuild" list rather than its
  four headline rules. The 2/6 no_skill rate supports that placement: most runs
  do surface errors unprompted. Worth keeping as a confirm-line, not promoting.

  Shape (b) is the more interesting failure for a reviewer: a run can look like
  it handles errors — typed status union, error plumbed through the hook,
  aria-live notice component — and still show a user nothing when their wallet
  rejects.
