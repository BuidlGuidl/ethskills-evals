mistake_id: wallets-agent-eoa-holds-whole-treasury
skill: wallets
first_seen: 2026-09-20
source: wallets-goal-002 (graded expect_1 / expect_2)
frequency:                     # per variant, per stack
  codex/gpt-5.5:               # 2026-09-20, benchmark major-refine-d9952522, three arms
    no_skill: 3/3
    with_skill_old: 3/3        # 2f0adb01, the 169-line file
    with_skill_new: 2/3        # d9952522, the 26-line file
category: dodges-the-tradeoff
symptom: >-
  Asked for an unattended rebalancer over a ~$400k treasury, with custody never
  named in the prompt, the run builds the bot and never makes a custody decision
  at all. rebalance.ts does
  `privateKeyToAccount(process.env.AGENT_PRIVATE_KEY)` and sends from the address
  that holds the entire treasury, so the agent's single key is sufficient to move
  everything. DEPLOY.md discusses RPC endpoints, slippage, gas and where to store
  the key — key hygiene in place of a bound on authority. The failure is not a
  weak custody design; it is the absence of one.
expected_pattern: >-
  Split the treasury from the signer before writing the bot. The one passing run
  defines three accounts up front — TREASURY_SAFE holding the $400k behind a
  threshold, HOT_EXECUTOR holding a bounded WETH/USDC float that rebalance.ts
  signs for, OPERATOR refilling and revoking with hardware-backed keys — and the
  code signs as HOT_EXECUTOR while the principal stays where that key cannot
  reach it. A capped on-chain allowance or a scoped module satisfies it equally.
  Storing the agent key in a KMS/HSM does not.
skill_section: "Authority first, storage second"
status: open
notes: |
  Measured on wallets-goal-002, 3 runs per arm, codex / gpt-5.5 high executor,
  claude-opus-5 high judge, self_judged false.

  The mirror quiz (wallets-quiz-006) passes 3/3 in every arm, including no_skill:
  asked about agent custody directly, the model knows the 2-of-3 answer. This
  task never names custody, and unprompted the same model ships a single-EOA
  design. That gap — knows-when-asked vs applies-unprompted — is the whole reason
  the goal task exists, and it is the strongest evidence in this benchmark for
  keeping wallets as a skill rather than a wiki page.

  The old file fails identically to no skill (3/3), despite carrying a "Safe for
  AI Agents" section with the 2-of-3 topology spelled out. Length was not the
  problem and the content was present; what the new file adds is the imperative
  ordering — "decide the authority before the storage" — stated as the first
  thing in the file rather than as one section among fifteen.

  The new arm's residual failure is narrower than the other two arms and worth
  keeping separate from this record's headline. Run 3 passes expect_1, expect_3
  and expect_4 — it states the bounded-float arrangement correctly in DEPLOY.md —
  and fails expect_2 only: rebalance.ts still signs with one key and sends from
  the treasury address, so the design is asserted in prose and contradicted by
  the code beside it. That is a states-the-rule-without-applying-it failure of
  the same family as wallets-burned-key-stated-not-acted-on, not an absent
  decision, and if it recurs on another stack it should be split into its own
  record rather than pooled here.
