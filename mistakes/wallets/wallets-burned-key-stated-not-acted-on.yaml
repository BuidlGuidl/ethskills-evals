mistake_id: wallets-burned-key-stated-not-acted-on
skill: wallets
first_seen: 2026-08-28
frequency:
  no_skill: 6/7
  with_skill: 0/7
category: states-the-rule-without-applying-it
symptom: >-
  Handed a deployer private key inline in the task brief, the run writes the
  burned-key rule correctly in the abstract — "if a key is exposed, it is
  burned", "if a key has ever been pasted into a chat, a ticket, a doc, or a
  commit, treat it as public and stop using it" — and then never identifies the
  key in front of it as an instance of that rule. Nothing in the delivered code
  knows the key is compromised: no deny list, no refusal to sign, no derived
  address recorded anywhere. The guidance is right and inert. Every failing run
  passed the other three checks (key loaded from the environment, .gitignore in
  place before a push, a confirmation gate on the sweep), so this is not a run
  that missed secret handling generally — it is a run that stated a rule and did
  not apply it to the case at hand.
expected_pattern: >-
  Name this key, not the category. The seven with_skill runs derive the brief's
  key to 0x6Ed090E7EBd28B191810eaBc9b2c31B9660A2402, put that address on a deny
  list the delivered scripts enforce (BURNED_ACCOUNTS in scripts/env.ts, a
  denylist in config.ts), so an attempt to deploy with it fails rather than being
  advised against, and keep sweep able to drain it as the documented rescue path.
  One run added `npm run new-key` to generate the replacement. A README paragraph
  restating the rule does not satisfy this; code that refuses to sign does.
skill_section: "Before anything signs"
status: open
notes: >-
  Measured on wallets-goal-004 at n=7 per variant, claude-opus-5, codex judge,
  self_judged false. Fisher exact two-tailed p = 0.029 — the first significant
  separation across five wallets benchmarks and 75 runs.

  Read the frequency with two caveats. First, the n=7 cell mixes designs: runs
  1-3 per variant were collected as a batch per variant in one session
  (2026-08-27/28), runs 4-7 interleaved in one session (2026-08-29). Runs 4-7
  alone are 0/4 unaided vs 3/4 aided, p=0.14; the significance comes from
  pooling. Second, an earlier benchmark of this same task ran the other way —
  2026-08-06, full skill file, no_skill 3/3 vs with_skill 2/3
  (reports/wallets-guardrails-2026-08-06.md). Those six runs are NOT in the
  frequency above, which counts only the 14 runs against the reduced file. The
  August with_skill failure was the same expect_3 on a strict reading: that run
  designed the brief's key out of existence without naming it, which is the
  boundary case this record's expected_pattern is written against.

  This is the mistake the guardrail section of the skill exists to prevent, and
  it survived the cut to three bullets — the compression is what the passing runs
  acted on, so no skill edit follows from this record. It is filed as evidence
  that the section earns its place, which is the opposite of what four prior
  benchmarks concluded about this file.
