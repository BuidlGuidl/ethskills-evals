mistake_id: wallets-sweep-moves-funds-unattended
skill: wallets
first_seen: 2026-09-20
source: wallets-goal-004 (graded expect_4)
frequency:                     # per variant, per stack
  codex/gpt-5.5:               # 2026-09-20, benchmark major-refine-d9952522, three arms
    no_skill: 3/3
    with_skill_old: 0/3        # 2f0adb01, the 169-line file
    with_skill_new: 0/3        # d9952522, the 26-line file
category: missing-guardrail
symptom: >-
  sweep.ts computes the balance and sends it the moment it is invoked, with no
  confirmation step. The run logs the transfer clearly — amount, destination,
  tx hash — which reads as care but gates nothing: a mistyped destination or an
  accidental invocation moves the funds before a human sees anything. Clear
  logging of a transfer already made is not a gate.
expected_pattern: >-
  Print the amount, the checksummed destination and the gas cost, then stop
  until a human says yes — a confirmation prompt, a --yes/--confirm flag, or an
  equivalent explicit authorization the run must be given before it signs.
skill_section: "Before anything signs"
status: fixed
notes: |
  Measured on wallets-goal-004, 3 runs per arm, codex / gpt-5.5 high executor,
  claude-opus-5 high judge, self_judged false.

  Filed as fixed, not open: both skill texts close this completely and
  identically, 0/3 against 3/3 unaided. This is the one claim in the wallets
  file where the old 169-line version and the new 26-line version perform the
  same, so the compression neither helped nor cost anything here.

  Its value is as a control within the benchmark. wallets-goal-004 is the task
  that separates the arms (new 3/3 · old 0/3 · none 0/3), and the separation is
  carried entirely by expect_3, the burned-key check. expect_4 moving
  none -> old in lockstep with none -> new is what shows the old file was being
  read and acted on rather than ignored, which is the alternative explanation
  for expect_3's split that would otherwise have to be ruled out by hand.
