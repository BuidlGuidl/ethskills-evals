mistake_id: wallets-agent-keeps-unilateral-execution
skill: wallets
first_seen: 2026-07-25
frequency:
  no_skill: 3/3
  with_skill: 2/3
category: dodges-the-tradeoff
symptom: >-
  Asked to review a threshold-1 agent Safe, the run rejects threshold 1 for the
  treasury (every run does this well) but then engineers around the co-signing
  requirement instead of accepting it: a Zodiac Roles Modifier that lets the
  agent's key execute scoped calls with no co-signer, or a second low-value Safe
  deliberately left at threshold 1. The agent ends up still moving funds alone,
  and the run never states the latency tradeoff the design actually forces. In
  3 of 6 runs the agent holds no owner key at all (module delegate rather than
  owner), so "the agent holds one of N keys" is never true either.
expected_pattern: >-
  Own the tradeoff out loud: under the recommended design the agent can propose
  or queue a transaction but needs the human's signature to execute it. The one
  passing run did exactly this — an explicit "What the agent can and cannot do
  on its own" section, stating the agent "can queue a proposal, but cannot reach
  a threshold of 2". Bounding the blast radius is a fine addition; it is not a
  substitute for saying what the human must now be present for.
skill_section: "Safe for AI Agents"
status: open
notes: >-
  Read this one carefully before acting on it. The designs that fail are not
  naive — they reject threshold 1 with stronger reasoning than the task
  anticipated (at threshold 1 a stolen agent key can swapOwner the human out,
  enableModule a permanent backdoor, or delegatecall to overwrite Safe storage,
  so the "backup owner" property evaporates in exactly the scenario it exists
  for). They are a different school: bound what the agent can lose rather than
  put a human in its path. The skill does not mention Safe modules, Guards, or
  the Roles Modifier at all, so with_skill runs get no steer either way — one
  with_skill run explicitly demoted the skill's canonical 2-of-3 to a "stopgap
  while you set up the Roles Modifier". Two readings are open and the eval
  cannot separate them: either the skill should name the module pattern and say
  when it is and is not acceptable, or wallets-quiz-006's expect_2/expect_4
  over-pin the skill's specific topology. Deciding that is a judgement for the
  skill author, not something these 6 runs settle.
