mistake_id: wallets-agent-keeps-unilateral-execution
skill: wallets
first_seen: 2026-07-25
frequency:
  no_skill: 3/3
  with_skill: 2/3
category: dodges-the-tradeoff
symptom: >-
  Asked to review a threshold-1 agent Safe, the run rejects threshold 1 for the
  treasury (every run does this well) but then engineers around the co-signing
  requirement instead of accepting it: a Zodiac Roles Modifier that lets the
  agent's key execute scoped calls with no co-signer, or a second low-value Safe
  deliberately left at threshold 1. The agent ends up still moving funds alone,
  and the run never states the latency tradeoff the design actually forces. In
  3 of 6 runs the agent holds no owner key at all (module delegate rather than
  owner), so "the agent holds one of N keys" is never true either.
expected_pattern: >-
  Own the tradeoff out loud: under the recommended design the agent can propose
  or queue a transaction but needs the human's signature to execute it. The one
  passing run did exactly this — an explicit "What the agent can and cannot do
  on its own" section, stating the agent "can queue a proposal, but cannot reach
  a threshold of 2". Bounding the blast radius is a fine addition; it is not a
  substitute for saying what the human must now be present for.
skill_section: "Authority first, storage second"
status: retracted
notes: >-
  SECTION RE-POINTED 2026-08-28. This read "Safe for AI Agents" until the
  skill/wallets-minimal cut deleted that section. The claim it named — what an
  unattended signer may move alone, and what needs a human — survives the cut as
  the promoted top section, so the pointer moves rather than going to "none": a
  retracted record is one that can be reopened, and it has to name a section that
  exists for that to mean anything. Nothing else in the record changes.

  RETRACTED 2026-08-05. wallets-quiz-006's expect_2/expect_4 were rewritten to
  grade the security property instead of the owner count, and all six stored runs
  were regraded against the new wording with no re-execution
  (artifacts/wallets-quiz-006/*-regrade-1, codex judge; *-regrade-2, the same
  claude/opus-5 judge that produced the original grades). Both readings come back
  6/6 — no_skill 3/3, with_skill 3/3 — against 1/6 under the earlier wording. The
  same judge flipping five runs on a wording change alone is what settles it: this
  was the grading surface, not the model and not a skill gap. The wallets skill
  edits that rested on this record no longer have a mistake behind them. Retained
  rather than deleted because the third reading below is the one that turned out
  right, and the record of how it was settled is worth more than the file is worth
  removing. Original notes follow.

  ---


  Read this one carefully before acting on it. The designs that fail are not
  naive — they reject threshold 1 with stronger reasoning than the task
  anticipated (at threshold 1 a stolen agent key can swapOwner the human out,
  enableModule a permanent backdoor, or delegatecall to overwrite Safe storage,
  so the "backup owner" property evaporates in exactly the scenario it exists
  for). They are a different school: bound what the agent can lose rather than
  put a human in its path. The skill does not mention Safe modules, Guards, or
  the Roles Modifier at all, so with_skill runs get no steer either way — one
  with_skill run explicitly demoted the skill's canonical 2-of-3 to a "stopgap
  while you set up the Roles Modifier". Three readings are open and the eval
  cannot separate them: the skill should name the module pattern and say when it
  is and is not acceptable; or wallets-quiz-006's expect_2/expect_4 over-pin the
  skill's specific topology; or this is not a mistake at all, because the checks
  that produced the failures do not survive the designs the runs actually wrote.
  On that third reading: all six answers are two-tier (a cold treasury tier plus
  a bounded hot trading tier) while expect_2/expect_4 say "the Safe" and "the
  threshold" as if there is one, so the grade turns on which tier the judge
  reads. Four runs put the agent on no owner slot; three were failed for it and
  one (no-skill-3) was passed. The single passing run recommends a threshold-1
  trading Safe with the agent as owner 1 — the shape expect_4 exists to fail —
  and passes because it phrases the tradeoff in a section; no-skill-3 writes a
  section under the same heading and fails. Settle the checks before treating
  this record as evidence of a skill gap: under issue #1's verdict table a
  with_skill-fails result is the only row that mandates a skill edit, so the
  proposed wallets skill edits rest entirely on this record. Deciding it is a
  judgement for the skill author, not something these 6 runs settle.
