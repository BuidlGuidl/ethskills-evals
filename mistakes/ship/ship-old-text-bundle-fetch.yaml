  claude/claude-opus-5:        # 2026-09-21, benchmark major-refine-d9952522, effort medium
    no_skill: 0/15
    with_skill_2f0adb01: 7/15
    with_skill_d9952522: 1/15
category: scope-expansion
symptom: "Fetches sibling ethskills SKILL.md files over the network before the plan it was asked for is concrete, so the answer reflects the skill bundle rather than ship."
expected_pattern: "Answer the requested slice from ship alone; fetch another skill only when the plan reaches that phase and needs its detail."
skill_section: "Fetch another focused skill only when the plan reaches that phase"
status: fixed
notes: |
  The 318-line text lists sibling skills by URL without a gate, and 7 of its 15 runs pulled
  between one and four of them (audit, security, standards, addresses, gas, concepts, wallets,
  frontend-ux). Every ship task's notes call this out as a threat to the measurement: a run that
  pulls them makes the delta about the bundle, not this skill. The 81-line text keeps the URLs
  but gates them ("Fetch another focused skill only when the plan reaches that phase and needs
  its details"), and 1 of 15 runs fetched one (addresses, on the goal task — the one place the
  text names it for verified contract addresses, so arguably correct). no_skill runs have no
  URLs to fetch and never did, which is why 0/15 is a floor and not a comparison.
