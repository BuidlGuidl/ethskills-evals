frequency:                     # per arm, one stack measured
  claude/claude-opus-5:        # 2026-09-21, benchmark major-refine-d9952522, effort medium
    no_skill: 0/15
    with_skill_2f0adb01: 4/15
    with_skill_d9952522: 0/15
category: deliverable-hygiene
symptom: "Writes the agent harness's own skill paths into the shipped deliverable — a project AGENTS.md telling readers to read `.agents/skills/<name>/SKILL.md`, or a README linking ethskills.com/<skill>/SKILL.md as the audit step."
expected_pattern: "Ship the product's own docs; the agent's skill plumbing is not part of the deliverable."
skill_section: "Minimal ship checklist"
status: fixed
notes: |
  Four of the old arm's 15 runs did this, and all four tripped verify's judge-blindness guard,
  because a deliverable naming `.agents/skills/` tells a blind judge it graded a with_skill run.
  Each was read and graded with --allow-skill-mention rather than resampled: the mentions come
  from the arm's own text, so re-running until they disappear would select the sample on the
  behavior under test. Direction of any bias is unknown; all four passed every expect line, as
  did the new-arm runs they are compared against, so the benchmark's conclusion does not rest
  on them. The refined text produced none in 15 runs.
