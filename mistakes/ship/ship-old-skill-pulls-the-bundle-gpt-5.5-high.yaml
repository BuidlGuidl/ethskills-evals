notes: |
  Fixed by the d9952522 rewrite, which cut the skill from 318 lines to 81 and rewords the
  routing as "Fetch another focused skill only when the plan reaches that phase and needs
  its detail". Zero of 15 new-arm runs fetched anything, against 8 of 15 old-arm runs.

  This is a measurement hazard as much as a skill defect, and ship-goal-001's and each
  ship quiz's notes ask for it to be recorded per run: where the old arm pulled the
  bundle, its pass counts and its cost describe ship-plus-what-it-fetched, not ship. It
  also cost one run its grade outright — ship-quiz-001 old 3 wrote the evm-audit-*
  namespace ids it had fetched into plan.md and tripped the judge-blindness guard.

  Not a graded expect line, so there is no pass-rate delta attached to it; the rate is the
  share of runs whose transcript shows a fetch command against an ethskills SKILL.md URL.
