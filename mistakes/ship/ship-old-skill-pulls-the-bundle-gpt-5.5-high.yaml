symptom: "The 2f0adb01 skill text routes to other skills by URL, and runs act on it mid-task: 8 of 15 old-arm runs curled or web-searched https://ethskills.com/<skill>/SKILL.md (audit, wallets, gas, qa, frontend-playbook) and folded that content into the deliverable."
