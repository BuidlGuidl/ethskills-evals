symptom: "Same failure as [[concepts-forkability-stops-at-verified-contracts]], on kimi-k3. On this stack it is not a run that stops at Etherscan verification. The NOTES.md never raises the question: the only 'verify' in any no_skill NOTES.md is the `--verify` flag on the deploy command, and nothing says what survives if the operator stops. Old-text run 1 comes closest, 'this is a *service* with an operator (you), not an unstoppable protocol', but it never splits the contracts from the weather API and the per-request check. Old-text run 3 has no survivability section at all; its nearest line is 'if you lose it, revenue is locked forever'."
expected_pattern: "Split the stack in NOTES.md. The contracts and subscription state survive the operator; the weather API and the check service do not. Every new-text run does it: 'What does not survive you is the weather API itself: the data, the endpoints, and the backend check are yours alone' (run 3); 'the money layer survives you, the service layer doesn't' (run 2)."
skill_section: "Before you finish, write down what the design gives up -> Could someone else run it?"
status: fixed
