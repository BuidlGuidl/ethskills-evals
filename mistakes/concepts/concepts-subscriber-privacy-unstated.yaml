  no_skill: 1/3                # #78, 230-line skill absent
  with_skill: 0/3              # #78, 230-line skill
  with_skill_minimal: 0/5      # #88 re-run, 42-line skill
source: concepts-goal-001 (claude/opus-5 executor; #78 3 runs per variant, #88 5 with_skill runs)
category: partial-application
symptom: "A design that writes each customer's plan and subscription state to a public chain ships with NOTES.md never saying that anyone — competitors included — can read which addresses subscribe to what. The one failing run discussed exposure only as an API-endpoint access-control concern (an unauthenticated read letting someone check an address), not as a property of putting the subscriber ledger onchain at all."
expected_pattern: "NOTES.md states plainly what the design publishes: subscriber addresses, plan tier, top-up and cancellation history are readable by anyone from chain data forever, independent of any access control on the operator's own endpoints."
skill_section: "Before you finish, write down what the design gives up -> What does an observer learn?"
status: open
notes: |
  Weak evidence: one failure in six runs. Filed because an unfiled observation
  is lost, and because it is the same shape as
  [[concepts-forkability-stops-at-verified-contracts]] — a CROPS habit the
  skill states correctly but which has to surface unprompted in prose the
  input never requests.

  with_skill 0/3 against no_skill 1/3 is not evidence the skill fixed it; the
  base rate is too low for three runs to distinguish anything.

  2026-08-25: same rewrite. The privacy question now carries the exact shape of
  the one failure — that access control on your own endpoints is a different
  question from what the design publishes onchain — and is asked at the end of
  a build rather than defined at the top.

  2026-08-25, re-run: expect_6 passed 5/5 against the minimal skill
  (reports/concepts-2026-08-25.md); every run named that anyone, competitors
  included, can read which addresses subscribe to what. Stays open anyway, and
  the reason is arithmetic rather than doubt: the baseline is one failure in
  six runs, so zero failures in five is what you would expect ~40% of the time
  even if nothing had changed. This record cannot be closed by more clean runs
  at this base rate — it needs a task where the privacy question is harder to
  answer by accident, or it should be folded into
  [[concepts-forkability-stops-at-verified-contracts]], which is the same habit
  and now has evidence behind it.
