category: partial-application
symptom: "The no_skill runs ship an owner who can reprice existing subscribers, and NOTES.md states the effect but not what happens if the key is lost or the operator walks away. none-1: 'A price change applies at each subscriber's *next* renewal… `exists=false` retires a plan'; 'Owner key. It controls plans and sweeps fees. Put it on a multisig.' none-3: `setPlan(planId, price, period, active)` applies to current subscribers, and its NOTES.md says 'A price change applies to existing subscribers at their next charge. There is no grandfathering… Owner key = the money key.' The judge failed none-1 on expect_5 and passed none-3."
expected_pattern: "Name each operator power over a paying customer and what becomes of customers if that key is lost or the operator walks away. Or ship none and say so. new-1 and new-2 ship constant prices and revenue withdrawal only, and all three new-text NOTES.md state what the owner key can and cannot do."
skill_section: "Before you finish, write down what the design gives up -> Can anyone be stopped from using it?"
status: open
notes: |
  This is the first time expect_5 has been exercised the way the task notes say
  it was written for: a run that scaffolds power over existing subscribers.
  Before this, every run on every stack passed it the trivial way, by shipping
  none. The grading across the three runs that carry such a power is uneven:
    - none-1 failed.
    - none-3 passed with a stronger power and no better NOTES.md.
    - old-3 passed. Its price is read live in `_owed` and `settleMany` is
      permissionless, so an owner can reprice and settle everyone in one block.
      Its NOTES.md says "they can always cancel and get refunded", which is
      false against that sequence, although it does cover key loss.
  The aggregates do not move, because none-3 fails expect_6 and expect_7 anyway.
  The inconsistency is in the report for #119.
