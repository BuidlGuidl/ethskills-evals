mistake_id: concepts-bare-secret-commitment-kimi-k3-high
skill: concepts
first_seen: 2026-09-23
frequency:                     # concepts-quiz-001, commitment is keccak256(secret) with no salt or address
  opencode/kimi-k3-high:       # major-refine-d9952522, 3 runs per arm
    no_skill: 0/3
    with_skill_2f0adb01: 2/3   # graded fail on expect_2: 1/3 (old-1); old-3 has the same shape and passed
    with_skill_d9952522: 0/3
source: concepts-quiz-001 (opencode/kimi-k3 high executor, benchmark major-refine-d9952522)
category: design-flaw
symptom: "Old-text runs commit the bare secret: 'submits `enter(keccak256(secret))`' (old-1) and 'submits `keccak256(secret)` as their commitment' (old-3). A commitment that binds neither a salt nor the sender's address can be copied by another entrant, who then reveals the same secret. Old-1 also puts no stake behind the reveal ('entry was free'), and old-3 calls a bond 'optional hardening… keep it simple'."
expected_pattern: "Commit `hash(secret, salt)` bound to the sender's address, as the new text says: 'Participants commit `hash(secret, salt)` bound to their address'. Every no_skill and new-text run did so, e.g. `keccak256(secret, address)`."
skill_section: "Randomness -> Commit-reveal"
status: fixed
notes: |
  The old text's commit-reveal recipe says "hash(secret + salt)" but not "bound
  to the sender's address", and both old-text runs that went wrong read it and
  still dropped the salt. The new text's wording fixed this on this stack (0/3).
  The judge was not consistent here. Old-1 failed expect_2 on the "binding a
  salt or the sender's address rather than the bare secret" clause, and old-3
  passed with the same construction. The rubric supports the fail, so old-3's
  pass is the miss, and a strict reading would put the old arm at 1/3 rather
  than 2/3 on quiz-001. The pass counts in the report stay on the judge's
  grades, and the report flags the inconsistency. The clause sits inside the
  lookback line. A line of its own would grade it more reliably, which is a
  rubric question for #119.
