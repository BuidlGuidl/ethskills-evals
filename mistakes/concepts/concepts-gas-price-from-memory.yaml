mistake_id: concepts-gas-price-from-memory
skill: concepts
first_seen: 2026-08-25
frequency:                     # concepts-quiz-002, runs pricing from memory
  with_skill: 2/3              # #88 re-run, 42-line minimal skill
source: concepts-quiz-002 (claude/opus-5 executor, 3 with_skill runs)
category: stale-knowledge
symptom: "Asked for an operational read on a mainnet vault whose harvest incentive has to be weighed against the caller's gas, runs do the comparison correctly but price both of its inputs from memory instead of the live market. Two of three runs built their tables around 2-60 gwei — one labelling 3 gwei 'calm' and 30 gwei 'busy', the other tabulating 2, 5, 10, 30 and 60 gwei — on a day mainnet was at 0.72 gwei, so even the cheapest scenario either offered was about three times the real price. Both also priced ETH from memory, and the two errors multiply rather than sit beside each other: run 1 used a flat $3,500 and run 2 a $3,000-4,000 band against a live ~$2,455, another 22-63% on top of the gas error. The verdict survives because both presented a range rather than a single number and the design fails at every point in it, but the dollar figures a reader would act on are wrong."
expected_pattern: "Read the current base fee and ETH price before quoting dollars — an RPC eth_gasPrice call and a price source take one command each — then price the caller's reward against the caller's gas at those numbers, showing a sensitivity range around them rather than instead of them."
skill_section: "Nothing runs itself -> 3. Is that enough?"
status: open
notes: |
  No expect line grades this. expect_1 requires a stated per-call gas figure
  and a gas price and ETH price "the answer itself supplies or measures", which
  a remembered number satisfies, and expect_2 grades the break-even the run
  derives from whatever prices it states. All three runs passed. This is
  recorded because the skill asks for something specific — "at the gas price
  and ETH price the target chain shows today" — and two of three runs did not
  do it, which an unfiled observation would lose.

  The third run shows the ask is cheap and works: it curled four public RPCs,
  took a live base fee of 0.54-0.65 gwei and ETH at $2,453.52, and priced
  against them. Both figures land within 1% of what I measured independently
  before the benchmark, so live data was reachable from the workspace and the
  other two runs simply did not go and get it.

  Same shape as [[concepts-forkability-stops-at-verified-contracts]]: the skill
  states the instruction correctly and the failure is that a run does not carry
  it into the work. Unlike that one, it has no eval pressure behind it — nothing
  fails when it is skipped. Either give expect_1 a clause requiring the prices
  to be live-checked, or accept that this task does not measure it. n=3, one
  task, one model: too thin to justify a skill edit.

  Re-measured 2026-09-23 in major-refine-d9952522 (claude-opus-5 medium,
  n=3 per arm): concepts-quiz-002 none 3/3, old (2f0adb01) 3/3, new
  (d9952522) 3/3 priced from memory. No run in any arm made a curl, RPC,
  WebFetch or WebSearch call; every run assumed 1-60 gwei and ETH at
  $3,000-4,000. At 19:36 UTC that day mainnet eth_gasPrice read 0.123 gwei
  (publicnode) and ETH $2,673 (Coinbase spot), so a 250k-gas harvest cost
  ~$0.08 against a ~$0.0088/day fee: break-even ~9 days (400k gas: ~15 days).
  The runs derived 13 months to 13 years, and none-1 and new-1 wrote that a
  mainnet harvest is never economic, which is wrong at the day's prices. The
  verdict (1% does not pay for a daily call; move to an L2 or restructure)
  still stands, which is why every run passed. new-3 wrote "I couldn't check
  live gas or ETH price" without trying, and new-1 and new-2 only told the
  reader to re-check on deploy day. concepts-goal-001 shows the same thing in
  all 9 runs (no live lookup; gas either measured with forge or called
  "fractions of a cent"), but no expect there needs a dollar figure.

  The refined text's "at the gas price and ETH price the target chain shows
  today" does not move this at all on opus-5 medium (new 3/3, same as none),
  so this is a reach gap, not a content gap, and it is the one open concepts
  record the refine left untouched. Frequency above stays the #88 reading;
  this paragraph is the major-refine one.
