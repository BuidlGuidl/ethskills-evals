symptom: "Same failure as [[concepts-forkability-stops-at-verified-contracts]], on codex. NOTES.md never says what a customer or third party could still run if the provider stopped. The weather API and the per-request subscription check are never named as the half that dies with the operator. The old-text run 2 stops at 'Verify the contract on the chain explorer if the chain supports it', which is the exact prior the line targets. Old-text run 1's only continuity note is 'Backend access depends on RPC freshness.'"
