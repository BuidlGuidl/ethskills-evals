notes: |
  Stack-specific companion to [[concepts-forkability-stops-at-verified-contracts]],
  whose notes asked for a reopen "if expect_7 fails on any other stack". On codex
  it does not reopen for the new text: 0/3. It does show that the old
  230-line text does not carry the claim on this stack. The old text
  states "fork the full stack" as one bullet of a list near the top, and 3/3
  old-text runs read the skill in full (sed 1,240p) and still left the service
  half out. The new text asks the question at the end of the build and names the
  split. That placement is the only difference in reach between the two
  texts on this line, and it is the one that moved.

  No-skill and old-text runs are 6/6 fails against 0/3 for the new text.
  The base rate here is much higher than claude's 3/6, which makes this the strongest
  evidence for the rewrite in the concepts row. The caveat from the parent record
  still applies: the expect line and the new text's wording were written by the same
  hand.
