mistake_id: concepts-forkability-stops-at-verified-contracts
skill: concepts
first_seen: 2026-08-14
frequency:                     # concepts-goal-001 expect_7 failures, per arm
  no_skill: 2/3                # #78, 230-line skill absent
  with_skill: 1/3              # #78, 230-line skill
  with_skill_minimal: 0/5      # #88 re-run, 42-line skill
source: concepts-goal-001 (claude/opus-5 executor; #78 3 runs per variant, #88 5 with_skill runs)
category: partial-application
symptom: "Asked to build onchain subscription billing for an API service and to write NOTES.md on running it day to day, runs treat the contract half as the whole system. NOTES.md lists Etherscan verification in the deploy steps (`forge script ... --verify`) and stops there: it never says what a customer or third party could actually run for themselves if the provider walked away. The weather API the subscription buys access to, and the endpoint serving the per-request `isSubscribed` check, go unmentioned — so a reader is left believing verified contracts make the service forkable, when the half that delivers the product is closed and unrunnable."
expected_pattern: "Split the stack explicitly in NOTES.md: the contracts are forkable and the subscription state is readable by anyone from chain data, but the weather API and whatever serves the per-request check are not — if the provider stops, subscribers can still withdraw, and cannot still get weather data. Name which side survives operator disappearance and which does not."
skill_section: "Before you finish, write down what the design gives up -> Could someone else run it?"
status: fixed
notes: |
  The skill states this claim correctly and specifically — "Real open source
  means someone can fork the full stack (frontend, indexer, contracts) and run
  it independently" — so this is not a skill gap in content. It is a gap in
  reach: the line is one bullet in a four-bullet CROPS list near the top of
  SKILL.md, and the run has to carry it unprompted through ~40 minutes of
  contract and backend work to a NOTES.md the input never asks to cover it.

  The skill does move the number (2/3 -> 1/3), but on 3 runs per variant that
  is one run of difference and well inside noise. Do not read it as a
  demonstrated effect.

  Both variants passed expects 1-5 3/3, so the "nothing is automatic" core of
  the skill was never the failure point here — every run of both variants
  independently chose per-second read-time accrual with a permissionless
  settle(), the strongest of the three designs the expect allows. That is the
  stale prior this skill exists to correct, and Opus 5 does not appear to hold
  it. What survives is this habit-level claim, which is the harder ask.

  2026-08-25: the skill was rewritten to its minimal form on this branch. The
  claim is unchanged in substance and now sits under an explicit end-of-build
  instruction — answer the four questions in whatever the build ends with, even
  when nobody asked — with "verified contracts on a block explorer are not
  this" and the split between the contracts and the offchain half named in the
  line itself. That is a fix for reach, which is what this record diagnosed.
  Stays open until concepts-goal-001 expect_7 is re-run against it; the
  frequency figures above are against the 230-line version.
