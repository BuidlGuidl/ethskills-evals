symptom: "All nine runs reach the right verdict: the 1% caller fee is far below gas, so harvest rarely or never gets called. Seven of the nine price the caller's side only as a dollar band with no gas price and no ETH price behind it: '~$5–$40' (none-1), '~$5–$30' (old-1), '~$1–$10 depending on gas price and ETH price' (new-1), '$1–$10 depending on gas price' (new-3). Three of them (none-1, old-1, new-3) give no per-call gas figure either. The dollar bands imply roughly 5–60 gwei; mainnet was at 0.067 gwei that day. Eight of nine runs priced gas from memory. The one pass on the no_skill arm (none-3) passes by stating a stale '~5 gwei, ~$3,500 ETH'. Only one run (new-2) searched the web, found 0.067 gwei and $2,475.84, and wrote '~0.5 gwei, ETH ~$2,500'."
expected_pattern: "State a per-call gas figure, and read the gas price and ETH price before quoting dollars. Put the caller's 1% (~$0.009 a day at these deposits) next to that dollar cost and derive the cadence from where they cross."
skill_section: "Nothing runs itself -> 3. Is that enough?"
status: open
notes: |
  The new text's third question names the fix almost word for word: "put the
  caller's reward and the caller's gas next to each other in dollars, at the gas
  price and ETH price the target chain shows today". Every with_skill run
  loaded it. Two of three new-text runs still skipped the prices, and new-3
  dropped the gas figure even though the skill quotes 250,000 gas. The old text
  only asks "covers gas + profit?". So the new text moves this 3/3 → 2/3, which
  is one run and inside noise.

  Related to [[concepts-gas-price-from-memory]], and it is the same cause: the
  model's remembered mainnet gas price is multi-gwei, so it writes a dollar band
  and treats the question as settled. Kimi-k3 goes one step further than the
  claude runs in that record: it drops the inputs entirely instead of stating
  stale ones. A more imperative line might be worth testing, e.g. "fetch both
  before quoting dollars, and write both numbers down". n=3.
