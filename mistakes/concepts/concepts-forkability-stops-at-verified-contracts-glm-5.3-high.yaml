symptom: "Same failure as [[concepts-forkability-stops-at-verified-contracts]], on glm-5.3. No NOTES.md from the no_skill or old-text arms says what a customer or third party could still run if the provider stopped. On this stack the runs do cover the contract half: no_skill run 3 says 'If the keeper stops running, nothing breaks for customers: refunds, withdrawals, and `isSubscribed` all still work', and old-text run 2 says 'if you disappear entirely, customers can still cancel and self-refund forever… This contract runs fine without you.' What they never do is name the weather API and the per-request check as the half that dies with the operator. Old-text run 2 mentions the API only as a chore ('keeping the API itself up'). Verification appears only as the `--verify` deploy flag."
expected_pattern: "Split the stack in NOTES.md: the contracts and subscription state survive the operator, and the weather API and the check service do not. Every new-text run does it under a 'What this design gives up' heading. Run 1: 'What dies with you is everything offchain: the weather API itself, the frontend you presumably build, and your `settle`/`collect` sweep routine'. Run 2: 'Your API, domain and any frontend would not survive you — that's the half that dies.'"
skill_section: "Before you finish, write down what the design gives up -> Could someone else run it?"
status: fixed
notes: |
  Stack-specific companion to [[concepts-forkability-stops-at-verified-contracts]],
  whose notes ask for a reopen "if expect_7 fails on any other stack". It
  fails here only without the new text: none 3/3, old 3/3, new 0/3. That is the
  same split as on codex and kimi-k3. All six skill runs loaded the skill
  through opencode's skill tool, so old against new is a difference of content,
  not of triggering.

  The glm-5.3 failures are closer misses than codex's. Two of the six failing
  runs state the survivability half that concerns money and stop there. The
  old text's one-bullet "fork the full stack" line does not get them to the
  other half. The new text's end-of-build question does.
