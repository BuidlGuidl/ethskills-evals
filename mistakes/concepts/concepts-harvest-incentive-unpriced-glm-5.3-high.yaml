symptom: "All nine runs reach the right verdict: the 1% caller fee is far below gas, so nobody calls harvest. The four failing runs state a per-call gas figure and a dollar cost but no gas price or ETH price that produces it: 'Mainnet gas for a harvest (claim + swap + redeposit) | ~300–500k gas → $2–20 per call at typical gas prices' (old-2), '150k–400k gas… $1–10 per call' (old-1), '~300–600k gas | ~$1–5 typical at recent base fees' (none-3), '200k–400k gas — call it $5–15 depending on gas and ETH price' (none-2). None of the four fetched a price. The two passes outside the new arm split: none-1 ran a web search, and old-3 passed on remembered prices, 'Mainnet gas at 3–15 gwei, ETH $2,500–3,500'. A new-text run's RPC call read 1.29 gwei and CoinGecko gave $2,665.92 on the same afternoon."
expected_pattern: "Read the gas price and ETH price before quoting dollars, write both down, and put the caller's 1% (~$0.009 a day at these deposits) next to the resulting per-call cost. All three new-text runs did this: new-2 called `eth_gasPrice` on a public RPC and CoinGecko; new-1 and new-3 searched the web (new-1: 'Mainnet base gas is ~0.1–1 gwei today'; new-3: 'ETH at ~$2,500 and mainnet gas at ~1 gwei base')."
skill_section: "Nothing runs itself -> 3. Is that enough?"
status: open
notes: |
  On glm-5.3 the new text's third question ("at the gas price and ETH price
  the target chain shows today") is followed literally: 3/3 new-text runs went
  and got both prices, against 0/3 old-text runs and 1/3 no_skill runs. The
  graded line moves from 2/3 to 0/3 with it. n=3 per arm is one to two runs of
  difference.

  Left open because the same text does not carry it on kimi-k3
  ([[concepts-harvest-incentive-unpriced-kimi-k3-high]], new 2/3). Codex fixed it
  like this stack did ([[concepts-harvest-incentive-unpriced-gpt-5.5-high]]).
