source: concepts-quiz-001 (codex/gpt-5.5 high executor, benchmark major-refine-d9952522)
category: design-flaw
symptom: "Asked for a same-evening commit-reveal raffle and 'what happens if someone doesn't do their part in time', runs make the draw all-or-abort. If any committer misses the reveal, the contract voids or restarts the whole draw. The prize 'remain[s] locked for the next month's raffle', or the contract 'restarts the ceremony with a new announced witness set'. So one absent revealer stalls the draw or re-rolls it. The bond that would make withholding costly is often 'optional' or 'small… if you want'. Old-text run 3 is the plainest case: its reveals are fixed before the future blockhashes it seeds from, so it could simply drop a non-revealer, and it aborts anyway."
expected_pattern: "Forfeit the absentee rather than stall the draw. A missed reveal makes that entrant ineligible and forfeits their bond, and the draw completes from the reveals that arrived. The result is seeded from something fixed after reveals close, so no single absence moves the winner. New-text run 3: 'They are ineligible. Their bond is forfeited.'"
skill_section: "Randomness -> Commit-reveal (\"Put a stake at risk: whoever reveals last sees the outcome coming and can withhold.\")"
status: open
notes: |
  The new text's commit-reveal bullet names both the stake and the
  last-revealer problem. All three new-text runs chose forfeit plus a bond, and none
  aborted. The old text reached the same design only through all-or-abort: 3/3
  old-text runs, against 2/3 without the skill.

  The graded counts understate the shape. Two runs that pass expect_5 use the same
  all-or-abort ceremony with bonded non-entrant witnesses as the failing old-text
  run 2 (124902Z): old-text run 1 (123731Z, "a new draw using the same frozen
  entrant set") and no_skill run 3 (125715Z, "the draw is aborted… the 5 ETH prize
  stays locked"). All three let one absence re-roll the draw and all three bond
  the witnesses. Read consistently, either all three fail or all three pass. That
  is a judge-consistency question on expect_5 to raise on #119, not regraded here.
  Read strictly, the arm counts become old 3/3 and none 2/3 against new 0/3.
