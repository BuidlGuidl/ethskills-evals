    with_skill_d9952522: 0/3
source: concepts-quiz-002 (codex/gpt-5.5 high executor, benchmark major-refine-d9952522)
category: missing-quantification
symptom: "Asked for an operational read on a mainnet vault whose permissionless harvest pays the caller 1% of rewards, a run says the incentive is weak but never values it against the caller's gas. It gives no per-call gas figure and no gas price. The no_skill run: 'In normal or spiky gas conditions, the caller loses money'. It gives no numbers, so its harvest cadence ('irregular… sit unharvested for long stretches') does not come from a comparison either. The old-text run: 'sub-gwei gas and example actions under a dollar… ETH was around $2,700', then a hypothetical 'If the transaction costs $1…' break-even."
expected_pattern: "Put the two sides of the caller's decision next to each other in dollars. The fee is 1% of about a dollar a day of accrual, so roughly $0.009 a day. The call costs a stated gas figure at a stated gas price and ETH price. Derive the cadence from where the fee overtakes the gas. New-text run 1: '0.416 gwei and ETH was around $2,749. A 250,000 gas harvest would cost roughly $0.29… needs to claim at least $29.'"
skill_section: "Nothing runs itself -> 3. Is that enough?"
status: open
notes: |
  This is the failure quiz-002 exists to catch, and no record covered it before.
  One run in each of none and old; the new text's third question tells a run to
  put reward and gas side by side in dollars, and 0/3 new-text runs skipped it.
  n=3 per arm is one run of difference and is not a demonstrated effect.

  Related to [[concepts-gas-price-from-memory]], but a different stack behaviour:
  8/9 codex runs sourced gas and ETH prices through web_search rather than memory
  or an RPC call, and no run called eth_gasPrice. The searched gas prices spread
  0.063 to 3 gwei on the same day, so "live" here means whatever a search snippet
  carried.
