mistake_id: concepts-harvest-incentive-unpriced-gpt-5.5-high
skill: concepts
first_seen: 2026-09-23
frequency:                     # concepts-quiz-002 expect_1 failures, per arm
  codex/gpt-5.5-high:          # major-refine-d9952522, 3 runs per arm
    no_skill: 1/3              # the same run also fails expect_2
