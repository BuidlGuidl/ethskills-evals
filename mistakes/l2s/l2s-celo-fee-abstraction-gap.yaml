source: pre-run fact audit (PR for tasks/l2s-*)
category: missing-content
symptom: "The skill's Celo section covers the L2 migration, MiniPay and the Mento stablecoins but never mentions fee abstraction: on Celo a transaction can pay its gas in an approved ERC-20 (USDC, USDT, USDm and others) via CIP-64, no paymaster or bundler involved. It is the chain's most distinctive developer-facing feature — Celo reports up to 50% of gas already settled in stablecoins — and the skill's own selection table routes 'mobile / real-world payments' to Celo without it. A reader building exactly that app reaches for ERC-4337 infrastructure it does not need."
expected_pattern: "In the Celo section, state that gas can be paid in approved ERC-20s through the fee-currency field (CIP-64), name a couple of the accepted tokens, and contrast it with the paymaster/bundler route an app would otherwise need."
skill_section: "none — gap (Key Chain Details -> Celo)"
status: open
notes: |
  Checked 2026-07-31 (docs.celo.org transactions overview; Ledger's CIP-64
  support announcement). Celo is also a custom-gas-token OP Stack chain — CELO
  is the L2 gas token and an ERC-20 on L1 — which the skill likewise does not
  say.

  Recorded but not graded: l2s-quiz-001 and l2s-goal-001 both note fee
  abstraction as record-do-not-grade, so runs will show whether the gap costs
  anything before the skill is edited.

  Run 2026-08-20 (claude/claude-opus-5, 12 Celo runs across both tasks and both
  variants), counted by grep over the graded deliverables:
    - CELO as the L2 gas token with a plain ERC-20 counterpart on L1: present in
      12/12. Both variants know this without the skill. quiz-001 no_skill run 1
      even pinned the L1 ERC-20 (0x057898f3...) and warned off a lookalike CELO
      contract with zero portal balance.
    - CIP-64 / fee-currency: present in 2/12, both no_skill goal-001 runs. Zero
      with_skill runs raised it.
  Neither absence cost a check — all 12 runs passed every expect.

  So the gap is confirmed as content the skill lacks, and confirmed as content
  that did not change an outcome on these tasks. The case for adding it rests on
  the selection table routing mobile/real-world payments to Celo: a reader
  building that app is the one who needs CIP-64, and no task in this set asks
  for that app. That is an eval gap more than a skill gap — see the report.
