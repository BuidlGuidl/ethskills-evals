symptom: "The skill's Celo section covers the L2 migration, MiniPay and the Mento stablecoins but never mentions fee abstraction: on Celo a transaction can pay its gas in an approved ERC-20 (USDC, USDT, USDm and others) via CIP-64, no paymaster or bundler involved. It is the chain's most distinctive developer-facing feature — Celo reports up to 50% of gas already settled in stablecoins — and the skill's own selection table routes 'mobile / real-world payments' to Celo without it. A reader building exactly that app reaches for ERC-4337 infrastructure it does not need."
expected_pattern: "In the Celo section, state that gas can be paid in approved ERC-20s through the fee-currency field (CIP-64), name a couple of the accepted tokens, and contrast it with the paymaster/bundler route an app would otherwise need."
skill_section: "none — gap (Key Chain Details -> Celo)"
status: open
notes: |
  Checked 2026-07-31 (docs.celo.org transactions overview; Ledger's CIP-64
