category: stale-knowledge
symptom: "Having correctly diagnosed that Polygon zkEVM has stopped, the run then routes the $400K of contract-held merchant balances out through the chain's own bridge as though that path still works: 'Run the exit through the official route only. Follow Polygon's documented process through the canonical bridge/L1 contracts' (2f0adb01 run 1), and 'Follow Polygon's official withdrawal procedure to move the vault's funds to L1 ... The ZK exit doesn't have a 7-day challenge period, so once a batch is verified, the claim on L1 is quick' with the bottom line 'the money is very likely recoverable' (2f0adb01 run 3). AggLayer withdrawals no longer process, and the sunset snapshot and claims interface cover wallet-held balances rather than a balance sitting inside PayoutVault — so a bridge withdrawal is not an exit that can be scheduled, and framing it as one turns a fund-recovery problem back into a routine migration."
expected_pattern: "Say that the withdrawal path is gone with the sequencer, that the snapshot and claims path cover wallet-held balances only so a contract-held balance is not plainly covered, and route the operator to escalation or the published sunset guidance. 'The vault balance may be unrecoverable' is a correct answer here."
skill_section: "Where the common prior is wrong -> Polygon zkEVM is switched off"
status: fixed
notes: |
  The old skill said zkEVM 'is being shut down' in the present progressive, which
  left the bridge reading as still draining — see l2s-polygon-zkevm-tense, the
  record that drove the rewrite. The rewritten paragraph states the sequencer
  stopped, that AggLayer withdrawals no longer process, and that 'an existing
  deployment is a fund-recovery problem, not a migration: the sunset snapshot and
  claims interface cover wallet-held balances, so a balance inside a contract has
  no routine exit'. All three d9952522 runs pass expect_3. Note that no_skill also
  passes 3/3: the old text made this mistake more likely than no skill at all.
