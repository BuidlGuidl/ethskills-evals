symptom: "The L2 comparison table gives Celo a 5s block time and 7-day finality. Both are wrong: Celo produces a block every 1 second, and its challenge window is 3.5 days because the chain settles through an OP Succinct fault dispute game rather than the standard OP Stack fault-dispute timeline. A reader planning a treasury sweep off this row schedules half a week of slack it does not need, and one reasoning about block cadence is off by 5x."
expected_pattern: "Give Celo a 1s block time, and state the challenge period as ~3.5 days with the reason — Celo runs an OPSuccinctFaultDisputeGame, not the 7-day fault-dispute game the other OP Stack rows share. Better still, point at viem's getTimeToProve / getTimeToFinalize the way Celo's own bridging guide does, so the figure cannot rot again."
skill_section: "Key Chain Details -> L2 comparison table (SKILL.md L34)"
