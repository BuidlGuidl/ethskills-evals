mistake_id: l2s-celo-chain-params-stale
skill: l2s
first_seen: 2026-08-03
frequency:                     # no runs yet — found auditing skill facts while drafting tasks
  no_skill: n/a
  with_skill: n/a
source: pre-run fact audit (PR for tasks/l2s-*)
category: stale-skill-fact
symptom: "The L2 comparison table gives Celo a 5s block time and 7-day finality, neither read off the chain. The block time is wrong outright: Celo produces a block every 1 second, so anything reasoning about cadence is off by 5x. The window is the blanket OP Stack fault-dispute figure applied to a chain that settles through an OP Succinct dispute game — right in magnitude for the wrong reason, which is why this record first corrected it to 3.5 days and why that correction was itself wrong: 3.5 is one gate of two, and the effective wait is ~7 days. See mistakes/l2s/l2s-celo-exit-window-composite.yaml."
expected_pattern: "Give Celo a 1s block time. For the exit window, either name both gates and the composite they produce (~7 days — see l2s-celo-exit-window-composite) or state no figure and point at viem's getTimeToProve / getTimeToFinalize the way Celo's own bridging guide does. What must not appear is a per-chain window sitting in a table with nothing beside it telling the reader to re-read it — that shape is what rotted here twice, in both directions."
skill_section: "Exiting to L1"
status: fixed
notes: |
  Read live 2026-08-03 against Celo's mainnet dispute game
  0xA35d2A7F365b42EcFCB7Db9240c3973Fc8e65139: gameType() 42,
  maxChallengeDuration() 302400 (3.5 days), maxProveDuration() 86400 (1 day).
  Block period measured over 24912 consecutive blocks on forno.celo.org: exactly
  1.0s. docs.celo.org/specs/deployments states the 1s block period directly.

  Ungraded by design. l2s-quiz-001 expect_3 and l2s-goal-001 expect_5 both grade
  the order of magnitude — days, not minutes or hours — so the skill's 7 days
  and the live 3.5 days both pass, and no expect turns on the figure. Same
  reasoning as l2s-unichain-ordering-inverted: an expect written against the
  live number would measure the rot rather than the model, since the skill
  carries the wrong figure and carries it nowhere else in corrected form.

  Fixed by the minimal rewrite (branch skill/l2s-minimal), by deletion plus a
  measurement nudge. The L2 comparison table is gone entirely — with it the
  5s block time, the blanket 7-day finality column and the tx-cost columns that
  belong to skills/gas. What replaces it: Celo settles through an OP Succinct
  fault dispute game and produces a block every 1s, the window is stated as
  per-chain and composite rather than a universal 7 days, and the reader is sent
  to viem's getTimeToProve / getTimeToFinalize against the chain's own contracts
  instead of a table that can rot again. (The rewrite first stated that window as
  ~3.5 days; e16c438 corrected it to the composite after the regression run
  measured it — see the half-superseded note below.)

  Worth recording from the 2026-08-20 runs even though nothing was graded on it:
  quiz-001 with_skill run 3 — the cheapest run in the benchmark, 110 transcript
  lines — wrote "7-day challenge period. This is a protocol constant. No amount
  of fee-paying shortens it" into the deliverable. It passed, because expect_3
  grades the order of magnitude, and it was wrong by a factor of two on the one
  number the runbook was built around. That is the cost of a stale table read by
  a run that trusts it instead of measuring.

  Half-superseded 2026-08-24. This record's expected_pattern asked for "~3.5
  days with the reason", and the rewrite said exactly that — which the
  regression run then showed is also wrong: Celo's exit is gated twice and the
  effective wait is ~7 days. See mistakes/l2s/l2s-celo-exit-window-composite.yaml
  for the measured breakdown and the corrected text. The rest of this record
  stands: the 5s block time was wrong (it is 1s), and dropping the finality
  column was right.

