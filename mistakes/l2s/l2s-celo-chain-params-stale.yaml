category: stale-skill-fact
symptom: "The L2 comparison table gives Celo a 5s block time and 7-day finality. Both are wrong: Celo produces a block every 1 second, and its challenge window is 3.5 days because the chain settles through an OP Succinct fault dispute game rather than the standard OP Stack fault-dispute timeline. A reader planning a treasury sweep off this row schedules half a week of slack it does not need, and one reasoning about block cadence is off by 5x."
expected_pattern: "Give Celo a 1s block time, and state the challenge period as ~3.5 days with the reason — Celo runs an OPSuccinctFaultDisputeGame, not the 7-day fault-dispute game the other OP Stack rows share. Better still, point at viem's getTimeToProve / getTimeToFinalize the way Celo's own bridging guide does, so the figure cannot rot again."
skill_section: "Exiting to L1"
status: fixed
notes: |
  Read live 2026-08-03 against Celo's mainnet dispute game
  0xA35d2A7F365b42EcFCB7Db9240c3973Fc8e65139: gameType() 42,
  maxChallengeDuration() 302400 (3.5 days), maxProveDuration() 86400 (1 day).
  Block period measured over 24912 consecutive blocks on forno.celo.org: exactly
  1.0s. docs.celo.org/specs/deployments states the 1s block period directly.

  Ungraded by design. l2s-quiz-001 expect_3 and l2s-goal-001 expect_5 both grade
  the order of magnitude — days, not minutes or hours — so the skill's 7 days
  and the live 3.5 days both pass, and no expect turns on the figure. Same
  reasoning as l2s-unichain-ordering-inverted: an expect written against the
  live number would measure the rot rather than the model, since the skill
  carries the wrong figure and carries it nowhere else in corrected form.

  Fixed by the minimal rewrite (branch skill/l2s-minimal), by deletion plus a
  measurement nudge. The L2 comparison table is gone entirely — with it the
  5s block time, the blanket 7-day finality column and the tx-cost columns that
  belong to skills/gas. What replaces it: Celo settles through an OP Succinct
  fault dispute game with a challenge duration of about 3.5 days and produces a
  block every 1s, the window is stated as per-chain rather than a universal 7
  days, and the reader is sent to viem's getTimeToProve / getTimeToFinalize
  against the chain's own contracts instead of a table that can rot again.

  Worth recording from the 2026-08-20 runs even though nothing was graded on it:
  quiz-001 with_skill run 3 — the cheapest run in the benchmark, 110 transcript
  lines — wrote "7-day challenge period. This is a protocol constant. No amount
  of fee-paying shortens it" into the deliverable. It passed, because expect_3
  grades the order of magnitude, and it was wrong by a factor of two on the one
  number the runbook was built around. That is the cost of a stale table read by
  a run that trusts it instead of measuring.
