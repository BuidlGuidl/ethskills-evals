symptom: "SKILL.md says Polygon zkEVM 'is being shut down' and 'do NOT recommend building on' it. The shutdown has happened: the Mainnet Beta sequencer stopped around 2026-07-01, the network no longer produces blocks and AggLayer bridge withdrawals no longer process. Read in the present tense the line still describes a chain that is running down, so a reader asked about an existing deployment there plans a migration on a normal timeline instead of an asset recovery."
expected_pattern: "Say the chain is shut down as of 2026-07-01: no new blocks, reads still answer a frozen state, bridge withdrawals closed. Split the recovery picture — wallet-held balances were snapshotted and are claimable through Polygon's interface (open ~2026-07-13 through 2027-12-31), while assets locked in contracts were not snapshotted and have no claims path at all."
skill_section: "Where the common prior is wrong -> Polygon zkEVM is switched off"
status: fixed
notes: |
  Sources checked 2026-07-31: forum.polygon.technology "Polygon zkEVM Mainnet
  Beta Sunset: Claim Your Funds" ("funds locked in DeFi protocols cannot be
  auto-migrated"); Alchemy's Polygon zkEVM deprecation notice. Probed the same
  day: https://zkevm-rpc.com still serves reads, latest block 33391890 frozen at
  2026-07-03T15:55:44Z — the chain is stopped, not unreachable.

  Graded by l2s-quiz-002, but only for the steer the skill actually carries
  (the chain is discontinued, do not plan work on it) — the expects do not
  require the shutdown date, so this record stays open independently of how the
  runs go.

  Run 2026-08-20 (claude/claude-opus-5, 3 runs per variant): 6/6, both variants,
  all three expects. Every run diagnosed the stall as the chain no longer
  producing blocks rather than an RPC fault, scoped the Q3 plan to a migration
  (Base in most runs, Polygon PoS and Arbitrum as alternates, all live chains),
  and refused to treat the $400k vault balance as a routine bridge exit.
  with_skill run 2 passed while explicitly saying it did not know the chain's
  current operational state — the steer was enough without the date.

  So the present-tense wording did not mislead any run here. The record stays
  open on the recovery split (wallet-held claimable, contract-held not), which
  is the part the skill still does not carry and which expect_3 deliberately
  does not require.

  Fixed by the minimal rewrite (branch skill/l2s-minimal). "Is being shut down"
  becomes the completed state: the Mainnet Beta sequencer stopped around
  2026-07-01, no new blocks, submitted transactions never confirm, AggLayer
  withdrawals no longer process, and reads keep answering a frozen final state —
  which is what a stuck dashboard looks like from the outside. The recovery
  split this record stayed open on is now in the text too: an existing
  deployment is a fund-recovery problem, and the sunset snapshot and claims
  interface cover wallet-held balances, so a balance inside a contract has no
  routine exit.

  Read the next quiz-002 numbers accordingly: expect_3's split was model
  knowledge in the 2026-08-20 runs (6/6, both variants, with nothing in the
  skill to source it from) and is now skill-sourced for the with_skill arm, so
  it stops being evidence about the model.
