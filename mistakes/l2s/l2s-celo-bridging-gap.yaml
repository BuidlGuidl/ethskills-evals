mistake_id: l2s-celo-bridging-gap
skill: l2s
first_seen: 2026-08-03
frequency:                     # l2s-quiz-001 / l2s-goal-001, 2026-08-20: gap did not cost a run
  no_skill: 0/6
  with_skill: 0/6
source: pre-run fact audit (PR for tasks/l2s-*)
category: missing-content
symptom: "The skill lists Celo as an OP Stack optimistic rollup and its selection guide routes mobile / real-world payments there, but the Bridging section has rows for Arbitrum, Base, Optimism, Unichain, zkSync and Scroll and no Celo row. The skill also never says anywhere that an OP Stack L2-to-L1 exit is a multi-step process: prove, finalize, output roots and L2ToL1MessagePasser do not appear in the document. A reader gets 'Celo | Optimistic (OP Stack) | 7 days' (L34) and 'deploy like mainnet, just change RPC URL and chain ID' (L113), and writes a withdrawal runbook with one bridge transaction and a 7-day wait."
expected_pattern: "Add a Celo row to the official-bridges table, and state the OP Stack exit as the three operator-submitted steps it is: initiate on L2 via L2ToL1MessagePasser, prove on L1 once a dispute game covering the block has been posted, finalize on L1 after the challenge period. Celo's own specs say it works 'the same as on OP chains that use ETH as the native token', so the mechanics generalise across every optimistic row in the table, not just Celo."
skill_section: "Exiting to L1"
status: fixed
notes: |
  Checked 2026-07-31 against specs.celo.org/bridge.html and
  docs.celo.org/specs/native-bridge. Celo runs the OP Stack Standard Bridge with
  the custom-gas-token feature — CELO is the L2 gas token and a plain ERC-20 on
  L1 — which the skill likewise does not say (see
  l2s-celo-fee-abstraction-gap.yaml, which records the other half of the Celo
  content gap).

  This one is graded, unlike the four rotted claims: l2s-quiz-001 expect_2 and
  l2s-goal-001 expect_4 both require the multi-step exit, and both tasks carry a
  verdict-flipping marker saying so. A with_skill failure on either line alone
  is what closes this record.

  Run 2026-08-20 (claude/claude-opus-5, 3 runs per variant per task): no such
  failure. with_skill passed expect_2 on quiz-001 3/3 and expect_4 on goal-001
  3/3, and so did no_skill — 12/12 across both tasks and both variants. Every
  run reconstructed initiate -> prove -> finalize from its own knowledge or from
  a live docs check; quiz-001 with_skill run 1 went further and used viem's
  getTimeToProve rather than pinning a number.

  So the gap is real in the text but costs nothing on this model: the executor
  already knows the OP Stack exit shape, and the skill's missing Celo row does
  not lead it astray. The value of adding the row is insurance against a weaker
  executor and against the reader who trusts L34's '7 days' as a single wait,
  not a measured regression. Keep the record open, drop the priority.

  Fixed by the minimal rewrite (branch skill/l2s-minimal). The skill now states
  the exit as three transactions across two chains — initiate on the L2, prove
  on L1 once an output root or dispute game covering the block is posted,
  finalize on L1 after the challenge window — says both L1 steps are submitted
  by the operator or their tooling, and says the clock starts at prove. The
  missing Celo row is moot: the per-chain bridging table is gone, and Celo's
  route and window are stated in the same section.

  Read the next numbers accordingly. This was a verdict-flipping marker on
  quiz-001 expect_2 and goal-001 expect_4 precisely because the skill did not
  carry the fact; it now does, so a with_skill pass there stops being evidence
  about the model and a with_skill failure becomes a much stronger signal. The
  2026-08-20 result stands as the pre-edit baseline: 12/12, both variants,
  reconstructed unaided.
