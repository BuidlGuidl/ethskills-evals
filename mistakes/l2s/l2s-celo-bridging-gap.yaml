symptom: "The skill lists Celo as an OP Stack optimistic rollup and its selection guide routes mobile / real-world payments there, but the Bridging section has rows for Arbitrum, Base, Optimism, Unichain, zkSync and Scroll and no Celo row. The skill also never says anywhere that an OP Stack L2-to-L1 exit is a multi-step process: prove, finalize, output roots and L2ToL1MessagePasser do not appear in the document. A reader gets 'Celo | Optimistic (OP Stack) | 7 days' (L34) and 'deploy like mainnet, just change RPC URL and chain ID' (L113), and writes a withdrawal runbook with one bridge transaction and a 7-day wait."
expected_pattern: "Add a Celo row to the official-bridges table, and state the OP Stack exit as the three operator-submitted steps it is: initiate on L2 via L2ToL1MessagePasser, prove on L1 once a dispute game covering the block has been posted, finalize on L1 after the challenge period. Celo's own specs say it works 'the same as on OP chains that use ETH as the native token', so the mechanics generalise across every optimistic row in the table, not just Celo."
