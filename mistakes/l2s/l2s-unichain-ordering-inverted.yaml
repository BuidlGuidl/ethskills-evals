frequency:                     # no runs yet — found auditing skill facts while drafting tasks
  no_skill: n/a
  with_skill: n/a
source: pre-run fact audit (PR for tasks/l2s-*)
category: wrong-skill-fact
symptom: "SKILL.md says Unichain orders transactions 'by time received, NOT gas price' and instructs 'Do NOT use gas-price bidding strategies on Unichain — they're pointless'. It is the other way round: Unichain's TEE enforces priority ordering, i.e. transactions are ordered by the priority fee they pay. Uniswap's own post announcing Rollup-Boost on mainnet says 'the TEE orders transactions based purely on priority fees'. A run following this line drops priority fees on the one chain where they are the whole ordering rule."
expected_pattern: "State Unichain's rule as priority-fee ordering enforced inside a TEE — deterministic and provable, with a private mempool and revert protection, which is what removes the MEV auction, not the fee. Say what the fee buys rather than telling builders to stop paying it."
skill_section: "Where the common prior is wrong -> Unichain orders by priority fee"
status: fixed
notes: |
  Same section, second staleness: it puts Unichain at 1s blocks with 250ms
  sub-blocks on the roadmap. Flashblocks are live and confirm every 200ms
  (blog.uniswap.org/flashblocks-are-live).

  No eval task grades this claim. The skill states the rule backwards and states
  it nowhere else, so a with_skill run has no correct line to reach: an expect
  written against reality fails every run that trusts the skill, and the number
  measures the rot rather than the model. That is what separates this from
  l2s-base-superchain-contradiction, which l2s-quiz-003 does grade — there the
  skill carries the fact correctly in one place and contradicts it in another,
  so a with_skill run can pass by reading the right line and a failure localises
  to the selection table. Fix this line and the claim becomes gradable.

  Fixed by the minimal rewrite (branch skill/l2s-minimal). The line now states
  the rule the right way round — the TEE (Rollup-Boost) enforces priority-fee
  ordering deterministically, with a private mempool and revert protection; the
  fee buys the position and what the TEE removes is the auction around it — and
  the "do NOT use gas-price bidding strategies, they're pointless" instruction
  is deleted. Flashblocks are stated as live at ~200ms rather than as a roadmap
  item.

  The eval consequence is the point: with the skill no longer stating the rule
  backwards, this claim becomes gradable, and the 2026-08-20 report names a
  Unichain ordering task as one of the two additions that would give this
  benchmark a second discriminator. That task does not exist yet — draft it
  with the human per the AGENTS.md interview before the re-run.
