symptom: "SKILL.md says Aerodrome and Velodrome 'merged into a single cross-chain DEX called Aero' in November 2025, 'same contracts, new brand', and its dominant-DEX table lists Base and Optimism under the Aero name. The merger was announced then, not completed: as of 2026-07-31 aero.xyz still reads 'Aero is on the horizon', the launch is targeted for September 2026 after a public audit contest, and no AERO/VELO consolidation has landed. A run trusting this treats Aero as the live brand and VELO as historical, which is backwards on Optimism today."
expected_pattern: "Date protocol migrations by state, not by announcement: 'announced Nov 2025, not yet launched as of <date>, migration window open, AERO/VELO consolidation lands at launch', and send the reader to the protocol's own contracts list for what is live now."
skill_section: "What You Probably Got Wrong (Aero paragraph) and Dominant DEX Per Chain table"
status: open
notes: |
  Schedule per the protocol's own post, re-read 2026-07-31
  (https://aero.xyz/articles/aero-is-on-the-horizon/): codebase public 3 Aug,
  final audit round through 21 Aug, public audit contest 24 Aug - 11 Sep, "we
  expect the full Aero to launch in September following the contest results",
  final target to be confirmed post-audit. News coverage claiming a July 2026
  launch is stale — take the date from the protocol, not the aggregators. That
  schedule is single-sourced to the protocol's own post and review has since
  reported the host unreachable, so re-check it before relying on the dates;
  addresses-quiz-004's run-day gate already does.

  Same fact as [[addresses-aero-merger-tense]], which flagged these two l2s
  locations as untracked copies; this record is that tracking. The third copy,
  skills/building-blocks L16 and L169, is [[building-blocks-aero-merger-tense]].
  skills/addresses has since dropped the merger entirely and its record is
  closed, so these two are what is left to fix.

  The tense is the error, not the steer — Aerodrome does lead Base by routed
  volume, and reflex-defaulting to Uniswap on Base is still the failure the
  paragraph exists to prevent. See
  mistakes/addresses/addresses-base-dominance-metric.yaml for the metric.

  Not graded by any l2s task: addresses-quiz-001, addresses-goal-001 and
  building-blocks-quiz-001 already grade the venue instinct, and both names pass
  there.
