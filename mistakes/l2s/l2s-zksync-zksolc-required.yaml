symptom: "SKILL.md's ZK rollup gotchas say ZKsync Era 'must use zksolc compiler. No EXTCODECOPY (compile-time error). 65K instruction limit.' Era now ships an EVM bytecode interpreter, and ZKsync's docs state that for most new development standard Ethereum tooling can be used directly, with zksolc/EraVM tooling described as the legacy path. A run trusting this line adds a compiler migration to an estimate that no longer needs one."
expected_pattern: "Say which execution path the constraint belongs to: contracts compiled to native EraVM still go through zksolc and inherit its restrictions, while standard solc bytecode deploys through the EVM interpreter. Give the tradeoff (native EraVM is cheaper, the interpreter is compatible) instead of a blanket 'must use zksolc'."
skill_section: "Deployment Differences -> ZK Rollups -> zkSync Era"
