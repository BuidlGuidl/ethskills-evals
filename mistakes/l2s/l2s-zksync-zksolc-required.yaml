source: pre-run fact audit (PR for tasks/l2s-*)
category: scope-error
symptom: "SKILL.md's ZK rollup gotchas say ZKsync Era 'must use zksolc compiler. No EXTCODECOPY (compile-time error). 65K instruction limit.' The constraints are real, but they belong to one of two execution paths rather than to the chain: Era now ships an EVM bytecode interpreter, so standard solc bytecode deploys through stock Foundry and Hardhat with none of them applying. What is wrong is the blanket 'must'. A run trusting the line as written adds a compiler migration to an estimate that may not need one."
expected_pattern: "Say which execution path the constraint belongs to: contracts compiled to native EraVM still go through zksolc and inherit its restrictions, while standard solc bytecode deploys through the EVM interpreter. Give the tradeoff (native EraVM is cheaper, the interpreter is compatible) instead of a blanket 'must use zksolc'."
skill_section: "Deployment Differences -> ZK Rollups -> zkSync Era"
status: open
notes: |
  Checked 2026-07-31 against docs.zksync.io (ZKsync Era custom tooling, EVM
  bytecode interpreter). The Atlas upgrade / ZKsync OS pushes further toward
  full EVM equivalence but is a developer-preview testnet, so it is the
  interpreter, not Atlas, that dates this line.

  EraVM is not deprecated — an earlier draft of this record said so and it is
  wrong. ZKsync still presents native EraVM compilation as the primary and
  cheaper path; what carries the legacy label is the old custom plugin suite,
  not the VM. EXTCODECOPY and the 65K instruction limit still apply when
  compiling to native EraVM. The skill's line is scoped wrong, not false.

  Not graded by any l2s task, for the same reason as
  l2s-unichain-ordering-inverted: the skill's text is the wrong answer and it
  appears nowhere in corrected form, so an expect against reality only measures
  the rot. Contrast l2s-base-superchain-contradiction, where the skill also
  states the fact correctly — that one l2s-quiz-003 grades.
