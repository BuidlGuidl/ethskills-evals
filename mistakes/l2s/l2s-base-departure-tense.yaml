mistake_id: l2s-base-departure-tense
skill: l2s
first_seen: 2026-08-20
frequency:
  no_skill: 0/3
  with_skill: 2/3
source: l2s-quiz-003 (claude/claude-opus-5, 3 runs per variant)
category: stale-skill-fact
symptom: "SKILL.md says Base 'announced they are leaving the Superchain in February 2026 and it will be finalized in a future hardfork'. The hardfork has landed: base/node v0.16.0 (2026-05-22) dropped every client except base-reth-node and base-consensus for the Azul mainnet deadline of 2026-05-28, Base's engineering blog says Azul 'established the Base Stack as a new foundation for the chain' with Reth 'now the sole client used by Base since Azul', and Beryl — Base's second independent upgrade, with its own B20 token standard and its own 7-day to 5-day withdrawal change — activated 2026-06-25/26. Two of three with_skill runs reproduced the skill's future tense verbatim: 'Base announced ... to be finalized in a future hardfork.'"
expected_pattern: "State the separation as underway on mainnet, not pending: announced 2026-02-18, Base's own client and upgrade cadence live since Azul (May 2026), Beryl (June 2026) shipping Base-specific changes. Keep the part that still holds — Base remains an Ethereum L2, chain id, addresses, deployments and canonical bridge unchanged — because that is what stops a reader overcorrecting."
skill_section: "Where the common prior is wrong -> Base is no longer on the OP Stack"
status: fixed
notes: |
  Ungraded by design and by luck. quiz-003's expect_2 grades that the departure
  is named at all, which the stale tense still satisfies, and expect_4's
  'already left' clause was dropped on run day precisely because the separation
  had become true (see the RUN-DAY GATE RESOLVED block in tasks/l2s-quiz-003).
  So all three with_skill runs passed 5/5 while two of them carried a stale
  tense into a Q4 architecture decision.

  It is not costless in the field even though it is costless here: a team told
  the exit is "a future hardfork" may plan for a shared-stack window that has
  already closed. Fix the tense and the claim stays gradable — unlike
  l2s-unichain-ordering-inverted, the skill has the fact, just dated wrong.

  Sits alongside l2s-base-superchain-contradiction, which is about the same
  paragraph disagreeing with the selection table. Both land in one edit.

  Fixed by the minimal rewrite (branch skill/l2s-minimal, from the 2026-08-20
  findings). The paragraph now reads "announced February 2026 and live on
  mainnet since the Azul upgrade (May 2026)", names the Base Stack and
  base-reth-node, and names Beryl (June 2026) as a second independent upgrade.
  The overcorrection guard the record asked to keep is in the same paragraph:
  still an Ethereum L2, chain id 8453, addresses, deployments and canonical
  bridge unchanged.

  Not yet re-run. The tense was ungraded in the 2026-08-20 benchmark — quiz-003
  expect_2 grades only that the departure is named — so nothing in the pass
  counts will move; what a re-run checks is that the two with_skill runs which
  echoed "to be finalized in a future hardfork" no longer have that line to
  echo.
