symptom: "SKILL.md records Base's February 2026 announcement that it is leaving the Superchain, but the rest of the document still reads as though Base is in it: the selection guide answers 'multi-chain deployment' with 'Base or Optimism — Superchain / OP Stack, shared infra', and the Superchain section's '17+ chains, 58.6% L2 market share' counts Base's share. A reader who hits the table first — it sits above the Superchain section — designs Base<->OP Mainnet coupling on shared-stack features that are being unwound."
expected_pattern: "Propagate the departure to every place it changes an answer: drop Base from the multi-chain row (or qualify it), restate the market-share figure without Base or date it, and say what the exit does and does not change — Base stays an Ethereum L2 on a near-identical OP-derived stack; what goes is the shared governance and interop roadmap."
skill_section: "L2 Selection Guide table and The Superchain (OP Stack)"
status: open
notes: |
  Checked 2026-07-31: announced 2026-02-18, Base migrating to its own client and
  stack ahead of upcoming hard forks (Coinbase blog; Unchained; The Block). The
  "~99% shared code" figure attributed to Optimism has no primary source
  located — treat it as unverified. Superchain interop itself is still
  testnet/devnet with no committed mainnet date (docs.optimism.io/interop), so
  the skill's "designed but not yet fully live" holds.

  l2s-quiz-003 grades the departure. Run 2026-08-20 (claude/claude-opus-5, 3
  runs per variant): with_skill passed expect_1 and expect_2 3/3, so the
  contradiction cost nothing — all three runs reached the Superchain paragraph
  and named the departure rather than stopping at the selection-table row. The
  frequency above records that. The contradiction is still real in the text and
  still worth fixing; what this run establishes is that it is a latent defect,
  not an active one, so it does not need to gate the more urgent tense fix in
  l2s-base-departure-tense.

  The same run makes the paragraph's value concrete from the other side:
  no_skill failed expect_2 3/3 (l2s-base-departure-model-blindspot), so this one
  line is carrying the entire measured benefit of skills/l2s in this benchmark.
