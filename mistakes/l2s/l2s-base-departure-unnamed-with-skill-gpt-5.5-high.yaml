mistake_id: l2s-base-departure-unnamed-with-skill-gpt-5.5-high
skill: l2s
first_seen: 2026-09-23
frequency:                     # l2s-quiz-003 expect_2 failures, per arm
  codex/gpt-5.5-high:          # major-refine-d9952522, 3 runs per arm
    no_skill: 0/3
    with_skill_2f0adb01: 1/3
    with_skill_d9952522: 1/3
source: l2s-quiz-003 (codex/gpt-5.5 high executor, benchmark major-refine-d9952522)
category: fact-read-not-surfaced
symptom: "A with_skill run reads SKILL.md, which states Base's departure from the OP Stack (the rewrite's first paragraph under 'Where the common prior is wrong'; the old text's Superchain section), and correctly keeps Superchain interop off the Q4 path. But when it lists what the design assumes about Base and OP Mainnet, it never names the departure. The new-text run (203804Z) writes only 'Base should not be treated as sharing OP Mainnet's stack/governance assumptions' and 'I am not assuming they are one shared OP Stack/Superchain execution environment'. The old-text run (205150Z) writes 'Assuming Base and OP Mainnet will remain in the same native interop dependency set'. All three no_skill runs named it unaided, from live search of blog.base.dev ('Base has publicly said it is moving away from the OP Stack distribution')."
expected_pattern: "When the prompt asks what the design assumes about the two chains, state the fact itself: Base has left the OP Stack / Superchain and runs its own Base Stack and client, so a Base <-> OP Mainnet design cannot rest on shared-stack features. The hedge that 'we should not assume they share a stack' is not the same statement."
skill_section: "Where the common prior is wrong -> Base is no longer on the OP Stack"
status: open
notes: |
  The opposite of what [[l2s-base-departure-model-blindspot]] measured on
  claude/claude-opus-5, where no_skill missed the departure (3/3 on 2026-08-20,
  2/3 on the major-refine Opus row) and both skill arms named it every time.
  On GPT 5.5 high the unaided model found it by web search in all three no_skill
  runs. The two with_skill misses both read the fact and then paraphrased it into
  a softer non-assumption. Neither run searched for the departure.

  The new-text miss is borderline. "should not be treated as sharing OP
  Mainnet's stack/governance assumptions" is close to "Base runs its own stack",
  which the line accepts. The judge failed it. Raised on #119 as a rubric
  question; the grade stands because the rubric is pinned.

  Weak evidence: one run per skill arm. No skill edit recommended at n=1. If it
  repeats, the fix is wording that the reader copies verbatim ("Base has left
  the Superchain") rather than wording it can paraphrase away.
