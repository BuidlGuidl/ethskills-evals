mistake_id: l2s-celo-exit-window-composite
skill: l2s
first_seen: 2026-08-24
frequency:                     # runs caught the skill out; none was misled
  no_skill: n/a
  with_skill: 0/6
source: l2s-quiz-001 + l2s-goal-001 (claude/claude-opus-5, 3 runs each, skill a3df027)
category: wrong-skill-fact
symptom: "The minimal rewrite replaced the old table's flat '7 days' for Celo with 'a challenge duration of about 3.5 days'. Both mislead, for opposite reasons. Celo's exit is gated twice and the later gate wins: proofMaturityDelaySeconds on the portal is 604,800 (7 days measured from the operator's prove transaction), while the OP Succinct game's maxChallengeDuration is 302,400 (3.5 days) with a further disputeGameFinalityDelaySeconds of 302,400 after the game resolves - so the game path is also ~7 days from game creation. A runbook built on '3.5 days' schedules the finalize step three and a half days early."
expected_pattern: "State the exit window as composite and name both gates, or state no number and send the reader to the portal. For Celo: ~7 days effective, from proofMaturityDelaySeconds (604,800) or from challenge + finality delay, whichever falls later; 3.5 days is maxChallengeDuration quoted on its own."
skill_section: "Exiting to L1"
status: fixed
notes: |
  Found by the regression run, not by an audit, and found the hard way round:
  the skill's own instruction to read the figure live is what caught its own
  stated figure. All six Celo runs measured the parameters off the portal and
  contradicted the skill in the deliverable rather than inheriting it -
  quiz-001 with_skill 1 wrote "Anything claiming Celo's exit is '~3.5 days' is
  quoting maxChallengeDuration alone and is wrong. Plan for 7", and backed it
  with an end-to-end measurement on a live withdrawal (0x8039c7ea...3588,
  initiated 2026-08-24 13:03 UTC, finalizable 2026-08-31 14:16 UTC = 7.07
  days). goal-001 runs 1-3 all put proofMaturityDelaySeconds = 604,800 in
  NOTES.md and scheduled finalize at prove + 7d.

  So the measured cost is zero - 0/6 carried the wrong figure into a
  deliverable - and the record exists because the next reader might not
  measure. That is the whole argument for the "read it live" line staying
  next to any number the skill states.

  Ungraded, like the figures it corrects: l2s-quiz-001 expect_3 and
  l2s-goal-001 expect_5 grade the order of magnitude (days), which 3.5 and 7
  both satisfy. Deliberately not tightened - see those tasks' notes for why an
  expect pinned to a dispute-game parameter grades the chain's config rather
  than the answer.

  Fixed in skills/l2s the same day (SKILL.md "Exiting to L1"), and re-run:
  see reports/l2s-with-skill-2026-08-24.md for the three quiz-001 runs against
  the corrected line. Supersedes the 3.5-day half of
  mistakes/l2s/l2s-celo-chain-params-stale.yaml, whose other claims (1s block
  time, drop the finality column) stand.
