mistake_id: l2s-zkevm-replacement-chain-deferred
skill: l2s
first_seen: 2026-09-21
frequency:
  claude/claude-opus-5:
    no_skill: 2/3
    with_skill_2f0adb01: 2/3
    with_skill_d9952522: 0/3
category: decision-deferred
symptom: "Told the chain their product runs on has stopped producing blocks, the run correctly refuses to build the Q3 feature work on Polygon zkEVM but never commits to a replacement. It hands back a candidate list and a criteria checklist instead — 'Candidates: Base, Arbitrum One, OP Mainnet, or Polygon PoS if you want to stay in the Polygon ecosystem' plus 'native stablecoin liquidity / L2BEAT stage / a documented deprecation policy / fees' (no_skill run 1), and a four-row options table closing on 'Choose based on where merchants want to receive funds and your on/off-ramp' (with_skill 2f0adb01 run 1). The migration is the whole Q3 plan, so a deferred chain pick leaves the plan unschedulable, which is what expect_2 of l2s-quiz-002 grades."
expected_pattern: "Name one replacement chain and say why, from the constraint that actually binds this product (stablecoin payouts to merchants who may hold no gas token, a direct fiat on-ramp, no multi-day exit), then schedule the migration against it. Offer the alternative as a branch off a stated condition, not as an undecided list."
skill_section: "Choosing a chain"
status: fixed
notes: |
  Closed by the minimal rewrite's selection table, which is keyed on the binding
  constraint rather than on a TVL ranking: all three d9952522 runs answer with a
  chain and a reason (run 3 'My recommendation: Base' with native USDC and
  merchant on/off-ramp; runs 1 and 2 with a constraint-to-chain rule that the
  judge accepted). The old 187-line text had no such table and did no better than
  no_skill here.
