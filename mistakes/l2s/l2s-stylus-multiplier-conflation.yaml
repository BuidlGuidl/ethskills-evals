mistake_id: l2s-stylus-multiplier-conflation
skill: l2s
first_seen: 2026-08-20
frequency:
  no_skill: 1/3
  with_skill: 1/3
source: l2s-quiz-004 (claude/claude-opus-5, 3 runs per variant)
category: wrong-skill-fact
symptom: "SKILL.md advertises Stylus as '10-100x gas savings' (L73, L125). The underlying RedStone benchmarks report 10-100x on execution speed and roughly 26-50% on gas against optimised EVM code, so the figure is a speed number wearing a gas label. One with_skill run repeated it as cost — 'filtering and resampling an hour of samples is 10-100x cheaper than the equivalent EVM work' — and, notably, one no_skill run produced the same conflation unprompted ('roughly 10-100x cheaper'), so the skill is reinforcing a prior the model already holds rather than creating it."
expected_pattern: "Split the two metrics where the claim is made: Stylus is roughly 10-100x faster on execution for memory- and compute-heavy work, and saves on the order of 26-50% of gas against heavily optimised EVM code, with storage priced the same as the EVM. Cite the benchmark rather than carrying a bare multiplier."
skill_section: "L2 Selection Guide (Rust row) and Deployment Differences -> Arbitrum-Specific"
status: open
notes: |
  Deliberately ungraded: no expect in l2s-quiz-004 turns on a multiplier in
  either unit, so all six runs passed 5/5 regardless of whether they quoted one.
  The task notes asked for this to be recorded rather than scored, and the
  even 1/3 vs 1/3 split is the reason that was the right call — an expect
  against the number would have measured the model's prior, not the skill.

  A third run's '10-100x' was about sample volume growth, not gas, and is not
  counted here.

  What the runs did get right is the part that matters for the decision: all
  six picked Arbitrum for Stylus on the reuse-the-Rust argument, named the
  activation transaction, and kept the reward contract's call path onchain.
  The multiplier is decoration on a correct recommendation, which is exactly
  why it can rot unnoticed.
