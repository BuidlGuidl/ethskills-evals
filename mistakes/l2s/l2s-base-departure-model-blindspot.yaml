mistake_id: l2s-base-departure-model-blindspot
skill: l2s
first_seen: 2026-08-20
frequency:
  no_skill: 3/3
  with_skill: 0/3
source: l2s-quiz-003 (claude/claude-opus-5, 3 runs per variant)
category: stale-knowledge
symptom: "Asked to design a Base <-> OP Mainnet token and to state what the design assumes about the two chains, a no_skill run never raises Base's departure from the OP Stack / Superchain. All three runs instead assert the opposite as a stability assumption: run 1 wrote 'Both chains track the same OP Stack hardfork schedule. Today they upgrade together under the Superchain schedule, which is what makes one bytecode at one address on both chains safe.' That is false as of 2026 — Base has run Azul (May) and Beryl (June) as its own independent upgrades on its own client — and it is exactly the assumption the prompt asked them to examine."
expected_pattern: "When a design couples two chains, check whether they still share the governance and upgrade arrangement the coupling rests on. Base announced its move off the OP Stack in February 2026 and has since shipped independent hardforks; a Base<->OP Mainnet design cannot assume a shared schedule or shared-stack messaging."
skill_section: "Where the common prior is wrong -> Base is no longer on the OP Stack"
status: open
notes: |
  The cleanest delta in the whole l2s benchmark: quiz-003 with_skill 3/3 vs
  no_skill 0/3, and every no_skill failure is expect_2 alone — all three got
  interop status (expect_1), the concrete Q4 design (expect_3), the
  no-overcorrection line (expect_4) and CREATE2 determinism (expect_5) right.
  The one thing they could not supply from their own priors was the departure.

  All three with_skill runs named it, sourced from the skill's Superchain
  paragraph. None was misled by the contradictory selection-table row that
  mistakes/l2s/l2s-base-superchain-contradiction.yaml predicted might bite, so
  that record's frequency is with_skill 0/3 — the contradiction is real in the
  text but did not cost a run here.

  Live-search did not rescue the no_skill runs: they had network access and
  used it for interop status, but never thought to question the Superchain
  membership premise, because nothing in the prompt flags it as questionable.
  That is what makes this a knowledge gap rather than a research failure, and
  why the skill's one-line statement of the fact is worth its weight.

  Stays open: this is a gap in the model, not a defect in the skill, and only a
  re-run on a later model closes it.

  Carried through the minimal rewrite deliberately (branch skill/l2s-minimal).
  That rewrite cuts skills/l2s from 187 lines to 51 — the cost tables, the
  comparison table, the RPC and explorer lists, the dominant-DEX table and the
  Further Reading block all go, because the 2026-08-20 benchmark measured no
  value in any of them. This paragraph is the exception: it is the only content
  in the skill with a measured delta (quiz-003, 3/3 vs 0/3, one expect line), so
  it survives in full and gets its tense fixed rather than being trimmed. If a
  future minimization pass looks for more to cut, cut around this.

