symptom: >-
  Assumes Forkcast bulk JSON responses are top-level arrays and applies jq .[]
  or array slicing before inspecting their object envelopes, producing exit-5
  errors and follow-up shape-discovery calls.
expected_pattern: >-
  Read /llms.txt, inspect the response type and keys once, then select the actual
  collection (such as .eips, .upgrades or .calls); reuse that response instead of
  fetching it again for each guessed shape. Prefer per-EIP endpoints for a few EIPs.
skill_section: Check its current fork relationship on forkcast
status: open
notes: >-
  Counts combine both protocol tasks on this stack and count runs, not commands.
  Observed on new quiz 1 and 3, new goal 1/2/3, and old goal 3. Every affected run
  recovered and passed the pinned rubric. These are executor query mistakes, not
  network outages or dead-sandbox failures. None of the no_skill runs used the
  Forkcast JSON API, so its zero rate is not evidence of better API handling.
  No causal attribution of the overall cost delta to these calls is claimed.
