notes: |
  The mistake is stack-dependent, which is why the rate is split rather than averaged: a
  single no_skill figure would read as 4/6 and describe neither stack. On codex it is the
  default — all three no_skill runs stopped at a read side that only ever ran locally,
  failing both expect_5 (any production run story) and expect_6 (a named target). On
  claude only one no_skill run missed, and it missed on expect_6 alone: supervised
  processes, persistent volume, Postgres to scale, and nowhere to put them. The skill
  closes it on both stacks, 0/3 either way.

  major-refine-d9952522 (claude-opus-5 at medium, 2026-09-24): every no_skill run missed,
  and on expect_6 alone again. All three built a Ponder indexer with a real production
  story (`npm run start`, Postgres via DATABASE_URL, a new DATABASE_SCHEMA per deploy,
  /ready as the readiness probe) and then left the host unnamed ("your host's dashboard") — the same shape
  as the 2026-08-19 miss, now 3/3 rather than 1/3. Both skill texts closed it, 0/3 each:
  the old text's runs all built a subgraph and published it via Subgraph Studio to The
  Graph's decentralized network; the new text's runs all built Ponder, like no_skill, and
  named Railway (with Fly.io or a systemd unit on a VM as alternatives in two of them).
