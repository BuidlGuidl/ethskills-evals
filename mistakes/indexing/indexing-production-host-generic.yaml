mistake_id: indexing-production-host-generic
skill: indexing
first_seen: 2026-09-23
source: indexing-goal-001 (graded expect_6 while expect_5 passes)
frequency:                          # major-refine-d9952522, judge claude-opus-5 high; e5 pass + e6 fail
  codex/gpt-5.5-high@2f0adb01:      # old arm (first vendored 318-line text)
    no_skill: 0/3                   # all three no_skill runs fail expect_5 too, so they sit in indexing-read-side-deploy-omitted
    with_skill: 1/3
  codex/gpt-5.5-high@d9952522:      # new arm; same no_skill draws
    no_skill: 0/3
    with_skill: 3/3
category: deployment-planning
symptom: >-
  README has a real production section for the read side (a start command, a long-lived
  worker, Postgres as the store) but describes its home by kind rather than by name, so a
  reader cannot tell where it is deployed. New arm, all three:
  2026-09-23T174931Z-codex-with-skill-d9952522-1 (Ponder) "Host this as one continuously
  running worker/API process on a platform that supports Node.js and Postgres";
  2026-09-23T181724Z-codex-with-skill-d9952522-2 (custom worker) "run `npm run start:indexer`
  as a long-lived worker service with a persistent Postgres database … Use managed Postgres
  or an equivalently durable database";
  2026-09-23T185101Z-codex-with-skill-d9952522-3 (custom worker) "one worker service running
  `npm run indexer`; one managed Postgres instance with backups". Old arm:
  2026-09-23T183954Z-codex-with-skill-2f0adb01-3 (Ponder) "Run Ponder in production with a
  persistent Postgres database". No platform (Railway, Fly, Render, a VM with systemd, Graph
  Node, a provider API) appears anywhere in the three new-arm transcripts or output trees.
  new-2's own closing summary says "the production service commands are named explicitly":
  it read naming the command as naming the home.
expected_pattern: >-
  Name the host the indexer and its store run on — Subgraph Studio then the network, a
  self-hosted Graph Node, or a named platform (e.g. a Railway service + Railway Postgres, a
  Fly machine with a volume, a systemd unit on a named VM) — next to the command that starts it.
skill_section: >-
  "The read side is not designed until its production home is named. Decide where the
  indexer runs in production and by which command or service" (fourth paragraph), and the
  frontmatter description
status: open
notes: >-
  The body paragraph never shows what a named self-hosted home looks like; its only concrete
  targets are The Graph's, and its "the host, the persistent store and the process
  supervision are yours to name" hangs off the self-hosting sentence without an example. All
  three new-arm runs self-hosted (Ponder or a custom worker) and so got no concrete target
  from the text. Every Ponder/custom-worker run in either skill arm failed expect_6; the one
  pass (old-2) was a subgraph. Hypothesis, not a finding: the three 2026-08-20 codex
  (gpt-5.6-terra) with_skill runs on dc771ad, whose SKILL.md body is byte-identical to
  d9952522, all named a platform and passed expect_6 (two a Railway service with Railway
  Postgres, one "for example Render, Fly.io, or ECS"). The only text difference is the
  frontmatter description, which then read "…and ship that read side to a named production
  home" and was rewritten as a trigger in #129 without that clause. The model differs too
  (gpt-5.6-terra vs gpt-5.5), so this does not separate the description from the model.
