mistake_id: tools-goal-npm-cache-breaks-judge
skill: tools
first_seen: 2026-09-20
frequency:
  codex/gpt-5.5:               # major-refine-d9952522, effort high
    no_skill: 0/3
    with_skill_2f0adb01: 0/3
    with_skill_d9952522: 2/5   # 2 of the 5 attempts needed to land 3 gradeable runs
source: tools-goal-001 (verify, not a graded expect line)
category: eval-design
symptom: >-
  A codex executor that cannot write npm's default cache re-points it into the
  workspace with `npm_config_cache="$PWD/.npm-cache"`. `.npm-cache` is not in
  GENERATED_DIRS, so the workspace's .git/info/exclude does not hide it, and
  `verify` snapshots it into `output/`: 600 files and 20M against the 8-10 files
  and ~100K a clean run leaves. The judge prompt goes in on stdin, and a snapshot
  that size kills it — `verify: judge failed: spawnSync env EPIPE`. The run is
  fine (exit 0, complete deliverable in src/, package.json and README.md); it
  simply cannot be graded, and re-running `verify` cannot help because the size is
  the problem. Hit twice on tools-goal-001, both times on the d9952522 arm, once
  during a disk-full episode and once with 11G free — so low disk makes it likelier
  but is not the cause.
expected_pattern: >-
  Add `.npm-cache` (and the other package-manager caches an executor may redirect
  into a workspace — `.yarn-cache`, `.pnpm-store`) to GENERATED_DIRS in
  lib/workspace.ts, so they are excluded from the snapshot the way node_modules
  already is. Failing that, `verify` should cap or summarise evidence rather than
  hand the judge a prompt that cannot be delivered.
skill_section: none
status: open
notes: |
  A harness defect surfaced by this skill's only goal task, not a model or skill
  failure. Recorded here because tools-goal-001 is where it reproduces; it will hit
  any goal task whose executor installs dependencies.

  Both occurrences were handled per AGENTS.md: the run was never graded, so it was
  deleted with its workspace and set up again under a new run id, and no grade was
  written over the failure. Cost of the two lost runs is real and is stated in
  reports/major-refine-tools-gpt-5.5-high.md.

  Note the interaction with "What gets committed": `output/` is force-added for
  question-shaped tasks so runs stay regradeable. A 20M snapshot is past what is
  reasonable to commit, so a run in this state is both ungradeable now and
  unauditable later — which is the argument for fixing it in GENERATED_DIRS rather
  than tolerating it.
