symptom: >-
  SKILL.md L53-62 ships a TypeScript sample importing `x402Fetch` from
  `@x402/fetch` and `createWallet` from `@x402/evm`, called as
  `x402Fetch(url, { wallet, preferredNetwork })`. Neither symbol exists in the
  2.x line the install line one paragraph above (L50) correctly tells you to
  install. `@x402/fetch` exports `wrapFetchWithPayment` and
  `wrapFetchWithPaymentFromConfig`; there is no wallet constructor in
  `@x402/evm` — you pass a plain viem account, or build a signer with
  `toClientEvmSigner`. L65's Go path `go get github.com/coinbase/x402/go` is
  stale the same way: the project moved to the x402 Foundation
  (github.com/x402-foundation/x402).
expected_pattern: >-
  Correct the sample to `wrapFetchWithPayment(fetch, account)` with a viem
  LocalAccount, and repoint Go at github.com/x402-foundation/x402/go/v2. The
  package scope on L50 is current and correct — only the code and the Go path rot.
skill_section: "x402 SDKs L53-62 (TypeScript sample) and L65 (Go path)"
status: open
notes: |
  Filed as a skill defect, not an executor mistake: no run reproduced it. All
  three with_skill quiz-001 runs installed the packages, read the actual exports,
  found the sample wrong, and said so in answer.md — one of them naming its own
  context as the source: "My in-house tools reference gives the right package
  names but a wrong code sample … Neither symbol exists in v2." Another wrote a
  standing warning: "two symbol names in circulation, x402Fetch and a createWallet
  export from @x402/evm, do not exist in 2.20.0. If you see them in a snippet,
  that snippet is wrong."

  That the model routinely verifies against npm is what contained this here, and
  it is not something to rely on: tools-quiz-001's input explicitly asks the
  executor to "confirm anything you install actually resolves today". A run under
  a prompt that does not ask for verification has no reason to open the package.

  Fix the sample before the next tools benchmark, then re-evaluate — with the
  install line already correct, this is a self-contained edit.
