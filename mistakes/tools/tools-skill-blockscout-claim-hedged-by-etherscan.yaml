mistake_id: tools-skill-blockscout-claim-hedged-by-etherscan
skill: tools
first_seen: 2026-09-20
frequency:
  claude/claude-opus-5:        # major-refine-d9952522, executor effort medium, n=3 per arm
    none: 3/3                  # Etherscan offered, MCP endpoint absent entirely
    old: 3/3                   # skill_version 2f0adb01 — named MCP, but offered Etherscan alongside
    new: 0/3                   # skill_version d9952522 — named MCP only
source: "tools-quiz-003, major-refine-d9952522 — output/answer.md across all nine runs"
category: skill-design
symptom: >-
  The first vendored tools skill lists read operations as "Blockscout MCP or
  Etherscan API" — co-equal, no stated preference — under "Tool Discovery
  Pattern", while asserting Blockscout MCP elsewhere. All three `with_skill` runs
  on that text named mcp.blockscout.com/mcp AND offered the Etherscan API
  alongside it in the same answer, reproducing the skill's own hedge. The check
  cannot see this: expect_1 only asks that an MCP endpoint be reached for, so all
  three pass. A reader of those answers still has to pick.
expected_pattern: >-
  State the preference outright and split the two cases: agent-native MCP at
  https://mcp.blockscout.com/mcp when the agent itself is the consumer, and a
  documented REST API when application code is. Not a list of equals.
skill_section: "Give agents structured onchain data"
status: fixed
notes: |
  Predicted by tasks/tools-quiz-003.yaml before it was measured. Its notes carry
  the tension verbatim — "expect_1 is stricter than the skill actually claims …
  a faithful with_skill run that reads the skill and picks Etherscan will fail
  expect_1, which reads as the skill losing" — and ask for a with_skill split to
  be reported rather than hidden. What actually happened is one step milder than
  the prediction and confirms the same diagnosis: no old-arm run picked Etherscan
  *instead* of MCP, so none of them failed, but 3/3 carried Etherscan alongside,
  which is the hedge surviving into the answer.

  Already fixed at the benchmark commit (d9952522): that text states the
  preference outright and splits agent-facing MCP from server-side REST, and all
  three `new` arm answers name Blockscout MCP with no Etherscan alternative
  offered — 0/3 against the old arm's 3/3. This record measures what the refine
  fixed; no edit is being asked for.

  tools-etherscan-instead-of-blockscout-mcp already carries a section-pointer note
  observing that the L22 "Blockscout MCP or Etherscan API" tension "no longer
  exists in the text". That note was written from reading the new text. This is
  the measurement behind it, on the old text, with a paired new arm — and it is
  the only place in this benchmark where the refine changes what an answer says
  while both arms pass every check.

  Cost note worth carrying together with this: tools-quiz-003 is the one task
  where the new arm costs *more* than the old ($0.24 / 100k / 6 turns vs $0.18 /
  60k / 4 turns). The un-hedged answer is not free — the new arm does more work
  to produce it. See reports/major-refine-tools-opus-5-medium.md.
