category: stale-knowledge
symptom: >-
  The first vendored tools skill gives the x402 Go module as
  `go get github.com/coinbase/x402/go`. Two of three `with_skill` runs on that
  text passed it straight into answer.md as the Go recommendation — one as
  "Other languages. Python `x402`, Go `github.com/coinbase/x402/go`", the other
  as a bare `go get github.com/coinbase/x402/go`. The path does not error: it
  silently resolves to a stale pre-Foundation commit, so nothing in the run
  surfaces the problem. Neither run verified it, and neither had any reason to —
  it is prose in the skill, not a code sample the executor installs and reads.
expected_pattern: >-
  For Go, `github.com/x402-foundation/x402/go/v2`, and say that the old
  `github.com/coinbase/x402/go` path resolves to a stale pre-Foundation commit
  rather than failing — the silence is the whole hazard.
skill_section: "Add inline HTTP payments"
status: fixed
notes: |
  The correction is already in the skill at the benchmark commit (d9952522),
  which is why the `new` arm carries this 0/3: its one run that mentions Go gives
  `github.com/x402-foundation/x402/go/v2` AND warns that the old path resolves
  stale without erroring. This record exists to measure the defect the refine
  fixed, not to ask for an edit.

  What makes it worth its own record rather than a line under
  tools-skill-x402-example-api-nonexistent: that record states "never reproduced
  by an executor — all 6 with_skill runs caught it", and for the *API symbols*
  that held again here. Every mention of `x402Fetch` or `createWallet` across all
  six skill-arm quiz-001 runs in this benchmark is a warning that they do not
  exist, never an endorsement — the executors install the packages, read the
  exports, and contradict the skill. The Go path is the half of that record that
  behaves differently, and it had never been measured: an executor building a
  TypeScript client has no reason to `go get` anything, so the stale string is
  copied out without ever being checked.

  The general lesson is worth keeping beyond x402: a wrong *code sample* in a
  skill gets caught, because the run installs the package and reads the types; a
  wrong *package path in prose* does not, because nothing in the task makes the
  run resolve it. Verification pressure only covers what the task actually
  exercises.
