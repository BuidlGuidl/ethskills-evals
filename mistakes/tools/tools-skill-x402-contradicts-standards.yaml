mistake_id: tools-skill-x402-contradicts-standards
skill: tools
first_seen: 2026-08-31
frequency:
  no_skill: n/a
  with_skill: n/a
source: "skills/tools/SKILL.md:54-58 and :65 — found in review of #92; skill defect, not measured by a run"
category: stale-knowledge
symptom: "The tools skill's x402 section teaches exactly the symbols the corrected standards skill tells the reader to unlearn: `import { x402Fetch } from '@x402/fetch'` and `const wallet = createWallet(privateKey)` from '@x402/evm', as a working code example. It also gives the Go module as `github.com/coinbase/x402/go`. Neither symbol exists in the scoped 2.x packages and the Go path has moved. The two skills ship together on ethskills.com, so an agent that loads tools is handed as a working example the exact API standards says does not exist."
expected_pattern: "@x402/fetch exports wrapFetchWithPayment and wrapFetchWithPaymentFromConfig (taking an x402 client, not a bare wallet); @x402/evm exports ExactEvmScheme and toClientEvmSigner, no wallet factory; Go lives at github.com/x402-foundation/x402/go/v2. Per the resolution already reached for the standards skill, do not pin a call signature the reader can read live from the installed .d.ts — name the entry points and defer."
skill_section: "x402 (client example and language/package list)"
status: fixed
notes: |
  Same defect as standards-skill-x402-example-api-nonexistent, in a second skill,
  and not fixed when that one was. It was verified there against the published
  packages on 2026-08-26 at 2.23.0, and independently in the #92 review against
  npm (unscoped x402 frozen at 1.2.0, scoped at 2.24.0, no x402Fetch and no
  createWallet in either).

  Filed rather than fixed: PR #92 is the standards benchmark, and editing the
  tools skill there would ship an unbenchmarked change to a second skill under a
  PR titled for a third. Fix it in its own PR, where tools-goal-001 can measure
  the change. Note the same PR is where tools-eval-rejects-current-create-eth-pin
  and the @coinbase/x402 rejection (issue #1) already point.

  Cross-skill contradiction is the part worth tracking beyond the stale API: two
  skills shipped as one set now give opposite instructions on the same import,
  and nothing in the repo detects that. A consistency check across skills — same
  package, conflicting symbols — is worth considering once this is fixed.

  Fixed as of the major-refine benchmark commit (d9952522). The skill no longer
  ships the `x402Fetch` / `createWallet` sample at all: it names both as symbols
  that "do not exist in the scoped packages", says that passing a wallet or
  account straight to `wrapFetchWithPayment` is the frozen v1 call shape, and
  defers to the installed types rather than pinning a signature. Go is repointed
  to `github.com/x402-foundation/x402/go/v2` with an explicit note that the old
  `coinbase/x402/go` path resolves stale without erroring. That is the form of
  the correction the standards resolution asked for, and it removes the
  cross-skill contradiction this record was opened for.

  Measured on 2026-09-20 (major-refine-d9952522, claude/claude-opus-5 at effort
  medium, 3 runs per arm). The API half never reached an answer in either skill
  arm: every mention of `x402Fetch` or `createWallet` across all six skill-arm
  tools-quiz-001 runs is a warning that the symbol does not exist, in the old arm
  as well as the new one — the executors install the packages and read the
  exports, exactly as tools-skill-x402-example-api-nonexistent records.

  The Go half did NOT survive that scrutiny on the old text: 2/3 old-arm runs
  copied `github.com/coinbase/x402/go` into answer.md as the Go recommendation,
  against 0/3 on the new text. Filed as tools-stale-go-module-path-propagated,
  which is the measurement behind closing this record. See
  reports/major-refine-tools-opus-5-medium.md.
