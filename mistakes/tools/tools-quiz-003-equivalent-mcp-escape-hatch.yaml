source: tools-quiz-003 expect_1
category: eval-design
symptom: >-
  tools-quiz-003 expect_1 reads "Blockscout MCP at mcp.blockscout.com/mcp (or a
  clearly-equivalent MCP endpoint)". The parenthetical is doing more work than the
  task notes assume. Two of three no_skill runs answered "GoldRush by Covalent,
  preferably through the GoldRush MCP server", wiring
  `@covalenthq/goldrush-mcp-server`; the judge read that as a clearly-equivalent
  MCP endpoint and passed expect_1. So the no_skill column reads 2/3 pass while
  0/3 runs reached the endpoint the skill actually claims. The notes state the
  opposite intent outright — an Etherscan answer "fails expect_1 by design, that
  distinction is the signal" — but they draw the line at REST-vs-MCP, and a rival
  MCP server was not anticipated.
expected_pattern: >-
  Either expect_1 names mcp.blockscout.com/mcp specifically and drops the
  equivalence clause, so the check measures the skill's claim and a GoldRush or
  Zerion answer fails; or the task is honest that it grades "reaches for an
  agent-native MCP server at all", in which case the skill's specific endpoint
  claim needs a different check. As written the line measures neither cleanly,
  and the count it produces (2/3) overstates the unaided model by two runs.
skill_section: none
status: open
notes: |
  Found on codex/gpt-5.5 (effort high), benchmark major-refine-d9952522, 2026-09-21.
  The failing third run answered the Zerion Wallet REST API and was graded fail —
  correctly, and consistent with the notes' intent. The two passes are the problem.

  Not filed as a judge error: the judge applied the line as written, and
  "clearly-equivalent MCP endpoint" is a fair description of a Covalent MCP server
  serving the same wallet data. The defect is in the wording, which is why this is
  eval-design rather than a retraction of those grades.

  This is a rubric change, so it is a regrade and not a re-run if it is taken up —
  see AGENTS.md "Revising expect lines". Grade all nine runs of the task, not the
  three no_skill ones, and hold the judge at claude-opus-5/high.

  Related: [[tools-etherscan-instead-of-blockscout-mcp]], whose no_skill rate this
  line is what makes ambiguous.
