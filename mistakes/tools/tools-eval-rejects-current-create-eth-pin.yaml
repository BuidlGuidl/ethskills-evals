category: eval-design
symptom: "Answers verify that create-eth@latest resolves to 2.0.23 and recommend the reproducible `npx create-eth@2.0.23`, but expect_2 fails them solely for not making the floating `@latest` spelling the primary command."
expected_pattern: "Accept `npx create-eth@latest` or a live-verified pin to the release currently carrying the latest tag; continue rejecting deprecated or invented scaffold commands."
skill_section: none
status: fixed
notes: |
  Fixed in PR #68 by rewriting `tools-quiz-004` expect_2 rather than by changing
  the runs: the check now accepts `npx create-eth@latest` or an explicit version
  that answer.md shows it verified is the release `latest` currently resolves to,
  and still rejects `create-eth-app`, `create-scaffold-eth`, invented commands,
  and a pin asserted from memory.

  The two codex records that triggered this keep their original `expect_2: fail`
  and `pass: false`. Runs are append-only and they were graded honestly under the
  wording in force at the time; reports/tools-2026-08-13.md reads them as the
  false negatives they are.

  The skill's `create-eth` line was reworded in the same change. It previously said
  not to replace `@latest` with a pin unless the user asks for reproducibility,
  which contradicted both this record and the skill's own opening instruction to
  treat versions as live data. It now says to verify the command resolves and
  treats a verified pin as acceptable. Note what that leaves: with the check fixed,
  the instruction has no measured uplift behind it — SE-2 is 3/3 vs 3/3 on both
  stacks with no skill — so whether it belongs in a minimal skill is still open in
  issue #1.

  Confirmed on 2026-08-20 by a paired codex/gpt-5.6-sol rerun under the rewritten
  expect_2: both arms passed 3/3. In with_skill run 3, answer.md recommends the
  live-verified pin `npx create-eth@2.0.23`, states that `latest` resolved to 2.0.23,
  and passes expect_2. That is the precise artifact shape the old wording falsely
  rejected. See reports/tools-quiz-004-2026-08-20.md.
