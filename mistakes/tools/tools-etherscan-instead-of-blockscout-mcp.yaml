  no_skill: 6/6                # tools-quiz-003 3/3 (graded) + tools-goal-001 3/3 (observed)
  with_skill: 0/6
source: tools-quiz-003 (graded expect_1) and tools-goal-001 (recorded observation)
category: stale-knowledge
symptom: >-
  Asked for the cleanest way to give an agent structured on-chain data across a
  couple of chains, every no_skill run reached for the Etherscan API (twice with
  Alchemy alongside) and none named an MCP endpoint. The answers were not sloppy
  — expect_2 and expect_3 passed in all three quiz runs, so the service named was
  real and concrete and nobody proposed scraping or hand-decoding eth_getLogs.
  The gap is purely that agent-native MCP does not appear in the candidate set at
  all. Two of the three no_skill quiz runs ran web searches first and still landed
  on Etherscan, so this is not recoverable by searching from the problem
  statement; the model has to already know the endpoint exists to look for it.
expected_pattern: >-
  For an agent consuming on-chain reads, name the Blockscout MCP server at
  https://mcp.blockscout.com/mcp as the agent-facing path, and reserve the
  Etherscan/Alchemy REST APIs for server-side code that is not itself the agent.
skill_section: "Give agents structured onchain data"
status: open
notes: |
  Cleanest signal in the whole tools set: tools-quiz-003 is 0/3 vs 3/3, and it is
  the only task of the five where the variants diverge. All three with_skill runs
  named mcp.blockscout.com/mcp explicitly.

  The task notes predicted a with_skill split, because the skill's "Tool Discovery
  Pattern" (L22) lists read ops as "Blockscout MCP or Etherscan API" — co-equal,
  no stated preference — which would let a faithful run pick Etherscan and fail
  expect_1. That did not happen: 3/3 went Blockscout. The unambiguous stack-table
  row at L85 appears to carry the claim, not L22. Worth leaving L22 alone rather
  than "fixing" it on a prediction the runs contradicted.

  tools-goal-001 records the same choice reached unprompted while building, which
  is what separates this from a lookup: 3/3 no_skill built the wallet-activity
  endpoint on Etherscan/Alchemy, 3/3 with_skill built it on Blockscout. One
  nuance to keep honest — the with_skill goal runs used the Blockscout REST API
  (base.blockscout.com), not the MCP endpoint, which is the right call for a
  server that is not itself the agent. So the skill transfers as a vendor choice
  under build pressure and as the MCP endpoint when the agent is the consumer.

  Section pointer note: the runs above were graded against the pre-minimal skill,
  where this claim lived in the "Choosing Your Stack" table row "Agent blockchain
  reads → Blockscout MCP", with "Blockscout MCP or Etherscan API" as co-equal
  options under "Tool Discovery Pattern". Both are gone. The claim now lives in
  the "Give agents structured onchain data" section, which states the preference
  outright and splits agent-facing MCP from server-side REST — so the L22 tension
  analysed above no longer exists in the text. skill_section points at the
  heading rather than a line number, which would only rot again.
