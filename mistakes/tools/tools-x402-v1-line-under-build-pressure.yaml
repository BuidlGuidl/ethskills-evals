mistake_id: tools-x402-v1-line-under-build-pressure
skill: tools
first_seen: 2026-08-02
frequency:
  no_skill: 3/6                # reached the v1 line inside the project; 1/6 still shipped it
  with_skill: 0/6              # both claude benchmarks, 2026-08-02 and 2026-08-19; 0/6 in the quiz framing
source: >-
  tools-goal-001 claude benchmarks — 2026-08-02T030129Z-claude-no-skill-3
  (shipped), 2026-08-19T212004Z-claude-no-skill-2 and
  2026-08-19T213824Z-claude-no-skill-3 (installed, then migrated)
category: stale-knowledge
symptom: >-
  Building the paid-API foundation, no_skill runs reach for the frozen unscoped
  x402 v1 line. One shipped it: x402@^1.2.0, x402-express@^1.2.0,
  x402-fetch@^1.2.0, @coinbase/x402@^1.0.1, pinned back to express@^4 to match.
  It did not get there from ignorance — the transcript shows it installed the v2
  packages first, saw @x402/core ^2.0.0 in the @coinbase/x402@2.1.0 dependency
  tree, correctly named the problem ("@coinbase/x402@2.x is a different package
  family"), and then resolved the conflict by pinning everything DOWN to the 1.x
  line instead of up to @x402/*@2.20.0. Two more runs made the v1 line their
  first install into the project package.json and only migrated after reading
  the installed types. The stale line is what these runs reach for when they
  have to build, not what they believe when asked.
expected_pattern: >-
  Resolve an x402 version conflict toward the maintained scoped line
  (@x402/core, @x402/evm, @x402/fetch, @x402/express) — the unscoped
  x402/x402-express/x402-fetch packages have been frozen at 1.2.0 since
  2026-04-16 and their own READMEs mark them deprecated v1.
skill_section: "Add inline HTTP payments"
status: open
notes: |
  The interesting part is where this does NOT appear. In the quiz framing
  (tools-quiz-001, "what do I install") all 6 runs across both variants named the
  v1/v2 split explicitly and steered to @x402/*, several with a version table and
  publish dates read live off npm. Knowing the answer when asked did not stop
  these runs regressing to v1 once a build was in front of them. That is the case
  for keeping a goal task alongside the quiz: the quiz alone scores 3/3 vs 3/3 and
  would have reported this claim as fully known.

  Counted two ways, because the distinction matters. **Shipped in the final
  artifact: 1/6 no_skill, 0/6 with_skill** — this is what expect_3 grades.
  **Reached inside the project at any point: 3/6 no_skill, 0/6 with_skill** — this
  is only visible in the transcripts, and it is where the arms actually separate.
  Both 2026-08-19 no_skill runs that reached for v1 recovered on their own after
  reading the installed d.ts files, so the graded surface shows nothing.

  One near-miss deliberately not counted: 2026-08-01T214602Z-claude-no-skill-1
  installed x402-express@1.2.0 / x402-fetch@1.2.0 / x402@1.2.0 into a throwaway
  /tmp/x402probe directory to read their type definitions, then built the project
  on @x402/*@2.20.0. Inspecting the frozen line is not standing on it.

  The skill's install guidance held under the same pressure — 6/6 with_skill goal
  runs across the two claude benchmarks went straight to the scoped family, none
  touched the unscoped packages even to probe them. n=3 per variant per benchmark,
  so read the direction, not a rate.

  Was not graded at first sight: tools-goal-001 expect_3 asked only that the x402
  dependency be "a concrete, named package … not a placeholder", which the v1 line
  satisfies, so the shipping run passed all three expects. expect_3 has since been
  rewritten to require the maintained scoped family and to reject a build standing
  on the frozen v1 line, so the shipped form of this failure is now graded. The
  first-reach form is not, and is the same "graded surface saturated, ungraded read
  still separates the arms" pattern reports/tools-goal-001-2026-08-19.md raises for
  the data path. See that report and reports/tools-2026-08-13.md.
