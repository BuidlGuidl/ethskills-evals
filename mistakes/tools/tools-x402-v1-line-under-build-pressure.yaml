mistake_id: tools-x402-v1-line-under-build-pressure
skill: tools
first_seen: 2026-08-02
frequency:
  no_skill: 1/3                # tools-goal-001 run 3; 0/3 in the quiz framing
  with_skill: 0/3
source: tools-goal-001 (2026-08-02T030129Z-claude-no-skill-3), package.json
category: stale-knowledge
symptom: >-
  Building the paid-API foundation, one no_skill run shipped the frozen unscoped
  x402 v1 line — x402@^1.2.0, x402-express@^1.2.0, x402-fetch@^1.2.0,
  @coinbase/x402@^1.0.1, pinned back to express@^4 to match. It did not get there
  from ignorance: the transcript shows it installed the v2 packages first, saw
  @x402/core ^2.0.0 in the @coinbase/x402@2.1.0 dependency tree, correctly named
  the problem ("@coinbase/x402@2.x is a different package family"), and then
  resolved the conflict by pinning everything DOWN to the 1.x line instead of up
  to @x402/*@2.20.0. The stale line is what it reached for when a build broke,
  not what it believed when asked.
expected_pattern: >-
  Resolve an x402 version conflict toward the maintained scoped line
  (@x402/core, @x402/evm, @x402/fetch, @x402/express at 2.x) — the unscoped
  x402/x402-express/x402-fetch packages have been frozen at 1.2.0 since
  2026-04-16 and their own READMEs mark them deprecated v1.
skill_section: "x402 SDKs L46-51 (`npm install @x402/core @x402/evm @x402/fetch @x402/express`)"
status: open
notes: |
  The interesting part is where this does NOT appear. In the quiz framing
  (tools-quiz-001, "what do I install") all 6 runs across both variants named the
  v1/v2 split explicitly and steered to @x402/*, several with a version table and
  publish dates read live off npm. Knowing the answer when asked did not stop one
  run from regressing to v1 when a dependency conflict had to be cleared mid-build.
  That is the case for keeping a goal task alongside the quiz: the quiz alone
  scores 3/3 vs 3/3 and would have reported this claim as fully known.

  The skill's install line held under the same pressure — 3/3 with_skill goal runs
  shipped @x402/*@^2.20.0. n=3 per variant, so 1/3 vs 0/3 is weak evidence for a
  rate difference; what it does establish is that the failure mode is real and
  reachable on this model, in the build framing only.

  Not graded, deliberately: tools-goal-001 expect_3 asks only that the x402
  dependency be "a concrete, named package … not a placeholder", which the v1 line
  satisfies. This run passed all three expects. See the report's eval-changes row.
