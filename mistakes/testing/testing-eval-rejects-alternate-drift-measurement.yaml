symptom: "FINDINGS.md proves the planted withdrawal-fee drift, names the gross-vs-net mechanism, shows a remaining shareholder credited 1000000000 against 1003000000 actually held, and gives the net-subtraction fix — but measures the gap through the share price rather than as totalAssetsStored against the vault's aUSDT balance, which is the measurement expect_2 named. Filed on the suspicion that the expect line was rejecting a correct answer for its wording."
