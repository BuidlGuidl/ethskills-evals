notes: |
  WITHDRAWN. The claim in this record was that expect_2 encoded one spelling of a right
  answer, the shape damianmarti flagged on issue #1 for tools, and that the negative
  accounting-drift delta in reports/testing-2026-09-01.md (3/3 no_skill against 2/3
  with_skill) was therefore a wording artifact rather than a measurement.

  It was tested rather than argued. expect_2 was rewritten (see the next paragraph for
  exactly how) and all six goal-001 runs were regraded on the judge that graded them
  originally (codex/gpt-5.6-sol). Result: reports/testing-goal-001-regrade-2026-09-03.md
  — 24 of 24 expect verdicts identical, including with-skill-1 expect_2, which fails
  under both wordings.

  THE EDIT WENT BOTH WAYS, AND THE FIRST DESCRIPTION OF IT WAS WRONG. This record, the
  regrade report, the task note and the six committed `regrade_reason` strings all called
  it a widening and said the retained-fee fix was "still" required. Corrected 2026-09-04,
  in review of PR #107: expect_2 was widened in its measurement clause (any figures
  exhibiting the recorded-vs-held gap, or a direct consequence of it, now satisfy it,
  where the old line named totalAssetsStored against the aUSDT balance) and narrowed by a
  clause that is new — "The reported fix accounts for the retained fee, by subtracting
  only the net or by pricing shares off live holdings." The old line ended at the new-file
  quarantine and required no fix at all. The regrade records cannot be rewritten, so the
  correction lives here and in the report. Two offsetting edits can in principle produce
  identical verdicts while masking each other; here they did not, because expect_4
  independently grades the same fix and every run's expect_4 verdict is unchanged too.

  So the delta stands as measured. The most likely reading of the fail is the clause the
  run asserts but never evidences: expect_2 requires a gap that accumulates across
  withdrawals, and the run shows one withdrawal and one 3 USDT fee, then states that
  "all accumulated withdrawal fees remain ownerless" without a second data point. That is
  a defensible fail, not a wording artifact.

  WHAT CANNOT BE ESTABLISHED FROM THE RECORDS. lib/judge.ts asks the judge for a `reason`
  per condition and the harness keeps only pass/fail, so the actual ground for this fail
  is unrecoverable and the paragraph above is inference. Persisting the judge's reasons
  would make exactly this question answerable, and is the single cheapest change to the
  harness for anyone auditing a suspected false negative. Worth an issue.

  THE NEW WORDING WAS KEPT, on the narrower ground that it no longer names one
  measurement while being demonstrably verdict-neutral on the evidence in hand. It is not
  credited with fixing anything. Its remaining defect is that expect_2 and expect_4 now
  both grade the withdraw fix, so a FINDINGS that evidences the drift and omits the fix
  loses two cells instead of one and the two columns stop being independent signals.
  Removing the clause is another rubric edit and therefore another regrade of all six
  runs; it is deliberately left for that, not slipped in beside this one.
