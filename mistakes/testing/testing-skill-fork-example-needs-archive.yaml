source: testing-quiz-004 no-skill-1 (2026-09-01T165912Z, expect_4); and the quiz's own drafting note
category: skill-content-gap
symptom: "The skill told the reader to pin an old fork block and never said that doing so is an archive request. Its own example — a mainnet fork at 19_000_000 — does not run against a free public endpoint: while quiz-004 was being drafted, that fork against ethereum-rpc.publicnode.com failed outright with 'Archive requests require a personal token', and the fork detector only ran once it stopped pinning. So the skill's headline fork example, followed literally, fails for a reason that has nothing to do with the contract under test. One no_skill run lost quiz-004 expect_4 on the same gap."
expected_pattern: "State the archive requirement beside the pinning advice: a full node keeps only recent state, older queries error rather than answer, and the endpoint should be confirmed on a historical eth_call at the intended block before that block is pinned."
skill_section: "Fork against the real deployment"
status: fixed                  # the missing guidance is present; the repeated task does not prove causality
notes: |
  Filed 2026-09-04 in review of PR #107. tasks/testing-quiz-004.yaml:53-57 instructs that
  this be filed as a mistake against the Fork section and that the skill be recommended to
  state the archive requirement next to its pinning advice. The PR made the skill edit and
  skipped the record; this is the record.

  READ THE TRIGGER HONESTLY. The task note conditions the content-gap reading on a
  with_skill run that passes expects 1-3 and fails 4. That did not happen: with_skill was
  3/3 on this quiz and expect_4 passed in every with_skill run. The fail is a no_skill one.
  So the grading evidence for this gap is weaker than the PR's description implied, and the
  load-bearing evidence is the drafting observation above — the skill's example does not
  run on a free endpoint — which is a defect in the skill independent of any run.

  Consequence for the next benchmark, same as [[testing-eval-rejects-alternate-drift-measurement]]
  raises for goal-001: quiz-004 expect_4 was written as a deliberate out-of-skill line and
  the skill now covers it, so this cell can no longer distinguish a model that reasons to
  the archive constraint from one that recalls it. It was already passing 3/3 with_skill
  before the content was added, so nothing about it is a regression guard now.

  Re-measured 2026-09-12 on codex/gpt-5.6-sol with no explicit reasoning effort.
  expect_4 passed 3/3 in both variants. That result cannot confirm the edit: the
  skilled arm already passed 3/3 before the archive paragraph was added, and the quiz
  is now direct-recall contaminated. The status is fixed because the documented
  content gap itself is absent from the current skill, not because this result shows
  a behavioral effect.

  Re-measured 2026-09-13 against patched skill a1d0be01. The skilled arm again passed
  3/3. This remains a regression observation, not causal evidence. One baseline answer correctly required archive/historical-state access and
  described direct historical queries, but omitted the expect's approximate 128-block
  full-node window and failed expect_4. The harness does not retain judge reasons, so
  that basis is inferred from the only missing clause in the committed answer.

  Re-measured 2026-09-14. The same 1/3 baseline versus 0/3 skilled miss appeared on
  quiz-004. The held-out integration wording also produced 1/3 baseline versus 0/3
  skilled archive-depth misses. This remains a content-fixed compatibility check; the
  result does not establish causality because the skill states the answer directly.

  Re-measured 2026-09-21 on claude/claude-opus-5/medium, benchmark major-refine-d9952522,
  as a three-arm comparison: no skill, the first vendored text 2f0adb01, and the refined
  text d9952522. This is the first measurement that separates the arms, and it is the
  strongest evidence yet that the archive paragraph does work.

  quiz-004 is saturated on this stack — expect_4 passed 3/3 in all three arms, including
  no_skill — so it says nothing, exactly as the 2026-09-12 note predicted it would not.
  The held-out testing-quiz-006 is where the gap shows: its expect_3 requires confirming
  the endpoint serves historical state at the pinned block before treating failures as
  contract failures, and it fails in 3/3 runs of the OLD text and 2/3 runs with no skill
  at all, against 0/3 with the refined text. quiz-006 expect_3 is the single cell that
  carries this benchmark's whole headline; every other failing cell on the stack is one
  no_skill run of goal-001 expect_2.

  Read the causality carefully, because this record has over-claimed before. The old text
  is not merely silent on archive depth — it recommends pinning (a '### Fork at specific
  block (reproducible)' comment) with no mention of the constraint, so its 0/3 is the
  documented gap reproducing on a task whose vocabulary was rotated away from the skill's
  own example. That is stronger than the earlier same-task reruns, which could only show
  recall of installed text. It is still not a controlled attribution: the refined text
  rewrote the whole skill, not just this paragraph, so the uplift is the revision's, not
  provably this paragraph's.

  One genuine oddity to record rather than smooth over: the old skill scored BELOW no_skill
  here (0/3 against 1/3). At n=3 that is one run and should not be read as the old text
  actively harming the answer.

  Re-measured 2026-09-21 on codex/gpt-5.5/high (major-refine-d9952522) against the
  held-out quiz-006 wording, expect_3, with the old and new skill texts as separate
  arms. This is the first reading that separates the two: the baseline and the FIRST
  vendored text both missed the archive-depth confirmation 3/3, and the refined text
  passed 3/3. Every earlier measurement compared the refined text against a baseline
  only, so it could not tell a model that recalls the paragraph from one that does not
  have it; the old arm supplies the missing control and the gap is 3/3 against 0/3.
  It remains recall on the new arm — the skill states the answer — but the content
  edit is now the difference between the two skilled arms rather than an inference.
