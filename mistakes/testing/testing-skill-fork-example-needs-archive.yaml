category: skill-content-gap
symptom: "The skill told the reader to pin an old fork block and never said that doing so is an archive request. Its own example — a mainnet fork at 19_000_000 — does not run against a free public endpoint: while quiz-004 was being drafted, that fork against ethereum-rpc.publicnode.com failed outright with 'Archive requests require a personal token', and the fork detector only ran once it stopped pinning. So the skill's headline fork example, followed literally, fails for a reason that has nothing to do with the contract under test. One no_skill run lost quiz-004 expect_4 on the same gap."
expected_pattern: "State the archive requirement beside the pinning advice: a full node keeps only recent state, older queries error rather than answer, and the endpoint should be confirmed on a historical eth_call at the intended block before that block is pinned."
skill_section: "Fork against the real deployment"
status: open                   # content added in PR #107; stays open until a re-run confirms
notes: |
  Filed 2026-09-04 in review of PR #107. tasks/testing-quiz-004.yaml:53-57 instructs that
  this be filed as a mistake against the Fork section and that the skill be recommended to
  state the archive requirement next to its pinning advice. The PR made the skill edit and
  skipped the record; this is the record.

  READ THE TRIGGER HONESTLY. The task note conditions the content-gap reading on a
  with_skill run that passes expects 1-3 and fails 4. That did not happen: with_skill was
  3/3 on this quiz and expect_4 passed in every with_skill run. The fail is a no_skill one.
  So the grading evidence for this gap is weaker than the PR's description implied, and the
  load-bearing evidence is the drafting observation above — the skill's example does not
  run on a free endpoint — which is a defect in the skill independent of any run.

  Consequence for the next benchmark, same as [[testing-eval-rejects-alternate-drift-measurement]]
  raises for goal-001: quiz-004 expect_4 was written as a deliberate out-of-skill line and
  the skill now covers it, so this cell can no longer distinguish a model that reasons to
  the archive constraint from one that recalls it. It was already passing 3/3 with_skill
  before the content was added, so nothing about it is a regression guard now.
