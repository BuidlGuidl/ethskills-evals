mistake_id: testing-boundary-excluded-from-bound-class
skill: testing
first_seen: 2026-09-01
frequency:                      # codex/gpt-5.6-sol, 2026-09-01, one repeated gap across two task shapes
  no_skill: 0/3                 # quiz-002 expect_1
  with_skill: 1/3               # quiz-002 expect_1 (with-skill-3)
  goal_001_no_skill: 2/3        # goal-001 expect_1 (no-skill-1, no-skill-3) — see notes on the overlap
  goal_001_with_skill: 1/3      # goal-001 expect_1 (with-skill-2)
source: testing-quiz-002 with-skill-3 (2026-09-01T165906Z), testing-goal-001 with-skill-2 (2026-09-01T174256Z)
category: edge-case-not-found
symptom: "Treats a bound as if only the far side of it were the breaking input class. On quiz-002 the answer argued the class is strictly above 10_000 — '10,000 itself is only the boundary, not a value above it' — evidenced the `amount - fee` underflow at 10_001, and never reached the zero-net/NoSharesMinted revert at exactly 10_000. The same half-answer failed goal-001 expect_1, which asks for both. The two values fail through different code paths and produce different failures, so evidence for either does not establish the other."
expected_pattern: "Exercise the limit and the value past it as two separate cases, and show the distinct failure each produces. A fuzz over the whole domain reaches both; a hand-picked value past the bound reaches one."
skill_section: "Fuzz the domain instead of picking from it"
status: open                   # skill revision in PR #107 adds the both-sides-of-the-bound line; stays open until a re-run confirms
notes: |
  Filed 2026-09-04 in review of PR #107. The observation is from the 2026-09-01 sitting
  and was written into tasks/testing-quiz-002.yaml's notes at the time but never given a
  record, which AGENTS.md loop step 6 asks for — an unfiled observation is lost.

  Overlaps [[testing-goal-unbounded-fee-missed]] rather than replacing it. That record
  counts goal-001 runs that failed to establish the unbounded-fee defect at all, by any
  route; this one names the specific shape the miss took where the run did reach the
  defect and stopped at one side of the bound. The goal-001 rows are given separately
  above for that reason: they are a subset of the other record's misses, not an
  independent measurement, and blending them into one rate would double-count.

  The expect lines stand. quiz-002 expect_1 and goal-001 expect_1 both ask for both
  halves and are right to.
