category: method-not-applied-unprompted
symptom: "On claude/claude-opus-5 goal-001 ('convince me it is safe to ship'), the no_skill runs reached for forks 3/3 and invariants 3/3 unprompted, but essentially never fuzzed; fuzzing was the only one of the skill's three stale-prior claims still alive on that stack. On codex/gpt-5.6-sol, no_skill reached for forks 2/3 and invariants 0/3, so both the fuzz and invariant claims remained alive. The unbounded-fee bug was generally approached by inspection plus a targeted unit test asserting a cap the model already reasoned must be missing, rather than by searching the input space. It cost nothing on the original Claude measurement: grading is outcome-based by design, the targeted tests evidenced the same defect, and all 6 goal runs passed expect 1. Recorded because the method gap is real even when the finding is not missed. It did not reproduce on the 2026-08-27 Claude sitting (reports/testing-2026-08-27.md): same task, same skill revision, same model, and all three no_skill runs fuzzed with bound() unprompted — 3/3 in both variants."
expected_pattern: "Fuzz the fee maths over the full input range (bound() over newFeeBps) rather than asserting a hand-picked bound, so the breaking value is discovered rather than assumed."
skill_section: "Fuzz the domain instead of picking from it"
status: open                   # same-task rerun moved method use, but cannot establish transfer
notes: |
  On 2026-09-12, against PR #107's merged skill, 2/3 codex skilled runs wrote no fuzz
  test and no handler invariant. The 2026-09-13 patch moved the risk-to-search mapping
  to the opening deployment gate and said targeted regressions do not replace search.
  All three fresh skilled runs then used fuzzing, a handler invariant, and a fork;
  all three baseline runs still used neither fuzzing nor invariants. Because that gate
  was written from goal-001's planted defects and then measured on goal-001 again, this
  is regression evidence only. Keep the record open until a held-out task shows the
  workflow transfers to different contract behavior.
