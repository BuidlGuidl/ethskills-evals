mistake_id: testing-eval-transcript-truncation-blocks-evidence-check
skill: testing
first_seen: 2026-09-21
frequency:
  claude/claude-opus-5/medium:
    all_variants: 9/9 goal-001 runs carry truncated tool output (32-56 truncated blocks per transcript)
measurements:
  - { date: 2026-09-21, stack: claude/claude-opus-5/medium, benchmark: major-refine-d9952522, truncated_blocks_per_transcript: "32-56", runs: 9 }
source: benchmark major-refine-d9952522, artifacts/testing-goal-001/2026-09-21T*/transcript.md
category: eval-design
symptom: "tasks/testing-goal-001.yaml requires the orchestrator to cross-check every run's FINDINGS.md against its transcript.md, because the expects grade pasted command output and pasted output is forgeable. That check cannot be completed as written: transcript.md elides long tool results, rendering them as '… [N more chars]'. Every one of the nine goal-001 runs in this benchmark carries between 32 and 56 such truncated blocks, and the elision falls precisely on the forge output the expects grade. Matching the FINDINGS' pasted result lines verbatim against the transcript reports 6-29 unmatched lines per run, none of which is evidence of fabrication — they are lines the renderer cut."
expected_pattern: "Either preserve tool output in transcript.md for the commands a task's expects grade, or state in the task notes that the verbatim cross-check is limited to the untruncated prefix and say what the orchestrator should check instead."
skill_section: none
status: open
notes: |
  What was actually checkable this sitting, and what the report claims on its strength:
  every run really did invoke forge (5-14 invocations visible per transcript, with real
  compiler and test output attached), the untruncated prefixes agree with FINDINGS.md
  wherever they overlap, and the three planted defects are corroborated in visible
  transcript text. No run showed a sign of fabrication. That is a weaker statement than
  the task asks for, and the report says so rather than reporting the mandated check as
  passed.

  The cost of the gap is asymmetric and worth stating plainly. A run that fabricated a
  forge result would most likely do it in exactly the region the renderer truncates — a
  long test output — so the check is missing over the part of the evidence it was written
  to police. This is not hypothetical for this skill: [[testing-evidence-command-not-verbatim]]
  is an open record about goal-001 evidence presentation on the claude stack.

  The raw capture beside transcript.md (transcript.jsonl) does hold the full tool results,
  but it is gitignored by design — AGENTS.md "What gets committed" — so it exists only on
  the machine that made the run. An orchestrator can complete the check locally, in the
  sitting, and nobody reviewing the eval PR afterwards can repeat it. If the verbatim check
  is to stay in the task notes, the reviewable artifact has to carry what it needs.

  Not specific to this skill or this stack; it is a property of the transcript renderer, so
  any task grading pasted output has it. Filed here because testing-goal-001 is the task
  whose notes mandate the check.
