notes: |
  Re-measured 2026-09-12 on codex/gpt-5.6-sol with no explicit reasoning effort:
  1/3 no_skill and 0/3 with_skill. All three skilled runs used a pinned real-mainnet
  fork and evidenced the USDT return-data incompatibility, confirming the PR #107
  fork guidance on this task.

  Re-measured 2026-09-13 against patched skill a1d0be01: 2/3 baseline runs missed the
  real-token fork evidence and 0/3 skilled runs did. Every skilled run used a pinned
  real-mainnet fork, so the fix remains stable.

  Re-measured 2026-09-14. No baseline run used a real fork. Both valid skilled runs
  authored pinned fork tests, but one could not obtain historical state from the public
  endpoint and correctly reported the qualification as outstanding; it failed the
  evidence check. Reopened because actual integration evidence is 1/2, while the eval
  environment's lack of a provisioned archive RPC is a material confounder.

  Re-measured 2026-09-21 on codex/gpt-5.5/high (major-refine-d9952522), goal-001
  expect_3: 1/3 baseline, 0/3 in both skilled arms. Eight of nine runs forked real
  mainnet USDT and pasted the approve revert; the single miss (baseline, run 3) wrote
  no fork test at all — no createSelectFork, no --fork-url anywhere in its transcript
  — and reported only mock-reachable findings. No run hit the archive-endpoint
  confounder that reopened this record on 2026-09-14: the runs that pinned a block
  used endpoints that served it, and the rest forked the live head, which is enough
  for this defect because the approve reverts at any block.
