symptom: "A no-skill goal run never established the real-mainnet USDT approve incompatibility on a fork, so it missed that every production deposit reverts before Aave supply."
expected_pattern: "Fork mainnet, fund and approve a depositor using a missing-return-tolerant call, then exercise the vault against real USDT and Aave and trace the raw IERC20.approve decode revert."
