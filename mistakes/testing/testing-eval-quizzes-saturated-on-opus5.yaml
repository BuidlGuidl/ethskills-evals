category: eval-design
symptom: "On claude/claude-opus-5 at medium effort, testing-quiz-001 through quiz-005 pass every expect line in all three arms — no skill, the 2f0adb01 text and the d9952522 text alike — 45 runs with not one failing cell. Five of the seven live tasks therefore contribute nothing to the benchmark's headline: they cannot distinguish the refined skill from the old one, and neither from an unskilled baseline. The whole measured signal on this stack comes from testing-goal-001 (one no_skill run losing expect_2) and the held-out testing-quiz-006 (expect_3, old 0/3 and no_skill 1/3 against new 3/3)."
expected_pattern: "A directed quiz should retain at least one cell an unskilled run of the current frontier model can lose. Where the skill now states the answer outright, the quiz measures recall of the installed text rather than judgment, and needs its planted decision rotated rather than its rubric loosened."
skill_section: none
status: open
notes: |
  This is the outcome testing-goal-001's own drafting notes predicted: "every turn of the
  loop that writes a measured miss into the skill shrinks what these cells can still
  discriminate", with the caveat put "more sharply, on quiz-001, quiz-004 and quiz-005,
  whose graded surface the revision covers outright". The d9952522 revision of the skill
  restates several of these quizzes' expect lines almost directly — both sides of a bound,
  the mocks-cannot-surface-the-mismatch argument, handler targetContract, the calls/reverts
  statistic. What this run adds is that the *no_skill* arm also passes them 3/3, so the
  saturation is not skill contamination alone; opus-5 at medium already holds this material.

  Do not read the 15/15 cells as a skill result in either direction. They are not evidence
  that the refinement helped, and not evidence that it did no harm — they are cells with no
  discriminative power left on this stack. The cost columns are still informative there
  (see the report: the refined text is cheaper and faster on every one of them), and that
  is the only thing those five tasks measured here.

  Rotating the planted decisions is the fix, as [[testing-skill-fork-example-needs-archive]]
  and [[testing-no-fuzz-unprompted]] both note for their own cells. testing-quiz-006 shows
  the shape that still works: it was written as a held-out forward check with rotated
  vocabulary and a different contract surface, and it is the only quiz on this stack that
  separated the arms at all.

  Unknown from this sitting: whether the same five quizzes are saturated on the weaker
  stacks. GPT 5.5 high, Kimi K3 and GLM 5.3 have not been run for this skill, and a cell
  that is dead on opus-5 may still discriminate there. Check before retiring anything.
