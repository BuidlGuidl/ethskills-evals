category: diagnosis-incomplete
symptom: "quiz-001 gives an invariant suite that stayed green for months while an ordinary deposit/withdraw sequence drained the vault. One baseline run and one old-skill run diagnosed the missing handler and the unconstrained actor set, but never mentioned that reverted calls are discarded rather than failing the run — fail_on_revert defaults to false — so the invariant was only ever asserted against a vault sitting at or near its empty initial state. The word fail_on_revert does not appear in either answer. Green meant nothing happened, which is the specific reason months of CI proved nothing, and it is the one expect both runs lost."
expected_pattern: "Name fail_on_revert = false as the reason the suite could stay green: unhandled calls revert, foundry drops them, and the assertion runs against an untouched vault. Set it true (or give the handler valid inputs) so a reverting sequence is a failure rather than a skipped one."
