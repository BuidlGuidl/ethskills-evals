mistake_id: testing-evidence-command-not-verbatim
skill: testing
first_seen: 2026-07-27
frequency:                     # codex/gpt-5.6-sol/none, 2026-09-12
  no_skill: 0/3
  with_skill: 0/3
category: evidence-presentation
symptom: "goal-001 tells the executor to paste the actual command it ran, 'copied from your terminal verbatim', because the human will re-run each one. Runs instead paste a tidied reconstruction: the real call was `forge test --match-path 'test/{OwnerPowers,UsdtCompatibility,FeeAccounting}.t.sol' -vv 2>&1 | tail -60` and FINDINGS.md shows it split into one clean per-file command; elsewhere a `--match-test <name>` command appears that was never issued (the test ran under a broader --match-path), and pipes like `| tail -70` are dropped. The pasted OUTPUT is genuine in every case — all 6 goal runs cross-checked against transcript.md, 0 fabricated output lines — and the reconstructed commands do reproduce the shown results, so this is presentation drift, not fabricated evidence. It still breaks the stated contract: the reviewer re-running the literal text gets differently-scoped output than the transcript shows."
expected_pattern: "Paste the command exactly as issued, pipes and combined match-paths included. If a narrower command is friendlier for the reader, show it in addition to the real one and label which is which."
skill_section: none
status: fixed
notes: |
  Re-measured 2026-09-12. Every Markdown `forge test` command in all six valid goal
  reports appears verbatim in its matching transcript, including pipes and match
  filters. Every distinctive pasted failure line matched too. The prior behavior is
  preserved in reports/testing-2026-07-27.md and the symptom above.
