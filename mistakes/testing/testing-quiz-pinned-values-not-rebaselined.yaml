symptom: "quiz-004's fork suite is flaky because it forks the live head. One run on the old skill text diagnosed the moving head correctly and gave the pin (vm.createSelectFork with a block, or --fork-block-number), plus a careful archive-depth check — and then said nothing about the assertions themselves. Once a block is pinned, the Chainlink price and Uniswap reserves at that block are fixtures and the assertions have to be re-baselined onto them; the answer left the original live-state expectations in place, which pins the flake rather than removing it."
expected_pattern: "Pair the pin with the consequence for the oracle: at a fixed block the values are constants, so assert against the values that block actually holds rather than against ranges chosen for live state."
skill_section: "Fork against the real deployment"
