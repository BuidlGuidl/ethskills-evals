category: diagnosis-incomplete
symptom: "quiz-002 asks what a green 100%-coverage suite missed on an unbounded deposit fee. Two of three runs on the refined skill text worked the arithmetic correctly (fee == amount at 10_000 so no shares mint; underflow above it), named fuzzing over the full range as the technique, and then stopped — never stating that the underlying defect is the missing input validation in the setter (`require(newFeeBps <= BPS_DENOMINATOR)`). One framed the remedy as a disjunction instead: the property asserted is that after any accepted fee 'a deposit should either succeed and mint shares, or the setter should have rejected that fee as invalid', which leaves the contract fix as one of two acceptable worlds rather than the thing that is wrong. Neither the baseline nor the old skill text produced this: both named the setter fix 3/3."
expected_pattern: "After naming the test-side gap and the technique that closes it, say plainly that the contract defect is the unvalidated setter and give the bound check, so the reader fixes the code rather than only the suite."
skill_section: "Fuzz the domain instead of picking from it"
status: open
notes: |
  A with_skill-only regression against both other arms, which is the shape worth
  watching: the refined text pulls the answer toward test technique and away from the
  code fix the technique exists to find. The judge's per-condition reason is not
  retained by the harness, so the attribution to the missing setter clause is read off
  the answers themselves — both failing answers discuss the setter's behaviour but
  neither prescribes bounding it, while the passing run on the same arm does.

  The same underlying pairing (find the bound, then bound it) is what
  [[testing-goal-unbounded-fee-missed]] grades on goal-001, where this stack's new arm
  missed the bug outright in 1/3 runs.
