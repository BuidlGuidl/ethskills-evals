category: property-not-evidenced
symptom: "One with-skill goal run discussed accounting risks but did not provide the required failing output proving that a withdrawal subtracts gross assets while only net assets leave Aave, leaving the retained fee outside totalAssetsStored."
expected_pattern: "After fee-bearing withdrawals, exhibit the gap numerically: any figures showing the recorded accounting against the holdings it understates, or a direct consequence of that difference, and enough of them to show the gap accumulating rather than a single instance. The choice of measurement is free — expect_2 stopped naming one on 2026-09-02."
skill_section: "Invariant-test anything stateful"
status: open                   # same-task rerun cannot establish that the skill edit fixed it generally
notes: |
  Re-measured 2026-09-12 on codex/gpt-5.6-sol with no explicit reasoning effort.
  The skilled miss showed one 3-USDT accounting/custody gap and asserted that the
  gap accumulates, but gave no second operation or second numerical data point.

  Re-measured 2026-09-13 after the skill distinguished a mismatch from accumulation.
  All three skilled runs passed the accounting check and all three wrote a handler
  invariant; the clearest report printed the gap growing from 3 USDT after the first
  withdrawal to 6 USDT after the second. One baseline run failed the check. Because
  this was the task used to write the edit, keep the mistake open pending held-out
  validation.

  Re-measured 2026-09-14 after the wording was narrowed to require two operations
  that can each create the drift. Both valid skilled goal reports passed, and all six
  held-out repayment answers required at least two drift-producing repayments. The
  held-out baseline also passed 3/3, so this is compatibility evidence rather than an
  isolated skill effect. The goal arm's third skilled slot was operationally unavailable.
