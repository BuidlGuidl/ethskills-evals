symptom: "Base model inconsistently catches DaisyUI cosmetic defects in a pre-ship pass: hardcoded bg-black text-white wrapper, the DaisyUI loading class on a btn that swallows the label, and --radius-field: 9999rem pill inputs. On opus-4-8 this was a review-attention gap rather than a knowledge gap — the model derived all three mechanisms cold in the isolated quizzes but did not walk to them unprompted in a full-app review."
expected_pattern: "Flag/fix bg-[#0]/bg-black wrapper -> bg-base-*/text-base-content; remove loading from btn className -> inline <span class='loading loading-spinner loading-sm'>; set --radius-field to ~0.5rem in BOTH theme blocks."
skill_section: "Theme and loading states"
status: open
notes: |
  Narrowed to one item on claude/claude-opus-5. Two of the three facets closed in
  the baseline without the skill: bg-black went 1/3 -> 3/3 caught and the loading
  class 1/3 -> 3/3 caught, on both the review and the fix task.

  --radius-field: 9999rem did not move at all — still 0/3 in no_skill on goal-001
  e12 and goal-002 e11, across both models and both task shapes, against 3/3 with
  the skill every time. It is the most durable single check in this benchmark and
  the reason this record stays open. The minimal rewrite compressed all three to
  one bullet each and lost nothing.
