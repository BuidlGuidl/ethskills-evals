notes: |
  The review facet is unchanged across stacks: 3/3 unflagged in no_skill, 0/3 with
  the skill, on both models.

  The magnitude facet is moot as a skill defect. The minimal rewrite dropped the 2s
  figure, the openWallet code block and the wc@2 localStorage read, keeping only
  prose rules (fire the write first, target the connected wallet, skip inside an
  in-app browser). Across all 12 runs of the 2026-09-06 benchmark no deliverable
  contains a setTimeout deep-link, a wc@2 read, or any delay figure — the dropped
  material was not reached for. #29's recommendation to "soften the magnitude or
  re-justify 2s" was answered by deleting it.

  Not re-measured on claude/claude-opus-5: qa-quiz-004 was deliberately skipped
  (it graded the ~2s delay and localStorage hints the skill no longer gives), so
  the magnitude facet has no reading on this stack and this record cannot be closed
  on it. One cost is visible in the goal-001 review text instead: the single
  with_skill run that wrote a deep-link code sketch (with-skill-2) produced a
  generic `wc://` redirect with no delay, contradicting its own prose about
  targeting the connected wallet. The prose lands the finding; the deleted recipe
  was what made the sketch correct.
