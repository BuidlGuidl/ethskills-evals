notes: |
  The review facet is unchanged across stacks: 3/3 unflagged in no_skill, 0/3 with
  the skill, on both models.

  The magnitude facet is moot as a skill defect. The minimal rewrite dropped the 2s
  figure, the openWallet code block and the wc@2 localStorage read, keeping only
  prose rules (fire the write first, target the connected wallet, skip inside an
  in-app browser). Across all 12 runs of the 2026-09-06 benchmark no deliverable
  contains a setTimeout deep-link, a wc@2 read, or any delay figure — the dropped
  material was not reached for. #29's recommendation to "soften the magnitude or
  re-justify 2s" was answered by deleting it.

  Not re-measured on claude/claude-opus-5: qa-quiz-004 was deliberately skipped
  (it graded the ~2s delay and localStorage hints the skill no longer gives), so
  the magnitude facet has no reading on this stack and this record cannot be closed
  on it. One cost is visible in the goal-001 review text instead: the single
  with_skill run that wrote a deep-link code sketch (with-skill-2) produced a
  generic `wc://` redirect with no delay, contradicting its own prose about
  targeting the connected wallet. The prose lands the finding; the deleted recipe
  was what made the sketch correct.

  MAGNITUDE FACET RE-MEASURED 2026-09-23 under major-refine-d9952522, the reading
  this record said it was missing — and it reverses the note above. The facet is
  NOT moot: deleting the 2s figure has a measured cost.

  qa-quiz-004 expect_2, three arms, n=3:
    none      0/3 pass  (delays: 0ms, none, "1 second after")
    old       2/3 pass  (both passes: setTimeout(openWallet, 2000))
    new       1/3 pass  (pass: 750ms; both failures: exactly 300ms)

  This is the only task in the whole four-row Opus 5 medium sweep where the old
  text outscores the rewrite. The mechanism is not in doubt: the old SKILL.md
  carries the figure, the code block and the rationale — L269
  `setTimeout(openWallet, 2000)`, L279 "**Why 2 seconds?** writeContractAsync must
  estimate gas, encode calldata, and relay the signing request through
  WalletConnect's servers. 300ms is too fast — the wallet won't have received the
  request yet" — and the rewrite keeps only the ordering rule (L59), with no
  magnitude and no rationale. Both failing new-arm runs land on 300ms, the exact
  value the deleted sentence names as too fast.

  So the earlier note's two claims both need qualifying. "No deliverable contains
  a setTimeout deep-link" held for the 2026-09-06 goal-shaped runs; under the quiz
  framing that asks about the patch directly, new-arm deliverables do write one,
  and they write it wrong. And "#29's recommendation was answered by deleting it"
  is true as an edit but not as a fix: deletion removed the contested figure and
  the correction along with it, and the model's own prior (sub-second, one relay
  round-trip) is what fills the gap.

  Caveat on strength: 2/3 against 1/3 at n=3 is one run. What raises it above
  noise is that the failure value is the specific number the deleted text warns
  against, in both failing runs, and that no no_skill run gets it either.

  Stays open. The fix is not to restore the 439-line section — it is one clause:
  give the delay a magnitude and say why sub-second fails.

  codex/gpt-5.5 (major-refine-d9952522, 2026-09-24) reopens the review facet as a
  regression of the refined text, not a base-model gap. The first-vendored text
  (2f0adb01, 2821 words, a full "Important: Mobile Deep Linking" section plus three
  checklist lines) flags the absent deep-linking 3/3; the refined text (d9952522,
  885 words, one "## Mobile" bullet) flags it 0/3, and all three of those runs read
  SKILL.md, so the trigger is not the cause. The same three runs pass quiz-004 3/3:
  asked about deep-linking directly, the model knows it; reviewing unprompted, the
  one bullet does not put it on the reviewer's list. It is the only expect in the
  benchmark where the old text beats the new one on runs that read the skill.
