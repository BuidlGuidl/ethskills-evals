mistake_id: node25-localstorage-fix-wrong-layer
skill: frontend-playbook
first_seen: 2026-07-24
frequency:                       # quiz-004 expect_3 + goal-001 expect_10 (Node 25.9.0 executors)
  no_skill: quiz-004 1/3 · goal-001 e10 2/3   # mistake occurs in 1 of 3 quiz, 2 of 3 goal
  with_skill: 0/3 both
category: node25-prerender
symptom: >-
  On Node 25 the built-in experimental localStorage lacks the WebStorage methods, so
  next-themes / RainbowKit crash static prerender with "localStorage.getItem is not a
  function". Most no_skill runs identified the built-in-localStorage cause and correctly
  refuted the instrumentation.ts polyfill via the build-worker process model. But for the
  actual fix, some no_skill runs stopped at application-code guards (typeof window checks,
  wagmi SSR config) plus pinning CI back to Node 24 — never landing a process-level fix that
  covers the build workers. In goal-001, one no_skill build shipped no Node-25 handling at
  all and crashed prerender.
expected_pattern: >-
  A Node-process-level fix that reaches the prerender workers: NODE_OPTIONS with
  --require pointing at a localStorage polyfill (.cjs), or Node's own flags
  (--localstorage-file / --no-experimental-webstorage). with_skill runs applied a
  process-level polyfill (or explicitly handled the crash-prone pages) every time.
skill_section: "IPFS static export — Node 25 localStorage prerender crash"
status: open
notes: >-
  This is the strongest wiki-vs-skill separator in the set, and the model is closer to it
  than expected: no_skill gets the mechanism and refutes teammate B's instrumentation.ts fix
  from the process model in most runs (quiz-004 expect_1 & expect_2 pass 3/3). The gap is the
  last step — a durable fix that reaches the build worker, not app-code guards or a Node-24
  pin. Two no_skill quiz runs web-searched here (the only quiz task where any did), showing
  the model itself treats this as beyond stable parametric memory. Runs on Node 25.9.0; on
  older Node the crash never fires and the check would false-pass, which is why executors
  were pinned to Node 25+.
