category: incomplete-answer
symptom: >-
  Asked why a vesting page's claimable amount freezes on a Base fork, the answer nails the
  mechanism (anvil mines only on transactions, so block.timestamp is stale between them),
  explains why vm.warp tests pass, and gives the interval-mining fix — then stops at vesting.
  Nothing says that the same freeze hits every other time-dependent read on the fork:
  deadlines, expiry, auctions, cooldowns. The failing new-arm answers end on the permanent
  --block-time fix and an unrelated chains.foundry tip; the passing ones close with one line
  ("time-based UI — vesting, deadlines, expiry — behaves like a real chain").
expected_pattern: >-
  One sentence generalizing the failure: any block.timestamp-dependent behaviour on a
  transaction-mined fork stays frozen or advances in jumps — deadlines, expiry, vesting alike —
  so the fix is a property of the fork setup, not a patch for this contract.
skill_section: "Choose the local chain deliberately"
status: open
notes: >-
  Both skill texts name the wider class ("Any contract logic using timestamps (deadlines,
  expiry, vesting) will break silently" in 2f0adb01; "This silently breaks live deadlines,
  expiry, and vesting displays" in d9952522), so the words are there in both arms. The old
  text states it as a rule about contract logic in general; the new text lists what breaks
  in a display. At n=3 old 0/3 vs new 2/3 is weak evidence that the rule form carries into
  the answer and the list form does not — worth re-reading on the other three stacks before
  editing. The 2026-09-05 Opus 5 benchmark (effort unrecorded) read no_skill 3/3 and
  with_skill 0/6 on this expect; those numbers were filed under
  frozen-timestamp-wrong-oneoff-fix at the time and belong here.
