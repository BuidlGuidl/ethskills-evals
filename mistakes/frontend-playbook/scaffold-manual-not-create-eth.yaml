category: project-scaffold
symptom: >-
  Asked to build a USDC tip jar "from scratch" with a contract, a page, and a connect-wallet
  flow, every no_skill run hand-rolled the stack: forge init for the contract plus a manually
  assembled Next.js app, producing a /frontend + /contracts split. No run invoked
  create-eth. The result has none of the Scaffold-ETH 2 monorepo (no packages/foundry +
  packages/nextjs) and none of the generator-wired tooling — so wallet connection and
  contract reads/writes would be hand-written wagmi/RainbowKit and ABI plumbing rather than
  the scaffold-eth hooks and components.
expected_pattern: >-
  Scaffold with npx create-eth@latest (foundry flavor), yielding the SE2 monorepo
  (packages/foundry + packages/nextjs) and using the generated RainbowKit + wagmi + scaffold-eth
  hooks/components for wallet and contract interaction. All with_skill runs invoked create-eth
  (via the Skill tool) and passed both checks.
skill_section: "Start with the requested stack"
status: open
notes: >-
  This is the skill's headline prior and structurally its only coverage: goal-001 hands the
  executor an already-scaffolded template and every quiz opens post-scaffold, so the scaffold
  decision fires nowhere else in the set. The prompt never names Scaffold-ETH 2, create-eth,
  or forge — the scaffold path is a pure inference, and without the skill the model reaches
  for forge init + a manual Next.js app every time. expect_2 is conditional on expect_1 (a
  hand-rolled stack fails it mechanically), so 0/2 is one failure, not two — all three
  no_skill runs are that single scaffold miss. The cleanest binary separator in the whole
  benchmark: 0/3 vs 3/3, driven entirely by whether create-eth was used.
