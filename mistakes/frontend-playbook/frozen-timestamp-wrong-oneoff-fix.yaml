category: fork-mining-model
symptom: >-
  Asked why block.timestamp freezes on a Base fork and how to fix it, every no_skill run
  nailed the mechanism (anvil auto-mines one block per transaction, so between txs the
  latest block's timestamp is frozen; the first new tx mines at wall-clock and the value
  jumps the whole gap) and correctly proposed the permanent fix (--block-time 1 baked into
  the fork script). But for the one-off, live-demo fix they reached for evm_mine /
  evm_increaseTime (manual, per-block nudging) instead of continuous interval mining. The
  vesting number only advances on each manual mine, so the demo still stutters.
expected_pattern: >-
  One-off: cast rpc anvil_setIntervalMining 1 on the running fork, so blocks (and
  block.timestamp) advance every second without anyone transacting. Permanent: --block-time 1
  in the fork script. All with_skill runs gave exactly this pairing.
skill_section: "Fork mode — frozen block.timestamp / on-demand mining"
status: open
notes: >-
  Both variants diagnose the mining model correctly and both get the permanent --block-time
  fix; the delta is purely the one-off command (interval mining vs evm_mine). The no_skill
  answers are engineering-valid — a working manual mine plus the right permanent fix — they
  just miss the specific continuous-mining command the expect names, which is what makes a
  demo tick smoothly. Read this as a genuine skill delta AND a note on expect strictness:
  expect_3 requires the interval-mining one-off specifically. no_skill run3 mentioned
  setIntervalMining once in passing but still led with evm_mine and failed. quiz-005 no_skill
  did zero web searches — this came from parametric memory, and the memory stops one command
  short.
