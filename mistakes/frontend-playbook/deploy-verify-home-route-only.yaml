mistake_id: deploy-verify-home-route-only
skill: frontend-playbook
first_seen: 2026-07-24
frequency:                       # goal-001 expect_8 (verify routes on gateway, not just home)
  claude/claude-opus-4-8:
    no_skill: 2/3
    with_skill: 0/3
  claude/claude-opus-5:
    no_skill: 0/3                 # no longer occurs unaided — every run checked a non-home route
    with_skill: 0/3               # 0/3 on both skill revisions
category: ipfs-deploy-discipline
symptom: >-
  The post-deploy verification in no_skill DEPLOY.md files curls only "/" on the gateway
  (and greps the page title), then calls the deploy verified. A single-page-only check is
  exactly what misses the trailingSlash routing failure the skill warns about: / resolving
  is no evidence that /debug/ or any other route resolves — those 404 on a gateway when the
  export lacks per-route directory/index.html.
expected_pattern: >-
  Verify a non-home route on the gateway too (curl the /debug/ route or ls out/*/index.html),
  so the check actually exercises directory resolution rather than just the root index.html.
  with_skill runs verified routes beyond home.
skill_section: "Verify before and after upload"
status: open
notes: >-
  Companion to deploy-no-clean-rebuild-no-cid-proof (same DEPLOY.md, adjacent gap). Note the
  fork/config side is not the problem here: every no_skill goal-001 run set trailingSlash:
  true correctly (expect_5 3/3) — they build the right output but then under-verify it. One
  no_skill run did check a second route (2/3, not 3/3).
