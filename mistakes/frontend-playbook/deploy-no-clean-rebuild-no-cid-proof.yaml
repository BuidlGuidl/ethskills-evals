mistake_id: deploy-no-clean-rebuild-no-cid-proof
skill: frontend-playbook
first_seen: 2026-07-24
frequency:                       # goal-001 expect_6 (clean rebuild) + expect_7 (CID as proof)
  no_skill: 3/3
  with_skill: 0/3
category: ipfs-deploy-discipline
symptom: >-
  In the DEPLOY.md written unprompted for the tip jar, no_skill runs documented a build and
  upload flow that never deletes .next / out before rebuilding, and framed the CID only as
  "your immutable site version" — not as the verification signal. Neither half of the
  stale-build guard is present: nothing forces the rebuilt out/ to actually contain the
  change, and nothing tells the deployer that an unchanged CID means the old build shipped
  again.
expected_pattern: >-
  Delete .next and out before every production build (clean slate), and treat a CHANGED CID
  as the proof that new content actually shipped (identical CID = byte-identical content =
  stale build re-uploaded, no amount of gateway-cache waiting will help). with_skill DEPLOY.md
  files did both.
skill_section: "IPFS static export — stale build / clean rebuild / CID as proof"
status: open
notes: >-
  Knows-when-asked but does not apply: quiz-006 asks this claim directly and no_skill passes
  3/3 (the model refutes the gateway-cache theory from content-addressing cold). The same
  model, building unprompted, omits the clean rebuild and the CID-as-proof framing from its
  own deploy doc. The abstract fact is held; the operational discipline is not reached for.
  Mirror: quiz-006. Companion gaps in the same DEPLOY.md: see
  deploy-verify-home-route-only and og-metadata-not-prod-url.
