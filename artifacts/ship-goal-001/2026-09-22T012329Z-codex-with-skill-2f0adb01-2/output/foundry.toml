[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "ds-test/=contracts/test-support/ds-test/",
  "forge-std/=node_modules/forge-std/"
]

[fuzz]
runs = 1000
