# Single-node deployment: one app container, one volume for the SQLite database
# and uploaded photos. Put a TLS-terminating proxy in front of it in production.
services:
  toolshed:
    build: .
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: '8080'
      DATABASE_PATH: /data/toolshed.db
      UPLOAD_DIR: /data/uploads
      # Members need this to join. Change it, and rotate it when the roster does.
      INVITE_CODE: ${INVITE_CODE:-maple-street}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SECURE_COOKIES: 'true'
      PAYMENT_PROVIDER: mock
      ACCRUAL_INTERVAL_MINUTES: '15'
      LATE_GRACE_HOURS: '0'
    volumes:
      - toolshed-data:/data
    restart: unless-stopped

volumes:
  toolshed-data:
