[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun" # PoolManager uses transient storage
optimizer = true
optimizer_runs = 1_000_000
via_ir = true
bytecode_hash = "none" # keeps creation code deterministic for CREATE2 salt mining

remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "forge-std/=lib/forge-std/src/",
]

[lint]
lint_on_build = false
