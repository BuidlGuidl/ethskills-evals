[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun" # v4-core uses transient storage (EIP-1153)
optimizer = true
optimizer_runs = 1_000_000
bytecode_hash = "none" # keeps creation code (and thus mined hook address) stable across builds
ffi = false

remappings = [
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "v4-core/=lib/v4-periphery/lib/v4-core/src/",
  "v4-periphery/=lib/v4-periphery/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
