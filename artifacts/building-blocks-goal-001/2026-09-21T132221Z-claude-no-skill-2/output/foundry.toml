[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun" # v4-core uses transient storage
optimizer = true
optimizer_runs = 1000000
bytecode_hash = "none" # stable creation code -> stable CREATE2 hook address

remappings = [
    "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
    "v4-core/=lib/v4-periphery/lib/v4-core/src/",
    "forge-std/=lib/forge-std/src/",
    "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
