[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"   # v4-core uses transient storage (EIP-1153)
optimizer = true
optimizer_runs = 1_000_000
bytecode_hash = "none"   # keeps creation code stable so a mined CREATE2 salt stays valid
cbor_metadata = false

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
