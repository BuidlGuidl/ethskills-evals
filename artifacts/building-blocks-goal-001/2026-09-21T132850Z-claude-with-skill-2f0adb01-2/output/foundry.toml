[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun" # v4 relies on transient storage
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"

remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "forge-std/=lib/forge-std/src/",
  "solmate/=lib/v4-core/lib/solmate/", # only for PoolManager in tests
]
