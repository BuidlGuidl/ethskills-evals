# Entities are shaped around the three screens:
#   feed        -> CheckIn, ordered by timestamp desc
#   profile     -> Member (+ its derived checkIns)
#   leaderboard -> MemberMonth, ordered by checkIns desc within one month

type CheckIn @entity(immutable: true) {
  "txHash-logIndex"
  id: Bytes!
  member: Member!
  "UTC day index (Unix day number) the check-in counted for"
  day: Int!
  "YYYY-MM-DD, for display and for day-scoped queries"
  date: String!
  "Public note; empty string when the member left none"
  note: String!
  "The member's streak immediately after this check-in, as computed onchain"
  streakAfter: Int!
  "The member's all-time total immediately after this check-in"
  totalAfter: Int!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  logIndex: BigInt!
  """
  Strictly increasing chain order key: blockNumber * 100000 + logIndex. Unique and
  monotonic, so the feed can page with a `seq_lt` cursor instead of `skip`, which
  graph-node caps at 5000.
  """
  seq: BigInt!
}

type Member @entity(immutable: false) {
  "The member's address"
  id: Bytes!
  "All-time check-ins"
  totalCheckIns: Int!
  """
  Streak as of `lastCheckInDay`. This is NOT necessarily the streak to show in a
  UI today: a streak silently dies when a day passes with no check-in, and no
  event fires when that happens. Pass this through `liveStreak()` in the read
  client (src/streak.ts), which zeroes it once `lastCheckInDay` is older than
  yesterday.
  """
  currentStreak: Int!
  "Best streak the member has ever reached"
  longestStreak: Int!
  firstCheckInDay: Int!
  firstCheckInAt: BigInt!
  lastCheckInDay: Int!
  lastCheckInAt: BigInt!
  checkIns: [CheckIn!]! @derivedFrom(field: "member")
  months: [MemberMonth!]! @derivedFrom(field: "member")
}

"One row per member per calendar month — the leaderboard's unit."
type MemberMonth @entity(immutable: false) {
  "0xaddress-YYYY-MM"
  id: String!
  member: Member!
  "YYYY-MM (UTC)"
  month: String!
  checkIns: Int!
  "Used to break leaderboard ties in favour of whoever got there first"
  firstCheckInAt: BigInt!
  lastCheckInAt: BigInt!
}

"Community-wide daily rollup. Handy for activity charts; not required by the three screens."
type DayStat @entity(immutable: false) {
  "UTC day index as a string"
  id: String!
  day: Int!
  date: String!
  checkIns: Int!
}

"Singleton, id = \"global\"."
type Community @entity(immutable: false) {
  id: String!
  totalCheckIns: Int!
  totalMembers: Int!
  firstCheckInAt: BigInt!
  lastCheckInAt: BigInt!
}
