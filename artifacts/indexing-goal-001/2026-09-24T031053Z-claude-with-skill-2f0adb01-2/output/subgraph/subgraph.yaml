specVersion: 1.0.0
description: Daily onchain check-ins for a community on Base — feed, streaks, leaderboard.
repository: https://github.com/your-org/streak
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Streak
    network: mainnet
    source:
      abi: Streak
      address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      startBlock: 1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - CheckIn
        - Member
        - MemberMonth
        - DayStat
        - Community
      abis:
        - name: Streak
          file: ./abis/Streak.json
      eventHandlers:
        - event: CheckedIn(indexed address,indexed uint32,uint64,uint32,uint32,string)
          handler: handleCheckedIn
