# Local indexing stack: graph-node + IPFS + Postgres, pointed at a local anvil.
# See README.md ("Running locally") for the full sequence.
services:
  graph-node:
    image: graphprotocol/graph-node:v0.37.0
    ports:
      - "8000:8000"   # GraphQL (queries)
      - "8020:8020"   # JSON-RPC (deploys)
      - "8030:8030"   # indexing status
    depends_on:
      - ipfs
      - postgres
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      # `mainnet` is just the network *label* the subgraph is built with locally;
      # it points at anvil. host.docker.internal works on Docker Desktop; on Linux
      # the extra_hosts entry below makes it resolve too.
      ethereum: "mainnet:http://host.docker.internal:8545"
      GRAPH_LOG: info
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ipfs:
    image: ipfs/kubo:v0.33.0
    ports:
      - "5001:5001"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - graph-db:/var/lib/postgresql/data

volumes:
  graph-db:
