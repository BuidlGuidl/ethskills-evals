specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Streak
    network: base
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: Streak
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CheckIn
        - Member
        - Month
        - MonthMember
      abis:
        - name: Streak
          file: ./abis/Streak.json
      eventHandlers:
        - event: CheckIn(indexed uint256,indexed address,indexed uint256,string,uint256,uint256)
          handler: handleCheckIn
      file: ./src/streak.ts
