# Local graph-node for development: indexes the Streak contract on a local anvil.
services:
  graph-node:
    image: graphprotocol/graph-node:v0.38.0
    ports: ["8000:8000", "8020:8020", "8030:8030"]
    depends_on: [ipfs, postgres]
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      # host.docker.internal points at anvil running on the host.
      ethereum: "base:http://host.docker.internal:8545"
      GRAPH_LOG: info
    extra_hosts: ["host.docker.internal:host-gateway"]
  ipfs:
    image: ipfs/kubo:v0.34.1
    ports: ["5001:5001"]
  postgres:
    image: postgres:16
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
