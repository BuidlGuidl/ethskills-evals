"""
One check-in transaction. Backs the global feed (newest first, across everyone)
and the per-member history on the profile screen.
"""
type CheckIn @entity(immutable: true) {
  "txHash-logIndex"
  id: ID!
  member: Member!
  "Free-form public note, may be empty."
  note: String!
  "UTC day number (unix timestamp / 86400) the check-in belongs to."
  dayIndex: Int!
  "The member's streak length *as of this check-in*."
  streakAtCheckIn: Int!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  """
  Strictly increasing chain order key (blockNumber * 100000 + logIndex).
  Ordering the feed by this instead of by timestamp gives a stable total order
  (several check-ins can share a block timestamp) and lets the feed paginate with
  a cursor — `sequence_lt: $cursor` — instead of `skip`, which The Graph caps.
  """
  sequence: BigInt!
}

"""
Running per-member aggregates, updated on every check-in. Backs the profile screen.
"""
type Member @entity(immutable: false) {
  "Lowercase member address."
  id: ID!
  address: Bytes!
  "All-time number of check-ins."
  totalCheckIns: Int!
  """
  Streak as of the member's most recent check-in. A reader must compare
  `lastDayIndex` against today to know whether it is still alive — see
  `currentStreak()` in web/lib/streak.ts.
  """
  streakAtLastCheckIn: Int!
  "Best consecutive-day run ever."
  longestStreak: Int!
  "UTC day number of the most recent check-in."
  lastDayIndex: Int!
  firstCheckInAt: BigInt!
  lastCheckInAt: BigInt!
  checkIns: [CheckIn!]! @derivedFrom(field: "member")
  months: [MemberMonth!]! @derivedFrom(field: "member")
}

"""
Per-member, per-calendar-month check-in count. Backs the monthly leaderboard:
one indexed, sortable row per member per month, so "top N this month" is a single
ordered query instead of a scan over every check-in.
"""
type MemberMonth @entity(immutable: false) {
  "memberAddress-YYYY-MM"
  id: ID!
  member: Member!
  "Calendar month in UTC, e.g. \"2026-09\". Filter on this for the leaderboard."
  month: String!
  checkIns: Int!
  lastCheckInAt: BigInt!
}

"Community-wide counters, singleton with id \"global\"."
type Community @entity(immutable: false) {
  id: ID!
  totalCheckIns: Int!
  totalMembers: Int!
  lastCheckInAt: BigInt!
}
