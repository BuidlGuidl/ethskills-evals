specVersion: 1.0.0
description: Streak — daily onchain check-ins for a community on Base
repository: https://github.com/your-org/streak
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Streak
    network: base
    source:
      address: "0x0000000000000000000000000000000000000000" # <- deployed Streak address
      abi: Streak
      # Block the contract was deployed in. Indexing starts here, so the subgraph
      # covers the complete history from the contract's first day. Do NOT use a
      # recent block: that would silently drop months of check-ins.
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/streak.ts
      entities:
        - CheckIn
        - Member
        - MemberMonth
        - Community
      abis:
        - name: Streak
          file: ./abis/Streak.json
      eventHandlers:
        - event: CheckedIn(indexed address,indexed uint32,string)
          handler: handleCheckedIn
