services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streak
      POSTGRES_USER: streak
      POSTGRES_PASSWORD: streak
    ports:
      - "5432:5432"
    volumes:
      - streak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streak -d streak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  streak-postgres:

