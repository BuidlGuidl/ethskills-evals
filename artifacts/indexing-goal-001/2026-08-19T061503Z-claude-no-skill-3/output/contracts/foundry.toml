[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# Base supports Cancun; pinned so local builds match what gets deployed.
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000

[fmt]
line_length = 110

# forge script ... --verify picks these up.
[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
