"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Meta {
  status: JSON
}

type Query {
  checkIn(id: String!): checkIn
  checkIns(where: checkInFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): checkInPage!
  member(address: String!): member
  members(where: memberFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): memberPage!
  memberMonth(month: String!, member: String!): memberMonth
  memberMonths(where: memberMonthFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): memberMonthPage!
  stats(id: String!): stats
  statss(where: statsFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): statsPage!
  _meta: Meta
}

type checkIn {
  id: String!
  member: String!
  day: Int!
  timestamp: Int!
  note: String!
  streakAtCheckIn: Int!
  totalAtCheckIn: Int!
  blockNumber: BigInt!
  logIndex: Int!
  transactionHash: String!
  memberRecord: member
}

type member {
  address: String!
  totalCheckIns: Int!
  streakAtLastDay: Int!
  longestStreak: Int!
  firstDay: Int!
  lastDay: Int!
  firstCheckInAt: Int!
  lastCheckInAt: Int!
  lastNote: String!
  checkIns(where: checkInFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): checkInPage
  months(where: memberMonthFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): memberMonthPage
}

type checkInPage {
  items: [checkIn!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

