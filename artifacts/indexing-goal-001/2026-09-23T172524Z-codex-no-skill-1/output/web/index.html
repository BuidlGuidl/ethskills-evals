<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Streak</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="shell header">
      <div>
        <p class="eyebrow">Base community check-ins</p>
        <h1>Streak</h1>
      </div>
      <div id="sync-status" class="sync-status">Syncing</div>
    </header>

    <main class="shell layout">
      <nav class="tabs" aria-label="Screens">
        <button class="tab active" data-screen="feed">Feed</button>
        <button class="tab" data-screen="profile">Profile</button>
        <button class="tab" data-screen="leaderboard">Leaderboard</button>
      </nav>

      <section id="feed" class="screen active" aria-labelledby="feed-title">
        <div class="screen-header">
          <h2 id="feed-title">Live Feed</h2>
          <button id="refresh-feed" class="icon-button" title="Refresh feed">Refresh</button>
        </div>
        <ol id="feed-list" class="feed-list"></ol>
      </section>

      <section id="profile" class="screen" aria-labelledby="profile-title">
        <div class="screen-header">
          <h2 id="profile-title">Member Profile</h2>
        </div>
        <form id="profile-form" class="profile-form">
          <input id="profile-address" name="address" autocomplete="off" placeholder="0x member address" />
          <button>Lookup</button>
        </form>
        <div id="profile-result" class="profile-result empty">Enter a member address.</div>
      </section>

      <section id="leaderboard" class="screen" aria-labelledby="leaderboard-title">
        <div class="screen-header">
          <h2 id="leaderboard-title">This Month</h2>
          <button id="refresh-leaderboard" class="icon-button" title="Refresh leaderboard">Refresh</button>
        </div>
        <ol id="leaderboard-list" class="leaderboard-list"></ol>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
