# Self-hosted production home: one Postgres, one long-running indexer process.
#
#   cp indexer/.env.example indexer/.env.local   # fill in RPC + contract
#   docker compose up -d
#
# The API is then on http://localhost:42069 -- put it behind your reverse proxy
# and point the frontend's INDEXER_URL at it.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: streak
      POSTGRES_PASSWORD: streak
      POSTGRES_DB: streak
    volumes:
      # The backfill lives here. Losing this volume means re-indexing from the
      # contract's first block, so back it up like any other production database.
      - streak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streak"]
      interval: 5s
      timeout: 5s
      retries: 20

  indexer:
    build: ./indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./indexer/.env.local
    environment:
      DATABASE_URL: postgres://streak:streak@postgres:5432/streak
      DATABASE_SCHEMA: streak
    ports:
      - "42069:42069"

volumes:
  streak-pgdata:
