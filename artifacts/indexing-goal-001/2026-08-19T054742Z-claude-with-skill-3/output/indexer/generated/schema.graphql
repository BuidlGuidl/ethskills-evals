"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  checkIn(id: String!): checkIn
  checkIns(where: checkInFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): checkInPage!
  member(address: String!): member
  members(where: memberFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): memberPage!
  memberMonth(month: String!, member: String!): memberMonth
  memberMonths(where: memberMonthFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): memberMonthPage!
  _meta: Meta
}

type checkIn {
  id: String!
  ordinal: BigInt!
  member: String!
  note: String!
  day: Int!
  month: String!
  streak: Int!
  memberTotal: Int!
  timestamp: Int!
  blockNumber: BigInt!
