"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  checkIn(id: String!): checkIn
  checkIns(where: checkInFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): checkInPage!
  member(address: String!): member
  members(where: memberFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): memberPage!
  monthlyCount(month: String!, member: String!): monthlyCount
  monthlyCounts(where: monthlyCountFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): monthlyCountPage!
  dailyTotal(day: Int!): dailyTotal
  dailyTotals(where: dailyTotalFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): dailyTotalPage!
  _meta: Meta
}

type checkIn {
  id: String!
  member: String!
  day: Int!
  month: String!
  timestamp: BigInt!
  streak: Int!
  total: Int!
  note: String!
  blockNumber: BigInt!
  transactionHash: String!
  seq: BigInt!
  memberRecord: member
}

type member {
  address: String!
  total: Int!
  streakAtLastCheckIn: Int!
  longestStreak: Int!
  firstDay: Int!
  lastDay: Int!
  firstCheckInAt: BigInt!
  lastCheckInAt: BigInt!
  lastNote: String!
  checkIns(where: checkInFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): checkInPage
  months(where: monthlyCountFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): monthlyCountPage
}

type checkInPage {
  items: [checkIn!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

