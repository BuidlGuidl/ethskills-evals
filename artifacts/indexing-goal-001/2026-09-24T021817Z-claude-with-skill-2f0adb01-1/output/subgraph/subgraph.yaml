specVersion: 1.0.0
description: Daily onchain check-ins for a community on Base.
repository: https://github.com/your-org/streak
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Streak
    network: base
    source:
      abi: Streak
      # Filled in by `pnpm subgraph:configure` from contracts/deployments/<chain>.json,
      # or edit by hand. startBlock MUST be the contract's deployment block —
      # that is what makes the feed/streaks/leaderboard cover the full history.
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/streak.ts
      entities:
        - CheckIn
        - Member
        - MemberMonth
        - Month
        - Global
      abis:
        - name: Streak
          file: ./abis/Streak.json
      eventHandlers:
        - event: CheckedIn(indexed address,indexed uint32,uint32,uint32,string)
          handler: handleCheckedIn
