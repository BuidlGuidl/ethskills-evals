# Local indexing stack: graph-node + IPFS + Postgres.
#
# Anvil runs on the host (see scripts/seed-local.sh), not in here, so you can
# restart the chain without tearing down the indexer.
services:
  graph-node:
    image: graphprotocol/graph-node:v0.36.0
    ports:
      - "8000:8000" # GraphQL (queries)
      - "8001:8001" # GraphQL (subscriptions)
      - "8020:8020" # JSON-RPC (subgraph deploy)
      - "8030:8030" # indexing status
    depends_on:
      - ipfs
      - postgres
    extra_hosts:
      # Lets the container reach anvil running on the host.
      - "host.docker.internal:host-gateway"
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      # `local` is the network name used in subgraph.local.yaml.
      ethereum: "local:http://host.docker.internal:8545"
      GRAPH_LOG: info
      ETHEREUM_REORG_THRESHOLD: 1
      ETHEREUM_ANCESTOR_COUNT: 1

  ipfs:
    image: ipfs/kubo:v0.27.0
    ports:
      - "5001:5001"

  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
