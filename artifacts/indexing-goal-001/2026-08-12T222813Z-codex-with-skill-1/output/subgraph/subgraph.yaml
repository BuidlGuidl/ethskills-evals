specVersion: 1.2.0
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum
    name: Streak
    network: base
    source:
      # Replace with the deployment address before deploying.
      address: "0x0000000000000000000000000000000000000000"
      abi: Streak
      # Replace with the contract creation block so historical indexing is complete.
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CheckIn
        - Member
        - MonthlyMember
      abis:
        - name: Streak
          file: ./abis/Streak.json
      eventHandlers:
        - event: CheckedIn(indexed address,indexed uint256,uint256,string)
          handler: handleCheckedIn
      file: ./src/streak.ts
