specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Streak
    network: base
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: Streak
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [CheckIn, Member, MemberMonth]
      abis:
        - name: Streak
          file: ./abis/Streak.json
      eventHandlers:
        - event: CheckedIn(indexed address,indexed uint256,string)
          handler: handleCheckedIn
      file: ./src/mapping.ts
