[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10_000_000
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 32

# Exact gas numbers quoted in PLAN.md were measured with via_ir = false and
# optimizer_runs = 10_000_000. Do not silently change these knobs.
