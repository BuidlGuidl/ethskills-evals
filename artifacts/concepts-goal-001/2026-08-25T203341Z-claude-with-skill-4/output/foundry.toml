[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 20000
evm_version = "cancun"
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }]

[invariant]
runs = 256
depth = 100
fail_on_revert = false
shrink_run_limit = 5000

[fuzz]
runs = 512

[fmt]
line_length = 118
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
