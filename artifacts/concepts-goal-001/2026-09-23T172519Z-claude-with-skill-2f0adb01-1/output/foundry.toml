[profile.default]
src = "src"
out = "out"
libs = []
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 1000
via_ir = false
# No external dependencies. Nothing is installed into lib/ on purpose:
# every line of Solidity this project relies on lives in src/, test/ or script/.
remappings = []

[fmt]
line_length = 110
