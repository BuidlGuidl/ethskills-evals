[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 10_000
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
# `token` is the conventional accessor name for an ERC-20 reference; every indexer, script and
# frontend in this repo calls `billing.token()`. Renaming it to TOKEN() to satisfy the immutable
# naming lint would be worse than the lint.
exclude_lints = ["screaming-snake-case-immutable"]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
