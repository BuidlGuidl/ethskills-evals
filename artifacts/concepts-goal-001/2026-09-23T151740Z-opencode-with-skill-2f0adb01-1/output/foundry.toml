[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"

# Lints reviewed and consciously excluded:
#   unsafe-typecast   — the uint64/uint176/uint16 casts are bounded by design:
#                       timestamps fit uint64 until 2554, balances are bounded by
#                       USDC supply (~1e16, far below uint176's ~1.9e52), plan ids
#                       are length-checked in addPlan, and the dry-branch cast is
#                       safe because covered <= elapsed there.
#   block-timestamp   — the whole contract is a function of block.timestamp;
#                       validator nudges of a few seconds are worth micro-cents
#                       at these plan rates.
#   environment-read-across-mutation — chained relative vm.warp in tests is
#                       intentional and each read is fresh.
[lint]
exclude_lints = ["unsafe-typecast", "block-timestamp", "environment-read-across-mutation"]

# Uncomment when verifying on Base (chain id 8453, explorer basescan.org).
# [etherscan]
# base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.basescan.org/api" }

