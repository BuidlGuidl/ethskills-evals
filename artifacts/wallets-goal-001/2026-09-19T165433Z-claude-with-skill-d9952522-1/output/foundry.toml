[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Keep the metadata hash so the runtime bytecode entry.ts compares against is
# byte-for-byte what `forge build` produces from this exact source.
bytecode_hash = "ipfs"
