[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"

# Allow the deploy script to write the generated address file into the frontend.
fs_permissions = [{ access = "read-write", path = "../frontend" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
