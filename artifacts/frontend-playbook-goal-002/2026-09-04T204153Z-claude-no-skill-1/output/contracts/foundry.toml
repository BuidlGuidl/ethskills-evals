[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
# `token` is a public immutable whose getter is part of the ABI the frontend reads,
# so it keeps camelCase; the modifier bodies are small enough not to matter here.
exclude_lints = ["screaming-snake-case-immutable", "unwrapped-modifier-logic"]

[rpc_endpoints]
base = "${BASE_RPC_URL}"
local = "http://127.0.0.1:8545"
