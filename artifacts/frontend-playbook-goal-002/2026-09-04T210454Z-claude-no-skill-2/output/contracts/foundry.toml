[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 118

[lint]
# ERC-20 requires the lowercase `name`/`symbol`/`decimals` identifiers, and inlining the
# two one-line modifiers here would cost more in readability than it saves in bytecode.
exclude_lints = ["screaming-snake-case-const", "screaming-snake-case-immutable", "unwrapped-modifier-logic"]
