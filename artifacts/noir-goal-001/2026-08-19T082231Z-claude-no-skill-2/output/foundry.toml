[profile.default]
src = "src"
out = "out"
libs = []
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "./deployments" },
]
via_ir = false

[fmt]
line_length = 110
