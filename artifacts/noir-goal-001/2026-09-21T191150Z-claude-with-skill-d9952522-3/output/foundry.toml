[profile.default]
src = "contracts"
script = "script"
test = "test"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The deploy script prints addresses to deployments/; the demo reads the circuit artifact.
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./circuits/vote/target" },
]
remappings = [
  "forge-std/=node_modules/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "poseidon-solidity/=node_modules/poseidon-solidity/",
]

[lint]
lint_on_build = false
