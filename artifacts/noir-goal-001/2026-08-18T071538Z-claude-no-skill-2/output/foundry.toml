[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./test/fixtures" },
]

[lint]
# The verifier under src/verifiers is generated by `bb`; its style is not ours.
ignore = ["src/verifiers/*.sol", "script/*.sol"]

[fmt]
line_length = 120
