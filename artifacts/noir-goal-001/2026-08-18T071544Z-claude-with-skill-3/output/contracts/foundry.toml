[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]

# The bb-generated HonkVerifier requires >=0.8.21 and cancun.
solc_version = "0.8.27"
evm_version = "cancun"

# HonkVerifier is close to the 24KB EIP-170 limit; the optimizer keeps it under.
optimizer = true
optimizer_runs = 200

fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "../deployments" },
]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "poseidon-solidity/=node_modules/poseidon-solidity/",
  "@zk-kit/=node_modules/@zk-kit/",
]

# The verifier is generated by `bb write_solidity_verifier`; linting it is noise.
[lint]
ignore = ["src/verifiers/*.sol"]
