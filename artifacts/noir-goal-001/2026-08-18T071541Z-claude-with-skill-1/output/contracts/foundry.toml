[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# The generated HonkVerifier requires >=0.8.21 and cancun, and only fits under
# EIP-170 with the optimizer on.
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }]

[fmt]
line_length = 120
