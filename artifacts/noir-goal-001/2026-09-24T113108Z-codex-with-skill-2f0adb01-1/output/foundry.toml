[profile.default]
src = "contracts/src"
script = "contracts/script"
test = "contracts/test"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

remappings = [
  "@zk-kit/lean-imt.sol/=node_modules/@zk-kit/lean-imt.sol/",
  "poseidon-solidity/=node_modules/poseidon-solidity/"
]

