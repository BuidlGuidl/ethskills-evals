[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
lint_on_build = false
