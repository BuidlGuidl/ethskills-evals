[profile.default]
src = "contracts/src"
script = "contracts/script"
test = "contracts/test"
out = "out"
cache_path = "cache"
libs = ["lib", "node_modules"]
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
# The deploy script writes the deployed addresses here for the Node scripts.
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "poseidon-solidity/=node_modules/poseidon-solidity/",
]

[lint]
lint_on_build = false
