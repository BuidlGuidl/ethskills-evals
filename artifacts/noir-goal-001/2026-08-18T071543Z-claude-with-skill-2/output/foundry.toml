[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# The bb-generated HonkVerifier needs >=0.8.21 and cancun, and is far over the
# 24KB EIP-170 limit unless the optimizer is on.
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "./deployments" },
]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "lean-imt/=vendor/lean-imt/",
    "poseidon-solidity/=vendor/poseidon-solidity/",
]

[lint]
# The verifier is machine-generated; its style is not ours to fix.
ignore = ["src/verifiers/*.sol"]
# Public immutables are part of the ABI and read like getters at the call site
# (`voting.verifier()`), so they keep camelCase.
exclude_lints = ["screaming-snake-case-immutable"]
