[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"      # the generated Honk verifier needs MCOPY/TSTORE-era opcodes
optimizer = true
optimizer_runs = 200        # keeps HonkVerifier under the 24KB deployed-code limit
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./test/fixtures" },
]

[fmt]
line_length = 110
