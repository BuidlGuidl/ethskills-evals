[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# The generated Honk verifier needs cancun (mcopy/tstore-era opcodes) and the
# optimizer, or it blows past the 24KB contract size limit.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "./circuits" },
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./contracts/test/fixtures" },
]
