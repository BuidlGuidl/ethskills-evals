[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=node_modules/forge-std/",
  "@zk-kit/lean-imt.sol/=node_modules/@zk-kit/lean-imt.sol/",
  "poseidon-solidity/=node_modules/poseidon-solidity/"
]
