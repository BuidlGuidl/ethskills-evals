[package]
name = "vote"
type = "bin"
authors = ["dao-private-vote"]

[dependencies]
# Pure-Noir keccak256. We hash with keccak everywhere (leaves, Merkle nodes,
# nullifiers) so the membership tree can also be maintained on-chain in plain
# Solidity for a few hundred gas per level - no exotic hash precompile, and the
# root nobody has to trust.
keccak256 = { tag = "v0.1.3", git = "https://github.com/noir-lang/keccak256" }
