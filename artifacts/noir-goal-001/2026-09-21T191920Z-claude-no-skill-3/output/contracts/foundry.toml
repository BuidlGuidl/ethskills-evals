[profile.default]
src = "src"
out = "out"
libs = ["lib"]
cache_path = "cache"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# Deploy script writes addresses to ../deployments/<chainid>.json
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[lint]
# HonkVerifier.sol is generated by bb; its lint noise drowns out real output.
lint_on_build = false
