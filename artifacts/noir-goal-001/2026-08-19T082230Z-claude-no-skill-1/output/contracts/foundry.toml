[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "none"
# Deploy.s.sol writes the deployment addresses where the Node scripts look.
fs_permissions = [
  { access = "read-write", path = "../deployments" },
  { access = "read", path = "./test/fixtures" },
]

[fmt]
line_length = 120

[lint]
# The generated Honk verifiers trip a pile of style lints that are not ours to fix.
exclude_lints = ["incorrect-shift", "unsafe-typecast"]
