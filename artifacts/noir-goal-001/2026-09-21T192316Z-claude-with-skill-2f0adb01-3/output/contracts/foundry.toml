[profile.default]
src = "src"
out = "out"
libs = ["../node_modules"]
test = "test"
script = "script"
cache_path = "cache"
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# @zk-kit/lean-imt.sol is installed under the npm alias zk-kit-lean-imt-sol: foundry
# mangles remapping targets whose directory name ends in ".sol".
auto_detect_remappings = false
# Tests generate real proofs via NoirJS (scripts/test/prove-ballot.mjs).
ffi = true
# Deploy script writes the address book the Node scripts read.
fs_permissions = [
    { access = "read-write", path = "../deployments" },
]
remappings = [
  "forge-std/=../node_modules/forge-std/src/",
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "lean-imt/=../node_modules/zk-kit-lean-imt-sol/",
  "poseidon-solidity/=../node_modules/poseidon-solidity/",
]
