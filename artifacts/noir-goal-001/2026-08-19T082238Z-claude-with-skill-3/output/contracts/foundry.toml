[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"        # HonkVerifier needs MCOPY / transient-era opcodes
optimizer = true
optimizer_runs = 200          # keeps HonkVerifier under the 24KB code limit
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.default.fmt]
line_length = 110
