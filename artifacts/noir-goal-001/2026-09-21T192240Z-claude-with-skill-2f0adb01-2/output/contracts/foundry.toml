[profile.default]
src = "src"
out = "out"
libs = []
allow_paths = ["../node_modules"]
solc_version = "0.8.27"
evm_version = "cancun"          # required by the bb-generated HonkVerifier
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=../node_modules/forge-std/src/",
  "@zk-kit/=../node_modules/@zk-kit/",  # remapping straight to lean-imt.sol/ breaks: forge drops the slash after a dir ending in .sol
  "poseidon-solidity/=../node_modules/poseidon-solidity/",
]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./test/fixtures" },
]
