[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["../node_modules"]
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = false
fs_permissions = [{ access = "read-write", path = "../deployments" }, { access = "read", path = "test/fixtures" }]
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "poseidon-solidity/=../node_modules/poseidon-solidity/",
  "forge-std/=../node_modules/forge-std/src/",
]

[lint]
lint_on_build = false
