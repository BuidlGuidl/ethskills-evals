name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # build-index answers two questions that live only in history — which SKILL.md a
          # run was given, and which revision of the task's expect lines graded it — and one
          # of them can sit on a branch other than this one. A shallow checkout would let
          # the check pass on facts it simply could not see.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn tsc --noEmit

      - run: yarn test

      # --no-prs on purpose: pull request descriptions are edited by people at any time, and
      # a check that reads them would fail this branch because someone reworded another one.
      # The deploy tolerates them being unreachable; only the git-derived facts are enforced.
      - run: yarn build-index --strict --no-prs

      - name: site/derived.json is up to date
        run: |
          if ! git diff --quiet -- site/derived.json; then
            echo "::error::site/derived.json is out of date — this branch adds runs whose skill version or task revision is not cached."
            echo
            echo "The deploy host clones one branch shallowly and cannot look those up, so they have to be committed."
            echo "Run this locally and commit the result:"
            echo
            echo "    git fetch --all && yarn build-index && git add site/derived.json"
            echo
            git --no-pager diff --stat -- site/derived.json
            exit 1
          fi
          echo "cache is complete"

      - name: site builds
        run: |
          cd site
          yarn install --immutable
          yarn build
