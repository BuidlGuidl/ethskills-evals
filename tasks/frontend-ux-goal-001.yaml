skill: skills/frontend-ux
template: templates/se-2
input: |
  This workspace is a fresh Scaffold-ETH 2 project. Build a USDC staking
  dApp on top of it:

  - A Staker contract: users deposit USDC and can withdraw their full
    position at any time. Keep it minimal — no rewards logic needed.
  - A /stake page in the Next.js app where a user can stake, withdraw, and
    see their wallet USDC balance, their ETH balance (they need it for
    gas), and their staked position.

  The app targets Base, where USDC is
  0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913. For local development you may
  deploy a mock token, but keep it faithful to the real one.

  Treat this as a real product: the page goes in front of real users at the
  end of the week. You do not need to deploy anywhere or run the app —
  finished, committed code is the deliverable.
expect:
  - "Amounts shown to the user carry USD context alongside the token amount; the ETH gas balance in particular shows a USD value from a real price source (SE-2's native-currency price), not a 1:1 stablecoin shortcut, and bare token units with no USD context anywhere are a fail."
  - "Failed or rejected transactions surface a human-readable message in the UI near the triggering action; raw revert data, raw error objects, or silent failures are a fail."
  - "Page metadata is the staking app's own: the tab title and OG/social tags (title, description) are set for the staking app, not left as Scaffold-ETH 2 template defaults. Two template sites carry the default: the 'Scaffold-ETH 2 App' title exported from the root app/layout.tsx, and the '%s | Scaffold-ETH 2' titleTemplate in utils/scaffold-eth/getMetadata.ts, which Next.js appends to titles set on child routes (the root default renders as-is). A pass changes the root app/layout.tsx title and description; a run that leaves the titleTemplate suffix in place still passes, since the suffix is generic framework attribution rather than the app's title. No app/layout.tsx change in the diff is a fail, and metadata set on app/stake/page.tsx alone does not pass: the home page and every shared link still carry the root default. Other layout files (app/blockexplorer/layout.tsx, a new app/stake/layout.tsx) do not count. Graded on the metadata alone — updated visible branding does not satisfy this line."
  - "Visible branding is the staking app's own: the header/logo text and any product name rendered on the page name the staking app, not Scaffold-ETH 2. The template default is components/Header.tsx rendering 'Scaffold-ETH' / 'Ethereum dev stack' next to the SE2 logo. A pass needs a Header.tsx hunk in the diff that removes or replaces those two strings. The judge sees only the diff: no Header.tsx change means the default is still shipped and is a fail, and a Header.tsx change that leaves those lines untouched (a nav link added to menuLinks, say) is the same fail — the default strings never appear in such a diff, and their absence is not evidence they were changed. Graded on visible branding alone — updated metadata does not satisfy this line."
  - "The /stake page uses SE-2's theme tokens and stays coherent under the template's light/dark switcher: page background, surfaces, and text use semantic theme classes (bg-base-*/text-*), with no hardcoded full-page dark wrapper (bg-black, bg-gray-900, or raw dark: overrides). If dark-only was a deliberate choice, the theme control is removed."
  - "The build is actually retargeted at Base in scaffold.config.ts: targetNetworks includes base, not left on the hardhat-only default. Polling stays healthy: the template's pollingInterval default (3000) is already responsive, so a pass means not degrading it — a sluggish interval (10s+) with no post-transaction refetch/invalidation is a fail, as are runaway request patterns (uncleaned intervals, duplicate watchers, block-watching multiplied by an interval)."
runs: 3
notes: |
  Goal task for skills/frontend-ux (vendored at 191dcc1, source
  ethskills.com/frontend-ux/SKILL.md), drafted 2026-07-15 per issue #1.
  The prompt never names the skill's claims; each is a decision on the way
  to the goal. Staking an ERC-20 forces the approve flow (Rules 1-2:
  per-button pending states through confirmation, one primary action at a
  time). USDC forces the 6-decimals conversion (Rule 9) — "faithful to the
  real one" is the only nudge, so a stale prior ships an 18-decimal mock or
  parseEther. "Real product / real users" licenses Rule 7 (error
  translation) and Rule 8 (metadata/branding) without naming them. Rule 4
  (USD context) is forced through the ETH gas balance rather than USDC —
  a stablecoin's dollar figure is ~1:1 and trivial, so the prompt asks for
  the ETH balance, whose USD value needs a real price lookup (SE-2 ships
  the native-currency price); no_skill runs typically render token units
  alone, which is exactly the habit the rule targets. Rule 6 (theming) is
  the added expect 7 — a visual-only claim with no quiz, so the goal is
  its only coverage. Deliberately left out: Rule 3 (address UX — the SE-2 template's
  Address component makes it low-signal); quiz-005 carries that rule
  instead. Reads together with the quizzes per the issue's verdict table
  (knows-when-asked vs applies-unprompted): expect 1 mirrors quiz-003
  (four-state flow), expect 2 mirrors quiz-001 (button lifecycle), expect
  3 mirrors quiz-002 (USDC decimals). Expects 4-6 (USD context, error
  translation, metadata) have no quiz on purpose — asked directly they
  are pure retrieval — so the goal is their only coverage. Expect 8
  carries Rule 5, which no quiz covers: targeting Base forces a real
  scaffold.config.ts edit (the template ships targetNetworks:
  [chains.hardhat]), making the chain retarget an observable build
  decision. The template's pollingInterval default is 3000 — already in
  the skill's healthy range — so polling only discriminates in the
  negative direction: degrading the interval without refetch, or runaway
  request patterns, fail; an untouched default passes.

  RUBRIC FIXED 2026-09-17, per issue #79 (from reports/frontend-ux-minimal-2026-08-12.md
  and review of #58). Expect numbers in the paragraph above are the original
  eight-line rubric. Two changes. (1) Old e6 bundled metadata and branding into
  one pass/fail, and a no_skill run passed it on a Header.tsx rewrite with
  'Scaffold-ETH 2 App' still exported from layout.tsx; it is now two lines,
  metadata (new e3) and branding (new e4), so the judge cannot trade one for
  the other. Both name the template default and what its absence from the
  diff means, because a template run is judged on run.diff alone: an
  untouched Header.tsx or app/layout.tsx leaves no hunk, and without the stated
  default one judge passes on silence while another fails by inference. Two
  stored-run shapes are settled by name, because the silence rule alone does
  not reach them: every stored run touches Header.tsx (a Stake nav link in
  menuLinks) without reaching the branding lines, so e4 requires the hunk to
  remove or replace the strings; and the 2026-08-12 no_skill runs export
  getMetadata on app/stake/page.tsx with app/layout.tsx untouched, so e3
  says the root layout must change. e3 also settles the titleTemplate suffix
  ('%s | Scaffold-ETH 2' in getMetadata.ts): an app/layout.tsx-only edit still
  ships it on child routes, and that passes.
  (2) Old e1/e2/e3 were 3/3 in both variants across #27 and #58 and
  are the same claims quiz-003, quiz-001 and quiz-002 already grade, so they
  are dropped. Old e7 (theme tokens) and e8 (Base retarget, polling) were
  saturated too but are the only coverage of Rules 5 and 6 anywhere in the
  suite, and cost nothing extra — the SE-2 build runs anyway for e1/e2 — so
  they stay, as new e5 and e6. Mapping: old e4->e1, e5->e2, e6->e3+e4, e7->e5,
  e8->e6. Input unchanged. All 12 stored runs were regraded on this rubric
  the same day (*-regrade-1 dirs, judge held at the source's model, effort
  medium): e3 (metadata) 6/6 with_skill vs 0/6 no_skill, e4 (branding) 3/6
  vs 0/6 — the three 2026-07-24 with_skill runs passed old e6 on metadata
  alone and fail e4, which is the trade the split was meant to close. e1
  3/6 no_skill, e2 5/6, e5 6/6 both, e6 5/6 no_skill. Source grades stay as
  the historical reading. Needs a fresh 3+3 run.
