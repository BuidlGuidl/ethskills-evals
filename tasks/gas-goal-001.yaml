skill: skills/gas
input: |
  I want to build an escrow service for freelance payments. Each job holds
  somewhere between $2,000 and $50,000 until the work is delivered. Build me
  the escrow smart contract and set it up so I can deploy it — pick whatever
  tooling you'd use.

  Work in this directory. Include a short README.md covering how to deploy
  it, and where you'd deploy it and why, so I know what to do next.
expect:
  - "The workspace contains an escrow contract plus a deploy setup (hardhat, foundry, or scaffold-eth) whose config names a specific target network — the deployment target is an actual decision that got made, not left open."
  - "The deployment is not reflexively placed on an L2 out of gas-cost concern: either mainnet is the configured target, or mainnet is acknowledged as viable for holding $2,000-$50,000 per job and any L2 choice rests on a reason other than mainnet being too expensive."
  - "Every cost figure is internally consistent: any gwei value agrees with the wei reading it came from, and any dollar figure follows from gas_used x gas_price_gwei x 1e-9 x eth_usd using the stated ETH price. A figure off by a factor of 1e9 (a wei reading used as gwei, or the reverse), or one that does not follow from its own quoted inputs, fails. A README that quotes no cost figure at all cannot pass this line."
  - "If the deploy setup or README specifies fee values, maxFeePerGas is in the single-digit-gwei range (roughly 1-2 gwei) and maxPriorityFeePerGas is a fraction of a gwei — not the tens-of-gwei values a stale prior produces. A setup that omits fee overrides entirely also passes."
  - "The deployment recommendation rests on a reading taken during the run, not on a remembered or unsourced number: the README states a current gas price or base fee for at least one candidate chain, in units, together with the ETH price behind any dollar figure. A README that names a target and argues it only qualitatively (\"low fees\", \"cheap enough\", \"gas is expensive on mainnet\") fails, as does one whose numbers appear with no indication of what they were read from."
runs: 3
notes: |
  Goal task for skills/gas per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Deliberate mirror
  of gas-quiz-001: same escrow scenario, same $2k-$50k value spec, but the
  chain is never named and never asked about — the when-to-use-mainnet-vs-L2
  decision has to surface unprompted, on the way to a deployable contract.
  Read the two together: quiz-001 measures knows-when-asked, this measures
  applies-unprompted, and only the split (quiz passes both variants, goal
  no_skill fails / with_skill passes) reaches the "keep as skill" verdict in
  the issue's table — no quiz combination can. Bare workspace, no template,
  on purpose: handing a template pre-picks the framework and kills the
  hardhat-vs-foundry-vs-scaffold-eth signal. Record which framework each run
  reaches for. Nothing is broadcast; a deploy config is the artifact, not a
  live deployment.

  RUBRIC FIXED 2026-08-31, in review of PR #57. None of the four original
  expects required a measurement: expect_4 explicitly passed a setup with no
  fee overrides and expect_3 only bit on an estimate that was actually stated,
  so a run that measured nothing and picked mainnet on unrelated grounds
  scored 4/4 — and two did (2026-08-27T233445Z-codex-with-skill-2 and
  2026-08-28T013258Z-codex-with-skill-1, neither of whose transcripts contains
  a single base-fee, gas-price, gwei or price lookup). expect_5 now requires
  the reading, on the model of gas-goal-002's expect_4. expect_3 was rewritten
  at the same time: it had become a strict subset of expect_2 (all three
  controls quoted no estimate at all and passed it), and now grades unit and
  arithmetic consistency instead — which is also the only line that can catch
  the wei-as-gwei error the skill's conversion clause addresses. Runs with
  committed output/ were regraded in place against the new list; the 2026-07-24
  and 2026-08-10 sets have no committed evidence and remain graded against the
  old one, which their result.yaml now shows as a missing expect_sha.
