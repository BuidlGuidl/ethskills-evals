skill: skills/gas
input: |
  I want to build a social feed for AI agents. We're committed to the Ethereum
  ecosystem. Which chain should I deploy on, and why?

  Write your answer to answer.md in this directory. Show the numbers you used
  and the reasoning behind the recommendation.
expect:
  - "answer.md gives a concrete chain recommendation backed by current per-action costs in numbers, not a bare pick."
  - "The recommended chain is inside the Ethereum ecosystem, as the prompt asks: mainnet, an L2, or an EVM chain that positions itself as part of the Ethereum ecosystem (Polygon PoS, Gnosis, an app-specific rollup). A chain outside it (Solana, Sui, etc.) fails this line and only this line; the reasoning is graded by condition 3."
  - "The recommendation is derived from the traffic profile — high frequency, near-zero value per action. Discussing mainnet is not required; if mainnet is discussed, it is weighed on that profile rather than dismissed out of hand. A defended mainnet or non-L2 pick that reasons from the profile passes; a right pick whose only argument is that mainnet is 'too expensive' or 'not viable', with no engagement with the profile, fails. This line grades the reasoning, not the noun, and not the mainnet number — a wrong dollars-per-action figure is condition 4's failure, not this one's."
  - "If a mainnet cost is quoted for comparison, it is in the cents-or-below range at a live-checked sub-1-gwei gas price, not the dollars-per-action figure a stale 20-30 gwei prior produces."
runs: 3
notes: |
  Quiz task for skills/gas per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Mirror of
  gas-quiz-001: that one tests the mainnet direction of the
  when-to-use-mainnet-vs-L2 rule (high-value, low-frequency), this tests the
  L2 direction (high-frequency, near-zero value). "For AI agents" is
  deliberate — "build a social app" lets the model pattern-match social->L2
  from training without reasoning, so the novel framing forces it to reason
  from the traffic profile. The pick doesn't discriminate (stale and current
  worldviews both say L2); the reasoning does, so the expects fail a
  right-pick-wrong-reason answer that disqualifies mainnet on cost. Bare
  workspace, answer is a file.

  SCOPE FIXED 2026-08-28. The prompt did not say Ethereum, so 2 of 3 controls
  in the 2026-08-28 run answered Solana and failed expect_2, which requires an
  L2 — a scope condition the prompt never stated, not a cost misconception.
  "We're committed to the Ethereum ecosystem" anchors the answer without naming
  mainnet or any L2, so the pick still has to come from the traffic profile.
  Runs before this date are not comparable. See
  reports/gas-minimal-2026-08-28.md.

  RUBRIC FIXED 2026-09-17, per issue #103. expect_2 hardcoded the destination
  ("lands on an L2") — the opposite of what the paragraph above says the task
  measures. It never discriminated on reasoning: 6/6 in both variants of the
  counted 2026-08-28 set, and its only failures were the two pre-scope-fix
  controls that answered Solana. Now split: expect_2 is the scope line (inside
  the Ethereum ecosystem, as the prompt asks), expect_3 grades the derivation
  from the traffic profile, and the old expect_3 (live-checked mainnet cost)
  moves to expect_4 unchanged. Two guards from review: expect_2 is worded to
  the prompt ("Ethereum ecosystem"), not "settles to Ethereum", so a
  Polygon PoS or Gnosis pick reached by right reasoning does not fail on the
  noun again; and expect_3 leaves the mainnet figure to expect_4, so one
  stale 20-30 gwei sentence costs one line, not two. Mainnet is optional in
  expect_3 as it is in expect_4: an answer that picks from the profile and
  compares L2s only is graded on that derivation, not on a mainnet paragraph
  it never wrote. Input unchanged. Runs before this date were graded on the
  three-line rubric and are not comparable; no regrade, they stay historical.
  Needs a fresh 3+3 run.
