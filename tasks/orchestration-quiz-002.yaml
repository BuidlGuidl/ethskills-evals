skill: skills/orchestration
input: |
  Our staking dApp is live on Base mainnet (Scaffold-ETH 2 stack, foundry
  flavor; contracts deployed and verified three weeks ago, ~$40k TVL).
  Yesterday we confirmed a bug: the vault contract's early-withdrawal fee
  is computed at the wrong decimals scale, so withdrawals under 100 USDC
  get charged roughly 10x the intended fee. No funds are at risk beyond the
  overcharge, but users are starting to notice.

  Our PM wants the fastest path and points out the frontend already
  controls the withdrawal form: "add a 100 USDC minimum in the UI today so
  nobody hits the bug, and we avoid a redeploy — migrating stakers and
  re-doing approvals is heavy."

  Write the fix plan to answer.md in this directory: what we ship today,
  what we ship this week, and the concrete steps in order. Be explicit
  about whether the UI minimum resolves the incident, and why or why not.
expect:
  - "answer.md rejects the PM's UI minimum as a resolution, with the load-bearing reason: the contract is publicly callable onchain (direct calls, integrators, other frontends), so a frontend-only guard binds nobody and the overcharge stays live regardless. If the UI minimum appears in the plan at all, it is framed as a temporary mitigation while the real fix ships — never as the fix."
  - "The real fix goes back to local first, in order: reproduce the bug locally against Base state (yarn fork / anvil fork / a fork-mode forge test all count), fix the fee math in the contract source, and add a regression test covering the small-withdrawal case BEFORE any redeploy. A plan that hot-patches the contract and redeploys straight to mainnet without local reproduction and a regression test fails this line."
  - "The plan lands the fix onchain and completes the loop: deploy the corrected contract to Base (or upgrade, if it assumes a proxy), point the frontend at the new deployment, and address existing stakers/state (migration or comms — mechanism is their choice). It acknowledges the live contract can't be edited in place."
runs: 3
notes: |
  Quiz task for skills/orchestration per issue #1. One claim per quiz; this one targets
  the phase-transition rule (SKILL.md "Phase Transition Rules"): a live
  contract bug goes back to Phase 1 — reproduce locally, fix, write a
  regression test, redeploy — and you never hack around bugs in production.
  Hallucination-prone behavior rather than stale fact: under schedule
  pressure agents endorse frontend workarounds for contract bugs, which
  bind nobody (the contract is a public API) and leave the bug live
  onchain.

  Quiz shape: the hack is the premise, argued with a real cost (staker
  migration is heavy), so a pass must push back unprompted. The bug is an
  overcharge on purpose — no exploit angle — so security-incident reflexes
  (pause, war room) don't crowd out the graded decision. The phases are
  never named; expect_2 grades the back-to-local discipline in substance.
  The scenario says the contracts were verified three weeks ago and
  expect_3 does not grade re-verification, so a failure here can't be
  confused with orchestration-quiz-001's verify claim.

  Expected friction, and the reason to read expect_2 closely: SKILL.md's
  "Phase Transition Rules" has rows for a Phase 3 bug (→ Phase 2) and a
  Phase 2 contract bug (→ Phase 1), but no row for this case — a contract
  bug found in Phase 3. The graded answer is the two-hop composition
  (Phase 3 → Phase 2 → Phase 1: reproduce on a local fork, fix, regression
  test, redeploy). A with_skill run that applies the table literally and
  stops at "back to Phase 2" is a skill gap, not judge noise: file it as a
  mistake record against "Phase Transition Rules" and propose the missing
  row rather than reading it as a negative delta.

  This claim deliberately has no goal twin: the scenario is already
  decision-shaped, and an incident goal would read as a near-duplicate.
  orchestration-goal-001 instead pairs with orchestration-quiz-001.

  Record whether runs propose the UI clamp as interim mitigation
  (acceptable if framed temporary) vs as the resolution (the failure the
  skill exists to prevent).

  Skill vendored at skills/orchestration (source
  ethskills.com/orchestration/SKILL.md, @ 191dcc1).
