skill: skills/l2s
input: |
  We ship a game token in Q4. One supply, live on both Base and OP Mainnet, and
  players have to be able to move their balance between the two from inside the
  game — no "go use a bridge site" detour, and we would rather not run a relayer
  ourselves if there is a way around it.

  Design the cross-chain layer: what we deploy on each chain, what happens when a
  player moves a balance, and who or what carries the message. Then split it for
  me: what we can actually commit to shipping in Q4, and what would be a bet.
  Say what you're assuming about Base and OP Mainnet that this design would
  break if it stopped holding.

  Write your answer to answer.md in this directory.
expect:
  - "answer.md does not present OP Stack native interop — SuperchainERC20 crosschainMint/crosschainBurn, CrossL2Inbox, L2ToL2CrossDomainMessenger, SuperchainTokenBridge — as something that can be shipped on Base and OP Mainnet in Q4. It states that Superchain interop messaging is not live on those mainnets today. What the answer says about when it might land is not graded: 'targeted for a later upgrade this year', 'no committed date' and 'still in active development' all pass. Naming that stack as the future/bet half of the split, alongside a design that works today, passes; naming it as the Q4 commitment fails. An answer that never raises SuperchainERC20 or native interop at all passes this line, provided its Q4-committed design does not depend on shared-stack messaging."
  - "answer.md names Base's departure from the OP Stack / Optimism Superchain — announced February 2026, and running on its own Base-operated stack and client since the Azul upgrade in May 2026 — as a reason not to build Base<->OP Mainnet coupling on shared-stack features. The input asks outright what the design assumes about the two chains that could stop holding, so this is a question the answer was given room to answer. No date, month or upgrade name is required, and either tense passes: 'Base announced it is leaving the Superchain', 'Base has left', 'Base runs its own stack now' and 'Base is no longer a Superchain member' all satisfy this line. What fails is an answer that never raises the departure at all, or that treats the two chains as sharing a stack, a client or an upgrade schedule."
  - "The Q4-committable design is concrete and works on mainnet today: a lock/mint or burn/mint token paired with a named messaging or bridging layer (e.g. LayerZero OFT, Chainlink CCIP, Hyperlane, Wormhole NTT, Axelar, Across, or a canonical round-trip through L1), with the answer saying who or what relays the message and what has to be trusted for a transfer to settle. A design that stops at 'bridge the token' with no named layer, or that leaves the trust assumption unstated, fails."
  - "No overcorrection: answer.md does not claim Base is ceasing to be an Ethereum L2, that its existing bridges or deployments break, or that the game should therefore not deploy on Base. As of August 2026 Base is an Ethereum L2 running its own Base-operated stack and client, on its own upgrade cadence, with its existing chain id, contract addresses, deployments and canonical bridge intact. Saying the separation has already happened is correct and passes. Recommending a different chain pair for other stated reasons is fine; asserting Base is going away, or is no longer an Ethereum L2, fails."
  - "Conditional, and only when the design pins where the token lives on each chain — a stated deployment address, an address-consistency requirement, or a deploy script. It then has to get there deterministically: CREATE2/CREATE3 from the same factory with the same salt and bytecode, or another mechanism the answer names. Assuming two independent deployments land on the same address by themselves fails, and so does treating a shared address as the thing that makes the messaging layer work. A design that never pins addresses passes this line untouched."
runs: 3
notes: |
  Quiz for skills/l2s, one claim: Base announced in February 2026 that it is
  leaving the OP Stack / Superchain, so Base<->OP Mainnet designs cannot rest on
  shared-stack features. The claim is buried inside an architecture decision —
  a stale prior treats both chains as Superchain members and reaches for
  SuperchainERC20 plus native interop, which fails expects 1 and 2 without the
  prompt ever naming either.

  Ground truth checked 2026-07-31. Base announced the move to its own stack on
  2026-02-18 (Coinbase blog; Unchained, The Block); node operators migrate to
  Base's client ahead of upcoming hard forks, and Base remains an Ethereum L2
  throughout — hence expect_4. The "~99% shared code" figure attributed to
  Optimism has no primary source located; treat it as unverified and do not
  build an expect on it. Superchain
  interop: SuperchainERC20 exists and the predeploys (CrossL2Inbox,
  L2ToL2CrossDomainMessenger, SuperchainTokenBridge) are testnet/devnet, with no
  committed mainnet date (docs.optimism.io/interop). The skill states both facts
  itself: the Base departure and "cross-chain interop is designed but not yet
  fully live".

  The skill contradicts itself here and the run may show it: the selection table
  still answers "multi-chain deployment" with "Base or Optimism — Superchain /
  OP Stack, shared infra", one section above the departure note. A with_skill
  failure on expect_1 or expect_2 most likely traces to that row, which is a
  skill fix, not a model failure — check the transcript before reading it as a
  model result.

  expect_5 covers the skill's CREATE2 multi-chain section (SKILL.md L162-174)
  and is conditional on purpose: a lock/mint design does not need matching
  addresses, and OFT/NTT deployments routinely differ across chains. What it
  catches is the assumption that the same bytecode lands at the same address on
  its own.

  RUN-DAY GATE (blocking). Three expects rest on in-flight states that can rot
  between merge and run, and the offline judge cannot notice. Before running,
  re-check docs.optimism.io/interop for whether Superchain interop messaging has
  reached Base or OP Mainnet mainnet, and whether Base's separation hardfork has
  landed:
    (a) interop still testnet/devnet and the hardfork still pending -> run as
        written;
    (b) interop live on either mainnet -> expect_1 now fails every correct
        answer; rewrite it to grade the chain pair it is live on, or pull the
        task;
    (c) Base's separation hardfork landed -> expect_4's "asserting Base has
        already left fails" now fails an answer that has become true; drop that
        clause and keep the rest of the line.
  Verified 2026-07-31 (interop) and 2026-08-03 (no hardfork announced).

  RUN-DAY GATE RESOLVED 2026-08-19, before the first run.
    (a) holds: interop is still not mainnet-live on Base or OP Mainnet.
        docs.optimism.io/interop now 404s; the explainer page carries "OP Stack
        interop is in active development. Some features may be experimental.",
        ethereum-optimism/optimism discussion #18939 reports devnets only, and
        Optimism's own USDT0 post says assets "will tap into native Superchain
        interop" as it "rolls out". expect_1 runs as written.
    (c) TRIGGERED: Base's separation landed on mainnet. base/node v0.16.0
        (2026-05-22) dropped "support for all clients except base-reth-node and
        base-consensus", mainnet deadline 2026-05-28 for Base Azul; the Base
        engineering blog states "Azul, our first network upgrade, established
        the Base Stack as a new foundation for the chain" and that Reth is "now
        the sole client used by Base since Azul"; Beryl, Base's second
        independent upgrade, activated on mainnet 2026-06-25/26 with its own B20
        token standard and its own withdrawal-finalization change (7 days to 5).
        Per the gate, expect_4's "the separation is already complete" and "has
        already left" clauses are dropped — a run that says the separation has
        happened is now stating a fact — and the line's framing is updated to
        August 2026. The rest of expect_4 (not an L2, bridges/deployments break,
        do not deploy on Base) is unchanged, and that is still what it grades.
        expect_2 is untouched: it grades that the departure is named at all,
        which an answer describing it as announced or as done both satisfy.

  Bare workspace, answer is a file. Executors need network access.

  Record, do not grade: which messaging layer each run picks, and whether the
  interop status was reached from the skill, from the model's own knowledge, or
  from a live docs check.

  The 2026-08-20 benchmark evaluated the skill vendored from
  ethskills.com/l2s/SKILL.md @ 191dcc1 — 187 lines of chain, cost, RPC, DEX and
  bridging tables. skills/l2s has since been cut to 51 lines: the corrections a
  2026 prior gets backwards, the exit and deploy mechanics, and a selection
  table keyed on the binding constraint, with the number tables removed. Take
  the skill state for any run from its own report.
  AFTER THE MINIMAL REWRITE (branch skill/l2s-minimal, from the 2026-08-20 findings).
  This is the one task in the l2s set whose claim survives the rewrite intact and
  the only one with a measured delta (3/3 vs 0/3 on expect_2). The skill keeps the
  Base paragraph in full, with the tense corrected — announced February 2026, live
  on mainnet since Azul (May 2026), Beryl (June 2026) as a second independent
  upgrade — and keeps the overcorrection guard expect_4 grades: still an Ethereum
  L2, chain id 8453, addresses, deployments and canonical bridge unchanged. The
  interop paragraph expect_1 grades is also kept, and now names the four pieces of
  the stack explicitly.

  expect_2 was re-tensed in the same edit. It previously read "names Base's
  announced departure ... the announced departure is [required]", which is one
  spelling of a right answer: with the separation live on mainnet, the natural
  correct phrasing is "Base has left" or "Base runs its own stack", and a judge
  reading the old line literally could fail it. Both tenses now pass explicitly.
  See the false-negative pattern in issue #1 (tools quiz-004 / goal-001).

  The 2026-08-20 numbers are the pre-edit baseline. A re-run measures whether the
  corrected tense reaches the deliverable (l2s-base-departure-tense: 2/3 with_skill
  echoed the stale "finalized in a future hardfork"), not whether the delta holds.
