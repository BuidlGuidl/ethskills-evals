skill: skills/orchestration
input: |
  We're a two-person team with a working Scaffold-ETH 2 dApp (foundry
  flavor): a creator-tipping app where fans tip creators in USDC and the
  contract takes a 1% platform fee. Everything runs and passes tests on the
  local fork — the full user journey works with a browser wallet against
  localhost.

  Nothing has touched a live network yet: no live deployment, no funded
  accounts, nothing public. Target chain is Base. We want real users on a
  public URL.

  Write LAUNCH.md in this directory — the repo itself isn't checked out
  here, the document is the whole deliverable: the complete ordered path
  from where we are today to live in production — the exact commands and
  config changes at each step, what we check before moving to the next
  step, and, where something can go wrong, how we'd catch it before users
  do. Assume we'll follow it verbatim, so order matters.
expect:
  - "LAUNCH.md stages the rollout: contracts are deployed to Base mainnet while the frontend is still running locally, and the frontend reaches a public URL only in a later step. A plan that goes straight from localhost to deploying both contracts and frontend publicly in one hop fails this."
  - "Before any step that puts the frontend on a public URL, the full user journey is tested against the live contracts with a real wallet and small real amounts (on the order of $1-10). A plan that never tests live with real funds before going public fails this, even if the rollout is otherwise staged."
  - "Contract verification (yarn verify --network base or equivalent) appears as its own step immediately adjacent to the contract deploy step — not deferred to a later pre-launch checklist, and not omitted."
  - "The plan never requires obtaining a block explorer API key (Etherscan/Basescan) as a credential for verification — verification is presented as working out of the box in SE2. None of these fail the line: noting that SE2 ships a default explorer key; wiring that already-shipped key into an [etherscan] entry in foundry.toml; saying the team may swap in its own later. What fails is listing a key the team must go and get among the setup the launch depends on."
  - "LAUNCH.md states an explicit go/no-go check, not merely the commands, at each of these three transitions: (a) before deploying to Base, contract tests pass and the local deploy works; (b) before the frontend goes public, a stated check against the live contracts that has to pass first; (c) after the frontend deploy, the public URL is loaded and exercised once. Gates beyond these three neither help nor hurt, and a plan is not marked down for having fewer stages than another. A runbook that lists commands with no per-stage checks fails this."
  - "If LAUNCH.md says where an RPC or API key goes, it goes in an env file read via process.env (.env.local, host env vars) — a literal key pasted into scaffold.config.ts rpcOverrides/alchemyApiKey, or into any committed file, fails. A runbook that never introduces a key does not fail this."
runs: 3
notes: |
  Goal task for skills/orchestration. The prompt never names phases,
  verification, staging, secrets, or API keys — each is a decision on the
  way to "real users on a public URL". Buried claims: Phase 2 as a distinct
  stage (expect_1) with small-real-money testing against live contracts
  before anything is public (expect_2 — split from expect_1 so
  "deployed both in one hop" and "never tested live with real money" stay
  separately attributable), verify immediately after deploy (expect_3) with
  no explorer API key to obtain (expect_4 — both reused from
  orchestration-quiz-001: the quiz measures knows-when-asked, this measures
  applies-unprompted), a go/no-go check at each of three named transitions
  (expect_5 — a closed list, so a longer runbook is not penalised for
  leaving some self-invented boundary ungated), and secrets hygiene as a
  conditional (expect_6 — the skill's largest block, uncovered anywhere
  else in the suite: security-* are Solidity-vuln shaped, wallets-* are
  custody-shaped, qa-quiz-005 touches rpcOverrides only as an availability
  bug; a runbook that never introduces a key passes it trivially).

  burnerWalletMode stays ungraded on purpose: both vendored templates
  already ship burnerWalletMode: 'localNetworksOnly'
  (scaffold.config.ts:45), so the skill's Phase 3 checklist item is a no-op
  on a fresh scaffold and a run that stays silent is correct. That is a
  skill finding for the report (propose dropping the checklist item), not a
  task gap. Also not graded, to keep deltas attributable: metadata/OG and
  IPFS-vs-Vercel choice (ship / frontend-playbook claims).

  Bare workspace, no template on purpose — a repo would pull the run toward
  checklist fixes (qa-goal-002's lane) instead of sequencing.

  Ground truth for the no-key claim (expect_4) is recorded in
  orchestration-quiz-001's notes (the template ships a default
  ETHERSCAN_API_KEY); revalidate there before re-running.

  Skill vendored at skills/orchestration (source
  ethskills.com/orchestration/SKILL.md).
