skill: skills/wallets
input: |
  I'm building a trading agent that will hold and move about $400k of treasury
  funds on Ethereum mainnet.

  The draft custody design in our PR: a Safe with two owners — the agent's hot key
  and my hardware wallet — with the threshold set to 1, so the agent can execute
  on its own. The PR argues: "the agent is the whole point; if it has to wait on a
  human co-signer it can't do its job, and my hardware wallet is there as a backup
  owner in case the agent's key is ever lost."

  Review this design. Is threshold 1 acceptable for an agent custodying this much?
  If not, give the owner set and threshold you would use instead, say which key
  lives where and how (hot vs cold), and explain what your design buys us if the
  agent's key is stolen. Be explicit about what the agent can and cannot do on its
  own under the design you recommend.

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md rejects threshold 1 and does not endorse a design in which the agent's key alone can move funds; it states that at threshold 1 a stolen agent key drains the treasury with no second approval standing in the way."
  - "It prescribes an arrangement in which the agent's key alone cannot move the treasury, and the human's own keys alone can control it and can revoke or evict the agent without the agent's cooperation. Any of these shapes satisfies it: a multisig whose threshold the agent alone cannot meet (the skill's canonical 2-of-3 — agent hot / human hot / human cold — is one example, a 2-of-4 adding a trusted-contact recovery signer is another); the agent holding no owner key at all and acting through a scoped module/allowance with a stated cap; or the agent trading only a bounded float that a human action tops up while the principal sits behind a threshold it cannot reach. At least one human key is cold/hardware. Grade the property, NOT the owner count or the specific threshold, and for a multi-tier design grade how the treasury is held. What fails: any design in which the agent's single key can move the bulk of the funds, including a 2-of-2 in which the human is merely a backup owner, and any design whose only protection is where the agent's key is stored (KMS/HSM/keystore bounds who can use a key, not what the key can do)."
  - "It makes the compromise story concrete: at the recommended threshold a stolen agent key cannot move funds by itself, and the human's remaining keys (which alone meet the threshold) can evict the compromised owner and keep control of the funds."
  - "It is explicit about what the agent can and cannot do on its own under the recommended design, and the boundary it draws is real rather than asserted. Either form satisfies this: the agent proposes/queues and the human's signature is what executes (the co-signing latency owned out loud), or the agent keeps unattended execution over a bound it states — a cap, a float size, or an allowlisted call set — while moving the principal, widening the agent's own limits, and changing who may sign each require a human signature the agent cannot produce. What fails is a design that leaves the agent able to move the principal unilaterally, or one that recommends a threshold the agent cannot meet and then implies it still executes as before."
runs: 3
notes: |
  Quiz task for skills/wallets per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. One claim per file:
  targets the skill's "Safe for AI Agents" section (SKILL.md L48-56) — the 2-of-3
  topology (agent hot / human hot / human cold, threshold 2) and its rationale:
  a compromised agent key cannot move funds alone, and the human can remove it.
  Framed as a PR review that plants threshold 1 as the trap, matching the
  quiz-003 / quiz-004 pattern, so the task is a decision rather than a recital.

  Distinct from wallets-quiz-002, which tests only that an audited multisig beats
  a lone hardware wallet and that one person can run a multisig alone. This tests
  the agent-specific topology: who holds which key, what the threshold is, and
  what it buys under compromise. The stale prior is agent-unilateral custody — a
  1-of-N Safe, or the agent's own EOA simply holding the funds — rationalized by
  "the agent has to run unattended". The PR states that rationalization out loud
  so the model has to reject it rather than quietly absorb it.

  Deliberate framing decision: unattended execution is the PR author's ARGUMENT,
  not a constraint of the task. The skill's own answer puts the human in the
  execution path (agent queues, human executes), so a task that demanded true
  unattended operation would make the expected answer unreachable and the task
  unfair. This is why quiz-002's "operates unattended for weeks" premise is not
  reused here. The fourth expect exists to force the model to own that tradeoff
  instead of dodging it — recommending 2-of-3 while implying the agent still acts
  alone is not a pass.

  expect_2 and expect_4 grade a security property, not a topology, and were
  rewritten on 2026-08-05 to do so. The first six runs answered with two-tier
  designs — a cold treasury tier plus a bounded hot trading tier — which the
  earlier wording ("the agent holds exactly one of N owner keys", "the agent must
  wait on a human signature") could not read consistently: four runs put the agent
  on no owner slot and three of them were failed for it while one passed, and the
  one passing run recommended a threshold-1 trading tier that the wording existed
  to fail. The property that actually discriminates the good answer from the stale
  one is: the agent's key alone cannot move the treasury, the human's own keys
  alone can control it and evict the agent, and whatever the agent does keep
  unattended is bounded and named. Do not re-pin these to an owner count or a
  single threshold. Runs graded before 2026-08-05 were graded under the earlier
  wording; their second reading lives in the sibling -regrade-N dirs.

  Alongside quiz-002 this is the least web-searchable of the wallets quizzes: it
  is a design judgement rather than a lookup, so it should discriminate on
  reasoning. Skill vendored at skills/wallets (source ethskills.com/wallets/
  SKILL.md, skill source @ 191dcc1). Bare workspace, answer is a file.
