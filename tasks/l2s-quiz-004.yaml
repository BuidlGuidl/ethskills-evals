skill: skills/l2s
input: |
  We run a DePIN network — a few thousand devices posting signed measurements
  every hour. Rewards already pay out of Solidity contracts we wrote and are
  keeping: an ERC-20, staking, slashing.

  The scoring is what we want to change. Today it runs on our own server: a Rust
  routine that takes a device's hour of raw samples, filters and resamples them
  and returns a quality score. Roughly 2k lines, fixed-point integer math all
  the way through, no floats, and it is the same code the device firmware
  pipeline runs. Operators dispute their scores constantly, so we want the
  scoring to run onchain where a device can check its own reward against it —
  and we are not willing to maintain a second implementation of that routine.

  Pick where we deploy and lay out the build: what runs onchain, how the reward
  contract calls into the scoring, and what our deploy pipeline has to do that a
  plain Solidity deploy would not. Then tell me what would have to change about
  this product for that to be the wrong choice.

  Write your answer to answer.md in this directory.
expect:
  - "answer.md commits to one specific chain as the deployment target — a named chain, not 'any EVM L2', 'an L2', or a decision deferred to a later spike."
  - "The reason given for that chain is that it can execute the team's existing Rust onchain alongside their EVM contracts — a second WASM VM whose programs are callable from Solidity and can call back into it (Arbitrum Stylus) — so the routine is reused rather than reimplemented. A chain picked for cheap gas, throughput, TVL, ecosystem size or popularity fails this line even when the chain named happens to be the right one. A chain other than Arbitrum passes only if the answer names that chain's own mechanism for running the Rust onchain with calls in both directions to its EVM contracts, and attributes it to a checkable source (the chain's own docs or deployment reference) — Aurora's NEAR/WASM cross-contract path qualifies; a chain named with no such mechanism, or with the mechanism asserted and unsourced, fails. A plan that ports the routine to Solidity passes only if it says outright that running the Rust onchain was available and gives a reason for porting anyway; an unexamined 'rewrite it in Solidity' fails."
  - "The deploy answer names the step a plain Solidity deploy does not have: the compiled WASM program is deployed and then activated onchain in a separate transaction before it can be called (Stylus activation, via the ArbWasm precompile). An answer that takes a non-Stylus route must name that route's own extra deploy step instead. 'Deploy it like any other contract' fails."
  - "The answer says how the reward contract reaches the scoring: an ordinary onchain contract call against a Solidity interface / ABI for the program, in the same transaction path as any other internal call — no bridge, oracle, relayer or offchain hop in between. Leaving the call path unspecified, or routing the reward contract to the scoring through an offchain service, fails."
  - "The what-would-make-this-wrong answer turns on the product changing shape — the scoring shrinking to something worth porting after all, moving offchain behind a proof or an attested oracle, or the reward token having to live on a chain that cannot run the Rust — not on gas prices moving or on the chain's TVL ranking changing."
runs: 3
notes: |
  Quiz for skills/l2s, one claim: the selection guide's Rust row — compute-heavy
  work in Rust belongs on Arbitrum, where Stylus runs WASM programs alongside
  the EVM with calls in both directions (pre-rewrite SKILL.md L73 and L125). The prompt
  names no chain, and never says Rust-onchain, WASM or Stylus; the claim
  surfaces because the team's binding constraint is an existing Rust library
  they refuse to reimplement.

  This is the only task in the l2s set that makes the model choose a chain,
  which is the half of the skill its own description calls "when to use which".
  The other three hand the chain over in the prompt.

  Ground truth checked 2026-07-31. Stylus launched with ArbOS 32 and is live on
  Arbitrum One, which runs ArbOS 51 as of 2026-08-03 (ArbSys.arbOSVersion()
  returns 106, i.e. 55 + 51): Rust/C/C++ compiled to WASM, deployed and then
  activated in a second onchain transaction, full interop both ways with
  Solidity (docs.arbitrum.io/stylus/gentle-introduction, /stylus/quickstart).

  The gas story is real for memory- and compute-heavy work, but the skill's
  "10-100x gas savings" conflates two different metrics: RedStone's Nov 2025
  benchmarks report 10-100x on execution speed and roughly 26-50% on gas against
  heavily optimised EVM code. No expect grades a multiplier, in either unit.

  Bare workspace, answer is a file. Executors need network access.

  Record, do not grade: whether the run quotes a gas multiplier and where it got
  it; whether it reaches for Orbit / an L3; and whether the pick came from the
  skill, from the model's prior, or from a live docs check.

  Not graded anywhere in this set: the mainnet-first steer (L57) and the cost
  tables (L10-14, L44-53). The cost model is graded against skills/gas by
  gas-quiz-001 through gas-quiz-003 and gas-goal-001.

  The 2026-08-20 benchmark evaluated the skill vendored from
  ethskills.com/l2s/SKILL.md @ 191dcc1 — 187 lines of chain, cost, RPC, DEX and
  bridging tables. skills/l2s has since been cut to 51 lines: the corrections a
  2026 prior gets backwards, the exit and deploy mechanics, and a selection
  table keyed on the binding constraint, with the number tables removed. Take
  the skill state for any run from its own report.
  AFTER THE MINIMAL REWRITE (branch skill/l2s-minimal, from the 2026-08-20 findings).
  The Rust steer this task grades survives — Stylus runs WASM alongside the EVM
  with calls in both directions, and the program must be activated in a second
  onchain transaction — so expects 1-5 are unchanged and still line up with the
  skill. What is gone is the bare "10-100x gas savings" in both places it
  appeared: the skill now splits execution speed (~10-100x) from gas (~26-50%
  against optimised EVM code, storage priced as the EVM) and says to quote them
  separately or not at all.

  That sharpens the ungraded read below rather than adding a graded one. On
  2026-08-20 the conflation showed up 1/3 with_skill and 1/3 no_skill, which is
  why no expect grades a multiplier — an expect against the number would have
  measured the model's prior. With the number gone from the skill, a with_skill
  run that still quotes "10-100x cheaper" is that prior with nothing reinforcing
  it, which is the distinction mistakes/l2s/l2s-stylus-multiplier-conflation.yaml
  could not draw before.
