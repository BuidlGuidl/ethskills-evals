skill: skills/addresses
input: |
  We're adding a "park idle USDC in Aave" feature to our multi-chain treasury
  app. The wallet plumbing for Ethereum mainnet, Arbitrum, Optimism and Base is
  already in place — what's missing is the chain configuration the supply call
  reads.

  Write chains.ts in this directory: one entry per chain (mainnet, arbitrum,
  optimism, base), each giving the Aave V3 lending pool the app supplies into
  and the USDC token it supplies. These go straight into a live supply() call,
  so they have to be the real deployments, not placeholders — and put a one-line
  comment on each address saying where you got it.

  chains.ts is the whole deliverable.
expect:
  - "chains.ts exists and defines all four chains (mainnet, arbitrum, optimism, base), each with a concrete Aave V3 pool address and a concrete USDC token address — no placeholders, TODOs, or 'fill this in' values."
  - "The Aave V3 pool addresses are right per chain, and Base is NOT given the address the other L2s share: mainnet 0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2, arbitrum 0x794a61358D6845594F94dc1DB02A252b5b4814aD, optimism 0x794a61358D6845594F94dc1DB02A252b5b4814aD, base 0xA238Dd80C259a72e81d7e4664a9801593F98d1c5. A single pool constant shared by all four chains fails, and so does 0x794a61358D6845594F94dc1DB02A252b5b4814aD appearing as the Base pool. If the config resolves the pool through the PoolAddressesProvider instead, the equivalent per-chain values pass: mainnet 0x2f39d218133AFaB8F2B819B1066c7E434Ad94E9e, arbitrum and optimism 0xa97684ead0e402dC232d5A977953DF7ECBaB3CDb, base 0xe20fCBdBfFC4Dd138cE8b2E6FBb6CB49777ad64D."
  - "The USDC entries are native Circle USDC on every chain: mainnet 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48, arbitrum 0xaf88d065e77c8cC2239327C5EDb3A432268e5831, optimism 0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85, base 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913. A bridged variant in any entry fails this line — Arbitrum USDC.e 0xFF970A61A04b1cA14834A43f5dE4533eBDDB5CC8, Optimism USDC.e 0x7F5c764cBc14f9669B88837ca1490cCa17c31607, Base USDbC 0xd9aAEc86B65D86f6A7B5B1b0c42FFA531710b6CA — and so does the mainnet USDC address repeated on an L2."
  - "The per-address comments attribute each value to something checkable — the protocol's deployment docs, a block explorer, or an on-chain check — rather than being asserted from memory with no source, given these addresses receive live funds."
runs: 3
notes: |
  Quiz task for skills/addresses per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets the per-chain deployment
  prior (before the reduction, the skill's L190 Aave V3 table and its L539 native
  vs bridged USDC note). The prior
  under test is "one protocol, one address": Aave V3's Pool genuinely IS the
  same on Arbitrum and Optimism, which makes the reflex feel confirmed right up
  until Base, where it is a different address entirely. Nothing is planted and
  nothing is asked about directly — the config cannot be written without
  committing to eight addresses, so the claim surfaces on the way.

  This is the one claim class the rest of the set leaves thin: the other four
  tasks all turn on DEX venues and cross-chain determinism, while the skill's
  bulk — per-chain deployment tables for protocols every model believes it
  already knows — went untested. Aave is the sharpest case: issue #1 records a
  model recalling Aave's pool address unprompted, and the mainnet value is
  exactly the one that is safe to recall and the L2 values are not.

  expect_3 is also the knows-when-asked half of addresses-goal-001's native-USDC
  line, which had no quiz mirror; read the two together the way quiz-001 and
  goal-001 pair. Per-check failures matter more than the aggregate here — a run
  can hold the Aave claim and miss the USDC one.

  PR #62 baseline, 2026-08-12: no_skill 3/3, with_skill 2/3. The failing run got
  all eight addresses right and attributed every one to "verified address
  reference" — the skill it had just read — which is circular under expect_4 (see
  mistakes/addresses/addresses-verified-stamp-substitutes-for-check.yaml). The
  reduced skill carries no addresses and no freshness stamp, so this task is the
  sharpest test of whether removing them removes the circular-attribution
  failure.

  Mine each transcript for whether the addresses came from the skill, a live
  lookup, or prior, and whether any run checked them on-chain. Bare workspace,
  the answer is a file.

  The 2026-08-12 benchmark evaluated the skill vendored from
  ethskills.com/addresses/SKILL.md @ 191dcc1 — 547 lines of address tables.
  skills/addresses has since been reduced to the verification and venue-choice
  discipline with no address tables, so a with_skill run now has to look every
  address up; take the provenance for any run from its own report.
