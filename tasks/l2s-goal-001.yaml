skill: skills/l2s
input: |
  Build the ops tooling for our remittance product. Payouts go out in USDC on
  Celo; revenue accrues in the same ops wallet in CELO, and at the end of every
  cycle finance wants that CELO balance in our Ethereum mainnet treasury wallet
  (0x1111111111111111111111111111111111111111 — placeholder, we'll swap the real
  one in).

  Work in this directory. Deliver:
    - payout.ts — real, runnable viem code that pays a list of recipients on
      Celo from our ops wallet. Recipients and amounts come from a CSV.
    - sweep.ts — real, runnable viem code that moves the cycle's CELO revenue
      from the ops wallet to the mainnet treasury wallet.
    - NOTES.md — how to run both, what the operator has to get right before this
      touches real money, and the cash-flow timing so finance can plan the close.

  This is going to production, not a testnet demo. Nothing gets broadcast from
  here — the deliverable is code someone else runs.
expect:
  - "payout.ts is runnable viem code (not pseudocode, placeholders or TODOs) targeting Celo mainnet — chain id 42220, via viem's celo chain or an explicit config, against a real Celo RPC endpoint such as https://forno.celo.org — that reads recipients from a CSV and pays them a stablecoin with real ERC-20 calls. Which stablecoin is expect_2's ground, not this line's."
  - "The USDC address in payout.ts is a genuine Celo deployment: native USDC 0xcebA9300f2b948710d2653dD7B07f33A8B32118C (Tether USDT 0x48065fbBE25f71C9282ddf5e1cD6D6A887483D5e or Mento USDm, ex-cUSD, 0x765DE816845861e75A25fCA122bb6898B8B1282a also pass if the run swaps the asset and says so). A token address carried from another chain fails — in particular Ethereum mainnet USDC 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48 or Base USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913. Any other address used must be attributed in NOTES.md to a checkable source (Celoscan, Circle's or Mento's own docs); an unsourced address fails."
  - "sweep.ts moves the CELO over a path that reflects Celo being an Ethereum L2: either the chain's own L2-to-L1 withdrawal through the OP Stack bridge, or a named third-party bridge/route (Squid, Portal/Wormhole, LayerZero, CCIP, Across) chosen deliberately over it. A sweep built on the premise that Celo is an independent L1 that can only reach Ethereum through a wrapped-asset bridge fails, as does a plain on-Celo transfer to the mainnet treasury address, and so does a script that leaves the route as a TODO."
  - "If sweep.ts implements the canonical L2-to-L1 withdrawal, it is modelled as the multi-step process it is: the Celo-side initiation is one step, and the prove and finalize transactions on Ethereum are separate later actions the operator or a follow-up run has to submit — not awaited inline as if the funds arrive with the first transaction receipt. A run that instead uses a fast bridge satisfies this check by not making the same mistake in the other direction: it does not describe the canonical route as instant."
  - "NOTES.md gives finance a cycle timing that matches the route the code takes: on the canonical withdrawal, funds are in flight for days — a challenge period measured in days, not minutes or hours — so the sweep cannot close same-day; on a fast bridge, NOTES.md says that is what the fee is buying and names the extra trust assumption. A run that checks the current window live and states a figure with its source passes as long as the order of magnitude is days; the skill's 7 days and Celo's current 3.5-day window both pass. Timing stated as minutes or hours for a canonical withdrawal fails, and NOTES.md that gives no in-flight time at all fails."
runs: 3
notes: |
  Goal for skills/l2s, mirroring l2s-quiz-001: same claim (Celo is an OP Stack
  L2, not the independent L1 it was until 2025-03-26), but nothing in the prompt
  names bridging, L1, L2 or a withdrawal — the L2 semantics have to surface on
  the way to code that runs. Read the pair together: the quiz measures
  knows-when-asked, this measures applies-unprompted.

  Ground truth checked 2026-07-31. Celo runs the OP Stack Standard Bridge with
  the custom-gas-token feature — CELO is the L2 gas token and an ERC-20 on L1 —
  and withdrawals go initiate (L2ToL1MessagePasser) -> prove on L1 -> finalize
  on L1 after the challenge period (specs.celo.org/bridge.html). Token addresses
  in expect_2 verified on Celoscan the same day. Fast Celo <-> Ethereum routes
  are live (docs.celo.org/home/bridged-tokens/bridges), so a fast-bridge design
  is a legitimate pass, which is why expects 3-5 grade the route's semantics
  rather than the route.

  The challenge window is 3.5 days, not the skill's 7: Celo's mainnet dispute
  game (0xA35d2A7F365b42EcFCB7Db9240c3973Fc8e65139) is an OPSuccinctFaultDispute
  game — gameType() 42 — whose maxChallengeDuration() returns 302400 seconds,
  read live 2026-08-03. expect_5 grades magnitude so both figures pass; the
  stale value is recorded in mistakes/l2s/l2s-celo-chain-params-stale.yaml.

  Verdict-flipping interpretation: expect_4 goes past the skill's own text. The
  bridging table (SKILL.md L145-152) has no Celo row, and prove, finalize,
  output roots and L2ToL1MessagePasser appear nowhere in the skill — all a
  with_skill run gets is L34 ("Celo | Optimistic (OP Stack) | 7 days") and L113
  ("deploy like mainnet, just change RPC URL and chain ID"). A with_skill fail
  on expect_4 alone is a skill gap, not a model failure; compare it across
  variants and read the transcript before scoring it. See
  mistakes/l2s/l2s-celo-bridging-gap.yaml.

  Bare workspace, no template. Executors need network access. Nothing is
  broadcast — the artifact is code, and the treasury address in the prompt is a
  placeholder.

  Record, do not grade: whether the run pays gas in CELO or assumes ETH, whether
  it reaches for Celo's CIP-64 fee abstraction (pay gas in a stablecoin), and
  whether addresses came from the skill, from a live lookup, or from the model's
  prior.

  The 2026-08-20 benchmark evaluated the skill vendored from
  ethskills.com/l2s/SKILL.md @ 191dcc1 — 187 lines of chain, cost, RPC, DEX and
  bridging tables. skills/l2s has since been cut to 51 lines: the corrections a
  2026 prior gets backwards, the exit and deploy mechanics, and a selection
  table keyed on the binding constraint, with the number tables removed. Take
  the skill state for any run from its own report.
  AFTER THE MINIMAL REWRITE (branch skill/l2s-minimal, from the 2026-08-20 findings).
  Same change as l2s-quiz-001, and the verdict-flipping marker above is likewise
  obsolete along with its L34 / L113 / L145-152 references. The skill now carries
  initiate -> prove -> finalize, the operator-submits point, Celo's ~3.5-day window
  and the getTimeToProve / getTimeToFinalize pointer, so a with_skill failure on
  expect_4 is a regression rather than a known gap. The skill also now states that
  CELO is the L2 gas token and a plain ERC-20 on L1, and that gas can be paid in an
  approved ERC-20 through the fee-currency field (CIP-64) — which is the
  "record, do not grade" item below, now sourced in the skill for the with_skill
  arm only. Read any change in that read as skill-sourced, not model knowledge.

  expect_5 still grades magnitude, for the same reason as quiz-001 expect_3: the
  window is a dispute-game parameter, not a constant of the design. Add the same
  ungraded read — measured or remembered, ~3.5 days or 7.
