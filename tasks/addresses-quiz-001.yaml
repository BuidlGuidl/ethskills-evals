skill: skills/addresses
input: |
  Our treasury desk on Base moves large positions — hundreds of thousands of
  USDC per swap into WETH — so execution quality and slippage really matter.

  We're wiring up the swap leg now and need to pick which on-chain venue to
  route through for the deepest liquidity on Base. Which DEX / router would you
  integrate, and why? If you name a router, give its Base address.

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md commits to a concrete swap venue/router for Base and justifies it by actual Base liquidity depth, not by naming a default that carries over from mainnet."
  - "It does NOT treat Uniswap as Base's deepest-liquidity venue by reflex: it either identifies Aerodrome as the dominant DEX on Base by TVL (the ve(3,3) DEX, token AERO), or routes through a DEX aggregator (e.g. 1inch) that sources Aerodrome and other Base liquidity — a Uniswap-only answer that assumes Uniswap has the deepest Base liquidity, with no liquidity reasoning, fails."
  - "Any router address given is a genuine Base deployment for the venue named (e.g. Aerodrome Router 0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43), not a mainnet address reused on Base and not a fabricated one; an answer that gives no address does not fail this line."
runs: 3
notes: |
  Quiz task for skills/addresses per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets the skill's
  L353 steering claim: the dominant DEX on an L2 is NOT Uniswap — Aerodrome
  dominates Base by TVL — so "deepest liquidity on Base" should not resolve to
  a reflexive Uniswap pick. The claim is buried behind a routing decision
  (which venue for best execution) rather than asked as "what is the Base
  Aerodrome address", so a stale prior that defaults to Uniswap everywhere
  fails on the way to the answer. The large-size / execution-quality hook is
  load-bearing: it makes deepest-liquidity the deciding factor, so a
  Uniswap-by-default answer is a real error rather than a defensible small-swap
  choice. Do not remove it.

  A DEX-aggregator answer (1inch) is correct and must pass — the skill itself
  recommends aggregators for best execution — as long as it does not assume
  Uniswap is Base's deepest venue.

  Mirrors addresses-goal-001, which puts the same Base-swap decision inside an
  unprompted build; read the two together for the knows-when-asked vs
  applies-unprompted split that the issue's table needs to reach "keep the
  skill". After the runs, mine each transcript.md for whether the venue was
  reached by web search, from the skill, or from prior, and note it in the
  report. Bare workspace, answer is a file. Skill vendored at skills/addresses
  (source ethskills.com/addresses/SKILL.md, skill source @ 191dcc1).
