skill: skills/addresses
input: |
  Our treasury desk on Base moves large positions — hundreds of thousands of
  USDC per swap into WETH — so execution quality and slippage really matter.

  We're wiring up the swap leg now and need to pick which on-chain venue to
  route through for the deepest liquidity on Base. Which DEX / router would you
  integrate, and why? Give the Base address of the router you'd call — it goes
  straight into the config.

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md commits to one concrete swap venue/router for Base and justifies it with Base-specific liquidity evidence for the USDC/WETH pair — routed volume, pool depth, a live quote or route, or an aggregator's split across Base venues — not by naming a venue that carries over from mainnet."
  - "The venue is not picked by reflex-defaulting to Uniswap as 'the' DEX. Ground truth as of 2026-07-27: Aerodrome clears far more Base DEX volume than Uniswap (Aerodrome Slipstream ~$344M/24h vs Uniswap v3 ~$89M), while Uniswap's versions together hold more Base TVL — so grade the venue on depth/volume for the pair being swapped, not on a TVL leaderboard. Aerodrome (also branded Aero as the Aerodrome/Velodrome merger rolls out — either name passes; ve(3,3), token AERO) passes. A DEX aggregator (e.g. 1inch) passes when it also shows which Base venues it sources from, or otherwise reasons about Base depth. Uniswap passes only when justified against Base liquidity for this pair rather than assumed. FAIL: 'Uniswap, it's the deepest/the standard' with no Base-specific evidence; a bare 'use an aggregator, it handles routing'; or a dominance claim in either direction asserted rather than shown."
  - "The answer names a router and gives its Base address, and that address is a genuine Base deployment for the venue named: Aerodrome Router 0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43, Uniswap v3 SwapRouter02 on Base 0x2626664c2603336E57B271c5C0b26F421741e481, Uniswap v4 PoolManager on Base 0x498581fF718922c3f8e6A244956aF099B2652b2b, 1inch v6 router 0x111111125421cA6dc452d289314280a0f8842A65 (identical on every chain via CREATE2, correct as-is on Base). A mainnet address carried onto Base fails — in particular Uniswap v3 SwapRouter02 0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45 or mainnet v4 PoolManager 0x000000000004444c5dc75cB358380D2e3dE08A90. For any other contract the answer reaches for (a newer Universal Router, a Slipstream router, another aggregator), the address must be attributed to a checkable source — the protocol's official deployment list or a Base block explorer; an unsourced address fails. Giving no address at all fails this line."
runs: 3
notes: |
  Quiz task for skills/addresses per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets the skill's
  L353 steering claim: the dominant DEX on an L2 is NOT Uniswap — so "deepest
  liquidity on Base" should not resolve to a reflexive Uniswap pick. The claim
  is buried behind a routing decision (which venue for best execution) rather
  than asked as "what is the Base Aerodrome address", so a stale prior that
  defaults to Uniswap everywhere fails on the way to the answer. The large-size
  / execution-quality hook is load-bearing: it makes depth the deciding factor,
  so a Uniswap-by-default answer is a real error rather than a defensible
  small-swap choice.

  L353's metric is wrong and the expects do not repeat it — see
  mistakes/addresses/addresses-base-dominance-metric.yaml. Checked 2026-07-27
  on DefiLlama: Aerodrome leads Base DEX volume by ~4x (Slipstream ~$344M/24h
  vs Uniswap v3 ~$89M), but Uniswap's versions together hold MORE Base TVL
  (~$386M vs ~$308M). Volume/depth is the metric that decides execution quality
  for a large swap anyway, so expect_2 grades on that and treats any asserted
  dominance claim — in either direction — as a fail.

  Because the graded thing is the reasoning rather than a leaderboard position,
  a justified Uniswap answer passes, matching addresses-goal-001 expect_5; the
  earlier no-pass-path version biased the knows-vs-applies delta this pair
  exists for. A DEX-aggregator answer (1inch) is correct and must pass — the
  skill itself recommends aggregators for best execution — but only when it
  also shows where Base liquidity sits. Without that clause an executor that
  has never heard of Aerodrome passes by saying "use 1inch".

  expect_3 makes the router address mandatory (the input asks for it outright).
  That is what keeps this task about addresses and distinct from
  building-blocks-quiz-001, which grades the same venue instinct for an LP
  position with no address in play.

  Mirrors addresses-goal-001, which puts the same Base-swap decision inside an
  unprompted build; read the two together for the knows-when-asked vs
  applies-unprompted split that the issue's table needs to reach "keep the
  skill". After the runs, mine each transcript.md for whether the venue was
  reached by web search, from the skill, or from prior, and note it in the
  report. Bare workspace, answer is a file. Skill vendored at skills/addresses
  (source ethskills.com/addresses/SKILL.md, skill source @ 191dcc1).
