skill: skills/addresses
input: |
  Our treasury desk on Base moves large positions — hundreds of thousands of
  USDC per swap into WETH — so execution quality and slippage really matter.

  We're wiring up the swap leg now and need to pick which on-chain venue to
  route through for the deepest liquidity on Base. Which DEX / router would you
  integrate, and why? Give the Base address of the router you'd call — it goes
  straight into the config.

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md commits to one concrete swap venue and one router to call for Base USDC/WETH, and shows Base-specific evidence for that choice: a live quote or route for the pair, pool depth or reserves, a current per-venue Base volume figure, or an aggregator's split across named Base venues. This line grades whether evidence is present and is about Base and about this pair — nothing else. FAIL: no venue committed to, no router named, a venue carried over from mainnet reasoning, or a choice resting only on reputation ('the deepest', 'the standard', 'the Base DEX') with no Base figure, quote, or route behind it. Whether the claims made are true is expect_2; whether the address is right is expect_3."
  - "Nothing the answer asserts about Base liquidity contradicts ground truth, and the venue is not picked by reflex-defaulting to Uniswap as 'the' DEX. Ground truth as of 2026-07-27 (DefiLlama, Base DEX volume, 7d): Aerodrome Slipstream ~$2.3B and Aerodrome v1 ~$38M; Uniswap v4 ~$980M and Uniswap v3 ~$610M; PancakeSwap v3 ~$590M. Base TVL runs the other way and close: Uniswap ~$305M (v3 ~$255M + v4 ~$50M) vs Aerodrome ~$285M (Slipstream ~$157M + v1 ~$128M). So Aerodrome leads aggregate routed volume — by roughly 1.5x, not by an order of magnitude — Uniswap v4 is itself a major Base venue, and no venue leads on every metric; 24h snapshots swing enough that a run's fresher numbers may differ from these without being wrong. Grade the claims and the reasoning about depth for the pair being swapped, not a leaderboard position. Any venue passes when the pick is argued from Base liquidity for this pair: Aerodrome (Aero is the brand the Aerodrome/Velodrome merger will ship under — announced Nov 2025, still unlaunched, targeting Sep 2026 — so either name passes; ve(3,3), token AERO), Uniswap, or a DEX aggregator (e.g. 1inch) that also shows which Base venues it sources from. FAIL: a dominance claim asserted rather than shown, in either direction — 'Aerodrome is the largest DEX on Base by TVL', 'Uniswap is the deepest venue on every chain'; a TVL or volume magnitude that contradicts the pinned figures above (e.g. Aerodrome Base TVL quoted at ~$500-600M); or a venue chosen on mainnet habit. Absence of evidence is graded by expect_1; this line grades what the answer claims."
  - "The answer names a router and gives its Base address, and that address is a genuine Base deployment for the venue named: Aerodrome Slipstream SwapRouter 0xBE6D8f0d05cC4be24d5167a3eF062215bE6D18a5 (concentrated liquidity; its factory() returns the Slipstream CLFactory 0x5e7BB104d84c7CB9B682AaC2F3d509f5F406809A), Aerodrome v2-style Router 0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43 (volatile/stable v2 pools only; defaultFactory() 0x420DD381b31aEf6683db6B902084cB0FFECe40Da), Uniswap v3 SwapRouter02 on Base 0x2626664c2603336E57B271c5C0b26F421741e481, Uniswap v4 PoolManager on Base 0x498581fF718922c3f8e6A244956aF099B2652b2b, 1inch v6 router 0x111111125421cA6dc452d289314280a0f8842A65 (identical on every chain via CREATE2, correct as-is on Base). A mainnet address carried onto Base fails — in particular Uniswap v3 SwapRouter02 0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45 or mainnet v4 PoolManager 0x000000000004444c5dc75cB358380D2e3dE08A90. Where the venue named runs more than one AMM, the router given must be the one that serves the pools the answer's own evidence points at: citing Aerodrome Slipstream / concentrated-liquidity depth and then handing over the v2-style Router 0xcF77a3Ba... fails this line, because that router cannot reach Slipstream pools — measured 2026-08-12 on a 500k USDC->WETH clip, that route filled ~1,283 bps below mid against ~14 bps through Slipstream. For any other contract the answer reaches for (a Universal Router deployment, another aggregator), the address must be attributed to a checkable source — the protocol's official deployment list or a Base block explorer; an unsourced address fails. Giving no address at all fails this line."
runs: 3
notes: |
  Quiz task for skills/addresses per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets the skill's
  venue-choice steer: the dominant DEX on an L2 is often not Uniswap — so "deepest
  liquidity on Base" should not resolve to a reflexive Uniswap pick. The claim
  is buried behind a routing decision (which venue for best execution) rather
  than asked as "what is the Base Aerodrome address", so a stale prior that
  defaults to Uniswap everywhere fails on the way to the answer. The large-size
  / execution-quality hook is load-bearing: it makes depth the deciding factor,
  so a Uniswap-by-default answer is a real error rather than a defensible
  small-swap choice.

  The pre-reduction skill's L353 asserted that Aerodrome leads Base by TVL; that
  metric is wrong and the expects do not repeat it — see
  mistakes/addresses/addresses-base-dominance-metric.yaml. Checked 2026-07-27
  on DefiLlama (7d Base DEX volume): Aerodrome ~$2.35B (Slipstream ~$2.3B, v1
  ~$38M) vs Uniswap ~$1.59B (v4 ~$980M, v3 ~$610M), while Base TVL runs the
  other way and close — Uniswap ~$305M vs Aerodrome ~$285M. Volume/depth is the
  metric that decides execution quality for a large swap anyway, so expect_2
  grades on that and treats any asserted dominance claim — in either direction
  — as a fail.

  The per-version numbers are in the expect on purpose. An earlier revision
  said "~4x", which compared Slipstream against Uniswap v3 alone and dropped
  v4; on aggregate the gap is ~1.5x and a run that counts v4 would have been
  failed for contradicting the rubric. Same reason the expect flags that 24h
  snapshots swing — two readings taken hours apart on 2026-07-27 gave $355M vs
  $316M and $430M vs $231M, so a fresher number is not evidence of a wrong
  answer.

  Because the graded thing is the reasoning rather than a leaderboard position,
  a justified Uniswap answer passes, matching addresses-goal-001 expect_5; the
  earlier no-pass-path version biased the knows-vs-applies delta this pair
  exists for. A DEX-aggregator answer (1inch) is correct and must pass — the
  skill itself recommends aggregators for best execution — but only when it
  also shows where Base liquidity sits. Without that clause an executor that
  has never heard of Aerodrome passes by saying "use 1inch".

  Three expects were rewritten after the 2026-08-12 run (PR #62 baseline:
  no_skill 3/3, with_skill 2/3, failing expect_1). expect_1 and expect_2
  overlapped — an asserted dominance claim arguably failed both, and the blind
  judge split them — so they now divide cleanly: expect_1 grades whether
  Base-specific evidence is present at all, expect_2 grades whether what the
  answer asserts is true. expect_3 now pins the Aerodrome Slipstream router and
  requires the router given to be the one serving the pools the answer's own
  evidence points at; naming Slipstream depth and handing over the v2-style
  Router is the -1,283 bps failure no rubric caught (mistakes/addresses/
  addresses-aerodrome-slipstream-missing.yaml). Aggregate counts stay comparable
  with the 2026-08-12 run only where the rubric did not move; read per-expect.

  expect_3 makes the router address mandatory (the input asks for it outright).
  That is what keeps this task about addresses and distinct from
  building-blocks-quiz-001, which grades the same venue instinct for an LP
  position with no address in play.

  Mirrors addresses-goal-001, which puts the same Base-swap decision inside an
  unprompted build; read the two together for the knows-when-asked vs
  applies-unprompted split that the issue's table needs to reach "keep the
  skill". After the runs, mine each transcript.md for whether the venue was
  reached by web search, from the skill, or from prior, and note it in the
  report. Bare workspace, answer is a file.

  The 2026-08-12 benchmark evaluated the skill vendored from
  ethskills.com/addresses/SKILL.md @ 191dcc1 — 547 lines of address tables.
  skills/addresses has since been reduced to the verification and venue-choice
  discipline with no address tables, so a with_skill run now has to look the
  router up rather than read it off a table; take the provenance for any run from
  its own report.
