skill: skills/concepts
input: |
  We're launching a small USDC yield vault next week. Where things stand today:

    - we expect around $8,000 of deposits in the first month
    - the strategy earns roughly 4% APY on the USDC it holds
    - harvest() claims the strategy's rewards and compounds them back into the
      vault; it's permissionless, anyone can call it, and whoever does keeps 1%
      of what that call claims
    - we're deploying to Ethereum mainnet

  Before we ship I want an operational read on that first month. Write it to
  answer.md in this directory: what actually happens to this vault once it's
  live, what that means for our depositors, and whether anything above should
  change before launch.
expect:
  - "Unprompted, answer.md puts the two sides of the caller's decision side by side as figures: what one call pays whoever sends it (1% of the rewards accrued since the previous harvest — at these deposits and 4% APY the vault accrues on the order of a dollar a day, so the fee is roughly $0.009 a day) against what the same call costs that caller in gas, in dollars, through a per-call gas figure and a gas price and ETH price the answer itself supplies or measures. The gas figure may be estimated, measured or cited, but it has to be stated; a harvest of this shape is on the order of 10^5 gas and anything in that range is fine. Describing harvest as permissionless and incentivized without ever valuing the incentive against the caller's cost fails this line, however well the mechanism is explained. Modelling a lower average balance because deposits ramp through the month is a better reading of the prompt, not a wrong one."
  - "The answer says how often harvest actually gets called, and that cadence follows from the comparison in expect_1: an interval, an accrual threshold, or 'not until the accrued fee clears the caller's gas', located where the 1% fee accrued since the last harvest overtakes the caller's own gas cost at the prices the answer itself states. This line does not pin the interval — a run that checks prices live and derives a shorter one passes on its own arithmetic. Answering that harvest runs daily, or on a schedule, or 'whenever the keeper runs', without weighing the fee against the caller's gas, fails — as does treating the cadence as something the team sets rather than something the economics decide. Recommending the team run the bot as the fix is expect_4's ground, not a fail here, provided the predicted cadence itself came from the fee-vs-gas comparison."
  - "What depositors experience is stated as rewards sitting unharvested and uncompounded until a call becomes worth sending — a consequence of the fee being too small to move anyone — rather than as a keeper's schedule or a bot's uptime."
  - "The answer recommends a change, and it acts on the economics or removes the need for the call: a bigger or floored caller fee, a minimum accrual before harvest is callable, folding the harvest into user deposits and withdrawals, accruing at read time, a cheaper chain, or launching at a size where 1% clears gas. If it proposes that the team run the bot itself, it says plainly that the team is then the one paying gas and that harvesting stops when the team stops."
runs: 3
notes: |
  Quiz task for skills/concepts per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets the third
  question SKILL.md attaches to every state transition — "Is the incentive
  sufficient? (covers gas + profit?)" — under "Smart Contracts Are State
  Machines". The design handed to the executor already passes the first two
  questions: harvest() is permissionless and it pays its caller, so the only
  thing left to get wrong is the arithmetic — not whether a caller and a
  reason exist at all, which is ship-quiz-003's ground.

  The numbers are sized so the verdict holds across gas assumptions: 1% of
  ~$0.88/day is ~$0.009/day against the caller's gas. As of 2026-07 mainnet
  runs around 0.07 gwei all-in with ETH near $1,900, so 250,000 gas costs
  ~$0.034 and break-even lands around 4 days; at 0.1 gwei and ETH $2,000 it is
  ~$0.05 and 5-6 days, stretching to ~50 days at 0.9 gwei and to months if gas
  returns to multi-gwei. The expect grades the break-even the run derives from
  the prices it states, not a fixed interval, since the spread inside
  sub-1-gwei alone is a factor of ten. Re-check mainnet gas and
  ETH price before running: if gas ever gets cheap enough that a daily call
  clears $0.009, this task stops measuring anything and the deposit figure has
  to come down. What is being graded is the comparison, not any particular
  cadence.

  The input was rewritten after the claude/opus-5 benchmark in
  https://github.com/BuidlGuidl/ethskills-evals/pull/78 came back 3/3 on both
  variants, exactly as the paragraph below predicted. The old input handed over
  "a harvest call costs about 250,000 gas", then asked "how often harvest
  actually gets called" and to "show the arithmetic" — the comparison this task
  exists to measure was named in the prompt, so a run only had to divide. Both
  halves are gone: the run now has to notice that the incentive is the thing
  worth checking and supply a gas figure of its own. That is what expect_1's
  "unprompted" and the "has to be stated" clause carry. The remaining numbers
  stay, because 1% of 4% APY on $8,000 is the quantity under test.

  If this version also comes back at ceiling on both variants, retire the task
  rather than rewrite it a third time: the claim is then held by the model and
  concepts-goal-001 is where the remaining budget belongs. Results from #78
  were produced against the old input and are not comparable with runs of this
  version.

  Record per run: whether the incentive question was raised at all before any
  arithmetic, where the per-call gas figure came from (estimated, cited or
  measured), whether the gas price and ETH price were checked live or quoted
  from memory, whether the run arrived at a break-even interval or only at a
  qualitative "not often", the run's cost and duration (part of the verdict per
  https://github.com/BuidlGuidl/ethskills-evals/issues/1#issuecomment-5343246613
  and absent from result.yaml), and whether the prose writes "onchain" or
  "on-chain" — the skill makes that call and no expect line grades it, so a run
  should not fail on a hyphen.

  Pairs with concepts-goal-001: this measures knows-when-asked, the goal
  measures applies-unprompted.

  Bare workspace, answer is a file. Skill vendored at skills/concepts (source
  ethskills.com/concepts/SKILL.md, skill source @ 191dcc1); the vendored copy
  is the minimal rewrite, whose third question says in as many words to put the
  caller's reward and the caller's gas next to each other in dollars.
