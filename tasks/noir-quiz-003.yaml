skill: skills/noir
input: |
  Our three-person team built a private-withdrawals app on Ethereum mainnet
  (think small Tornado-style pool, fixed 1 ETH notes). An auditor already
  verified the cryptography: the circuit correctly proves membership of a
  committed note in the onchain Merkle tree, the nullifier scheme prevents
  double-withdrawal, and the verifier contract is sound. Treat all of that
  as correct.

  The user flow as shipped:
    1. Alice connects her wallet and calls deposit(), inserting her note's
       commitment into the tree. She saves her note locally.
    2. Weeks later, Alice opens the app, connects her wallet, generates the
       membership proof in-browser, and calls withdraw(proof, root,
       nullifierHash, recipient) — where recipient is a fresh, empty address
       she generated for the payout.

  Marketing wants the launch page to say: "withdrawals cannot be linked to
  deposits." Before we print that, I want a reality check. Write
  privacy-review.md: what can a competent chain observer actually determine
  about who withdrew, and what — if anything — has to change in the product
  for marketing's claim to hold?
expect:
  - "privacy-review.md's verdict is that the marketing claim does NOT hold as shipped: a chain observer links Alice's deposit and withdrawal because the same wallet submits both transactions (msg.sender / gas payer), and the ZK proof does nothing to hide who sent the withdraw transaction. A review that endorses the claim as-is, or finds only cosmetic issues, fails."
  - "It is not bought off by the fresh recipient address: the leak is located in who SUBMITS the withdraw transaction, not where the funds land. A review that treats the fresh recipient as what makes withdrawals unlinkable fails."
  - "The required product change routes the withdraw transaction through a sender unlinkable to the deposit wallet: a relayer, an ERC-4337 paymaster / sponsored userop, or equivalent. If a fresh submitting wallet is proposed, the review must not have it gas-funded from Alice's wallet — that recreates the link. Network-level measures alone (VPN, private RPC) or circuit/cryptography changes offered as THE fix fail."
  - "The review bounds the guarantee by the anonymity set: even after the fix, unlinkability is only as strong as the number of deposits in the pool (1-of-N; a near-empty pool gives weak privacy). Mentioning timing correlation as an additional bound also satisfies this."
runs: 3
notes: |
  Targets SKILL.md "What You Probably Got Wrong" #5: the ZK proof hides the
  commitment-nullifier link, but msg.sender is public — the same wallet
  depositing and withdrawing links the two transactions onchain, so the
  pattern needs a separate acting wallet whose gas comes from somewhere
  unlinkable (relayer / ERC-4337 paymaster).

  Load-bearing, don't soften: "an auditor already verified the cryptography"
  walls off circuit-security boilerplate — the only real finding left is the
  transaction-graph hole. The fresh recipient address is deliberate bait: the
  flaw is who SENDS the withdraw tx, not where funds land (expect_2 measures
  the bait's hit rate separately from the diagnosis). expect_3's funding trap
  (a burner gas-funded from Alice's wallet re-links) is where the with_skill /
  no_skill delta should concentrate — "use a burner" is the half-remembered
  answer.

  Pairs with noir-goal-001, which buries the same claim in an unprompted
  voting build: this quiz measures knows-when-asked, the goal measures
  applies-unprompted. Domains differ on purpose (withdrawals vs voting) so
  the pair shares no surface text.

  Record per run: relayer vs paymaster vs burner as the proposed fix, and
  whether the anonymity-set bound (expect_4) surfaced unprompted or not at
  all.

  Bare workspace, answer is a file. Skill vendored at skills/noir (source
  ethskills.com/noir/SKILL.md, skill source @ 191dcc1).
