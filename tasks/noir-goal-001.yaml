skill: skills/noir
input: |
  Our 150-member DAO wants contested governance votes without vote
  attribution. Membership is public — each member's wallet holds a membership
  NFT and the member registry is on our site. Proposals are yes/no; each
  member votes at most once per proposal; there will be many proposals over
  time. After the deadline anyone can read the tally. The requirement that
  matters: nobody — including us — should be able to tell how any individual
  member voted.

  Build the working core in this directory:
    - the Noir circuit(s)
    - the Solidity contracts (foundry project, compiles with forge build)
    - a deploy script that stands the contracts up on a local chain and wires
      them to each other
    - a Node script showing how one member goes from their secret to a
      submitted vote (proof generation and the vote transaction), runnable
      logic even if pointed at a local chain
    - NOTES.md: the end-to-end flow for one member voting on one proposal,
      from joining the vote to the tally — naming, for each onchain
      transaction, which wallet sends it and what a chain observer learns
      from it.

  Keep everything you write in ordinary source folders here. Nothing you want
  us to read should end up under node_modules/, target/, out/ or cache/, which
  we treat as generated. If a step of your setup initialises a git repo in this
  directory, list those generated folders in .gitignore before you finish.
expect:
  - "The vote-submission path does not have the member's registered wallet send the vote transaction. Registering / inserting the commitment from the known member wallet is fine — membership is public. What must hold: the flow names a production gas path for the vote — a relayer service, an ERC-4337 paymaster / sponsored userop, or equivalent — such that the submitting wallet cannot be linked to a member. A local prefunded dev account may stand in for that sender during testing, but only if the flow says so and states what replaces it in production; a prefunded 'fresh wallet' presented as the design itself, with no production story, fails. A flow where the member's own wallet sends the vote, or a burner gas-funded by the member's wallet, fails regardless of how good the circuit is."
  - "The nullifier is scoped to the proposal in-circuit: the public nullifier hash incorporates the proposal id (external nullifier), so one member voting on two proposals yields two unrelated nullifier hashes. A global per-member nullifier fails either way it's wired — it blocks the second proposal entirely, or it reappears across proposals and links the member's votes into a pseudonymous profile. An alternative design (e.g. per-proposal commitment sets) passes only if it keeps votes on different proposals unlinkable AND enforces one vote per member per proposal."
  - "The contract counts a vote only after the verifier's verify() succeeds, and records the nullifier hash as used so a repeat proof on the same proposal reverts — state mutation strictly after successful verification. The deploy/wiring path targets the real generated verifier; a MockVerifier anywhere in the deploy path fails."
  - "The Node script generates proofs with the current NoirJS stack: @noir-lang/noir_js plus @aztec/bb.js, using the UltraHonkBackend class, and it asks for EVM-targeted proof serialization — `generateProof(witness, { keccak: true })`, the newer `{ verifierTarget: \"evm\" }`, or equivalent — so the proof matches what an EVM verifier accepts. @noir-lang/backend_barretenberg or UltraPlonkBackend (the deprecated stack) fails, as does a proof generated with the default (non-EVM) serialization."
  - "NOTES.md walks the flow transaction by transaction, names each transaction's sender, and matches the code: it does not claim unlinkability while the script or contracts have the member's wallet submitting the vote. It treats registration as public and locates the anonymity guarantee in the submission path and the size of the voter set."
  - "Public input ordering matches across layers: the circuit's `pub` parameter order, the order the Node script passes and reads `publicInputs`, and the order the app contract builds the `publicInputs` array it hands to `verify()`. A mismatch in any pair fails; if the contract forwards the script's inputs untouched, the script-against-circuit pair is the one to check."
  - "The client derives its Merkle path by replaying the contract's insert events into an offchain tree mirror — not from a contract call returning a witness path, and not from a hardcoded path — and the member's note (nullifier, secret, leaf index) is persisted at registration time. The contract emits an insert event carrying the commitment, its leaf index, and the resulting root, so that replay is possible."
runs: 3
notes: |
  Goal for skills/noir. Mirrors noir-quiz-003 (msg.sender linkability), never
  named in the input — the quiz measures knows-when-asked, this measures
  applies-unprompted. Second buried decision: "many proposals over time" +
  "once per proposal" makes external-nullifier scoping load-bearing (expect_2)
  without naming nullifiers. expect_4 is the only place the NoirJS stack is
  graded; expect_6 and expect_7 grade the serialization boundary and the tree
  mirror / note persistence — failures SKILL.md predicts by name.

  Don't soften: the NOTES.md sender clause ("which wallet sends it and what a
  chain observer learns") is what makes linkability gradeable without naming
  wallets or relayers, and the deploy-script deliverable is what gives
  expect_3's MockVerifier clause something to grade.

  Bare workspace, no template on purpose — a scaffold would pre-pick the
  architecture. Runs need network access (forge init / npm install). A run
  that dies in toolchain or dependency setup is an env failure: record it as
  one and re-run it, never count it as a design miss.

  Report, do not grade: whether forge build / nargo compile actually ran and
  passed (the judge reads code, cannot execute); circuit currency — post-colon
  pub syntax, Poseidon from the external dependency, not std::hash — which
  quiz-002 already grades; toolchain command hygiene (quiz-001 territory);
  whether the run cloned example repos (the skill links the se-2 zk-voting
  challenge — leaning on it is the skill working; note it when attributing);
  and turns burned on `claude mcp add noir-mcp` + `/reload-plugins` (neither
  survives the `-p --strict-mcp-config` spawn).

  Known skill rot — read with_skill failures accordingly (skill-edit
  candidates, not run errors): `u1` was removed in nargo beta.20 but the
  skill's circuit examples still use it; zk-kit's binary_merkle_root still
  wants `[u1; N]` indices, so it does not compile against current Noir; and
  the generated verifier's Solidity floor is >=0.8.27 now, not the >=0.8.21
  the skill cites.

  PRE-FLIGHT, once per machine before the first run — intentionally long:
  AGENTS.md wants pinned install commands and what a working install looks
  like in task notes, and this is the only task in the repo needing a proving
  toolchain (global binaries, so a template cannot carry it). Install nargo
  first; bbup reads the nargo version and picks the matching bb:

      curl -L https://raw.githubusercontent.com/noir-lang/noirup/refs/heads/main/install | bash
      noirup -v <version>    # 1.0.0-beta.4 or newer — see floor below
      curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
      bbup

  A working install answers `nargo --version && bb --version && forge
  --version && node --version`; record all four at the top of the report.
  Authored against nargo 1.0.0-beta.3 / bb 0.82.2 / forge 1.4.4-stable / node
  v22.18.0 (2026-07), but the nargo floor for this set is beta.4: stdlib
  Poseidon still resolves on beta.3, which contradicts quiz-002 expect_1 and
  the circuit-currency report item above. Re-check the bb pairing when you
  re-pin; @aztec/bb.js must match the bb CLI exactly or proof serialization
  diverges. While the toolchain is up, generate one verifier and check its
  size: verify.ts drops files over 256KB from output/, so if HonkVerifier.sol
  lands over the cap it silently vanishes from the judge's evidence and
  expect_3 gets graded from the deploy script alone — record the size here if
  it is over.

  Deliberately not graded: SKILL.md claim #6 (verifier pragma / evm_version /
  24KB) — both failure modes are loud, so runs self-correct; rationale in PR
  #36, alongside the ranked follow-up coverage (pattern-selection quiz, WASM
  config, chain compat, testing boundaries).

  Skill vendored at skills/noir (ethskills.com/noir/SKILL.md @ 191dcc1).
