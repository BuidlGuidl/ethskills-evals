skill: skills/testing
input: |
  Write your answer to answer.md.

  I am reviewing the test plan for a new onchain credit pool before deployment. The
  current unit suite is green and covers every line, but it only uses local mocks and
  one-operation examples. The implementation has these three independent surfaces:

  1. Governance can set `reserveFactorWad`. A redemption computes
     `net = assets * (1e18 - reserveFactorWad) / 1e18` and then reverts when `net == 0`.
     The setter currently accepts any uint256. Existing tests cover 0 and 0.2e18.
  2. Each repayment retains a protocol cut in the pool while the internal
     `accountedAssets` value is reduced by the gross repayment. The test plan shows one
     deposit followed by one repayment, observes a mismatch, and calls that proof that
     the mismatch accumulates.
  3. Liquidation reads a Chainlink feed and transfers the deployed collateral token.
     Both are represented by standard-behaviour mocks. The production addresses are
     known, but no test has called them.

  Tell me whether this is enough to sign off. For each surface, specify the search or
  experiment you would require and the evidence that would make it meaningful. Be
  precise about the limit cases for the governance value, what would actually
  demonstrate accumulation, and how the production integrations should be exercised
  reproducibly.
expect:
  - "answer.md rejects the current value-math coverage and requires a fuzz/property search over the accepted reserveFactorWad domain. It separately classifies and exercises a usable value immediately below 1e18, exactly 1e18 (zero net and therefore a revert), and above 1e18 (arithmetic underflow), rather than treating only values above the numeric limit as invalid."
  - "answer.md says one deposit plus one repayment proves only divergence, not accumulation. It requires at least two repayments (or two other operations that each create this specific gross-versus-net drift) and evidence that the accounting/custody gap grows after the second, or a stateful handler-invariant counterexample whose sequence demonstrates that growth."
  - "answer.md requires testing the deployed Chainlink feed and collateral token on a real fork rather than relying only on standard-behaviour mocks, pins a specific block for reproducibility, and says to confirm the RPC endpoint can serve the historical state at that block (archive depth) before treating failures as contract failures."
  - "answer.md concludes the current green, full-coverage suite is insufficient for deployment and maps the applicable risks to distinct searches: configurable value math to fuzzing, repeated accounting changes to a stateful invariant/sequence, and external integrations to a pinned production fork."
runs: 3
notes: |
  Held-out forward check added after review of PR #114. It rotates the concrete
  vocabulary and contract surface away from testing-goal-001: reserve-factor
  redemption rather than a deposit fee, repayments rather than vault withdrawals,
  and Chainlink/collateral integration rather than USDT/Aave approval. It tests
  transfer of the semantic-boundary and repeated-drift wording without requiring a
  second large Foundry fixture.

  This remains a question-shaped check, not an operational repo-shaped goal. A pass
  can support narrow transfer of the reasoning, but cannot establish that an executor
  will actually build and run all three searches under deployment pressure. Do not
  blend it into earlier six-task totals; report it as a separate 3-per-variant
  forward-validation result.
