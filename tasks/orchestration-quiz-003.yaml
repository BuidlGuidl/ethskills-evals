skill: skills/orchestration
template: templates/se-2-foundry
input: |
  This workspace is a Scaffold-ETH 2 (foundry flavor) project mid-build:
  the contract phase just wrapped — YourContract
  (packages/foundry/contracts/YourContract.sol) is final, its deploy
  script and tests are in place, and nothing on the contract side should
  change. The frontend phase starts now, and the first ticket is yours.

  Build a /greetings page in the Next.js app:

  - show the current greeting and the total number of times it has been
    changed
  - a form where a connected user can submit a new greeting
  - a feed of past greeting changes below the form — who set it and to
    what, newest first

  Run whatever local tooling you find useful, but you don't need to run
  the app or deploy anywhere — finished, committed code is the
  deliverable.
expect:
  - "The page's reads of YourContract state (greeting, totalCounter) go through useScaffoldReadContract — not wagmi's useReadContract/useContractRead or a viem publicClient with a hand-supplied ABI and address. wagmi connection hooks (useAccount and friends) don't fail this."
  - "The greeting submission goes through useScaffoldWriteContract's writeContractAsync — not wagmi's useWriteContract/useContractWrite or a raw walletClient. Noting that the scaffold hook wraps wagmi under the hood does not fail this; hand-rolling the wagmi call does."
  - "The feed is built on useScaffoldEventHistory (any hook from packages/nextjs/hooks/scaffold-eth passes this line) — not viem getLogs or wagmi's useWatchContractEvent wired to self-supplied contract metadata."
  - "The frontend duplicates no contract identity: YourContract's address and ABI are never hardcoded or hand-copied into components, and deployedContracts.ts is not hand-edited. A run that fails the hook lines but pulls address/ABI by importing the generated deployedContracts data still passes this line — the deltas stay separable."
runs: 3
notes: |
  Quiz task for skills/orchestration. One claim per quiz; this one targets
  the hooks block (SKILL.md 1.2 Frontend, "USE SCAFFOLD HOOKS, NOT RAW
  WAGMI") and exists as the deletion test for it: the block is the bulk of
  the skill's line count and plausibly redundant with what a real SE-2
  workspace already tells the agent.

  Deliberate confound, and the point of the design: templates/se-2-foundry
  ships create-eth's own AGENTS.md, which documents the scaffold hooks and
  says in bold "Always use hooks from packages/nextjs/hooks/scaffold-eth"
  (CLAUDE.md @-includes it, so both claude and codex harnesses surface
  it). The no_skill variant therefore has the rule in-context from the
  repo itself. What's measured is the skill block's marginal value over
  what every real SE-2 workspace already provides. Decision rule: both
  variants pass all four lines → the block is dead weight, delete it from
  the skill; no_skill fails while with_skill passes → the block carries
  weight beyond the repo's own docs, keep it; with_skill fails → fix the
  skill.

  Prior evidence that the ceiling is not a foregone conclusion: the
  committed frontend-ux-goal-001 run diffs (claude, 2026-07-24) show 2 of
  3 no_skill runs mixing raw wagmi useReadContract/useWriteContract into
  their pages alongside scaffold hooks, despite the workspace's own
  AGENTS.md. Observational only — that task ran with skills/frontend-ux
  and grades other claims — but it is the no_skill arm of this question
  in the wild.

  Grades applies-unprompted despite the quiz name: the input never
  mentions hooks, wagmi, or house conventions — a knows-when-asked
  version would be pure retrieval from the template's AGENTS.md and
  settle nothing. Repo-shaped (first quiz with a template:) for the same
  reason: without the repo, SE-2 hook names aren't derivable and no_skill
  fails vacuously, faking a delta the skill doesn't earn in real use.

  The feature runs entirely on the shipped YourContract (greeting,
  totalCounter, GreetingChange) — zero contract-side work, so failures
  attribute to the frontend API choice alone. deployedContracts.ts ships
  empty ({} as const); regenerating it via a local chain + yarn deploy is
  the executor's call and ungraded, hence "contract phase wrapped" rather
  than "deployed" in the input. Approve flows, loading states, and
  decimals are deliberately absent from the feature — that's frontend-ux
  territory (its quizzes and goal-001 grade them), so no double-testing.

  Rejected template alternatives, for the record: qa-target has a
  populated deployedContracts.ts (better mid-build realism) but its
  seeded payouts page mixes raw wagmi useWriteContract with scaffold read
  hooks, so an executor extending it would be graded on workspace mimicry
  rather than its own prior — that mixed-API page is instead a candidate
  for a separate mimicry-resistance quiz if this one ceilings on both
  variants. templates/se-2 is equivalent but hardhat-flavored;
  quiz-001/002 scenarios are foundry, so foundry stays consistent.

  Skill vendored at skills/orchestration (source
  ethskills.com/orchestration/SKILL.md).
