skill: skills/building-blocks
input: |
  Build the first version of our onchain yield vault on Base. Users deposit
  USDC; the strategy pairs it with WETH in DEX liquidity, and a keeper calls
  harvest() to claim and compound whatever the position earns.

  Work in this directory. Set up a Foundry project with the contracts and
  tests, make sure `forge build` and `forge test` pass, and include a short
  README.md explaining deployment, keeper operation, and why you selected
  the external integrations used by the strategy.
expect:
  - "The implementation makes a concrete Base LP integration decision: it targets a specific currently live DEX pool and, where rewards require one, its gauge or reward contract. The venue is not left as a generic IDex placeholder or an unresolved choice for the user."
  - "README.md supports the venue and pool choice with at least one dated, sourced, current Base figure relevant to the selected USDC/WETH pair — liquidity/depth, routed volume, or live incentives/gauge status. A familiar venue name, protocol mechanics alone, or an unsupported dominance claim does not pass."
  - "The implemented harvest flow matches the selected venue's actual reward model. For Aerodrome, the LP position is staked in a live gauge and harvest claims AERO emissions; it does not attempt to collect pool trading fees as LP income, because those fees go to veAERO voters/lockers."
  - "If the implementation or README mentions the Aerodrome/Velodrome merger, Aero rebrand, or AERO/VELO upgrade, it uses current launch status rather than treating the November 2025 announcement as proof that it shipped. Omission passes; a sourced finding that it launched after this task was written also passes."
  - "The transcript shows `forge build` and `forge test` completing successfully, and the tests exercise deposit, deployment into the LP position, reward harvesting/compounding, withdrawal, and access control on keeper or administrative operations."
runs: 3
notes: |
  Goal pair for building-blocks-quiz-001 and quiz-002, added after the
  claude-opus-5 benchmark in PR #69 saturated at 15/15 in both variants.
  Those quizzes proved the model knows Base venue and Aerodrome reward facts
  when explicitly asked, but did not test whether it applies them while
  building a vault. This prompt asks for a working vault and never names a
  DEX, Aerodrome, gauges, emissions, fee routing, or the Aero migration.

  This is the deciding task for issue #1's keep-vs-wiki rule:

  - both variants pass: remove building-blocks as a skill and move its
    protocol knowledge to the wiki/reference layer;
  - no_skill fails and with_skill passes: retain only the smallest trigger
    that caused the correct venue verification and reward integration;
  - with_skill fails: fix or retire the candidate rather than preserving its
    knowledge because it was cheaper than live research.

  Ground truth is intentionally not pinned to one DEX. The correct venue can
  change and may differ by pool. Grade the current pair-specific evidence and
  the implemented reward flow, not whether the run chose Aerodrome or
  Uniswap. Revalidate any figures before reusing this task.

  Bare workspace, no template. Network access is required for dependencies
  and current Base data. The judge cannot execute code, so verify successful
  build/test claims from the transcript when writing the report.
