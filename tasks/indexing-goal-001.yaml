skill: skills/indexing
input: |
  Build Streak, a daily onchain check-in app for a community on Base.

  How it works: once a day a member sends a check-in transaction, optionally with a
  short public note ("gm", "shipped the docs", whatever). That's the only write.

  The app has three screens, and this is the whole point of the product:
    - a live global feed of the most recent check-ins across everyone, newest first,
      each showing who, when, and their note;
    - a per-member profile showing their current streak (consecutive days) and their
      all-time total check-ins;
    - a leaderboard of the top members this month by number of check-ins.

  By the time the app launches, the contract will already have months of check-ins
  behind it, so the feed, the streaks, and the leaderboard all have to reflect the
  complete history — the entire record from the contract's first day, not just what
  happens after a page is opened.

  Work in this directory. Ship what a developer needs to run this: the contract(s), the
  code for the read side that backs those three screens, and a README.md covering the
  architecture, how to deploy it, and how a developer gets it running locally. Keep
  everything you write in ordinary source folders here — nothing you want us to read
  should end up under lib/, dist/, build/, out/ or cache/, which we treat as generated.
expect:
  - "The check-in contract emits an event on every check-in (event-first design), and that event carries the data the three screens need — at minimum the member address; the check-in must be placeable in time by the read side, where an event field or the block's own timestamp both pass. Because the feed has to display the note text, the note is recoverable by the read side: emitted in the event, or stored offchain (DB/IPFS) with the check-in referencing it — NOT reduced to an onchain hash the feed cannot render back to text. A contract that records check-ins with no event fails this check."
  - "The historical read side — the global feed, the streaks/totals, and the month leaderboard, all of which must reflect full history at launch — is served by an indexer over the contract's events: a subgraph (The Graph), Ponder, a provider API, or a hand-rolled indexer that backfills the history once into a persistent store and then tails new events. The distinction is one-time backfill into an indexed store (passes) versus re-scanning the chain per query (fails): a client or backend that answers a page load or API request by calling eth_getLogs from block 0 (or a hardcoded early block) to latest, or by reconstructing history from archive-node state reads, fails this check."
  - "The month leaderboard and per-member streak/total are computed offchain from the indexed events, not maintained as onchain rankings or counters that the contract sorts or paginates: there is no onchain view returning a ranked/sorted leaderboard. Plain per-member counters recorded as a side effect of a check-in the contract already writes do not fail this check, but the sorting/ranking for the leaderboard is derived offchain."
  - "README.md describes the read architecture explicitly: it names where the feed / streak / leaderboard data is served from (the indexer/subgraph/store), and how that stays in sync with new check-ins — so a developer can tell the historical data does not come from a live full-chain scan."
  - "README.md names a concrete deployment path for the read side — how the indexer/subgraph gets deployed or run in production (a named target and the command or service) — as a decision that got made, not left open."
runs: 3
notes: |
  Goal task for skills/indexing per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Grades the claims the
  indexing quizzes test, unprompted, off one build:

    - reach for an indexer, don't scan history via RPC   expect_2            (quiz-001)
    - design contracts event-first                        expect_1            (skill core)
    - don't compute rankings onchain                      expect_3
    - the read architecture is a real, stated decision    expect_4, expect_5

  The prompt never says "indexer", "subgraph", "event", "The Graph", or "don't scan
  blocks". The forcing function is the product itself: a global feed + streaks +
  a month leaderboard that must reflect full history at launch cannot be rendered from
  a cheap current-state read, so a competent build has to decide how to read history —
  and the skill's habit is that the answer is an indexer over events, with the contract
  designed event-first to make that possible. Don't soften the "reflect the full
  history at launch" clause; that clause is what rules out "just watch new events from
  now" and forces the historical-read decision.

  Read the two shapes together: the quizzes measure knows-when-asked, this measures
  applies-unprompted. Every expect must pass for a run to pass, so the aggregate may be
  0/3 on both variants — the per-claim split (esp. expect_1/2/3) is the point.

  Bare workspace, no template on purpose: a template pre-picks the framework, and a
  Scaffold-ETH template ships its own AGENTS.md and skills that could carry a no_skill
  run for reasons unrelated to skills/indexing. Nothing is broadcast; the artifact is
  code and a deploy plan, not a deployment.

  Before grading, check the run's evidence contains everything the run wrote: verify
  snapshots a bare workspace but skips generated-dir path segments (lib, dist, build,
  out, cache and friends), while a run that created a .git dir is graded from run.diff
  instead, which keeps them — so the same deliverable can be visible in one run and
  missing in the next. The input asks for source outside those folders to keep the two
  paths comparable; if a run ignored that, say so rather than grading the gap.

  Record per run: which framework/indexer stack the run reaches for (subgraph vs Ponder
  vs provider API), whether it emits events at all, whether any leaderboard/streak
  logic leaked onchain, which chain it targets, and whether the run fetched any other
  ethskills SKILL.md over the network.

  Overlap caveat: expect_3 (rankings offchain) also lives in skills/ship's onchain
  litmus. Attribute a delta here to indexing only when the win is the event-first /
  index-over-events decision (expect_1/2/4/5); read expect_3 per-check, not as the
  headline. The contract's deploy target and command are deliberately not graded here —
  ship-goal-001 expect_6 owns that — so expect_5 grades only the indexer/read side and
  the delta stays attributable to indexing.

  Skill vendored at skills/indexing (source ethskills.com/indexing/SKILL.md, skill
  source @ 191dcc1).
