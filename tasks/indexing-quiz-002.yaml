skill: skills/indexing
input: |
  Our subgraph is written and tested — it indexes our marketplace's events and the
  GraphQL queries return what we want against a local Graph Node. Next sprint is
  "ship the subgraph to production," and I'm writing the runbook and the budget line
  for it now.

  A teammate's draft runbook says:

    "Ship step: run `graph deploy --hosted-service marketplace` to push it to The
     Graph's hosted service. The hosted service is free and gives us a public GraphQL
     endpoint our frontend can hit straight away — no tokens, no billing, nothing to
     set up."

  I need the real go-live path for a production dApp querying The Graph today. Walk me
  through what actually happens between "works locally" and "our frontend is hitting a
  production endpoint we can rely on": what that draft step gets wrong, what the correct
  steps are, and what — if anything — this costs us to run, both to stand up and per
  month at, say, a few million queries. Be concrete about anything that isn't free and
  anything involving tokens, and flag any number that I should re-check before I commit
  it to the budget. For each figure, say where you got it from, so I can check it myself.

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md flags the draft step as broken because The Graph's hosted service no longer exists — it was sunset / decommissioned (mid-2024), so `graph deploy --hosted-service` and any free hosted GraphQL endpoint from The Graph is not a path you can ship on today. It does NOT present the hosted service as a currently working free option."
  - "It gives the correct go-live path as two distinct steps: deploy to Subgraph Studio for testing (graph deploy to Studio), THEN publish the subgraph to The Graph's decentralized network to get a production endpoint. It does not conflate 'deploy to Studio' with 'live in production' — Studio deploy alone is not the production endpoint."
  - "It states that querying the production (decentralized network) endpoint requires an API key created in Subgraph Studio and is a paid/metered service — not unconditionally free. A free monthly allowance may be mentioned, but the answer must make clear production queries are billed beyond it."
  - "It puts concrete numbers on the cost that are in the right ballpark and flags them as checkable: a free tier around 100K queries/month and paid queries around single-dollars per 100K (e.g. ~$2 per 100K) — so a few million queries/month lands on the order of tens to low hundreds of dollars (e.g. 5M/mo ≈ $100 at $2/100K), not free and not thousands. A run reporting different live numbers passes only if answer.md names the source it took them from (The Graph's pricing/billing docs or the Studio billing page, named or linked) so the figure is checkable — a divergent figure with no named source fails this line."
  - "It does NOT claim that buying GRT is required to pay for each query. If GRT is mentioned, it is tied to optional curation/signal at publish time (to attract indexers) or as one way to fund the API-key billing — not presented as a strict per-query requirement. Omitting GRT entirely does not fail this line."
runs: 3
notes: |
  Quiz task for skills/indexing per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. One claim per file: targets
  the skill's The Graph deploy/publish section ("Deploying a Subgraph", "Subgraph
  Studio ... Publish to the decentralized network for production"). This is the
  skill's most stale-prone content — the go-live story around The Graph changed
  materially in 2024 and the skill only gestures at it.

  The claim is buried in a proxy: the prompt hands a plausible-but-dead runbook step
  (deploy to the hosted service) and asks for the real path plus a budget, rather than
  asking "does the hosted service still exist?". A stale-prior model reflexively
  recommends thegraph.com's hosted service; the derivation (correct two-step
  Studio->publish path + a real cost figure) is what a pass has to produce.

  Ground truth as of 2026-07 (revalidate every number on re-run — this is the most
  time-sensitive task in the set):
    - The Graph hosted service was fully sunset 12 Jun 2024; endpoints are gone. The
      current path is: deploy to Subgraph Studio (test) -> publish to the decentralized
      network (production) -> query via an API key from Studio.
    - Pricing: ~100K free queries/month, then ~$2 per 100K queries (confirm the live
      rate). A few million queries/month ≈ tens to low hundreds of dollars. The judge
      only sees the diff and the output, so it cannot verify a figure that diverges from
      this ballpark is current rather than hallucinated — expect_4 therefore makes the
      run name its source, and the input asks for it. If the live rate has moved, update
      the ballpark here and in expect_4 rather than loosening the source requirement.
    - GRT: self-signal at publish is optional (commonly ~3K GRT suggested) to attract
      indexers; API-key billing accepts card or GRT. Do not fail a run that omits GRT
      entirely as long as it doesn't claim GRT is required per query.

  Note the skill itself is thin here, not wrong: it never names the hosted service, so
  it won't actively mislead — the test is whether the model, with vs without the skill,
  lands on the current path. If a with_skill run still recommends the hosted service or
  calls production queries free, that's a content gap (the skill should state the
  hosted service is gone and name the Studio->publish->API-key path with costs) — file
  it as a mistake against the deploy section.

  Record per run: whether the run checked a live source for the deprecation and the
  pricing or recited it, and whether it recommended the hosted service at any point.

  Bare workspace, answer is a file. Skill vendored at skills/indexing (source
  ethskills.com/indexing/SKILL.md, skill source @ 191dcc1).
