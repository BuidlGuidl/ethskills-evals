skill: skills/tools
input: |
  I have to get a full-stack Ethereum app in front of users by the end of the
  week: one Solidity contract, a React frontend that reads and writes it with
  typed contract calls, wallet connect, and a local chain to develop against.

  What's the fastest way to stand this up? Give me the exact setup commands.

  Write your answer to answer.md in this directory. Confirm anything you tell me
  to run actually exists today.
expect:
  - "answer.md names Scaffold-ETH 2 as the path — not a generic 'use a boilerplate/starter' with no specific toolkit named, and not 'wire it together yourself'."
  - "The scaffold command it gives is built on the current `create-eth` package: either `npx create-eth@latest`, or an explicit version that answer.md shows it checked is the release `latest` resolves to right now. It fails on the deprecated `create-eth-app` / `create-scaffold-eth`, on any invented incantation, and on a pinned version asserted with no evidence it is current."
  - "It names the concrete payoff that removes the plumbing: TypeScript types generated automatically from the contracts, plus scaffold hooks for contract reads/writes — rather than describing Scaffold-ETH 2 only as 'a boilerplate' or 'a starter kit'."
runs: 3
notes: |
  Quiz task for skills/tools per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. One claim per file:
  targets the skill's Scaffold-ETH 2 claim (the "Rapid prototyping / full dApps
  → Scaffold-ETH 2" stack-table row, plus `npx create-eth@latest` and the
  auto-generated-types/hooks specifics).

  What this quiz really tests: whether SE-2 is well-known enough that an agent
  reaches for it to build a full-stack Ethereum app without being pushed there —
  i.e. is it the LLM's default priority for this niche. Same shape as quiz-001:
  the failure mode isn't ignorance, it's a stale command name (`create-eth-app`,
  long dead), so expect_2 grades the artifact fact the judge can see — the
  command in answer.md is the current `create-eth@latest`. Resolvability-was-
  checked is NOT graded (blind judge, no npm access); the input asks the executor
  to confirm the command exists so the check lands in the transcript, mined at
  report time. Bare workspace, no template on purpose — a template would
  pre-install SE-2 and destroy the signal.

  Partly orphaned by the minimal-skill rewrite (PR #68, 2026-08-20). The
  "Rapid prototyping / full dApps → Scaffold-ETH 2" stack-table row cited above is
  gone, as is the Scaffold-ETH 2 section carrying the auto-generated-types and
  scaffold-hooks specifics that expect_3 grades. What survives in the skill is a
  single instruction: give `npx create-eth@latest` and verify that it resolves.

  So expect_2 still grades a claim the skill makes, while expect_1 and expect_3
  grade claims it no longer makes — a `with_skill` pass on those two measures the
  executor model, not this skill. Both are 3/3 vs 3/3 on both stacks, which is why
  the material was cut.

  expect_2 was also rewritten in the same PR, per
  `tools-eval-rejects-current-create-eth-pin`: it rejected a live-verified pin
  purely for not being the floating `@latest` spelling, which failed two codex
  `with_skill` runs that had done exactly the right thing. It now accepts either
  spelling and grades what actually matters — the `create-eth` package name, and
  evidence in answer.md that the version was checked rather than remembered. The
  committed 2026-08-13 codex records keep their original grades; they were graded
  under the old wording and the report already reads them as false negatives.

  With expect_2 fixed, the skill's `create-eth` instruction no longer has a broken
  check propping it up — and it has no measured uplift either, since SE-2 is 3/3 vs
  3/3 on both stacks. Whether it earns its place in a minimal skill is a live
  question in issue #1, not something this PR settles.
