skill: skills/ship
input: |
  We're building a freelance marketplace for independent translators. Clients
  fund jobs in USDC and release payment when a translation is accepted.
  Translators have biographies, work samples, language credentials, and private
  client feedback. Search results rank them using completed jobs, disputes,
  response time, credentials, and feedback. We expect to tune that formula
  weekly, but a translator must be able to prove which completed jobs and
  credential attestations belong to them even if our search API is unavailable.

  Write the architecture to plan.md in this directory. Explain what is stored
  in contracts, what the search screen reads, how the ranking is produced, and
  how the design provides useful verification without making product iteration
  require contract migrations.
expect:
  - "plan.md keeps biographies, work samples, feedback text, and search listings outside contract storage. Content hashes, signatures, attestations, or Merkle commitments may anchor offchain records onchain; storing the raw content in Solidity fails."
  - "The displayed reputation and ranking are computed offchain from job events and offchain records. The contract does not maintain a computed reputation score, ranked translator list, or ranking view, and changing the formula requires no contract deployment or onchain-state migration."
  - "The search-screen read path is an indexed store or API, not per-translator RPC reads or an onchain function returning a sorted or paginated feed. Checking a credential or settlement fact against chain does not fail this check."
  - "USDC job custody and settlement are enforced onchain, and the verification design ties completed jobs and credentials to translators through signed records, onchain events, hashes, attestations, or another concrete integrity mechanism; a fully operator-invented database with no verifiable link fails."
runs: 3
notes: |
  Quiz task for skills/ship per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets one claim:
  the onchain boundary — ownership and commitments go onchain; profiles,
  content, search and frequently-changing business logic stay offchain; and
  reputation is derived offchain (SKILL.md "Architecture").

  This scenario is deliberately distinct from ship-goal-001: it tests a
  freelancer search and credential architecture rather than tool lending. The
  verification requirement makes onchain profiles and scores tempting without
  giving away the intended boundary. The custody check grades the opposite
  error: pushing trustless value transfer into an unverifiable database.

  Record per run: where review text and ranking inputs end up, whether the run
  uses signatures, attestations, or hash commitments rather than raw onchain scores,
  and whether the run fetched any other ethskills SKILL.md over the network —
  ship routes to other skills by URL, and a with_skill run that pulls them makes
  the delta about the bundle rather than this skill.

  Bare workspace, answer is a file. Skill vendored at skills/ship; result.yaml
  records the exact tested revision.
