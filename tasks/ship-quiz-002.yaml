skill: skills/ship
input: |
  We're building a tool-lending network for several neighborhoods. Members have
  profiles and list tools with photos and condition notes. A loan locks a USDC
  deposit; after return, each side can leave a signed review. The home screen
  ranks reliable lenders and borrowers using completed loans, late returns,
  disputes, and reviews. We expect to tune that formula often, but members must
  be able to verify that the displayed history belongs to them and was not
  silently invented by the operator.

  Write the architecture to plan.md in this directory. Explain what is stored
  in contracts, what the home screen reads, how the ranking is produced, and
  how the design provides useful verification without making product iteration
  require contract migrations.
expect:
  - "plan.md keeps member profiles, tool photos, condition notes, review text, and browse listings outside contract storage. Content hashes, signatures, attestations, or Merkle commitments may anchor offchain records onchain; storing the raw content in Solidity fails."
  - "The displayed reputation and ranking are computed offchain from loan events and offchain records. The contract does not maintain a computed reputation score, ranked member list, or ranking view, and changing the formula requires no contract deployment or onchain-state migration."
  - "The home-screen read path is an indexed store or API, not per-member RPC reads or an onchain function returning a sorted or paginated feed. Checking a commitment or settlement fact against chain does not fail this check."
  - "USDC deposit custody and settlement are enforced onchain, and the verification design ties offchain history or reviews to members through signed records, onchain events, hashes, attestations, or another concrete integrity mechanism; a fully operator-invented database with no verifiable link fails."
runs: 3
notes: |
  Quiz task for skills/ship per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets one claim:
  the onchain litmus test — ownership and commitments go onchain; profiles,
  content, search and frequently-changing business logic stay offchain; and
  reputation is offchain compute with an onchain commitment at most (SKILL.md
  "The Onchain Litmus Test" and the "Onchain everything" anti-pattern).

  This revision replaces the original saturated music/badge prompt. Verification
  pressure makes onchain reviews and scores tempting without explicitly asking
  where the formula runs. The deposit check grades the opposite error: pushing
  trustless value transfer into an unverifiable database also fails the litmus.

  Record per run: where review text and ranking inputs end up, whether the run
  uses signatures, attestations, or hash commitments rather than raw onchain scores,
  and whether the run fetched any other ethskills SKILL.md over the network —
  ship routes to other skills by URL, and a with_skill run that pulls them makes
  the delta about the bundle rather than this skill.

  Bare workspace, answer is a file. Skill vendored at skills/ship (source
  ethskills.com/ship/SKILL.md, skill source @ 191dcc1).
