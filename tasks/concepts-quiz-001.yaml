skill: skills/concepts
input: |
  We run a monthly community meetup and this month we're giving away 5 ETH from
  the treasury. Anyone who turns up can enter onchain during the week before;
  entries close Friday at 20:00 UTC and we want to hand the prize over that same
  evening, on stage.

  Two things matter more than anything else here. Nobody — us included — gets to
  influence or foresee which entrant wins. And a losing entrant who goes and
  reads the contract afterwards can't build a credible case that it was rigged.

  One constraint from the treasury: it holds ETH and nothing else, and we're not
  opening an account with a paid third-party provider or topping one up for a
  single evening's giveaway. Whatever we do has to work with the contract and the
  people who are in the room.

  Write your answer to answer.md in this directory: the exact sequence from
  entries closing to the prize landing in the winner's wallet. For each onchain
  step, say who sends that transaction and the window it has to happen in.
  Include anything we need to have in place beforehand for that sequence to work
  on the night. Then tell me what happens if someone doesn't do their part in
  time, and what the contract does about it.
expect:
  - "The seed the draw rests on is not derived from block.timestamp, block.number, the current block's blockhash (which is always zero), or a number the organizers generate off-chain and submit without a verifiable proof; any of those fail. block.prevrandao passes only if answer.md states its limitation — a proposer can withhold a block to re-roll the result — and argues why that is tolerable at this prize size. A past blockhash bound to a committed secret is not disqualified by this line; expect_2 grades that construction. This line grades the source only; manipulation by the entrants themselves is expect_5's ground."
  - "If the design reads a past blockhash (commit-reveal or any variant), answer.md states the lookback limit of the mechanism it actually uses — 256 blocks for the blockhash opcode, or 8191 blocks (~27 hours) if it reads the EIP-2935 history contract at 0x0000F90827F1C53a10cb7A02335B175320002935 — and places its reveal-and-draw window inside that limit, with the commitment binding a salt or the sender's address rather than the bare secret. Converting the limit to wall-clock time is not required. Passes trivially if no blockhash-based scheme is chosen."
  - "If the design uses an external randomness service (Chainlink VRF or equivalent), answer.md treats the request as asynchronous — the value arrives in a later callback transaction, never as the return value of the requesting call — and accounts for that delay in the same-evening timeline. Passes trivially if no external service is chosen."
  - "If the design uses an external randomness service, answer.md names who pays for the randomness and how that payment is funded: a subscription balance or a direct-funded consumer contract, in LINK or native ETH. Passes trivially if no external service is chosen."
  - "answer.md handles a participant who doesn't do their part in time: the missed step forfeits that entrant instead of stalling the draw, and where the outcome depends on inputs participants supply, it addresses the last-actor problem — whoever acts last can see the result coming and withhold to change it — with a stake at risk or a construction where no single absence moves the winner. A fallback that quietly substitutes a manipulable value (a timestamp, an organizer-chosen number) fails. Passes on stating it if the chosen design takes no participant-supplied input."
  - "Every step between entries closing and payout names who sends that transaction. No step is described as the contract acting on its own when the deadline passes; the prize moves because someone — the winner, the organizers, anyone — sends a transaction."
runs: 3
notes: |
  Quiz task for skills/concepts per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets SKILL.md
  "Randomness": deterministic execution means there is no usable onchain
  entropy, a past blockhash is readable for 256 blocks (8191 through the
  EIP-2935 history contract) and returns zero for the current block, and the
  two workable constructions are commit-reveal and a VRF.

  The prompt never says "random", "randomness", "VRF" or "commit-reveal" — it
  asks for a step-by-step operational sequence, and a mechanism has to be
  chosen to answer at all. Keep it that way. Two clauses are load-bearing and
  should not be softened: "hand the prize over that same evening" (which is
  what makes the 256-block window and VRF callback latency bite instead of
  staying abstract), and "who sends that transaction and the window it has to
  happen in" (which is what turns the answer into something gradable rather
  than a description of a mechanism).

  Expects 2, 3 and 4 are per-path and each passes trivially when the run picked
  the other path — every design still faces expects 1, 5 and 6.

  The treasury constraint was added after the claude/opus-5 benchmark in
  https://github.com/BuidlGuidl/ethskills-evals/pull/78, where all six runs
  across both variants chose Chainlink VRF and passed 3/3. expect_2 — the
  lookback limit, which is the one claim in this task the skill's own text
  carries — was never exercised, so the task graded nothing it was built to
  grade. Ruling out a funded external provider is what forces the blockhash
  path; it never says "random", "commit", "reveal" or "blockhash", so the
  mechanism is still the run's to find. Expects 3 and 4 stay in place: a run
  that reaches for VRF anyway is still graded on getting VRF right, and that
  choice should be recorded as the constraint not biting rather than treated as
  a fail.

  Results from #78 were produced against the pre-constraint input and are not
  comparable with runs of this version.

  Verdict-flipping interpretation: expect_5's last-actor clause goes one step
  past the skill's own text, which gives the commit-reveal construction but
  not the case where the last revealer sees the outcome coming and withholds.
  A with_skill fail on expect_5 alone is not by itself a skill failure —
  compare it across variants.

  Record per run: which source it chose (commit-reveal, VRF, prevrandao,
  something naive), whether a blockhash design reached for the blockhash opcode
  (256 blocks) or the EIP-2935 history contract (8191), whether it put a stake
  behind the reveal, and the run's cost and duration — the cost delta is part
  of the verdict per
  https://github.com/BuidlGuidl/ethskills-evals/issues/1#issuecomment-5343246613
  and is not in result.yaml. Also record whether the prose writes "onchain" or
  "on-chain" — the skill makes that call and no expect line grades it, so a run
  should not fail on a hyphen.

  Bare workspace, answer is a file. Skill vendored at skills/concepts (source
  ethskills.com/concepts/SKILL.md, skill source @ 191dcc1); the vendored copy
  is the minimal rewrite, which states the 8191-block EIP-2935 lookback
  alongside the 256-block one, so a with_skill run naming the history contract
  is now skill-sourced rather than knowledge surviving the skill.
