skill: skills/concepts
input: |
  We run a monthly community meetup and this month we're giving away 5 ETH from
  the treasury. Anyone who turns up can enter onchain during the week before;
  entries close Friday at 20:00 UTC and we want to hand the prize over that same
  evening, on stage.

  Two things matter more than anything else here. Nobody — us included — gets to
  influence or foresee which entrant wins. And a losing entrant who goes and
  reads the contract afterwards can't build a credible case that it was rigged.

  Write your answer to answer.md in this directory: the exact sequence from
  entries closing to the prize landing in the winner's wallet. For each onchain
  step, say who sends that transaction and the window it has to happen in. Then
  tell me what happens if someone doesn't do their part in time, and what the
  contract does about it.
expect:
  - "The seed the draw rests on is not derived from block.timestamp, block.number, the current block's blockhash (which is always zero), or a number the organizers generate off-chain and submit without a verifiable proof; any of those fail. block.prevrandao passes only if answer.md states its limitation — a proposer can withhold a block to re-roll the result — and argues why that is tolerable at this prize size. A past blockhash bound to a committed secret is not disqualified by this line; expect_2 grades that construction. This line grades the source only; manipulation by the entrants themselves is expect_4's ground."
  - "If the design reads blockhash (commit-reveal or any variant), answer.md states that blockhash is only available for the most recent 256 blocks, places its reveal-and-draw window inside that limit, and has the commitment bind a salt or the sender's address rather than the bare secret. Converting the limit to wall-clock time (roughly 51 minutes at 12-second blocks) is not required. Passes trivially if no blockhash-based scheme is chosen."
  - "If the design uses an external randomness service (Chainlink VRF or equivalent), answer.md treats the request as asynchronous — the value arrives in a later callback transaction, never as the return value of the requesting call — accounts for that delay in the same-evening timeline, and names who pays for the randomness and how that payment is funded: a subscription balance or a direct-funded consumer contract, in LINK or native ETH. Passes trivially if no external service is chosen."
  - "answer.md handles a participant who doesn't do their part in time: the missed step forfeits that entrant instead of stalling the draw, and where the outcome depends on inputs participants supply, it addresses the last-actor problem — whoever acts last can see the result coming and withhold to change it — with a stake at risk or a construction where no single absence moves the winner. A fallback that quietly substitutes a manipulable value (a timestamp, an organizer-chosen number) fails. Passes on stating it if the chosen design takes no participant-supplied input."
  - "Every step between entries closing and payout names who sends that transaction. No step is described as the contract acting on its own when the deadline passes; the prize moves because someone — the winner, the organizers, anyone — sends a transaction."
runs: 3
notes: |
  Quiz task for skills/concepts per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets SKILL.md
  "Randomness Is Hard": deterministic execution means there is no usable
  onchain entropy, blockhash is readable for 256 blocks only and returns zero
  for the current block, and the two workable constructions are commit-reveal
  and a VRF.

  The prompt never says "random", "randomness", "VRF" or "commit-reveal" — it
  asks for a step-by-step operational sequence, and a mechanism has to be
  chosen to answer at all. Keep it that way. Two clauses are load-bearing and
  should not be softened: "hand the prize over that same evening" (which is
  what makes the 256-block window and VRF callback latency bite instead of
  staying abstract), and "who sends that transaction and the window it has to
  happen in" (which is what turns the answer into something gradable rather
  than a description of a mechanism).

  Expects 2 and 3 are per-path and each passes trivially when the run picked
  the other path — every design still faces expects 1, 4 and 5.

  Verdict-flipping interpretation: expect_4's last-actor clause goes one step
  past the skill's own text, which gives the commit-reveal construction but
  not the case where the last revealer sees the outcome coming and withholds.
  A with_skill fail on expect_4 alone is not by itself a skill failure —
  compare it across variants.

  Record per run: which source it chose (commit-reveal, VRF, prevrandao,
  something naive), whether the 256-block limit appeared as a derived number
  (blocks x block time) or was asserted, and whether the prose writes "onchain"
  or "on-chain" — the skill makes that call and no expect line grades it, so a
  run should not fail on a hyphen.

  Bare workspace, answer is a file. Skill vendored at skills/concepts (source
  ethskills.com/concepts/SKILL.md, skill source @ 191dcc1).
