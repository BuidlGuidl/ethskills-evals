skill: skills/concepts
input: |
  I run a small API service — weather data for hobby projects — and I want the
  billing to live onchain instead of on Stripe. How it should work:

    - a customer tops up their account with USDC up front
    - they pick a plan: $5/month hobby, $20/month pro
    - they're charged monthly for as long as they keep the subscription
    - they can cancel whenever and get back whatever they haven't used
    - my backend has to be able to check, per incoming request, whether a
      given address is currently subscribed

  Build it in this directory: the contracts plus whatever tooling you'd use to
  deploy them, your call on the stack. Then add a NOTES.md covering how this
  runs day to day once it's live, and what I should be keeping an eye on. Keep
  everything you write in ordinary source folders here — nothing you want us to
  read should end up under lib/, dist/, build/ or out/, which we treat as
  generated.
expect:
  - "The directory contains subscription contract code plus a deploy path (hardhat, foundry, scaffold-eth or equivalent) — the stack was actually chosen and wired, not described."
  - "No part of the monthly charge depends on a transaction only the operator can send. It is one of: the provider withdrawing revenue that has already accrued to it without that transaction, a call any address can make, or an accrual computed at read time with no periodic transaction at all. A design where what a customer owes only moves because the operator's cron, script or owner-only function runs fails; such a job passes only as a convenience layered over a path that works without it."
  - "Whoever the design expects to send a recurring transaction has a reason to pay for it, and NOTES.md says what that reason is — the provider claiming its own revenue, or a caller earning a fee. If the design charges subscribers one at a time on a schedule, NOTES.md states who pays that gas and what it comes to on the chain the design targets, against $5 and $20 plan prices, instead of leaving it as an assumed background job — a design on a cheap L2 saying the per-charge cost is negligible at those prices passes this clause; leaving the cost unnamed does not. Passes on NOTES.md saying so where the design has no recurring transaction at all because the charge accrues at read time."
  - "A customer can get their unused balance out without the operator's cooperation: cancelling and withdrawing are functions the customer calls. NOTES.md does not describe refunds as something the operator processes, and does not leave customer funds stranded if the operator stops running anything."
  - "If the contracts carry operator powers — Pausable, owner-only control over customer balances or over a customer's access to the service, an upgradeable proxy, a blacklist; withdrawing the provider's own accrued revenue does not count — NOTES.md names what those let the operator do to a paying customer and what becomes of customers if that key is lost or the operator walks away. Contracts shipping no such powers pass this line."
  - "NOTES.md states what this design puts in public: at minimum, that anyone — competitors included — can read which addresses are subscribed, plus whatever else the chosen design exposes onchain (plan, payment history). Saying nothing about it fails."
  - "NOTES.md does not let public or verified contracts stand in for the whole system being forkable: it says what a customer or a third party could and could not run for themselves if the provider stopped operating — the contracts on one side, the weather API and whatever serves the per-request subscription check on the other. Contracts being open or verified, with the service side of the stack unmentioned, fails this line."
runs: 5
notes: |
  Goal task for skills/concepts per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Mirror of
  concepts-quiz-002: the quiz hands over a design that already has a
  permissionless incentivized caller and asks whether the incentive is big
  enough; this asks for a build where "charged monthly" has no automatic path
  at all, so who advances the state, and why they would, has to be decided
  along the way. That one measures knows-when-asked, this one measures
  applies-unprompted.

  The prompt never says automatic, keeper, cron, incentive, admin, privacy or
  decentralization. Don't add them. "Charged monthly for as long as they keep
  the subscription" is the trap: there is nothing to run it. The per-request
  backend check is deliberate too — it leaves the read-time accrual design
  (no periodic transaction exists to pay for) available as the strongest
  answer without hinting at it.

  Expects 2-4 grade SKILL.md "Nothing runs itself" (who sends it, why would
  they, is it enough) and whether a customer can still get out with nobody
  operating the thing. Expects 5-7 grade three of the four CROPS questions the
  skill says to answer in writing before a build is finished: an operator key
  that can cut off a paying customer is the censorship power it says to name
  rather than scaffold silently (5), a public ledger of who subscribes to what
  is the exposure it says to state (6), and a subscription whose contracts are
  public while the API it buys access to is not is its open-source point —
  verified contracts are not a forkable stack (7). The fourth, what "audited"
  covers, has no hook in this build and is untested here.

  Every expect must pass for a run to pass, and expects 5-7 ask for NOTES.md
  content the input never requests, so the aggregate may be 0/5 on both
  variants — the per-claim split is the point of this task. Report per-expect
  counts, not only the aggregate.

  runs: 5, raised from 3 after the claude/opus-5 benchmark in
  https://github.com/BuidlGuidl/ethskills-evals/pull/78. This is the only one
  of the three concepts tasks that produced any separation there, and the
  entire finding was a 2/3-vs-1/3 split on expect_7 — one run of difference,
  inside noise. Three runs cannot resolve that, and the two quizzes are cheap
  by comparison, so the budget belongs here.

  What #78 established, and what this task is now measuring. Expects 2-4 came
  back 3/3 on both variants: all six runs independently chose per-second
  read-time accrual with a permissionless settle(), so the stale prior the
  skill was written to correct — "charged monthly" with nothing to run it — did
  not reproduce on claude-opus-5. Do not read 5/5 there as the skill working;
  it is the model. The live lines are 6 and 7, the CROPS habits that have to
  surface unprompted in prose the input never asks for, and expect_7 in
  particular: 3 of 6 runs stopped at Etherscan verification and never mentioned
  the weather API or the per-request check. The minimal skill rewrite moves
  those four questions out of a definition list at the top and into an
  end-of-build instruction to write the answers down, so expects 6 and 7 are
  the pre-registered test of whether that framing lands. A with_skill run that
  still stops at verified contracts is evidence against the framing, not
  against the content — SKILL.md states the claim either way.

  expect_5 has passed 6/6 the trivial way: no run shipped operator powers at
  all, so "contracts shipping no such powers pass this line" carried it every
  time. Record whether that holds — a run that scaffolds Pausable or onlyOwner
  and then names what it does is the case the line was written for, and none
  has occurred yet.

  Before grading, check the run's evidence actually contains everything the run
  wrote. verify snapshots a bare workspace but skips any path segment in its
  generated-dirs list (lib, dist, build, out, cache and friends), while a run
  that created a .git dir is graded from run.diff instead — and a run that
  committed its own work leaves that diff empty. The input asks for source
  outside those folders to keep the two paths comparable; if a run ignored
  that, say so rather than grading the gap.

  Bare workspace, no template on purpose: a scaffold pre-picks the stack, and
  that choice is signal. Record per run: which stack it reached for, whether
  the monthly charge came out as provider-pull, permissionless poke or
  read-time accrual (all three pass, they are not equally good answers),
  whether any operator power was scaffolded, the run's cost and duration —
  part of the verdict per
  https://github.com/BuidlGuidl/ethskills-evals/issues/1#issuecomment-5343246613
  and not carried in result.yaml — and whether prose writes "onchain"
  or "on-chain" — the skill makes that call and no expect line grades it, so a
  run should not fail on a hyphen.

  Nothing is deployed or broadcast; the contracts and deploy config are the
  artifact.

  Skill vendored at skills/concepts (source ethskills.com/concepts/SKILL.md,
  skill source @ 191dcc1); the vendored copy is the minimal rewrite, so a
  with_skill run here tests that version, not the 230-line one #78 ran.
