skill: skills/l2s
input: |
  Our remittance product settles on Celo. Revenue accrues there in CELO — about
  180,000 CELO sitting in the ops wallet right now — and finance wants it in the
  Ethereum mainnet treasury wallet, where the custodian can see it.

  They want to run this as a monthly close: kick it off on the last business day
  and have the money in the mainnet wallet before the next month's books close.
  Volume is growing, so assume this becomes a $2M sweep before long.

  I need to write the runbook. Tell me how the transfer actually works step by
  step, how long the money is in flight, what the operator has to do at each
  stage and when, and what you would change if finance comes back and says they
  need it same-week.

  Write your answer to answer.md in this directory.
expect:
  - "answer.md treats Celo as an Ethereum L2 (OP Stack) whose canonical route to mainnet is an L2-to-L1 withdrawal through the chain's own bridge, not as an independent L1 chain that can only reach Ethereum through a third-party or wrapped-asset bridge. An answer whose canonical / trust-minimised route is a third-party message bridge (Axelar, LayerZero, Portal/Wormhole), an exchange hop, or a wrapped CELO representation fails this check, as does one that describes Celo as an L1. Offering one of those routes as the faster option for the same-week ask is expect_4's ground and does not fail this line — what this line grades is which route the answer calls canonical."
  - "The canonical route is described as the OP-Stack multi-step exit rather than a single send: initiate the withdrawal on Celo, then a prove transaction on Ethereum once the output root / dispute game covering it has been posted, then a separate finalize transaction on Ethereum after the challenge period. The answer must make clear that the two Ethereum-side steps are actions the operator (or their tooling) has to submit, not something that happens automatically. Exact contract or method names are not required; skipping either the prove or the finalize step fails."
  - "The stated in-flight time for the canonical route is multi-day and centred on the challenge period — measured in days, not minutes or hours. An answer that has the canonical withdrawal landing in minutes or hours fails. A run that checks the current window live and states a figure with its source passes as long as the order of magnitude is days; the skill's 7 days and Celo's current 3.5-day window both pass. Whether the answer also gives the prove step's own latency is recorded, not graded."
  - "For the same-week ask, answer.md gives finance an answer and prices what it costs. Two pass paths. Either it names at least one concrete faster route — a liquidity/fast bridge (Across, Squid, Portal/Wormhole, LayerZero-based routes, Chainlink CCIP) or a centralised exchange hop — and states the extra trust assumption beyond Ethereum that the route introduces; or it declines a faster route at this size on stated grounds (the trust or the liquidity a $2M transfer would have to accept) and gives finance a scheduling fix instead — initiating earlier in the cycle, splitting the sweep, running the exit continuously. Naming the fee, and flagging that $2M may exceed a route's liquidity or per-transfer limits and have to be split, are expected and worth recording, but their absence alone does not fail this check. A faster route named with no trust tradeoff stated fails, and so does leaving the same-week ask unanswered."
runs: 3
notes: |
  Quiz for skills/l2s, one claim: Celo is an OP Stack L2 (migrated 2025-03-26,
  block 31056500), not the independent L1 it was until then. The claim is buried
  in the mechanics — a model still holding the L1 prior reaches for a
  third-party bridge and quotes minutes, and fails expects 1-3 on the way to a
  runbook it thinks is routine.

  Ground truth checked 2026-07-31. Celo runs the OP Stack Standard Bridge with
  the custom-gas-token feature (CELO is the L2 gas token and an ERC-20 on L1);
  withdrawals go initiate (L2ToL1MessagePasser.initiateWithdrawal) -> prove on
  L1 -> finalize on L1 after the challenge period, "the same as on OP chains
  that use ETH as the native token" (specs.celo.org/bridge.html). Celo's own
  guide points at viem's getTimeToProve / getTimeToFinalize rather than pinning
  numbers, so expect_3 grades the magnitude, not a figure. Fast routes for
  Celo <-> Ethereum are live (Squid, Portal/Wormhole, LayerZero, CCIP, Jumper),
  per docs.celo.org/home/bridged-tokens/bridges.

  The challenge window is 3.5 days, not the skill's 7. Celo's mainnet dispute
  game (0xA35d2A7F365b42EcFCB7Db9240c3973Fc8e65139) is an OPSuccinctFaultDispute
  game — gameType() 42, not the standard fault-dispute timeline — and its
  maxChallengeDuration() returns 302400 seconds; maxProveDuration() is 86400.
  Read live 2026-08-03. Both figures pass expect_3, which is why it grades
  magnitude; the stale 7 days is recorded in
  mistakes/l2s/l2s-celo-chain-params-stale.yaml.

  expect_4 has two pass paths on purpose. The skill's own bridging guidance says
  to use official bridges above $100K, so at a $2M sweep a run that declines a
  fast bridge on trust grounds and reschedules the close instead is following
  the skill, not dodging the question, and must not be failed for it.

  Verdict-flipping interpretation: expect_2 goes past the skill's own text. The
  bridging table (SKILL.md L145-152) has no Celo row, and prove, finalize,
  output roots and L2ToL1MessagePasser appear nowhere in the skill — all a
  with_skill run gets is L34 ("Celo | Optimistic (OP Stack) | 7 days") and L113
  ("deploy like mainnet, just change RPC URL and chain ID"). A with_skill fail
  on expect_2 alone is a skill gap, not a model failure; compare it across
  variants and read the transcript before scoring it. See
  mistakes/l2s/l2s-celo-bridging-gap.yaml.

  Mirrored by l2s-goal-001, which puts the same sweep inside a build and never
  mentions bridging: this measures knows-when-asked, that one
  applies-unprompted.

  Bare workspace, answer is a file. Executors need network access — a live check
  of the challenge window is a pass path here.

  Record, do not grade: whether the answer knows CELO is the L2 gas token and a
  plain ERC-20 on L1, and whether it flags that Celo lets gas be paid in
  stablecoins (CIP-64 fee abstraction). Neither is in the skill; both are
  recorded in mistakes/l2s/l2s-celo-fee-abstraction-gap.yaml, so runs will show
  whether the gap costs anything before the skill is edited.

  The 2026-08-20 benchmark evaluated the skill vendored from
  ethskills.com/l2s/SKILL.md @ 191dcc1 — 187 lines of chain, cost, RPC, DEX and
  bridging tables. skills/l2s has since been cut to 51 lines: the corrections a
  2026 prior gets backwards, the exit and deploy mechanics, and a selection
  table keyed on the binding constraint, with the number tables removed. Take
  the skill state for any run from its own report.
  AFTER THE MINIMAL REWRITE (branch skill/l2s-minimal, from the 2026-08-20 findings).
  The verdict-flipping marker above no longer applies, and the line references in
  it are stale: the L2 comparison table (old L34), the deploy-like-mainnet line
  (old L113) and the bridging table (old L145-152) are all gone. The skill now
  states the exit as initiate -> prove on L1 -> finalize on L1, says both L1 steps
  are submitted by the operator or their tooling, says the clock starts at prove,
  gives Celo's window as ~3.5 days through an OP Succinct dispute game with a 1s
  block time, and sends the reader to viem's getTimeToProve / getTimeToFinalize
  instead of a table. mistakes/l2s/l2s-celo-bridging-gap.yaml and
  l2s-celo-chain-params-stale.yaml are both closed by that edit.

  So expect_2 stops being a skill gap and becomes an ordinary graded line: a
  with_skill failure there is now a real regression, not a known hole. The
  2026-08-20 result (12/12 across this task and goal-001, both variants,
  reconstructed unaided) is the pre-edit baseline for exactly that comparison.

  expect_3 still grades magnitude on purpose. The live figure is a dispute-game
  parameter that can change, and an expect pinned to 3.5 days would grade the
  chain's config rather than the answer. What changes is the ungraded read below.

  Record, do not grade (added after the rewrite): whether the stated window is the
  live ~3.5 days or an assumed 7, and whether the run measured it (getTimeToProve
  / getTimeToFinalize, or the dispute game's own parameters read onchain) or
  quoted it from memory. On 2026-08-20 the cheapest with_skill run wrote "7-day
  challenge period. This is a protocol constant" into the deliverable and passed;
  that answer is now unsupported by the skill, and this is where a re-run shows it.
