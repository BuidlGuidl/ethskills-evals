skill: skills/indexing
input: |
  We're adding a portfolio panel to our dApp. When a user connects, the panel shows
  their current balance of the 40 ERC-20 tokens we support, on Base — just the live
  numbers as of now, refreshed when they reopen the panel. No history, no charts, no
  P&L, just "what do you hold right now."

  An engineer has scoped it like this and wants to start building:

    "We'll write and deploy a subgraph that indexes Transfer events for all 40 tokens,
     track a running balance per holder in the mappings, and the panel queries the
     subgraph for the connected wallet's balances. That way the balances are always
     accurate."

  Before we commit a sprint to building and operating that subgraph, tell me whether
  it's the right tool for this panel. If it's overkill, say what the panel should do
  instead, be specific about how many onchain calls it takes to fetch all 40 balances
  for one wallet the way you'd build it, and explain how that approach stays accurate
  as balances change.

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md concludes that building/operating a subgraph for this panel is overkill: the panel needs only current balances, and current state does not require an indexer or historical event processing. It frames indexers as the tool for historical/aggregated data, not for a live current-state read."
  - "The recommended approach is direct current-state reads of balanceOf on the token contracts via RPC — no subgraph, no scanning of Transfer history."
  - "It specifies that all 40 balances for one wallet come back in a single aggregated request rather than 40 separate RPC round-trips — either by batching the 40 balanceOf reads with Multicall3 (one onchain call), or via a provider balances endpoint (e.g. Alchemy getTokenBalances) that returns them in one request. It does NOT describe the correct approach as 40 individual calls or as a subgraph query. Multicall3 is the expected onchain answer; a provider balances API is equally acceptable."
  - "It explains why the direct read stays correct without an indexer: balanceOf returns live current state on every call, so there is nothing to keep synced — whereas the proposed subgraph would have to reconstruct balances from Transfer history and could drift or lag from the true current value (e.g. rebasing/fee-on-transfer tokens, reorgs, indexing lag), making it both more work and less reliable for this use case."
runs: 3
notes: |
  Quiz task for skills/indexing per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. One claim per file: targets
  the OPPOSITE error from quiz-001 — the skill's current-state rule (in the minimized
  skill, the "Current state is not indexing work" paragraph; before 2026-08-18, the
  "Reading Current State (Not Historical)" and "Batch Reads with Multicall" sections).
  quiz-001 grades "should have indexed but scanned RPC"; this grades "indexed something
  that only needed a current-state read".

  The claim is buried in a proxy: a plausible over-engineered plan (subgraph to track
  running balances) that the model has to reject, plus a concrete "how many calls"
  question that forces the Multicall3 answer (one aggregated call, not 40, not a
  subgraph query). Testing this direction keeps the skill honest — a model that reflex-
  indexes everything is as wrong as one that reflex-scans, and only grading quiz-001
  would miss it.

  Ground truth (stable): current balances are a live RPC read (balanceOf); Multicall3
  (0xcA11bde05977b3631167028862bE2a173976CA11, same address on Base and 50+ chains)
  batches the 40 reads into one call. Reconstructing balances from indexed Transfers is
  more work and can drift (fee-on-transfer / rebasing tokens, reorgs, indexing lag).

  Record per run: whether it names Multicall specifically (vs just "batch"), whether it
  gives the one-call figure, and whether the answer came from the skill, memory, or a
  web search (mine transcript.md).

  Result note (2026-08-12, codex gpt-5.6-terra): 3/3 vs 3/3, no over-indexing in either
  variant. Its job in the set is negative-delta insurance: the minimized skill (2026-08-18)
  leads with "index, don't scan", so this is the check that catches the skill pushing a
  run to index a current-state read. Keep it in every re-run of the minimal version.

  Bare workspace, answer is a file. Skill vendored at skills/indexing (source
  ethskills.com/indexing/SKILL.md, skill source @ 191dcc1), minimized in this repo on
  2026-08-18 after the eval in PR #64.
