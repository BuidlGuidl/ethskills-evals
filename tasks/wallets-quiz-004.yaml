skill: skills/wallets
input: |
  Our deploy script computes the counterfactual address of a user's 2-of-3 Safe
  before deploying it, using the standard Safe deployment — same owners, same
  threshold, same salt every time. It produces one address on Ethereum mainnet
  and a DIFFERENT address when we point it at Base and at Arbitrum. A teammate
  wants to give up and store a separate Safe address per chain.

  Is a different address per chain expected here, or does that signal a bug in
  how we're deploying? Walk me through what is actually causing the divergence,
  then tell me what to do about it — keep one address everywhere, or store one
  per chain as my teammate wants.

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md says the counterfactual Safe address SHOULD be identical across mainnet, Base, and Arbitrum given the same owners/threshold/salt and the same Safe contracts — so a differing address signals a bug (e.g. a different singleton/factory version or a per-chain salt/initializer), not something to store per-chain."
  - "It attributes the determinism to the standard CREATE2 deployment with the same singleton + proxy factory deployed at the same addresses on every chain, and pins the divergence on those inputs differing across chains (mismatched Safe contract version/factory, or a per-chain salt/initializer)."
  - "The fix it prescribes is standardizing the same Safe singleton + proxy factory + initializer (owners/threshold/salt) across all three chains, so that CREATE2 yields one address everywhere. Naming a specific consistent version to pin to — e.g. v1.4.1 at 0x41675C099F32341bf84BFc5382aF534df5C7461a — confirms this but is not required. It fails if it recommends storing a separate address per chain, or treats the Safe version/factory as something that can legitimately differ per chain."
runs: 3
status: retired
notes: |
  Quiz task for skills/wallets per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. One claim per file:
  targets the skill's "Safe addresses are deterministic across chains" claim.
  Framed as a diagnosis — a differing per-chain address that the model must call
  a bug and explain via CREATE2 determinism — so it exercises reasoning about why
  the address is the same, not just an address lookup. The load-bearing tell to
  catch is accepting per-chain addresses as normal instead of naming the
  divergence a bug.

  The claim under test is the CREATE2 determinism, so expect_3 grades the fix —
  standardize the same singleton + factory + initializer across chains — with the
  version/address as a confirming example, not a required pass gate. Pinning a
  hardcoded "current v1.4.1" would rot on every Safe release (v1.5.0 was tagged in
  July 2025), and v1.3.0 is itself perfectly deterministic if applied
  consistently, so version-currency is not the discriminator here.

  Report, do not grade: whether a run reaches for v1.3.0 as the version to pin
  to. It is not a failure — v1.3.0 is deterministic if used consistently — but a
  with_skill run defaulting to it while the skill teaches v1.4.1 is a signal
  worth capturing in the transcript notes.

  Caveat: the singleton address is web-searchable, so a no_skill run with live
  search can pass on the address alone. Mine each run's transcript.md for
  whether the determinism claim came from reasoning or a lookup and report it;
  the discriminating part is the CREATE2/same-address-across-chains reasoning,
  which the diagnosis framing is meant to force. Skill vendored at
  skills/wallets (source ethskills.com/wallets/SKILL.md, skill source @
  191dcc1). Bare workspace, answer is a file.

  ## Under the reduced skill (skill/wallets-minimal, 2026-08-27)

  Input reworded: "what we should standardize on so the address comes out
  identical on every chain" asserted the answer inside the question. The prompt
  now asks what to do about the divergence, with the teammate's per-chain storage
  left as the live alternative. The rewording is what voids the comparison: the
  expect lines are unchanged, so the 2026-07-25 grades were produced against a
  different prompt and are not comparable — but this task is being retired rather
  than re-baselined; see below.

  The reduced skill drops the Safe address table, and the address-verification
  bullet that briefly replaced it is gone too — it duplicated `skills/addresses`
  and was the one line in the cut that risked creating a negative delta here (a
  with_skill run reading it as "per-chain addresses are normal" would fail
  expect_1 and expect_3). So this task tests nothing the skill claims: retire it,
  do not re-baseline.

  Measured 2026-08-27, one with_skill run on the reduced skill
  (artifacts/wallets-quiz-004/2026-08-27T182946Z-claude-with-skill-1): the skill
  DID fire. The prompt says "the counterfactual address of a user's 2-of-3 Safe —
  same owners, same threshold, same salt", which matches the description's own
  front-loaded custody keywords. A "not for contract address lookup" clause was
  tried in the description and did not beat that overlap; it was dropped rather
  than sharpened, since #91 asks for a not-for clause only where useful and
  tuning one to silence a single task is over-pinning. Recorded as an
  observation: on a task the skill has no content for, it still loads and costs
  context. Whether that HARMS the answer is what grading this run tells us.
