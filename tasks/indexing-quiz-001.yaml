skill: skills/indexing
input: |
  We're launching the frontend for an NFT collection that's been live on Ethereum
  mainnet for about three years. The main screen is an activity feed — every mint,
  sale, and transfer in the collection, newest first — plus a "top holders" panel
  that ranks wallets by how many tokens they hold right now.

  Here's the plan our contractor wrote up, and I want a sanity check before we build on
  it:

    "On page load the client calls eth_getLogs for the collection's Transfer event
     from block 0 to latest, gets the full history back, and we compute the feed and
     the holder ranking in the browser. It's all standard RPC, so any provider key
     works and we don't need extra infrastructure."

  Ethereum is around block 25,800,000 now. Walk me through what actually happens when
  this ships: roughly how many RPC requests that one page load turns into and why (be
  concrete about the number and what forces it), what specifically breaks first in
  production, and what we should build instead so the feed and the holder panel load
  quickly. If your alternative needs infrastructure we don't have yet, say so.

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md establishes that a single provider's eth_getLogs call cannot return the full 0-to-latest range at once: public RPC providers cap each getLogs call by block span (commonly ~2K, up to ~10K blocks) and/or by matched-result count (~10K logs), so the client is forced to paginate across the whole history. It does NOT claim one call from block 0 to latest just works."
  - "It derives a concrete request/page count from a stated cap rather than answering with a vague 'a lot' or 'it's slow' — either from the block-span cap and the height stated in the input (at ~25.8M that is 25,800,000 / ~2,000 ≈ 12,900 requests) or from the ~10K matched-log response cap and an estimated log volume (e.g. a few million transfers / 10K ≈ hundreds of pages). Any figure that ties a real cap to a real volume passes; a request count with no cap behind it does not."
  - "It names what breaks first in production as a consequence of that scan — provider rate limits / 429s, request timeouts, or blown compute-unit / credit budget on every page load — i.e. an O(n)-in-chain-length scan that gets worse every block, not a one-time cost."
  - "The recommended fix is an indexer that has already processed the collection's history and serves it as a ready query — a subgraph (The Graph), Ponder, or a provider/NFT data API (Alchemy getNftsForContract / getAssetTransfers, etc.) — so the page load becomes one indexed query instead of a historical block scan. It explicitly acknowledges this is added infrastructure (an indexing service to run/deploy or a third-party API), not just 'paginate harder' or 'use an archive node'."
  - "The 'top holders right now' panel is handled as current ownership, not as a historical scan: the ranking is derived from the indexed dataset or from current-state ownership reads (e.g. ownerOf across the collection), and it does NOT prescribe an archive node — current ownership is a current-state read, while the historical feed is what needs the indexer."
runs: 3
notes: |
  Quiz task for skills/indexing per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. One claim per file: targets
  the skill's core habit correction — don't loop through blocks looking for events, and
  don't try to query historical state via RPC (in the minimized skill, the opening
  paragraph: per-call span and matched-log caps, backfill once into an indexed store;
  before 2026-08-18 this lived in "What You Probably Got Wrong" and "Reading Events
  Directly").

  The claim is buried in a proxy: the prompt asks the model to price the contractor's
  full-range scan (how many requests, what breaks) rather than asking "is scanning
  blocks bad?". A stale-prior model that treats eth_getLogs as a free full-history read
  fails expect_1/expect_2; the derivation (block height / per-call cap → thousands of
  requests) is what makes a pass mean the limit is understood, not recalled.

  Ground truth as of 2026-08-18 (revalidate on re-run — both the caps and the height move):
    - Public RPC eth_getLogs caps: block-span limits commonly ~2K blocks, and/or a
      ~10K matched-log response cap (Alchemy, Infura, and most public endpoints). Free
      tiers can be far tighter (Alchemy free tier ~10-block ranges).
    - Mainnet is ~block 25.78M (eth_blockNumber, 2026-08-18; grows ~7.2K blocks/day), so
      the input and expect_2 both say ~25.8M. On re-run bump the height in BOTH the input
      and expect_2's worked example — they must agree, or the expect drifts from the
      prompt. A full 0->latest Transfer scan at a ~2K cap is ~12.9K
      sequential paginated calls; deriving instead from the ~10K log cap and the
      collection's transfer volume is equally valid. Any figure that ties a stated cap
      to a real volume passes; a bare "a lot" does not.
    - Current ownership (the holder panel) is current state, so an archive node is the
      wrong fix — flag any run that reaches for one.

  Record per run: whether the request-count estimate is actually derived from a cap or
  asserted, which indexer the run reaches for, and whether the answer came from the
  skill, parametric memory, or a web search (mine transcript.md).

  Bare workspace, answer is a file. Pairs with indexing-goal-001, which buries the same
  scan-vs-index decision in an unprompted build: this measures knows-when-asked, the
  goal measures applies-unprompted.

  Result note (2026-08-12, codex gpt-5.6-terra): 3/3 vs 3/3 — non-discriminating on this
  stack, both variants derive the cap and reach for an indexer. Kept as a regression
  guard for the minimized skill (2026-08-18) rather than as a source of deltas; if a
  with_skill run ever fails this, the trimmed opening paragraph lost something.

  Skill vendored at skills/indexing (source ethskills.com/indexing/SKILL.md, skill
  source @ 191dcc1), minimized in this repo on 2026-08-18 after the eval in PR #64.
