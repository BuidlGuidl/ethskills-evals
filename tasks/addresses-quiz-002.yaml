skill: skills/addresses
input: |
  Our app integrates Uniswap v4 on Ethereum mainnet, pointing at the
  PoolManager we deployed against there. We're expanding to Base and Arbitrum
  next week, and the plan on the table is:

    "Uniswap ships with CREATE2, so the v4 contracts live at the same addresses
    on every chain. Just reuse the mainnet addresses on Base and Arbitrum and
    we're done — no per-chain config needed."

  Before we ship this, is that plan safe? If we should not reuse the mainnet
  addresses, what do we actually use on Base and Arbitrum?

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md rejects the 'reuse the mainnet addresses on every chain' plan: Uniswap v4 contract addresses are NOT the same across chains — v4 lands at a different address on each chain — so per-chain addresses are required, and reusing the mainnet ones would point at the wrong (or empty) address on Base and Arbitrum."
  - "It provides per-chain v4 addresses for Base and Arbitrum that are DISTINCT from the mainnet PoolManager (0x000000000004444c5dc75cB358380D2e3dE08A90) — e.g. Base PoolManager 0x498581fF718922c3f8e6A244956aF099B2652b2b and Arbitrum PoolManager 0x360E68faCcca8cA495c1B759Fd9EEe466db9FB32 — or, at minimum, directs the reader to Uniswap's official per-chain v4 deployment list to fetch them; restating the mainnet address for all chains fails."
  - "It does NOT rescue the same-address plan by silently downgrading to Uniswap v3: the answer stays on v4 and treats v4 as live and available on Base and Arbitrum, not as mainnet-only."
runs: 3
notes: |
  Quiz task for skills/addresses per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets the skill's
  L106 claim: Uniswap v4 addresses DIFFER per chain — unlike v3, v4 lands at a
  different address on each chain. The stale prior is the v3-era fact that
  Uniswap addresses are identical cross-chain; the scenario plants exactly that
  as "the plan on the table" so the model has to reject a plausible,
  once-true belief. Two ways to fail, both caught: (a) endorsing the
  same-address reuse, and (b) escaping by downgrading to v3 to make the plan
  work instead of staying on v4.

  expect_2 is lenient on exact addresses on purpose — the load-bearing thing is
  distinct-per-chain, not memorizing them, so pointing at Uniswap's official
  per-chain deployment list passes. Bare workspace, answer is a file. Skill
  vendored at skills/addresses (source ethskills.com/addresses/SKILL.md, skill
  source @ 191dcc1).
