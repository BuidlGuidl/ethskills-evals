skill: skills/noir
input: |
  We're standardizing build tooling for our Noir-based privacy app. The circuit
  lives in the app repo at circuits/age_check/ (standard nargo layout:
  Nargo.toml, src/main.nr, and a Prover.toml with known-good test inputs) — that
  repo is not checked out here, so write the script against that layout rather
  than trying to run it. Target is Ethereum mainnet — proofs get verified
  onchain by a Solidity contract in our foundry repo.

  Write build.sh in this directory: the exact command sequence a fresh CI runner
  executes to go from circuit source to (a) the artifact our frontend prover
  loads, and (b) the Solidity verifier contract ready to drop into the foundry
  repo. Then add a smoke-test section that generates and checks one proof
  against the Prover.toml inputs, so a dev can sanity-check the circuit locally
  before wiring the frontend.

  Assume the toolchain is already installed. Comment each command with what it
  produces. The script is the deliverable — write it to build.sh.
expect:
  - "build.sh has a smoke-test section that both generates a proof and checks it, and both steps run through the Barretenberg CLI (`bb`) — a script that omits the smoke test, or generates a proof without checking it, fails. build.sh does NOT invoke `nargo prove` or `nargo verify` as commands (a comment merely mentioning them is fine); a script whose smoke test proves or verifies via nargo fails, even if the rest is correct."
  - "The Solidity verifier is produced by `bb write_solidity_verifier`, fed by a verification key from `bb write_vk` — not `nargo codegen-verifier`, not `bb contract`, and not hand-written Solidity. Exact paths and flag order may vary."
  - "Compilation and witness generation use nargo's remaining role correctly: `nargo compile` to build the circuit artifact, and `nargo execute` (reading Prover.toml) to produce the witness the smoke test proves against."
  - "The EVM-facing pipeline uses keccak as the oracle hash consistently: `bb write_vk` carries `--oracle_hash keccak`, and the smoke-test prove and verify commands use the same oracle hash as the VK they run against. A script that omits the flag on the VK feeding the Solidity verifier, or mixes oracle hashes between prove/verify/VK, fails this check."
runs: 3
notes: |
  Targets the noir skill's headline stale claim (SKILL.md "What You Probably
  Got Wrong" #1 + Build Pipeline): `nargo prove` / `nargo verify` were removed —
  nargo only compiles and executes; proving, VK generation, and the Solidity
  verifier all go through the bb CLI (`bb write_solidity_verifier`, not
  `bb contract`, not `nargo codegen-verifier`).

  Quiz shape: authoring a CI script buries the command choice in a job — the
  prompt never names bb or Barretenberg. The smoke-test section is what forces
  the prove/verify step where the dead nargo commands surface; "Ethereum
  mainnet, verified onchain" is what makes --oracle_hash keccak load-bearing
  (expect_4, the strictest check — a run can pass 1-3 from current docs and
  still silently break onchain verification here).

  expect_1 grades the smoke test's presence, not just its commands: a run that
  skips the section entirely dodges the only place the dead nargo commands can
  surface, and would otherwise pass expect_1 vacuously while leaving expect_4
  half-gradeable. Omission is a fail.

  Ground truth as of 2026-07 (vendored skill): nargo compile / nargo execute,
  bb write_vk --oracle_hash keccak, bb write_solidity_verifier, and a
  keccak-consistent bb prove / bb verify smoke test. Authored against nargo
  1.0.0-beta.3 and bb 0.82.2 — those subcommand names and flags are what these
  versions accept. The Noir toolchain moves fast: check `nargo --version && bb
  --version` before re-running (install recipe in noir-goal-001's notes) and
  revalidate the expects against current noir-lang docs if either moved.

  The run itself needs no toolchain — the input says the app repo is not
  checked out and the deliverable is the script. Versions matter here for
  revalidating the expects, not for executing anything.

  Record per run: whether the run checked live docs (noir docs, noir-mcp, web
  search) or asserted the commands from memory, and any turns spent installing
  the noir-mcp server — SKILL.md tells the agent to run `claude mcp add
  noir-mcp` then `/reload-plugins`, neither of which can take effect under the
  `-p --strict-mcp-config` spawn in AGENTS.md. A with_skill run that chases it
  spent turns for nothing; that is a negative delta, and a skill-edit candidate,
  not a wash.

  Bare workspace, deliverable is a file. Skill vendored at skills/noir (source
  ethskills.com/noir/SKILL.md, skill source @ 191dcc1).
