skill: skills/noir
input: |
  We're standardizing build tooling for our Noir-based privacy app. The circuit
  lives in the app repo at circuits/age_check/ (standard nargo layout:
  Nargo.toml, src/main.nr, and a Prover.toml with known-good test inputs) — that
  repo is not checked out here, so write the script against that layout rather
  than trying to run it. Target is Ethereum mainnet — proofs get verified
  onchain by a Solidity contract in our foundry repo.

  Write build.sh in this directory: the exact command sequence a fresh CI runner
  executes to go from circuit source to (a) the artifact our frontend prover
  loads, and (b) the Solidity verifier contract ready to drop into the foundry
  repo. Then add a smoke-test section that generates and checks one proof
  against the Prover.toml inputs, so a dev can sanity-check the circuit locally
  before wiring the frontend.

  Assume the toolchain is already installed. Comment each command with what it
  produces. The script is the deliverable — write it to build.sh.
expect:
  - "build.sh has a smoke-test section that both generates a proof and checks it. A script that omits the smoke test, or generates a proof without checking it, fails. This check grades that the section exists and is complete — which tool it invokes is graded by the next check."
  - "Proof generation and proof checking run through the Barretenberg CLI (`bb`). build.sh does NOT invoke `nargo prove` or `nargo verify` as commands (a comment merely mentioning them is fine); a smoke test that proves or verifies via nargo fails this check even if the rest of the script is correct."
  - "The Solidity verifier is produced by `bb write_solidity_verifier`, fed by a verification key from `bb write_vk` — not `nargo codegen-verifier`, not `bb contract`, and not hand-written Solidity. Exact paths and flag order may vary."
  - "Compilation and witness generation use nargo's remaining role correctly: `nargo compile` to build the circuit artifact, and `nargo execute` (reading Prover.toml) to produce the witness the smoke test proves against."
  - "The EVM-facing pipeline targets the EVM oracle hash consistently: the VK feeding the Solidity verifier is generated with `--oracle_hash keccak` or the newer `--verifier_target evm` (either spelling passes), and the smoke-test prove and verify use the same setting as the VK they run against. Omitting it on the VK feeding the Solidity verifier, or mixing settings between prove/verify/VK, fails this check."
runs: 3
notes: |
  Grades SKILL.md "What You Probably Got Wrong" #1 + Build Pipeline: nargo only
  compiles and executes; proving, VK, and the Solidity verifier go through bb
  (`bb write_solidity_verifier`, not `bb contract`, not `nargo codegen-verifier`).
  expect_1 / expect_2 split lazy from stale — a missing smoke test and a
  nargo-run one are different failures. expect_5 (EVM oracle hash) is the strict
  one: a run can get 1-4 right from current docs and still break onchain
  verification. It accepts both flag spellings — `--oracle_hash keccak` is
  legacy but valid; current bb prefers `--verifier_target evm`.

  Ground truth as of 2026-07 (skill @ 191dcc1), authored against nargo
  1.0.0-beta.3 / bb 0.82.2: nargo compile, nargo execute, bb write_vk
  --oracle_hash keccak, bb write_solidity_verifier, keccak-consistent bb prove /
  bb verify. Check `nargo --version && bb --version` and revalidate against
  noir-lang docs if either moved (install recipe in noir-goal-001's notes). No
  toolchain needed for this task — the deliverable is a script written blind.

  Record per run: whether the run checked live docs or answered from memory, and
  any turns spent on `claude mcp add noir-mcp` + `/reload-plugins` (SKILL.md
  tells it to; neither survives the `-p --strict-mcp-config` spawn).

  Bare workspace, deliverable is build.sh. Skill vendored at skills/noir
  (ethskills.com/noir/SKILL.md).
