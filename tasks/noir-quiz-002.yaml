skill: skills/noir
input: |
  We're adding a sealed-bid auction to our NFT platform. During the bidding
  window, bidders publish an onchain commitment to their bid amount. After the
  window closes, nobody reveals bids in the clear — instead each bidder proves
  their committed bid sits inside the auction's allowed range [min_bid, max_bid]
  without revealing the amount. Proofs verify onchain on Ethereum mainnet, and
  bidders generate them in the browser, often on mid-range phones, so proving
  cost matters.

  Write the Noir circuit project in this directory: Nargo.toml and src/main.nr
  for that range proof over the committed bid. The commitment scheme is yours
  to design — add a comment explaining exactly how the frontend must compute
  the commitment so it matches the circuit. Keep it minimal: no Merkle tree,
  no nullifier, single circuit.
expect:
  - "The in-circuit commitment hash is Poseidon over BN254 imported from the external poseidon library: the dependency appears in Nargo.toml [dependencies] (git noir-lang/poseidon; exact tag may vary) and the import path is `use poseidon::poseidon::bn254::...`, matching how it's called in the circuit. An import from the standard library (`std::hash::poseidon::...`) fails — that path was removed."
  - "The commitment is NOT hashed with SHA256, keccak, pedersen_hash, or Poseidon2 in-circuit. Any of those as the commitment hash fails regardless of an explanatory comment — SHA256/keccak cost ~30,000 gates where Poseidon costs ~600, and pedersen_hash / Poseidon2 are different algorithms than the Poseidon-BN254 the standard frontend and onchain tooling expects."
  - "Public inputs use Noir 1.0 visibility syntax — the form `name: pub Field`. Pre-1.0 `pub name: Field` on any parameter fails."
  - "The circuit is sound for the job: it recomputes the commitment from the private bid AND a private salt/blinding factor, asserts equality with the public commitment, and range-checks the bid against the bounds. A commitment over the bare bid with no salt fails — bid amounts are small-domain and trivially brute-forceable from the onchain commitment. A circuit that never recomputes the commitment, or never range-checks, fails."
  - "If Nargo.toml pins compiler_version at all, the constraint is not a beta string (e.g. '>=1.0.0-beta.3', which nargo rejects). Omitting compiler_version entirely passes."
runs: 3
notes: |
  Targets SKILL.md "What You Probably Got Wrong" #2: Poseidon was removed from
  the Noir stdlib — it is an external dependency (noir-lang/poseidon in
  Nargo.toml, `use poseidon::poseidon::bn254::...`), and in-circuit hashing is
  Poseidon (~600 gates), not SHA256 (~30k). Riders graded as separate checks:
  Noir 1.0 pub syntax (expect_3, claim #3), salt on a small-domain commitment
  (expect_4, Circuit Security Checklist), compiler_version beta strings
  (expect_5, claim #4 — fires only if a run writes the line at all; most
  passes are trivial).

  Load-bearing, don't soften: "mid-range phones, proving cost matters" is what
  turns the hash choice into a derivation instead of trivia; "no Merkle tree,
  no nullifier" keeps the scope off quiz-003 / goal-001 territory.

  Ground truth as of 2026-07 (vendored skill): dependency
  poseidon = { git = "https://github.com/noir-lang/poseidon", tag = "v0.2.6" };
  the expects check source and import path, not the pin, so any current tag
  passes. Revalidate before re-running.

  Record per run: which hash the run reached for first, whether it attempted
  nargo compile (installs allowed; the judge grades source text either way),
  and whether the frontend-commitment comment actually matches the circuit.

  Bare workspace, deliverables are Nargo.toml + src/main.nr. Skill vendored at
  skills/noir (source ethskills.com/noir/SKILL.md, skill source @ 191dcc1).
