skill: skills/noir
input: |
  We're adding a sealed-bid auction to our NFT platform. During the bidding
  window, bidders publish an onchain commitment to their bid amount. After the
  window closes, nobody reveals bids in the clear — instead each bidder proves
  their committed bid sits inside the auction's allowed range [min_bid, max_bid]
  without revealing the amount. Proofs verify onchain on Ethereum mainnet, and
  bidders generate them in the browser, often on mid-range phones, so proving
  cost matters.

  Write the Noir circuit project in this directory: Nargo.toml and src/main.nr
  for that range proof over the committed bid. The commitment scheme is yours
  to design — add a comment explaining exactly how the frontend must compute
  the commitment so it matches the circuit. Keep it minimal: no Merkle tree,
  no nullifier, single circuit.
expect:
  - "The in-circuit commitment hash is Poseidon over BN254 imported from the external poseidon library: the dependency appears in Nargo.toml [dependencies] (git noir-lang/poseidon; exact tag may vary) and the import path is `use poseidon::poseidon::bn254::...`, matching how it's called in the circuit. An import from the standard library (`std::hash::poseidon::...`) fails — that path was removed."
  - "The commitment is NOT hashed with SHA256, keccak, or another general-purpose bit-oriented hash in-circuit. Either fails regardless of an explanatory comment — they cost ~30,000 gates against ~600 for an algebraic hash, and bidders prove in-browser on mid-range phones. This check is about the hash family only; which algebraic hash was chosen is graded by expect_1."
  - "Public inputs use Noir 1.0 visibility syntax — the form `name: pub Field`. A return-position public output written `-> pub Field` is the same 1.0 syntax and passes. Pre-1.0 `pub name: Field` on any parameter fails."
  - "The circuit is sound for the job: it recomputes the commitment from the private bid AND a private salt/blinding factor, binds that recomputed commitment to the proof, and range-checks the bid against the bounds. Either binding shape passes: asserting equality against a public commitment input, or returning the recomputed commitment as a public output for the auction contract to compare against the published one. A commitment over the bare bid with no salt fails — bid amounts are small-domain and trivially brute-forceable from the onchain commitment. So does a circuit that never recomputes the commitment, or never range-checks. The range bounds must be public inputs or fixed constants; bounds the prover supplies privately fail, since a prover-chosen bound grades nothing."
runs: 3
notes: |
  Targets SKILL.md "What You Probably Got Wrong" #2: Poseidon was removed from
  the Noir stdlib — it is an external dependency (noir-lang/poseidon in
  Nargo.toml, `use poseidon::poseidon::bn254::...`), and in-circuit hashing is
  Poseidon (~600 gates), not SHA256 (~30k). Riders graded as separate checks:
  Noir 1.0 pub syntax (expect_3, claim #3), salt on a small-domain commitment
  (expect_4, Circuit Security Checklist).

  Claim #4 (compiler_version beta strings) is deliberately NOT an expect. It
  is conditional on a line `nargo new` never writes, so an expect would pass
  on both variants for every run that omits it, and the judge has no N/A to
  record. It moves to the report-only list below.

  expect_1 and expect_2 split deliberately: expect_2 grades the hash family
  (algebraic vs bit-oriented — the ~30k-gate mistake the scenario makes
  derivable), expect_1 grades which algebraic hash and via which import path
  (the actual stale claim). A run using SHA256 fails both, and that is the
  intended reading.

  Known edge, call it out in the report rather than folding it into the delta:
  Poseidon2 and pedersen_hash fail expect_1 because the skill takes a position
  against them, but this scenario is greenfield — the commitment scheme is the
  run's to design, there is no existing tree, contract, or frontend to match,
  and Poseidon2 is a defensible choice on its own merits. If a run fails only
  on that, report it as skill-conformance, not as a wrong answer, and consider
  giving the scenario an existing onchain Poseidon consumer before re-running.

  Load-bearing, don't soften: "mid-range phones, proving cost matters" is what
  turns the hash choice into a derivation instead of trivia; "no Merkle tree,
  no nullifier" keeps the scope off quiz-003 / goal-001 territory.

  Ground truth as of 2026-07 (vendored skill): dependency
  poseidon = { git = "https://github.com/noir-lang/poseidon", tag = "v0.2.6" };
  the expects check source and import path, not the pin, so any current tag
  passes. Revalidate before re-running.

  Record per run: which hash the run reached for first, whether it attempted
  nargo compile (installs allowed; the judge grades source text either way),
  whether the frontend-commitment comment actually matches the circuit, and
  whether Nargo.toml pins compiler_version at all — a beta-string constraint
  (e.g. '>=1.0.0-beta.3', which nargo rejects) is claim #4 surfacing, and an
  omitted line is the common case rather than a result.

  Four conjunctive expects, so aggregate `pass` will likely read 0/3 on both
  variants. Lead the report with per-check counts; the aggregate is the weaker
  number here.

  Bare workspace, deliverables are Nargo.toml + src/main.nr. Skill vendored at
  skills/noir (source ethskills.com/noir/SKILL.md).
