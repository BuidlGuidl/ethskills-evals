skill: skills/addresses
input: |
  Build a small tool for our treasury desk: a viem script that swaps a user's
  USDC into WETH on Base, ready to run against Base mainnet with a funded
  account. The desk moves large positions — hundreds of thousands of USDC per
  swap — so execution quality and slippage matter.

  Work in this directory. Deliver:
    - swap.ts — a real, runnable viem implementation (not pseudocode); include
      the token and router addresses and the actual contract calls you rely on.
    - NOTES.md — explain your approach, the venue you chose and why, and what the
      developer must get right before running it with real funds.

  Assume Base mainnet as it exists today.
expect:
  - "swap.ts is runnable viem code targeting Base mainnet that swaps USDC into WETH using concrete on-chain addresses (a swap venue/router, USDC, WETH) and real contract calls — not pseudocode, placeholders, or TODO addresses."
  - "It uses NATIVE Circle USDC on Base (0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913) — not bridged USDC.e and not a USDC address from another chain such as the mainnet 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48."
  - "Every address in swap.ts is correct for Base for what it represents, checked against these genuine Base deployments: WETH 0x4200000000000000000000000000000000000006, Aerodrome Router 0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43, Aerodrome PoolFactory 0x420DD381b31aEf6683db6B902084cB0FFECe40Da, Uniswap v3 SwapRouter02 on Base 0x2626664c2603336E57B271c5C0b26F421741e481, Uniswap v4 PoolManager on Base 0x498581fF718922c3f8e6A244956aF099B2652b2b, Uniswap Universal Router on Base 0x6ff5693b99212da76ad316178a184ab56d299b43. An address for one of these contracts that does not match the value above fails this line — in particular the mainnet Uniswap v3 SwapRouter02 0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45 or mainnet v4 PoolManager 0x000000000004444c5dc75cB358380D2e3dE08A90 carried over to Base. Contracts that are deliberately identical on every chain via CREATE2 — 1inch v6 router 0x111111125421cA6dc452d289314280a0f8842A65, Permit2 0x000000000022D473030F116dDEE9F6B43aC78BA3 — are correct as-is on Base and are NOT 'reused mainnet addresses'. For any other contract the run introduces, an address that is invented or plausible-but-unsourced fails."
  - "Given the stated large-size / execution-quality requirement, the swap venue is not chosen by reflex-defaulting to Uniswap as Base's deepest liquidity: NOTES.md justifies the venue against where Base liquidity actually sits. Routing through the dominant Base DEX (Aerodrome, also branded Aero — ve(3,3)/AERO) passes; a DEX aggregator (e.g. 1inch) passes only if NOTES.md also shows what Base liquidity it is sourcing (naming Aerodrome/Aero among them, or otherwise reasoning about Base depth); Uniswap passes only if justified against Base liquidity rather than assumed. A bare 'Uniswap by default' or 'the aggregator handles routing' with no Base-liquidity reasoning fails."
  - "NOTES.md flags that the hardcoded addresses must be verified on a Base block explorer / the protocol's official deployment list before running with real funds, rather than trusted as-is."
runs: 3
notes: |
  Goal task for skills/addresses per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Deliberate mirror of
  addresses-quiz-001: the same large-size Base USDC->WETH swap decision, but no
  venue and no address is named or asked for — the address discipline has to
  surface unprompted on the way to runnable code. Read the two together:
  quiz-001 measures knows-when-asked, this measures applies-unprompted, and only
  the split (quiz passes both variants, goal no_skill fails / with_skill passes)
  reaches the issue's "keep the skill" verdict.

  The build is a single vehicle for several skill claims at once, each an
  unprompted habit rather than a prompted answer: native vs bridged USDC on Base
  (L539), not reflex-defaulting to Uniswap as Base's deepest DEX (L353), correct
  per-chain Base addresses with no mainnet reuse or hallucination, and the
  skill's headline verify-before-send discipline. The large-size hook is
  load-bearing for the venue check — without it a plain Uniswap-on-Base swap is a
  legitimate small-swap answer.

  Record which venue and which USDC each run reaches for, and whether addresses
  came from the skill, web search, or prior. Nothing is broadcast — the artifact
  is runnable code, not a live tx. Bare workspace, no template on purpose:
  handing a template would pre-pick the venue and addresses and kill the signal.
  Skill vendored at skills/addresses (source ethskills.com/addresses/SKILL.md,
  skill source @ 191dcc1).
