skill: skills/addresses
input: |
  Build a small tool for our treasury desk: a viem script that swaps a user's
  USDC into WETH on Base, ready to run against Base mainnet with a funded
  account. The desk moves large positions — hundreds of thousands of USDC per
  swap — so execution quality and slippage matter.

  Work in this directory. Deliver:
    - swap.ts — a real, runnable viem implementation (not pseudocode); include
      the token and router addresses and the actual contract calls you rely on.
    - NOTES.md — explain your approach, the venue you chose and why, and what the
      developer must get right before running it with real funds.

  Assume Base mainnet as it exists today.
expect:
  - "swap.ts is runnable viem code targeting Base mainnet that swaps USDC into WETH using concrete on-chain addresses (a swap venue/router, USDC, WETH) and real contract calls — not pseudocode, placeholders, or TODO addresses."
  - "It uses NATIVE Circle USDC on Base (0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913) — not bridged USDC.e and not a USDC address from another chain such as the mainnet 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48."
  - "Every address in swap.ts that names one of these contracts matches the pinned genuine Base deployment: WETH 0x4200000000000000000000000000000000000006, Aerodrome v2-style Router 0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43, Aerodrome PoolFactory 0x420DD381b31aEf6683db6B902084cB0FFECe40Da, Aerodrome Slipstream SwapRouter 0xBE6D8f0d05cC4be24d5167a3eF062215bE6D18a5, Aerodrome Slipstream CLFactory 0x5e7BB104d84c7CB9B682AaC2F3d509f5F406809A, Uniswap v3 SwapRouter02 on Base 0x2626664c2603336E57B271c5C0b26F421741e481, Uniswap v4 PoolManager on Base 0x498581fF718922c3f8e6A244956aF099B2652b2b. A value that differs from the one pinned above fails this line; name the contract and both addresses when it does."
  - "No mainnet address is carried onto Base and no address is unsourced. The mainnet Uniswap v3 SwapRouter02 0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45 and the mainnet v4 PoolManager 0x000000000004444c5dc75cB358380D2e3dE08A90 appearing as Base addresses fail. Contracts that are deliberately identical on every chain via CREATE2 — 1inch v6 router 0x111111125421cA6dc452d289314280a0f8842A65, Permit2 0x000000000022D473030F116dDEE9F6B43aC78BA3 — are correct as-is on Base and are NOT 'reused mainnet addresses'. For any other contract the run introduces (a Universal Router deployment, an aggregator router, anything else), NOTES.md attributes the address to a checkable source — the protocol's official deployment list or a Base block explorer; an extra address with no source attribution fails."
  - "Given the stated large-size / execution-quality requirement, the swap venue is not chosen by reflex-defaulting to Uniswap as Base's deepest liquidity: NOTES.md justifies the venue against where Base liquidity actually sits. Ground truth as of 2026-07-27 (DefiLlama, Base DEX volume, 7d): Aerodrome Slipstream ~$2.3B and Aerodrome v1 ~$38M; Uniswap v4 ~$980M and Uniswap v3 ~$610M; PancakeSwap v3 ~$590M. Base TVL runs the other way and close: Uniswap ~$305M (v3 ~$255M + v4 ~$50M) vs Aerodrome ~$285M (Slipstream ~$157M + v1 ~$128M). So Aerodrome leads aggregate routed volume — by roughly 1.5x, not by an order of magnitude — Uniswap v4 is itself a major Base venue, and no venue leads on every metric; 24h snapshots swing enough that a run's fresher numbers may differ from these without being wrong. Grade the reasoning about depth for USDC/WETH, not a leaderboard position. Any venue passes when NOTES.md justifies it against Base liquidity for the pair: Aerodrome (Aero is the merger's brand, announced Nov 2025 but still unlaunched and targeting Sep 2026 — either name passes; ve(3,3)/AERO), Uniswap, or a DEX aggregator (e.g. 1inch) that also shows what Base liquidity it is sourcing. A bare 'Uniswap by default', a bare 'route through Aerodrome', or 'the aggregator handles routing' with no Base-liquidity reasoning fails."
  - "NOTES.md tells the developer to verify the hardcoded addresses against a Base block explorer or the protocol's official deployment list before running with real funds, rather than trusting them as-is. What is graded is a written instruction to the human in the deliverable. Runtime assertions inside swap.ts — re-reading factory(), WETH9(), token0()/token1(), tickSpacing() before swapping — are good practice and worth noting, but do NOT satisfy this line on their own: they confirm the wiring is self-consistent, not that the deployment is the right or current one. A run whose only verification is runtime checks, with no verify-before-funds instruction written for the person who will run it, fails this line."
  - "The router swap.ts actually calls is the one that serves the pools the run's own evidence points at, and NOTES.md says which contract that is. Aerodrome is the case in play: the v2-style Router 0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43 reaches only volatile/stable v2 pools, while Base USDC/WETH depth sits in Slipstream, Aerodrome's concentrated-liquidity deployment — its own SwapRouter 0xBE6D8f0d05cC4be24d5167a3eF062215bE6D18a5 and CLFactory 0x5e7BB104d84c7CB9B682AaC2F3d509f5F406809A, keyed by tickSpacing rather than fee, so the Uniswap exactInputSingle ABI does not transfer. FAIL: choosing Aerodrome on Slipstream/CL depth evidence and then swapping through the v2-style Router — measured 2026-08-12 on a 500k USDC->WETH clip, that route filled ~1,283 bps below mid against ~14 bps through Slipstream, and it neither reverts nor looks wrong. PASS: a venue with one AMM (Uniswap v3 SwapRouter02, v4 through the Universal Router, an aggregator that routes across Base) whose called contract matches the pools or quotes the run cites, or Aerodrome via the Slipstream router. Grade the match between the evidence and the contract called, not which venue was chosen."
runs: 3
notes: |
  Goal task for skills/addresses per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Deliberate mirror of
  addresses-quiz-001: the same large-size Base USDC->WETH swap decision, but no
  venue and no address is named or asked for — the address discipline has to
  surface unprompted on the way to runnable code. Read the two together:
  quiz-001 measures knows-when-asked, this measures applies-unprompted, and only
  the split (quiz passes both variants, goal no_skill fails / with_skill passes)
  reaches the issue's "keep the skill" verdict.

  The build is a single vehicle for several skill claims at once, each an
  unprompted habit rather than a prompted answer: native vs bridged USDC on Base
  ("Bridged where you meant native"), not reflex-defaulting to Uniswap as Base's
  deepest DEX ("Choosing a venue"), the right router inside the venue chosen
  ("Right protocol, wrong contract"), correct per-chain Base addresses with no
  mainnet reuse or hallucination, and the skill's headline verify-before-send
  discipline. The large-size hook is
  load-bearing for the venue check — without it a plain Uniswap-on-Base swap is a
  legitimate small-swap answer.

  The address check is two expects, not one: expect_3 grades the pinned Base
  values, expect_4 grades carryover and unsourced additions. They were one line
  and a fail in result.yaml did not say which of ~10 addresses was wrong. Venue
  is expect_5, the verify-before-funds habit is expect_6, and the router-within-
  venue check is expect_7 — earlier revisions numbered venue and verify 4 and 5,
  so cross-references older than the 2026-08-12 run are off by one.

  expect_6 and expect_7 moved after that run (PR #62 baseline: no_skill 2/3,
  with_skill 3/3, on six expects). expect_6 now says outright that runtime
  on-chain assertions do not substitute for a written verify-before-funds
  instruction — the only failing run wrote runtime checks and no instruction, and
  the judge failed it on a reading the line did not state. expect_7 is new and
  grades which router inside the venue gets called, the gap that let a run route
  a large clip through the Aerodrome vAMM Router at -1,283 bps while every
  address it used was genuine (see
  mistakes/addresses/addresses-aerodrome-slipstream-missing.yaml). Because
  expect_7 is new, aggregate pass counts are not comparable with the 2026-08-12
  run; per-expect results for 1-6 still are.

  expect_5 grades venue on Base volume/depth rather than on the pre-reduction
  skill's "Aerodrome dominates Base by TVL", which is false as of 2026-07-27 — see
  mistakes/addresses/addresses-base-dominance-metric.yaml. It reads the same as
  addresses-quiz-001 expect_2 on purpose: the pair only measures
  knows-when-asked vs applies-unprompted if both sides accept the same answers.

  Record which venue and which USDC each run reaches for, and whether addresses
  came from the skill, web search, or prior. Nothing is broadcast — the artifact
  is runnable code, not a live tx. Bare workspace, no template on purpose:
  handing a template would pre-pick the venue and addresses and kill the signal.
  The 2026-08-12 benchmark evaluated the skill vendored from
  ethskills.com/addresses/SKILL.md @ 191dcc1 — 547 lines of address tables.
  skills/addresses has since been reduced to the verification and venue-choice
  discipline with no address tables at all, so a with_skill run now has to look
  every address up; take the provenance for any run from its own report.
