skill: skills/l2s
input: |
  We run merchant payouts on Polygon zkEVM. PayoutVault went live there in March
  2025 and holds about $400,000 of merchant balances right now.

  Two things this week:

  1. Ops says the dashboard has been stuck since the start of the month:
     merchant balances read back the same numbers every day, the block number it
     displays has not moved, and payouts we submit never confirm. They have
     already swapped RPC providers twice and re-checked the API keys. Tell me
     what to look at.

  2. Q3 build plan: merchants want batch payouts (one transaction settling up to
     200 merchants) and we want the per-payout cost down. Lay out how we get
     there this quarter.

  Write your answer to answer.md in this directory.
expect:
  - "answer.md identifies the cause as the chain itself no longer operating — Polygon zkEVM Mainnet Beta has been discontinued / sunset (announced June 2025, sequencer stopped mid-2026), so no new blocks are produced, submitted transactions can never confirm, and the balances being read back are a frozen final state. An answer that proposes a fixable cause — another RPC provider or endpoint, rate limits, API keys, node sync, client config — or that reads the stall as a temporary sequencer outage to wait out, fails this check. The exact shutdown date is not required; asserting the chain is live, or that it will resume, is disqualifying. Noting that reads still answer while writes cannot land is correct and does not fail this line."
  - "The Q3 plan is not written as work to be done on Polygon zkEVM. Batch payouts and cost reduction are scoped to a migration onto a chain that is operating today — the answer names a specific target chain and gives a reason for it — rather than being planned, scheduled or estimated against the discontinued network. Delivering the batch-payout design on Polygon zkEVM, or deferring the chain question to later, fails."
  - "answer.md treats the ~$400,000 still held on the discontinued chain as the item that outranks the feature work, and does not present its recovery as a routine exit. Presenting a normal bridge withdrawal as the way the funds come back fails — the AggLayer bridge no longer processes withdrawals — and so does telling the operator to put the vault's balance through Polygon's claims interface as though contract-held funds are plainly covered by it. Either of two answers passes: stating that the exit snapshot and the claims path cover wallet-held balances only, so a balance sitting inside PayoutVault is not covered; or flagging the vault's eligibility as unverified and routing the operator somewhere it can be settled (escalation to Polygon Labs, the published sunset guidance, whatever recovery the team can still run against a frozen chain). Concluding the vault balance may be unrecoverable is a correct answer here, not a failing one. Leaving the merchant balances unaddressed fails."
runs: 3
notes: |
  Quiz for skills/l2s, one claim: Polygon zkEVM is discontinued and must not be
  built on. The claim is buried behind a support ticket — a stale prior debugs
  the RPC provider and then plans a quarter of work on a chain that stopped
  producing blocks.

  Ground truth checked 2026-07-31: sunset announced June 2025 with a 12-month
  window; Mainnet Beta sequencer stopped and AggLayer bridge withdrawals closed
  around 2026-07-01 (forum.polygon.technology "Polygon zkEVM Mainnet Beta
  Sunset: Claim Your Funds"; Alchemy's deprecation notice). The exit snapshot
  and the claims interface — open from ~2026-07-13 to 2027-12-31 — cover
  wallet-held balances only; funds locked in contracts were never snapshotted
  and have no claims path, which is why expect_3 accepts "may be unrecoverable"
  as the right answer.

  The chain is frozen, not unreachable: probed 2026-07-31, https://zkevm-rpc.com
  still answers eth_chainId, eth_getBalance and eth_call, with latest block
  33391890 timestamped 2026-07-03T15:55:44Z. A run that probes the endpoint and
  reports reads working must not be failed for it.

  The skill carries the steer but not the completion — it says "being
  discontinued" — so the expects grade the steer, not the date.

  Bare workspace, answer is a file. Executors need network access: a no_skill
  run can reach this by searching, which is exactly the delta this task
  measures.

  Record, do not grade: which replacement chain each run picks and whether that
  chain is live; whether the run mentions Polygon's PoS + AggLayer refocusing;
  and whether it gets the wallet-held vs contract-held split exactly right. That
  split is not in the skill, so it cannot be a with_skill win — expect_3 grades
  only that the recovery is not treated as routine.

  Skill vendored at skills/l2s @ 191dcc1 (source ethskills.com/l2s/SKILL.md).
