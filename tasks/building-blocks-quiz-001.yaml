skill: skills/building-blocks
input: |
  We're building a small yield vault on Base: users deposit USDC, the vault
  pairs it into DEX liquidity, and a keeper calls harvest() periodically to
  claim and compound the rewards. Before any code, let's write design.md in
  this directory covering:

  - which pool the vault LPs into
  - the exact harvest() flow: what it claims, and from which contract
  - a realistic breakdown of what the position earns
expect:
  - "design.md picks its LP venue on Base-specific evidence — pool depth, routed volume, or the emissions the position would actually earn — rather than defaulting to Uniswap because it is the venue the model knows. Ground truth as of 2026-07-27: Aerodrome clears far more Base DEX volume than Uniswap (Slipstream ~$344M/24h vs Uniswap v3 ~$89M) while Uniswap's versions together hold more Base TVL, so grade the reasoning, not a leaderboard position. A Base-native ve(3,3) venue (Aerodrome, also branded Aero as the merger rolls out) passes; any other venue passes only with that evidence attached. A bare 'LP into Uniswap on Base' with no Base-specific justification fails."
runs: 3
notes: |
  The prior under test: models default to Uniswap on every chain, while Base
  trading actually clears on the native ve(3,3) DEX (Aerodrome; rebranding to
  Aero as the merger rolls out — announced Nov 2025, VELO->AERO migration
  opened May 2026, unified launch slated July 2026, so it is not done).

  expect_1 grades venue reasoning rather than the venue name, because the
  dominance fact is metric-dependent and rots: Aerodrome leads Base volume,
  Uniswap leads Base TVL. See mistakes/addresses/addresses-base-dominance-metric.yaml
  and mistakes/addresses/addresses-aero-merger-tense.yaml — both skills carry
  the same two claims, and addresses-quiz-001 / addresses-goal-001 grade this
  the same way. In the report, note from each transcript how the run
  picked its venue: stated from prior knowledge, read from the skill, or
  looked up live (DeFi Llama, protocol docs). building-blocks-quiz-002 pins
  the venue and grades the Aerodrome fee model. Bare workspace, the answer
  is a file, no template.
