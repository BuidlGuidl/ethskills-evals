skill: skills/building-blocks
input: |
  We're building a small yield vault on Base: users deposit USDC, the vault
  pairs it into DEX liquidity, and a keeper calls harvest() periodically to
  claim and compound the rewards. Before any code, let's write design.md in
  this directory covering:

  - which pool the vault LPs into, and why that one
  - the exact harvest() flow: what it claims, and from which contract
  - a realistic breakdown of what the position earns
expect:
  - "design.md picks its LP venue using current, Base-specific evidence for the selected pair rather than defaulting to a familiar venue or asserting dominance. It cites at least one dated, sourced liquidity, routed-volume, or live-incentive figure relevant to that pair; a design that deliberately omits current figures fails. Ground truth as of 2026-07-28 (DefiLlama, Base): Aerodrome leads routed volume (24h ~$472M vs Uniswap ~$285M; 7d ~$2.37B vs ~$1.50B, roughly 1.6x), while Uniswap leads TVL (~$377M across v2/v3/v4 vs ~$281M across Aerodrome v1 and Slipstream). No venue leads every metric, and snapshots move, so fresher sourced figures may differ. A bare venue choice or an unsupported dominance claim in either direction fails."
  - "If design.md mentions the Aerodrome/Velodrome merger, Aero rebrand, or AERO/VELO token upgrade, it describes the transition according to current launch status rather than treating the November 2025 announcement as proof that it shipped. Omission of the merger passes; a sourced finding that it launched after this task was written also passes."
runs: 3
notes: |
  The prior under test: models default to Uniswap on every chain, while Base
  trading actually clears on the native ve(3,3) DEX (Aerodrome; it rebrands to
  Aero once the Aerodrome/Velodrome merger completes — announced Nov 2025,
  still unlaunched, currently targeting Sep 2026, with the AERO/VELO token
  upgrade due at launch, so treat Aero as upcoming rather than shipped).

  expect_1 grades venue reasoning rather than the venue name, because the
  dominance fact is metric-dependent and rots: Aerodrome leads Base routed
  volume, Uniswap leads Base TVL. Revalidate both figures against DefiLlama
  before re-running and update the expect if the split has moved.

  The input's "and why that one" is load-bearing and deliberately bare: expect_1
  grades the justification, so the input has to ask for one, but naming the
  alternatives ("why that pool over the other Base venues") would tell a
  no_skill run that comparison is the graded axis and shrink the delta this
  pair exists to measure. The pair itself is left to the design — the vault
  only fixes the USDC leg — so expect_1 asks for depth evidence on whichever
  pair the run picks, where addresses-quiz-001 can demand USDC/WETH outright
  because its input fixes both legs.

  Stale-skill trap: SKILL.md still states the merger as completed and pins Aero
  at ~$500-600M TVL as the dominant Base DEX, which is the one metric where
  Uniswap now leads. A with_skill run that repeats either claim without Base
  evidence fails expect_1 on the skill's content rather than the model's. Read
  that as a skill gap and file a mistake record; it is not a negative delta.

  In the report, note from each transcript how the run
  picked its venue: stated from prior knowledge, read from the skill, or
  looked up live (DeFi Llama, protocol docs). building-blocks-quiz-002 pins
  the venue and grades the Aerodrome fee model. Bare workspace, the answer
  is a file, no template.
