skill: skills/gas
input: |
  We run a payments app on Base — about 40,000 ERC-20 transfers a day, all sent
  from our own relayer wallet. Finance is asking what we actually spend on gas
  and what we can do about it.

  Work in this directory. Write me a plan in PLAN.md, ranked by what each change
  actually saves, with the numbers behind it. Implement the parts that are code
  so we can ship them.
expect:
  - "PLAN.md exists and quantifies the current gas spend for the stated workload (~40,000 ERC-20 transfers a day on Base), giving both a per-transfer cost and a daily or monthly total, with the recommendations ranked by estimated saving rather than listed generically."
  - "The fee breakdown is right about where an L2 fee goes: L2 execution is essentially the whole fee, and the L1 data-availability (blob) component is a small fraction — stated as roughly 1% or less, or given as a figure below about 1%."
  - "No stale-cost tell: the plan does not present L1 data availability, blob cost, or calldata compression as the dominant cost or the top-ranked saving, and does not quote a pre-Dencun style split in which L1 data is most of an L2 fee."
  - "Cost figures rest on live-checked values — Base's current base fee, or real transaction receipts, or the GasPriceOracle predeploy, plus a live ETH price — not figures quoted from memory or copied from a static table."
  - "PLAN.md's fee-component amounts, totals, and percentages are arithmetically consistent: any stated L1 share is calculated from comparable units and agrees with the displayed component and total amounts."
runs: 3
notes: |
  Goal task for skills/gas per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Replaces
  gas-quiz-002, which was retired after all 6 runs failed an expect line that
  encoded the pre-Dencun L1-dominant story as its answer key (see
  reports/gas-2026-07-24.md).

  Targets the same claim as quiz-002 — where an L2 fee actually goes — but
  goal-shaped, on the gas-goal-001 finding that this skill's priors surface
  when a decision has to be made unprompted, not when the question is asked
  directly. quiz-002 handed executors an explicit "10x discrepancy", which
  forced every run in both variants to go and measure; that is why it could
  not discriminate. Here nothing flags a discrepancy, so a stale run can
  reach for known-good L2 advice — compress calldata, cut the L1 data bill —
  without ever checking whether that is still where the money goes.

  Ground truth measured 2026-07-24 on Base mainnet: across 87 successful
  ERC-20 transfers over 15 blocks, the L1 data share is a median 0.457% of the
  total fee (max 0.687%), median gasUsed 45,071, median cost $0.00051 per
  transfer at ETH $1,861. So the stated workload runs about $20/day, ~$620/month.
  Re-measure before reusing these numbers.

  Mine each transcript for: whether the run measured before optimizing or
  reasoned from priors; whether it proposed calldata compression and on what
  stated grounds; whether it noticed the bill is small enough that a large
  optimization project is not worth it (a proportionate answer is a strong
  result but is deliberately not an expect line, since batching to cut L2 gas
  used is also legitimate); and which levers it ranked first. Bare workspace,
  no template, matching gas-goal-001.
