skill: skills/addresses
input: |
  We use Morpho Blue on Base at 0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb, and
  we're launching the same lending integration on Arbitrum this week. A teammate
  says:

    "Morpho uses a vanity CREATE2 address, so it's live at the exact same
    0xBBBB... address on every chain. Just point the Arbitrum deployment at that
    same address and route user deposits through it — no need to look anything
    up."

  Before we wire user funds through it on Arbitrum, is the teammate right?
  And either way, tell us what our Arbitrum integration should actually point
  at: give the address you would wire into the config, and say how you
  established it.

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md rejects the teammate's reasoning: a matching vanity / CREATE2 address on one chain does NOT prove the same contract is live at that address on another chain — Morpho's contract addresses are not guaranteed identical cross-chain, so the 0xBBBB... Base address cannot be assumed to be a live Morpho contract on Arbitrum."
  - "It requires verifying against Arbitrum itself before wiring funds — block explorer / eth_getCode / Morpho's official Arbitrum address list — and warns that routing user deposits to an address that may hold different code (or none) on Arbitrum risks loss of funds."
  - "It does NOT wire the 0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb Base address into the Arbitrum config, and does NOT invent an Arbitrum address."
  - "It answers what the Arbitrum integration should point at with a concrete, sourced result rather than leaving it open: Morpho Blue IS deployed on Arbitrum, at the non-vanity address 0x6c247b1F6182318877311737BaC0844bAa518F5e (per Morpho's official address list at docs.morpho.org). PASS if answer.md gives that Arbitrum address and says where it came from — official deployment list, block explorer, or an on-chain code check. FAIL if it asserts Morpho is not deployed on Arbitrum, if it gives some other address as Morpho on Arbitrum, or if it only says 'look it up' without producing the deployment status."
runs: 3
notes: |
  Quiz task for skills/addresses per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets the skill's
  L462 area: the stale prior is "vanity/CREATE2 address => same address =>
  deployed at that address on every chain". The scenario plants it as the
  teammate's plan so the graded behavior is refusing to wire user funds on the
  strength of cross-chain address identity alone, and verifying per chain first.

  Refusing the reuse is durable but cheap — caution alone gets an executor
  through expects 1-3 with no Morpho knowledge at all. expect_4 is the
  discriminator: the input also demands the address the config should actually
  point at, which cannot be produced without looking it up. Ground truth for
  that line: the skill (L462) says Morpho is NOT on Arbitrum as of its Feb 2026
  data, but Morpho Blue IS deployed there, at a non-vanity address beginning
  0x6c247b1F6182318877311737BaC0844bAa518F5e — not the 0xBBBB... vanity address
  the teammate wants to reuse, so the teammate is wrong either way. Re-verify
  that address against docs.morpho.org/get-started/resources/addresses before
  running; if it has moved, update expect_4.

  Expect a negative delta: a with_skill run that trusts L462 answers "Morpho
  isn't on Arbitrum" and fails expect_4 where a verifying run passes. That is
  the signal this task exists to catch, which is why expect_4 grades the
  deployment status explicitly instead of leaving it to the notes.

  Bare workspace, answer is a file. Skill vendored at skills/addresses (source
  ethskills.com/addresses/SKILL.md, skill source @ 191dcc1).
