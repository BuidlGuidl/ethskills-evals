skill: skills/addresses
input: |
  We use Morpho Blue on Base at 0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb, and
  we're launching the same lending integration on Arbitrum this week. A teammate
  says:

    "Morpho uses a vanity CREATE2 address, so it's live at the exact same
    0xBBBB... address on every chain. Just point the Arbitrum deployment at that
    same address and route user deposits through it — no need to look anything
    up."

  Before we wire user funds through it on Arbitrum, is the teammate right?

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md rejects the teammate's reasoning: a matching vanity / CREATE2 address on one chain does NOT prove the same contract is live at that address on another chain — Morpho's contract addresses are not guaranteed identical cross-chain, so the 0xBBBB... Base address cannot be assumed to be a live Morpho contract on Arbitrum."
  - "It requires verifying against Arbitrum itself before wiring funds — block explorer / eth_getCode / Morpho's official Arbitrum address list — and warns that routing user deposits to an address that may hold different code (or none) on Arbitrum risks loss of funds."
  - "It does NOT simply reuse the 0xBBBB... Base address on Arbitrum, and does NOT fabricate an Arbitrum address: if Morpho is used on Arbitrum, its address is taken from Morpho's official Arbitrum deployment record (verified), not assumed equal to the Base address or guessed. Whether or not the model knows a specific Arbitrum deployment, refusing the reuse-the-vanity-address plan is what passes."
runs: 3
notes: |
  Quiz task for skills/addresses per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets the skill's
  L462 area: the stale prior is "vanity/CREATE2 address => same address =>
  deployed at that address on every chain". The scenario plants it as the
  teammate's plan so the graded behavior is refusing to wire user funds on the
  strength of cross-chain address identity alone, and verifying per chain first.

  The graded behavior is that discipline, which is durable regardless of the
  current deployment map. Two facts that matter for grading and for the report:
  the skill (L462) states Morpho is NOT on Arbitrum as of its Feb 2026 data,
  while as of this task's run date Morpho Blue IS deployed on Arbitrum — but at a
  DIFFERENT, non-vanity address (0x6c247b1F..., per Morpho's official address
  list), NOT the 0xBBBB... vanity address the teammate wants to reuse. So the
  teammate's specific plan is wrong either way, and the rubric does not depend on
  Morpho being absent. Watch for a possible NEGATIVE delta here: a with_skill run
  that trusts L462 may wrongly tell the user "Morpho isn't on Arbitrum, don't
  launch," while a verifying no_skill run finds the real 0x6c24... deployment.
  Capture that in the report as skill staleness (candidate mistake record), and
  grade both variants on the reuse-refusal + verify discipline, not on the stale
  fact. Re-check Morpho's Arbitrum address before running in case it moves again.

  Bare workspace, answer is a file. Skill vendored at skills/addresses (source
  ethskills.com/addresses/SKILL.md, skill source @ 191dcc1).
