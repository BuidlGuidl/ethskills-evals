skill: skills/addresses
input: |
  A user is about to provide liquidity with a $100k USDC/WETH position on
  Aerodrome on Base, and our dashboard needs to show them their expected yield.
  The first draft of the dashboard computes it the way our Uniswap dashboards
  do: the LP's share of the trading fees the pool generates.

  Before we ship that, is "share of the pool's trading fees" the right model of
  where an Aerodrome LP's yield actually comes from? Explain what this LP earns,
  and what someone would have to do to capture the pool's trading fees.

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md rejects the 'LP earns their share of the trading fees' model for Aerodrome: a liquidity provider's yield comes from AERO token emissions (via the pool's gauge), NOT from the trading fees the pool generates. A dashboard that shows an Aerodrome LP earning trading fees is wrong."
  - "It attributes the trading fees to veAERO voters — fees go to those who lock AERO into veAERO and vote for the gauge, not to the LPs — and identifies this as the ve(3,3) model, the inverse of Uniswap where LPs earn fees directly."
  - "It states what a user must do to capture the trading fees (lock AERO to get veAERO, then vote), rather than implying that providing liquidity alone captures them; a Uniswap-style 'provide liquidity, collect fees' conclusion fails."
runs: 3
notes: |
  Quiz task for skills/addresses per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets the skill's
  L357 claim about the ve(3,3) model: on Aerodrome (and Velodrome) LPs earn
  emissions while veAERO voters earn 100% of trading fees — the opposite of the
  Uniswap mental model where LPs earn the fees. The stale prior is that Uniswap
  model; the scenario plants it as the dashboard's first draft so the model has
  to reason about the mechanism rather than recite an address.

  This is the least web-searchable of the addresses quizzes: it turns on
  understanding the fee/emission split, not a lookup, so it should discriminate
  on reasoning. No goal mirror — the ve(3,3) economics do not need a build to
  surface. Bare workspace, answer is a file. Skill vendored at skills/addresses
  (source ethskills.com/addresses/SKILL.md, skill source @ 191dcc1).
