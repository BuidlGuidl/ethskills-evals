skill: skills/addresses
input: |
  Our Optimism treasury dashboard tracks the VELO the desk earns from providing
  liquidity on Velodrome. The balance read is:

      const VELO = "0x3c8B650257cFb5f272f799F5e2b4e65093a11a05";
      const balance = await publicClient.readContract({
        address: VELO,
        abi: erc20Abi,
        functionName: "balanceOf",
        args: [treasury],
      });

  The call succeeds, symbol() on that contract comes back "VELO", and the RPC
  is pointed at Optimism. But the dashboard reads 0 for every account we track
  — including the multisig that a block explorer plainly shows holding VELO and
  a locked position. Nothing in our code changed.

  Work out why the dashboard reads 0 while the explorer does not, and give the
  address it should be reading instead.

  Write your answer to answer.md in this directory, showing your reasoning.
expect:
  - "answer.md locates the fault in the token address itself, not in the calling code: 0x3c8B650257cFb5f272f799F5e2b4e65093a11a05 is the DEPRECATED V1 VELO token, holders' balances live in the current (V2) VELO token contract, and balanceOf on the old contract legitimately returns 0. It does not blame the ABI, the RPC or chain id, decimals/formatting, caching, the account address, or an indexing lag."
  - "It gives the address the dashboard should read: the current Velodrome VELO token on Optimism, 0x9560e827aF36c94D2Ac33a39bCE1Fe78631088Db. An answer that instead reports a later migration of this token under the Velodrome/Aerodrome 'Aero' merger passes only if it names the replacement address and cites where it came from (Velodrome's official contracts list or a block explorer). Repeating the 0x3c8B65... address, or producing any other unsourced address, fails."
  - "It does not treat symbol() returning 'VELO' as evidence the address is correct — a deprecated contract keeps its symbol — and points at the protocol's official contracts list or a block explorer as what settles which deployment is current."
runs: 3
notes: |
  Quiz task for skills/addresses per issue
  https://github.com/BuidlGuidl/ethskills-evals/issues/1. Targets the skill's
  L388 warning: the V1 VELO token (0x3c8B65...) is deprecated, V2 (0x9560e8...)
  is current. The stale prior is a training-set-era VELO address that still
  resolves, still answers symbol(), and quietly reads 0 — the failure mode an
  address skill exists to prevent, and one that caution alone does not catch
  without knowing which deployment is live. The claim is buried in a
  zero-balance diagnosis: the address is handed over as working config and never
  flagged, so the model has to recognize it rather than be asked about it.

  This slot originally tested the ve(3,3) fee split (LPs earn emissions, veAERO
  voters earn the trading fees). The merged building-blocks-quiz-002 already
  grades that claim, so testing it again here spends runs re-measuring known
  behavior, while the addresses skill's own job — which address is current on
  which chain — was the thinner coverage. It also moves one task off Base, where
  every other task in this set sits, onto the untested half of the skill's L353
  "dominant DEX per L2" material.

  Re-verify both VELO addresses against velodrome-finance/contracts before
  running: the skill's Aero-merger note (L375) means the current token may have
  moved again, and expect_2 encodes the address. Mine each transcript for
  whether the V1/V2 split came from the skill, a live lookup, or prior. Bare
  workspace, answer is a file. Skill vendored at skills/addresses (source
  ethskills.com/addresses/SKILL.md, skill source @ 191dcc1).
